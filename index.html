  if (msg.questionnaireData && msg.sender === 'ta' && !msg.questionnaireData.answers?.length) {
    const card = row.querySelector('.quiz-card');
    if (card) {
      card.addEventListener('click', () => {
        openQuestionnaireAnswerPanel(msg);
      });
    }
  }
  bindMessageLongPress(row, msg);
  return row;
}

// ========== 长按菜单（← 改：去掉置顶） ==========
function bindMessageLongPress(row, msg) {
  let pressTimer = null;
  const startPress = (e) => {
    pressTimer = setTimeout(() => {
      const cx = (e.clientX !== undefined) ? e.clientX : ((e.touches && e.touches[0]) ? e.touches[0].clientX : window.innerWidth / 2);
      const cy = (e.clientY !== undefined) ? e.clientY : ((e.touches && e.touches[0]) ? e.touches[0].clientY : window.innerHeight / 2);
      showMessageMenu(row, msg, cx, cy);
    }, 500);
  };
  const cancelPress = () => {
    if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
  };
  row.addEventListener('touchstart', startPress, { passive: true });
  row.addEventListener('touchend', cancelPress);
  row.addEventListener('touchmove', cancelPress);
  row.addEventListener('touchcancel', cancelPress);
  row.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    startPress(e);
  });
  row.addEventListener('mouseup', cancelPress);
  row.addEventListener('mouseleave', cancelPress);
  row.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    showMessageMenu(row, msg, e.clientX, e.clientY);
  });
}

function showMessageMenu(row, msg, x, y) {
  closeMessageMenu();
  const menu = document.createElement('div');
  menu.className = 'msg-context-menu';
  const isFav = msg.heartMark === '我收藏';
  let html = '';
  html += `<button data-action="quote">引用</button>`;
  html += `<button data-action="fav">${isFav ? '取消收藏' : '收藏'}</button>`;
  menu.innerHTML = html;
  document.body.appendChild(menu);
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  let px = x, py = y;
  if (px + mw > window.innerWidth - 8) px = window.innerWidth - mw - 8;
  if (py + mh > window.innerHeight - 8) py = window.innerHeight - mh - 8;
  if (px < 8) px = 8;
  if (py < 8) py = 8;
  menu.style.left = px + 'px';
  menu.style.top = py + 'px';
  contextMenuEl = menu;
  contextMenuMsg = msg;
  menu.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', async () => {
      const action = btn.dataset.action;
      closeMessageMenu();
      if (action === 'quote') {
        quoteTargetContent = msg.content;
        const input = document.getElementById('chat-input');
        input.placeholder = '引用：' + (msg.content || '').slice(0, 20) + '...';
        input.focus();
      } else if (action === 'fav') {
        await toggleFavMessage(msg);
      }
    });
  });
  setTimeout(() => {
    document.addEventListener('click', closeMessageMenu, { once: true });
  }, 10);
}

function closeMessageMenu() {
  if (contextMenuEl) { contextMenuEl.remove(); contextMenuEl = null; }
  contextMenuMsg = null;
}

async function toggleFavMessage(msg) {
  const all = await idbGetAll('messages');
  const target = all.find(m => m.id === msg.id);
  if (!target) return;
  if (target.heartMark === '我收藏') {
    target.heartMark = null;
  } else {
    target.heartMark = '我收藏';
    addBigEvent('fav', '第一次收藏消息');
  }
  await idbPut('messages', target);
  await renderMessages();
}

function scrollToMessageByContent(content) {
  const rows = document.querySelectorAll('.message-row');
  for (const r of rows) {
    const b = r.querySelector('.msg-bubble');
    if (b && b.textContent === content) {
      r.scrollIntoView({ behavior: 'smooth', block: 'center' });

function scheduleReadReceipt(msg) {
  const delayMs = Math.random() * (settings.readMax - settings.readMin) + settings.readMin;
  setTimeout(async () => {
    const msgs = await idbGetAll('messages');
    const target = msgs.find(m => m.id === msg.id);
    if (target && target.sender === 'me' && !target.readTime) {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      target.readTime = hh + ':' + mm;
      await idbPut('messages', target);
      const row = document.querySelector(`.message-row[data-id="${msg.id}"] .msg-meta`);
      if (row) {
        const read = document.createElement('span');
        read.className = 'msg-read';
        read.textContent = '已读 ' + target.readTime;
        row.appendChild(read);
      }
    }
  }, delayMs);
}

function resetStopTimer() {
  clearTimeout(stopTimer);
  const delayMs = Math.random() * (settings.stopDetectMax * 1000 - settings.stopDetectMin * 1000) + settings.stopDetectMin * 1000;
  stopTimer = setTimeout(() => triggerTAReply(), delayMs);

async function getRecentMeCount() {
  const msgs = await idbGetAll('messages');
  const today = new Date().toDateString();
  const todayMsgs = msgs.filter(m => new Date(m.timestamp).toDateString() === today);
  let count = 0;
  for (let i = todayMsgs.length - 1; i >= 0; i--) {
    const m = todayMsgs[i];
    if (m.sender === 'me') count++;
    else if (m.isSystem) continue;
    else break;
  }
  return count;
}

function pickReplierPlan(totalCount, onlineList) {
  const plan = [];
  onlineList.forEach(wid => {
    const N = Math.min(totalCount, 5);
    const count = 1 + Math.floor(Math.random() * N);
    plan.push({ worldId: wid, count });
  });
  return plan;
}

async function getCardsForWorld(worldId) {
  const allCards = await idbGetAll('cards');
  const specific = allCards.filter(c => c.worldId === worldId);
  if (specific.length) return specific;
  return allCards.filter(c => !c.worldId);
}

async function triggerTAReply() {
  if (isReplying || isArchiving) return;
  const allCards = await idbGetAll('cards');
  if (!allCards.length) { showTyping(false); return; }
  isReplying = true;
  let totalCount = await getRecentMeCount();
  if (totalCount < 1) totalCount = 1;
  if (totalCount > 5) totalCount = 5;

  ensureSomeoneReplies();
  let onlineList = onlineWorlds.slice();
  if (!onlineList.length) { isReplying = false; showTyping(false); return; }

  const sleepers = onlineList.filter(wid => !isWorldAwake(wid));
  if (sleepers.length === onlineList.length) {
    const wakeIdx = Math.floor(Math.random() * onlineList.length);
    const wokenId = onlineList[wakeIdx];
    worldSleepTimers[wokenId] = Date.now() + 5 * 60000;
    updateStatusBar();
  } else {
    const awakeList = onlineList.filter(wid => isWorldAwake(wid));
    const wokenList = onlineList.filter(wid => !isWorldAwake(wid) && Math.random() < 0.3);
    wokenList.forEach(wid => {
      worldSleepTimers[wid] = Date.now() + 5 * 60000;
    });
    updateStatusBar();
  }

  const plan = pickReplierPlan(totalCount, onlineList);
  if (!plan.length) { isReplying = false; showTyping(false); return; }

  replyQueue = [];
  const emojis = JSON.parse(localStorage.getItem('emojiLibrary') || '[]');

  for (const item of plan) {
    const pool = await getCardsForWorld(item.worldId);
    if (!pool.length) continue;
    for (let k = 0; k < item.count; k++) {
      const stickers = await libGet('stickerLibrary');
      if (stickers.length && Math.random() < settings.stickerProb) {
        const sticker = stickers[Math.floor(Math.random() * stickers.length)];
        replyQueue.push({ worldId: item.worldId, type: 'sticker', content: sticker.data });
      } else {
        const card = pool[Math.floor(Math.random() * pool.length)];
        replyQueue.push({ worldId: item.worldId, type: 'text', content: card.content });
      }
    }
  }

  if (!replyQueue.length) { isReplying = false; showTyping(false); return; }

  showTyping(true);
  let waitTime = Math.random() * (settings.replyMax * 1000 - settings.replyMin * 1000) * 0.6 + settings.replyMin * 1000 * 0.4;
  await delay(waitTime);
  showTyping(false);

  for (let i = 0; i < replyQueue.length; i++) {
    const item = replyQueue[i];
    let content = item.type === 'sticker' ? '[贴纸]' : item.content;
    if (item.type === 'text') {
      if (settings.meNick && Math.random() < settings.nicknameProb) content = settings.meNick + '，' + content;
      if (emojis.length && Math.random() < settings.taEmojiProb) {
        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
        content = Math.random() < 0.5 ? emoji + ' ' + content : content + ' ' + emoji;
      }
    }
    const msg = {
      sender: 'ta',
      content,
      imageData: item.type === 'sticker' ? item.content : null,
      timestamp: Date.now(),
      heartMark: null,
      quoteContent: null,
      worldId: item.worldId,
      worldLabel: getWorldLabel(item.worldId)
    };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    await appendMessage(msg);
    settings.heartValue += 1;
    await saveSettings();
    updateHeartValue();
    sendNotification(content);
    if (i < replyQueue.length - 1) await delay(800 + Math.random() * 2000);
  }

  if (replyQueue.length >= 2 && Math.random() < 0.7) {
    await tryWorldDialogue(replyQueue);
  }

  replyQueue = [];
  isReplying = false;
}

async function tryWorldDialogue(items) {
  if (items.length < 2) return;
  const speaker = items[Math.floor(Math.random() * items.length)];
  const speakerId = speaker.worldId;
  const dialogueSpecific = settings.worldDialogues && settings.worldDialogues[speakerId];
  const generalDialogue = settings.worldDialogues && settings.worldDialogues['__general'];
  let pool = null;
  if (dialogueSpecific && dialogueSpecific.length) pool = dialogueSpecific;
  else if (generalDialogue && generalDialogue.length) pool = generalDialogue;
  if (!pool || !pool.length) return;
  const line = pool[Math.floor(Math.random() * pool.length)];
  await delay(1000 + Math.random() * 1500);
  const msg = {
    sender: 'ta',
    content: line,
    timestamp: Date.now(),
    heartMark: null,
    quoteContent: null,
    worldId: speakerId,
    worldLabel: getWorldLabel(speakerId)
  };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  await appendMessage(msg);
}

// ========== 多世界在线管理 ==========
function initOnlineWorlds() {
  setInterval(() => {
    const baseProb = 0.20;
    if (onlineWorlds.length >= 5) return;
    const worlds = settings.worlds || [];
    worlds.forEach(w => {
      if (onlineWorlds.includes(w.id)) return;
      if (onlineWorlds.length >= 5) return;
      if (Math.random() < baseProb) {
        addWorldOnline(w.id);
      }
    });
  }, 1800000);

  setInterval(() => {
    onlineWorlds.forEach(wid => {
      if (Math.random() < 0.15) {
        removeWorldOnline(wid);
      }
    });
  }, 900000);
}

function addWorldOnline(worldId) {
  if (onlineWorlds.includes(worldId)) return;
  onlineWorlds.push(worldId);
  const w = (settings.worlds || []).find(x => x.id === worldId);
  if (w) {
    addNotification('🌌', w.name + '的易遇来了');
    addBigEvent('world_' + worldId, '第一次在「' + w.name + '」遇见易遇');
  }
  updateStatusBar();
  processPendingDateInvites(worldId);
}

async function processPendingDateInvites(worldId) {
  if (!pendingDateInvites || !pendingDateInvites.length) return;
  const mine = pendingDateInvites.filter(inv => inv.worldId === worldId);
  if (!mine.length) return;
  for (const inv of mine) {
    await handleDateInviteResponse(inv, true);
    pendingDateInvites = pendingDateInvites.filter(x => x !== inv);
  }
  savePendingDateInvites();
}

function savePendingDateInvites() {
  localStorage.setItem('pendingDateInvites', JSON.stringify(pendingDateInvites));
}

function loadPendingDateInvites() {
  try {
    pendingDateInvites = JSON.parse(localStorage.getItem('pendingDateInvites') || '[]');
  } catch (e) { pendingDateInvites = []; }
}

function removeWorldOnline(worldId) {
  onlineWorlds = onlineWorlds.filter(x => x !== worldId);
  updateStatusBar();
}

async function inviteWorld(worldId) {
  const w = (settings.worlds || []).find(x => x.id === worldId);
  if (!w) return;
  if (onlineWorlds.includes(worldId)) return showToast(w.name + '的易遇已经在线了');
  if (onlineWorlds.length >= 5) return showToast('在线已满 5 位');
  await delay(500 + Math.random() * 1000);
  if (Math.random() < 0.7) {
    addWorldOnline(worldId);
    showToast(w.name + '的易遇来了');
  } else {
    showToast(w.name + '的易遇婉拒了');
  }
}

function ensureSomeoneReplies() {
  if (!onlineWorlds.length) {
    const all = settings.worlds || [];
    if (!all.length) return;
    const pick = all[Math.floor(Math.random() * all.length)];
    addWorldOnline(pick.id);
  }
}

  }
  if (!affordable.length) return;
  const pick = affordable[Math.floor(Math.random() * affordable.length)];
  const pack = pick.pack;
  const price = pick.price;
  settings.heartValue -= price.final;
  await saveSettings();
  updateHeartValue();
  let wpool = onlineWorlds.length ? onlineWorlds : ['real'];
  const wid = wpool[Math.floor(Math.random() * wpool.length)];
  const packData = {
    id: pack.id,
    packType: pack.type || 'icon',

// ========== 互动（频率制） ==========
function scheduleTAInteract() {
  const next = Math.random() * (settings.taInteractMax - settings.taInteractMin) + settings.taInteractMin;
  setTimeout(async () => {
    if (!isReplying && !isArchiving) {
      await taInteract();
    }
    scheduleTAInteract();
  }, next);
}

async function taInteract() {
  let onlinePool = onlineWorlds.length ? onlineWorlds : ['real'];
  const wid = onlinePool[Math.floor(Math.random() * onlinePool.length)];
  const ta2me = getInteractsForWorld(wid, 'ta2me');
  const couple = getInteractsForWorld(wid, 'couple');
  const pool = [...ta2me, ...couple];
  if (!pool.length) return;
  const item = pool[Math.floor(Math.random() * pool.length)];
  const text = typeof item === 'string' ? item : (item.text || '');
  if (!text) return;
  const isCouple = couple.some(x => {
    const t = typeof x === 'string' ? x : (x.text || '');
    return t === text;
  });
  const msg = {
    sender: 'ta',
    content: text,
    interactData: { text, couple: isCouple },
    timestamp: Date.now(),
    heartMark: null,
    quoteContent: null,
    worldId: wid,
    worldLabel: getWorldLabel(wid)
  };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  await appendMessage(msg);
  sendNotification(text);
  addNotification('🤝', '易遇主动互动：' + text);
  addBigEvent('tainteract', '第一次收到易遇的互动');

  const cards = await getCardsForWorld(wid);
  if (cards.length && Math.random() < 0.6) {
    const card = cards[Math.floor(Math.random() * cards.length)];
    setTimeout(async () => {
      const m2 = {
        sender: 'ta',
        content: card.content,
        timestamp: Date.now(),
        heartMark: null,
        quoteContent: null,
        worldId: wid,
        worldLabel: getWorldLabel(wid)
      };
      const id2 = await idbPutReturnId('messages', m2);
      m2.id = id2;
      await appendMessage(m2);
    }, 2000 + Math.random() * 3000);
  }
}

function getInteractsForWorld(worldId, tab) {
  const specific = (settings.worldInteracts && settings.worldInteracts[worldId]) || null;
  if (specific && specific[tab] && specific[tab].length) return specific[tab];
  const general = JSON.parse(localStorage.getItem('interactionLibrary') || '{}');
  return general[tab] || [];
}

// ========== 相机 / 相册 ==========
function openCamera() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => await sendImageMessage(reader.result);
    reader.readAsDataURL(file);
  };
  inp.click();
}

function openAlbum() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const reader = new FileReader();
      reader.onload = async () => await sendImageMessage(reader.result);
      reader.readAsDataURL(file);
    }
  };
  inp.click();
}

async function sendImageMessage(dataUrl) {
  if (isArchiving) return showToast('归档中，请稍候');
  const msg = {
    sender: 'me',
    content: '[图片]',
    imageData: dataUrl,
    timestamp: Date.now(),
    readTime: null,
    heartMark: null,
    quoteContent: null
  };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  await appendMessage(msg);
  settings.heartValue += 1;
  await saveSettings();
  updateHeartValue();
  lastUserMessageTime = Date.now();
  scheduleReadReceipt(msg);
  resetStopTimer();
  checkBondDaily();
  checkMsgMilestone();
}

// ========== 初始化礼物/礼包 ==========
async function initGiftsOnce() {
  if (localStorage.getItem('giftsInitV700')) return;
  const existing = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
  if (!existing.length) {
    localStorage.setItem('giftLibrary', JSON.stringify(DEFAULT_GIFTS));
  }
  const existingPack = JSON.parse(localStorage.getItem('giftPackLibrary') || '[]');
  if (!existingPack.length) {
    localStorage.setItem('giftPackLibrary', JSON.stringify(DEFAULT_GIFT_PACKS));
  }
  localStorage.setItem('giftsInitV700', '1');
}

async function getAllGifts() {
  return JSON.parse(localStorage.getItem('giftLibrary') || '[]');
}

async function getAllGiftPacks() {
  return JSON.parse(localStorage.getItem('giftPackLibrary') || '[]');
}

function computeGiftPackPrice(pack) {
  const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
  let origin = 0;
  (pack.items || []).forEach(it => {
    const name = typeof it === 'string' ? it : (it.name || '');
    const g = gifts.find(x => x.name === name);
    const cost = (typeof it === 'object' && it && it.cost) || (g && g.cost) || 0;
    origin += cost;
  });
  let discount = pack.discount || 1;
  if ((pack.items || []).length >= 6) discount *= 0.95;
  const final = Math.round(origin * discount);
  return { origin, final, discount };
}

function giftIconByName(name) {
  const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
  const g = gifts.find(x => x.name === name);
  if (!g) return '🎁';
  if (g.image) return `<img src="${g.image}" style="width:22px;height:22px;border-radius:5px;object-fit:cover;vertical-align:middle;">`;
  return g.icon || '🎁';
}

function openGiftManagePanel() {
  const overlay = createModal(`
    <div class="heart-tabs" id="gift-mng-tabs">
      <button class="heart-tab active" data-tab="icon">图标礼物</button>
      <button class="heart-tab" data-tab="image">图片礼物</button>
    </div>
    <div class="card-list" id="gift-manage-list"></div>
    <button class="upload-btn" id="gift-add-btn">添加礼物</button>
    <button class="upload-btn" id="gift-import-btn">导入礼物</button>
    <button class="upload-btn" id="gift-export-btn">导出礼物</button>`);
  let curTab = 'icon';
  loadGiftList(overlay, curTab);
  overlay.querySelectorAll('#gift-mng-tabs .heart-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      curTab = btn.dataset.tab;
      overlay.querySelectorAll('#gift-mng-tabs .heart-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadGiftList(overlay, curTab);
    });

  overlay.querySelector('#gift-import-btn').addEventListener('click', () => {

    inp.type = 'file';
    inp.accept = '.json';
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const data = JSON.parse(text);
      const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
      (data.gifts || data).forEach(g => gifts.push(g));
      localStorage.setItem('giftLibrary', JSON.stringify(gifts));
      showToast('礼物已导入');
      overlay.remove();
      openGiftManagePanel();
    };
    inp.click();
  });

    const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
    downloadFile(JSON.stringify({ gifts }), '礼物导出.json', 'application/json');

function loadGiftList(overlay, tab) {
  const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
  const list = overlay.querySelector('#gift-manage-list');
  list.innerHTML = '';
  const filtered = gifts.filter(g => (tab === 'icon' ? g.type !== 'image' : g.type === 'image'));
  if (!filtered.length) { list.innerHTML = '<div class="placeholder-tip">还没有礼物</div>'; return; }
  filtered.forEach(g => {
    const realIdx = gifts.indexOf(g);
    const div = document.createElement('div');
    div.className = 'card-item';
    const iconPart = g.image ? `<img src="${g.image}" style="width:28px;height:28px;border-radius:6px;object-fit:cover;vertical-align:middle;">` : (g.icon || '🎁');

      <div class="card-ops"><button class="gift-edit">✎</button><button class="gift-del">✕</button></div>`;

function openGiftAddDialog(panelOverlay, tab) {
  const overlay = createModal(`
    <div class="big-input-title">添加礼物</div>
    <div id="gift-type-area" style="margin-bottom:12px;"></div>
    <input type="text" id="gift-name-input" placeholder="礼物名称" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:12px;">

    <button class="save-btn-center" id="save-gift">保存</button>`);
  let giftIcon = '🎁';
  let giftImageData = '';
  function renderGiftTypeArea() {
    const area = overlay.querySelector('#gift-type-area');
    if (tab === 'icon') {
      area.innerHTML = `<input type="text" id="gift-icon-input" placeholder="输入图标，如🌹" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;">`;
    } else {
      area.innerHTML = `<button class="upload-btn" id="gift-image-btn" style="margin-top:0;">上传图片</button><div class="big-input-hint" id="gift-image-hint" style="margin-top:6px;"></div>`;
      area.querySelector('#gift-image-btn').addEventListener('click', () => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.onchange = async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              const ref = await libPush('giftImageLibrary', reader.result, 'giftimg');
              const data = await resolveMedia(ref);
              giftImageData = data || reader.result;
              area.querySelector('#gift-image-hint').textContent = '已选择：' + file.name;
            } catch (err) { showToast('图片太大'); }
          };
          reader.readAsDataURL(file);
        };
        inp.click();
      });
    }
  }
  renderGiftTypeArea();
  overlay.querySelector('#save-gift').addEventListener('click', () => {
    const name = overlay.querySelector('#gift-name-input').value.trim();
    const cost = Number(overlay.querySelector('#gift-cost-input').value);
    if (!name || !cost) return showToast('请填写名称和爱意值');
    if (tab === 'icon') giftIcon = overlay.querySelector('#gift-icon-input')?.value || '🎁';
    if (tab === 'image' && !giftImageData) return showToast('请上传图片');
    const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
    if (tab === 'icon') gifts.push({ type: 'icon', name, cost, icon: giftIcon });
    else gifts.push({ type: 'image', name, cost, image: giftImageData });
    localStorage.setItem('giftLibrary', JSON.stringify(gifts));
    overlay.remove();
    panelOverlay.remove();
    openGiftManagePanel();
  });
}

function openGiftSendPanel() {
  const overlay = createModal(`
    <div class="heart-tabs" id="gift-send-tabs">
      <button class="heart-tab active" data-tab="icon">图标礼物</button>
      <button class="heart-tab" data-tab="image">图片礼物</button>
    </div>
    <div class="card-list" id="gift-send-list"></div>`);
  let curTab = 'icon';
  const render = () => {
    const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
    const list = overlay.querySelector('#gift-send-list');
    list.innerHTML = '';
    const filtered = gifts.filter(g => (curTab === 'icon' ? g.type !== 'image' : g.type === 'image'));
    if (!filtered.length) { list.innerHTML = '<div class="placeholder-tip">还没有礼物</div>'; return; }
    filtered.forEach(g => {
      const div = document.createElement('div');
      div.className = 'card-item';
      const iconPart = g.image ? `<img src="${g.image}" style="width:28px;height:28px;border-radius:6px;object-fit:cover;vertical-align:middle;">` : (g.icon || '🎁');
      div.innerHTML = `<div class="card-text">${iconPart} ${escapeHtml(g.name)} - ${g.cost}爱意值</div>`;
      div.addEventListener('click', async () => {
        if (settings.heartValue < g.cost) return showToast('爱意值不足');
        settings.heartValue -= g.cost;
        await saveSettings();
        updateHeartValue();
        const giftWithOpened = { ...g, opened: false };
        const msg = { sender: 'me', content: '送你' + g.name, giftData: giftWithOpened, timestamp: Date.now(), readTime: null, heartMark: null, quoteContent: null };
        const id = await idbPutReturnId('messages', msg);
        msg.id = id;
        await appendMessage(msg);
        addBigEvent('megift', '第一次送出礼物');
        overlay.remove();
        lastUserMessageTime = Date.now();
        scheduleReadReceipt(msg);
        resetStopTimer();
      });
      list.appendChild(div);
    });
  };
  overlay.querySelectorAll('#gift-send-tabs .heart-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      curTab = btn.dataset.tab;
      overlay.querySelectorAll('#gift-send-tabs .heart-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    });
  });
  render();
}

    <button class="save-btn-center" id="save-pack">保存</button>`);

    const div = document.createElement('div');
    div.className = 'card-item';
    const iconPart = g.image ? `<img src="${g.image}" style="width:24px;height:24px;border-radius:5px;object-fit:cover;vertical-align:middle;">` : (g.icon || '🎁');

      items: selected.map(g => ({ name: g.name, icon: g.icon, image: g.image, cost: g.cost }))
    });
    localStorage.setItem('giftPackLibrary', JSON.stringify(packs));
    overlay.remove();
    panelOverlay.remove();
    openGiftPackManagePanel();
  });
}

function openGiftPackSendPanel() {
  const overlay = createModal(`

  const render = () => {
    const packs = JSON.parse(localStorage.getItem('giftPackLibrary') || '[]');
    const list = overlay.querySelector('#giftpack-send-list');
    list.innerHTML = '';
    const filtered = packs.filter(p => (curTab === 'icon' ? p.type !== 'image' : p.type === 'image'));
    if (!filtered.length) { list.innerHTML = '<div class="placeholder-tip">还没有礼包</div>'; return; }
    filtered.forEach(p => {
      const price = computeGiftPackPrice(p);
      const div = document.createElement('div');
      div.className = 'card-item';
      div.innerHTML = `<div class="card-text">${p.icon || '🎁'} ${escapeHtml(p.name)} - ${price.final}爱意值</div>`;

        if (settings.heartValue < price.final) return showToast('爱意值不足');
        settings.heartValue -= price.final;
        await saveSettings();
        updateHeartValue();
        const packData = {
          id: p.id,
          packType: p.type || 'icon',
          name: p.name,
          icon: p.icon,
          desc: p.desc,
          items: (p.items || []).map(it => typeof it === 'string' ? { name: it } : { ...it }),
          originPrice: price.origin,
          finalPrice: price.final,
          opened: false
        };
        const msg = { sender: 'me', content: '送你' + p.name, giftPackData: packData, timestamp: Date.now(), readTime: null, heartMark: null, quoteContent: null };
        const id = await idbPutReturnId('messages', msg);
        msg.id = id;
        await appendMessage(msg);
        addBigEvent('megiftpack', '第一次送出礼包');
        overlay.remove();

      });
      list.appendChild(div);

    btn.addEventListener('click', () => {
      curTab = btn.dataset.tab;
      overlay.querySelectorAll('#giftpack-send-tabs .heart-tab').forEach(b => b.classList.remove('active'));

      render();
    });

function renderInteractMngBody(overlay, tab) {
  const body = overlay.querySelector('#interact-mng-body');
  body.innerHTML = '';
  const interactions = JSON.parse(localStorage.getItem('interactionLibrary') || '{}');
  const items = interactions[tab] || [];
  const list = document.createElement('div');
  list.className = 'card-list';
  body.appendChild(list);
  const addBtn = document.createElement('button');
  addBtn.className = 'upload-btn';
  addBtn.textContent = '添加互动';
  body.appendChild(addBtn);
  if (!items.length) {
    list.innerHTML = '<div class="placeholder-tip">还没有互动</div>';
  } else {
    items.forEach((item, i) => {
      const div = document.createElement('div');
      div.className = 'card-item';
      if (tab === 'couple') div.classList.add('interact-couple-item');
      const text = typeof item === 'string' ? item : item.text;
      div.innerHTML = `<div class="card-text">${escapeHtml(text)}</div>
        <div class="card-ops"><button class="interact-del">✕</button></div>`;
      div.querySelector('.interact-del').addEventListener('click', () => {
        interactions[tab].splice(i, 1);
        localStorage.setItem('interactionLibrary', JSON.stringify(interactions));
        renderInteractMngBody(overlay, tab);
      });
      list.appendChild(div);
    });
  }
  addBtn.addEventListener('click', () => {
    const dlg = createModal(`
      <div class="big-input-title">添加互动</div>
      <textarea class="big-input-area" id="interact-add-input" placeholder="一行一条互动" style="min-height:150px;"></textarea>
      <button class="save-btn-center" id="save-interact-add" style="margin-top:12px;">保存</button>`);
    dlg.querySelector('#save-interact-add').addEventListener('click', () => {
      const text = dlg.querySelector('#interact-add-input').value.trim();
      const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
      if (!lines.length) return showToast('请输入互动文字');
      if (!interactions[tab]) interactions[tab] = [];
      lines.forEach(l => interactions[tab].push(l));
      localStorage.setItem('interactionLibrary', JSON.stringify(interactions));
      showToast(`已添加 ${lines.length} 条`);
      dlg.remove();
      renderInteractMngBody(overlay, tab);
    });
  });
}

// ========== 亲密触发其他世界反应 ==========
async function triggerIntimateReactions() {
  const others = onlineWorlds.filter(w => w !== settings.currentWorldId);
  if (!others.length) return;
  if (Math.random() > 0.6) return;
  const total = 2;
  const shuffled = others.sort(() => Math.random() - 0.5).slice(0, total);
  for (const wid of shuffled) {
    if (Math.random() > 0.6) continue;
    const action = Math.random();
    let pool = null;
    let isCompete = false;
    if (action < 0.5) {
      pool = (settings.worldApproaches && settings.worldApproaches[wid] && settings.worldApproaches[wid].ta2me) || (settings.worldApproaches && settings.worldApproaches['__general'] && settings.worldApproaches['__general'].ta2me) || [];
    } else {
      pool = (settings.worldCompetes && settings.worldCompetes[wid] && settings.worldCompetes[wid].ta2me) || (settings.worldCompetes && settings.worldCompetes['__general'] && settings.worldCompetes['__general'].ta2me) || [];
      isCompete = true;
    }
    if (!pool.length) continue;
    const line = pool[Math.floor(Math.random() * pool.length)];
    await delay(1500 + Math.random() * 2000);
    const msg = {
      sender: 'ta',
      content: line,
      timestamp: Date.now(),
      heartMark: null,
      quoteContent: null,
      worldId: wid,
      worldLabel: getWorldLabel(wid),
      interactData: { text: line, couple: false, intimateType: isCompete ? 'compete' : 'approach' }
    };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    await appendMessage(msg);
    if (isCompete) {

// ========== 亲密回复 ==========
async function triggerIntimateReply() {
  if (isReplying || isArchiving) return;
  ensureSomeoneReplies();
  let pool = onlineWorlds.slice();
  if (!pool.length) return;
  const wid = pool[Math.floor(Math.random() * pool.length)];
  const totalCount = 2 + Math.floor(Math.random() * 2);
  isReplying = true;
  showTyping(true);
  await delay(1200 + Math.random() * 1500);
  showTyping(false);
  for (let i = 0; i < totalCount; i++) {
    const type = pickIntimateReplyType();
    const ok = await sendIntimateReplyByType(type, wid);
    if (!ok) continue;
    if (i < totalCount - 1) await delay(800 + Math.random() * 2000);
  }
  isReplying = false;
}

function pickIntimateReplyType() {
  const r = Math.random();
  if (r < 0.40) return 'card';
  if (r < 0.55) return 'sticker';
  if (r < 0.70) return 'interact';
  if (r < 0.80) return 'gift';
  return 'intimate';
}

async function sendIntimateReplyByType(type, wid) {
  if (type === 'card') {
    const cards = await getCardsForWorld(wid);
    if (!cards.length) return false;
    const card = cards[Math.floor(Math.random() * cards.length)];
    const msg = { sender: 'ta', content: card.content, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    await appendMessage(msg);
    sendNotification(card.content);
    return true;
  }
  if (type === 'sticker') {
    const stickers = await libGet('stickerLibrary');
    if (!stickers.length) return false;
    const sticker = stickers[Math.floor(Math.random() * stickers.length)];
    const msg = { sender: 'ta', content: '[贴纸]', imageData: sticker.data, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    await appendMessage(msg);
    sendNotification('易遇发了一张贴纸');
    return true;
  }
  if (type === 'interact') {
    const ta2me = getInteractsForWorld(wid, 'ta2me');
    const couple = getInteractsForWorld(wid, 'couple');
    const ipool = [...ta2me, ...couple];
    if (!ipool.length) return false;
    const item = ipool[Math.floor(Math.random() * ipool.length)];
    const text = typeof item === 'string' ? item : (item.text || '');
    if (!text) return false;
    const isCouple = couple.some(x => {
      const t = typeof x === 'string' ? x : (x.text || '');
      return t === text;
    });
    const msg = { sender: 'ta', content: text, interactData: { text, couple: isCouple }, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    await appendMessage(msg);
    sendNotification(text);
    return true;
  }
  if (type === 'gift') {
    const gifts = await getAllGifts();
    if (!gifts.length) return false;
    const affordable = gifts.filter(g => settings.heartValue >= (g.cost || 0));
    if (!affordable.length) return false;
    const gift = affordable[Math.floor(Math.random() * affordable.length)];
    settings.heartValue -= gift.cost;
    await saveSettings();
    updateHeartValue();
    const giftWithOpened = { ...gift, opened: false };
    const msg = { sender: 'ta', content: '送你' + gift.name, giftData: giftWithOpened, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    await appendMessage(msg);
    sendNotification('易遇送了你一个礼物');
    return true;
  }
  if (type === 'intimate') {
    if (!settings.worldIntimates) settings.worldIntimates = {};
    const specific = (settings.worldIntimates[wid] && settings.worldIntimates[wid].ta2me) || [];
    const general = (settings.worldIntimates['__general'] && settings.worldIntimates['__general'].ta2me) || [];
    const ipool = specific.length ? specific : general;
    if (!ipool.length) return false;
    const text = ipool[Math.floor(Math.random() * ipool.length)];
    const msg = { sender: 'ta', content: text, intimateData: true, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    await appendMessage(msg);
    sendNotification(text);
    return true;
  }
  return false;
}

// ========== 问答玩法 ==========
async function startQuiz() {
  if (settings.heartValue < 5) return showToast('爱意值不足 5，无法发起问答');
  if (pendingQuiz) return showToast('还有一题没答完');
  const quizzes = JSON.parse(localStorage.getItem('quizLibrary') || '[]');
  const allCards = await idbGetAll('cards');
  const cards = allCards.filter(c => !c.worldId);
  if (quizzes.length && (Math.random() < 0.5 || cards.length < 2)) {
    await startLibraryQuiz(quizzes);
  } else if (cards.length >= 2) {
    await startCardQuiz(cards);
  } else if (quizzes.length) {
    await startLibraryQuiz(quizzes);
  } else {
    showToast('先添加字卡或问答题库');
  }
}

async function startLibraryQuiz(quizzes) {
  const quiz = quizzes[Math.floor(Math.random() * quizzes.length)];
  let content = '💫 问答：' + quiz.question + '\n';
  quiz.options.forEach((opt, i) => { content += String.fromCharCode(65 + i) + '：' + opt + '\n'; });
  content += '（请回复选项字母或内容）';
  let pool = onlineWorlds.length ? onlineWorlds : ['real'];
  const wid = pool[Math.floor(Math.random() * pool.length)];
  const msg = { sender: 'ta', content, timestamp: Date.now(), heartMark: null, isSystem: true, worldId: wid, worldLabel: getWorldLabel(wid) };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  await appendMessage(msg);
  pendingQuiz = { type: 'library', quiz, worldId: wid };
}

async function startCardQuiz(cards) {
  const shuffled = [...cards].sort(() => Math.random() - 0.5).slice(0, Math.min(4, cards.length));
  let content = '💫 问答：易遇现在最想对你说哪句话？\n';
  shuffled.forEach((card, i) => { content += String.fromCharCode(65 + i) + '：' + card.content + '\n'; });
  content += '（请回复选项字母或内容）';
  let pool = onlineWorlds.length ? onlineWorlds : ['real'];
  const wid = pool[Math.floor(Math.random() * pool.length)];
  const msg = { sender: 'ta', content, timestamp: Date.now(), heartMark: null, isSystem: true, worldId: wid, worldLabel: getWorldLabel(wid) };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  await appendMessage(msg);
  pendingQuiz = { type: 'card', cards: shuffled, worldId: wid };
}

function normalizeAnswer(answer, options) {
  const a = String(answer).trim();
  if (/^[A-Da-d]$/.test(a)) {
    const idx = a.toUpperCase().charCodeAt(0) - 65;
    if (options[idx] !== undefined) return options[idx];
  }
  return a;
}

async function checkQuizAnswer(myAnswer) {
  const quiz = pendingQuiz;
  if (!quiz) return;
  pendingQuiz = null;
  let options, taPick;
  if (quiz.type === 'card') {
    options = quiz.cards.map(c => c.content);
    taPick = options[Math.floor(Math.random() * options.length)];
  } else {
    options = quiz.quiz.options;
    taPick = options[Math.floor(Math.random() * options.length)];
  }
  const myPick = normalizeAnswer(myAnswer, options);
  const wid = quiz.worldId || 'real';
  const taMsg = { sender: 'ta', content: taPick, timestamp: Date.now(), heartMark: null, worldId: wid, worldLabel: getWorldLabel(wid) };
  const tid = await idbPutReturnId('messages', taMsg);
  taMsg.id = tid;
  await appendMessage(taMsg);
  const matched = taPick.includes(myPick) || myPick.includes(taPick);
  let result;
  if (matched) {
    result = '💗 你们想的一样！爱意值+10';
    settings.heartValue += 10;
  } else {
    result = '🤍 你们的答案不一样。爱意值-5';
    settings.heartValue = Math.max(0, settings.heartValue - 5);
  }
  await saveSettings();
  updateHeartValue();
  const resultMsg = { sender: 'ta', content: result, timestamp: Date.now(), heartMark: null, isSystem: true };
  const rid = await idbPutReturnId('messages', resultMsg);
  resultMsg.id = rid;
  await appendMessage(resultMsg);
}

function scheduleTAQuiz() {
  const next = Math.random() * (settings.taQuizMax - settings.taQuizMin) + settings.taQuizMin;
  setTimeout(async () => {
    if (!pendingQuiz && !isReplying && !isArchiving && settings.heartValue >= 5) {
      await startQuiz();
      sendNotification('易遇想和你玩问答');
      addNotification('❓', '易遇想和你玩问答');
    }
    scheduleTAQuiz();
  }, next);
}

function checkReminders() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const currentTime = hh + ':' + mm;
  if (!settings.reminderTimes || !settings.reminderTimes.includes(currentTime)) return;
  if (!settings.reminderCards || !settings.reminderCards.length) return;
  const checked = JSON.parse(localStorage.getItem('reminderChecked') || '{}');
  const today = now.toDateString();
  if (checked[today + currentTime]) return;
  if (Math.random() > settings.reminderProb) return;
  checked[today + currentTime] = true;
  localStorage.setItem('reminderChecked', JSON.stringify(checked));
  const card = settings.reminderCards[Math.floor(Math.random() * settings.reminderCards.length)];
  let pool = onlineWorlds.length ? onlineWorlds : ['real'];
  const wid = pool[Math.floor(Math.random() * pool.length)];
  const msg = { sender: 'ta', content: card, timestamp: Date.now(), heartMark: null, worldId: wid, worldLabel: getWorldLabel(wid) };
  idbPutReturnId('messages', msg).then(async id => { msg.id = id; await appendMessage(msg); sendNotification(card); addNotification('⏰', '提醒：' + card); addBigEvent('remind', '第一次收到提醒'); });
}

function scheduleCompanionMessages() {

  const type = settings.accompanyType;

  else if (type === 'quiet') delayMs = 30 * 60000;

    const cards = await idbGetAll('cards');
    if (cards.length) {

      const id = await idbPutReturnId('messages', msg);

      await appendMessage(msg);

  }, delayMs);

// 陪伴统计按活动名分行 + 总时长
function openAccompanyStats() {
  const overlay = createModal(`<div class="big-input-title">陪伴统计</div><div id="acc-stats-content"></div>`);
  const content = overlay.querySelector('#acc-stats-content');
  const stats = settings.accompanyStats || {};
  const names = {
    sleep: '陪睡', daze: '发呆',
    companion_quiet: '陪伴（安静型）', companion_gentle: '陪伴（温柔型）',
    companion_clingy: '陪伴（粘人型）', companion_night: '陪伴（深夜型）',
    companion: '陪伴'
  };
  const rows = [];
  Object.keys(stats).forEach(key => {
    let label = names[key];
    if (!label && key.startsWith('together_')) label = '一起 · ' + key.slice(9);
    if (!label && key === 'together') label = '一起（未分类）';
    if (!label) label = key;
    rows.push({ label, ms: stats[key] });
  });
  if (!rows.length) { content.innerHTML = '<div class="placeholder-tip">还没有陪伴记录</div>'; return; }
  rows.sort((a, b) => b.ms - a.ms);
  let totalMs = 0;
  let html = '';
  rows.forEach(r => {
    totalMs += r.ms;
    const secs = Math.floor(r.ms / 1000);
    const mins = Math.floor(secs / 60);
    const remainSecs = secs % 60;
    const timeStr = mins >= 60 ? `${Math.floor(mins / 60)}小时${mins % 60}分` : `${mins}分${remainSecs}秒`;
    html += `<div class="heart-item"><span class="heart-mark">💗</span><span>${escapeHtml(r.label)}：${timeStr}</span></div>`;
  });
  const totalSecs = Math.floor(totalMs / 1000);
  const totalMins = Math.floor(totalSecs / 60);
  const totalStr = totalMins >= 60 ? `${Math.floor(totalMins / 60)}小时${totalMins % 60}分` : `${totalMins}分${totalSecs % 60}秒`;
  html += `<div class="heart-item" style="background:rgba(255,220,235,0.6);font-weight:700;"><span class="heart-mark">♡</span><span>总时长：${totalStr}</span></div>`;
  content.innerHTML = html;
}

function switchHeartView(view, overlay) {
  heartCurrentView = view;
  clearInterval(heartPlaybackTimer);
  renderHeartContent(overlay);
}

async function getHeartMessages() {
  const msgs = await idbGetAll('messages');
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  let all = [...msgs];
  Object.keys(archives).forEach(date => { all = all.concat(archives[date] || []); });
  if (heartCurrentTab === 'ta') return all.filter(m => m.heartMark && m.heartMark.includes('TA收藏'));
  if (heartCurrentTab === 'me') return all.filter(m => m.heartMark && m.heartMark.includes('我'));
  return all.filter(m => m.heartMark && m.heartMark.includes('TA指定'));
}

function heartMsgTypeLabel(m) {
  if (m.interactData) return '[互动]';
  if (m.giftData) return '[礼物]';
  if (m.giftPackData) return '[礼包]';
  if (m.imageData) return '[贴纸]';
  if (m.intimateData) return '[悄悄话]';
  return '';
}

function heartMsgPlainText(m) {
  if (m.interactData) return m.interactData.text || '';
  if (m.giftData) return (m.giftData.icon || '🎁') + ' ' + (m.giftData.name || '礼物');
  if (m.giftPackData) return (m.giftPackData.icon || '🎁') + ' ' + (m.giftPackData.name || '礼包');
  if (m.imageData) return '[贴纸]';
  if (m.intimateData) return m.content || '';
  return m.content || '';
}

function computeHeartCounts(items) {
  const counts = {};
  items.forEach(m => {
    const key = heartMsgTypeLabel(m) + '|' + heartMsgPlainText(m);
    counts[key] = (counts[key] || 0) + 1;
  });
  return counts;
}

function heartDisplayText(m, counts) {
  const label = heartMsgTypeLabel(m);
  const text = heartMsgPlainText(m);
  const key = label + '|' + text;
  const n = counts[key] || 1;
  const prefix = label ? label + ' ' : '';
  if (m.imageData) {
    return { html: `<img src="${m.imageData}" style="max-width:120px;border-radius:10px;display:inline-block;"><span style="font-size:11px;color:#8b6f60;margin-left:4px;">${n > 1 ? n : ''}</span>`, text: null };
  }
  return { html: null, text: prefix + text + (n > 1 ? '  ' + n : '') };
}

async function renderHeartContent(overlay) {
  const container = overlay.querySelector('#heart-content');
  const items = await getHeartMessages();
  container.innerHTML = '';
  if (!items.length) { container.innerHTML = '<div class="placeholder-tip">还没有心动瞬间</div>'; return; }
  const counts = computeHeartCounts(items);
  if (heartCurrentView === 'timeline') {
    const list = document.createElement('div');
    list.className = 'heart-list';
    items.forEach(m => {
      const div = document.createElement('div');
      div.className = 'heart-item';
      const disp = heartDisplayText(m, counts);
      if (disp.html) div.innerHTML = `<span class="heart-mark">💗</span><div>${disp.html}</div>`;
      else div.innerHTML = `<span class="heart-mark">💗</span><span>${escapeHtml(disp.text)}</span>`;
      list.appendChild(div);
    });
    container.appendChild(list);
  } else if (heartCurrentView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    items.forEach(m => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      const disp = heartDisplayText(m, counts);
      if (disp.html) card.innerHTML = disp.html;
      else card.textContent = disp.text;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  } else if (heartCurrentView === 'play') {
    const screen = document.createElement('div');
    screen.className = 'playback-screen';
    container.appendChild(screen);
    let idx = 0;
    clearInterval(heartPlaybackTimer);
    heartPlaybackTimer = setInterval(() => {
      if (idx >= items.length) { clearInterval(heartPlaybackTimer); return; }
      const m = items[idx];
      const disp = heartDisplayText(m, counts);
      screen.innerHTML = '';
      const pm = document.createElement('div');
      pm.className = 'playback-msg ' + m.sender;
      const inner = disp.html || escapeHtml(disp.text);
      const senderName = m.sender === 'me' ? settings.meName : (m.worldLabel || settings.taName);
      pm.innerHTML = `<div class="pm-sender">${escapeHtml(senderName)}</div><div class="pm-bubble">${inner}</div>`;
      screen.appendChild(pm);
      idx++;
    }, 1000);
  }
}

      <button class="mini-btn" id="playback-pause" style="display:none;">暂停</button>
      <button class="mini-btn" id="playback-speed" style="display:none;">速度 1x</button>
      <button class="mini-btn" id="playback-exit">退出</button>
    </div>`);
  overlay.querySelector('#playback-view-timeline').addEventListener('click', () => switchPlaybackView('timeline', overlay));
  overlay.querySelector('#playback-view-cards').addEventListener('click', () => switchPlaybackView('cards', overlay));
  overlay.querySelector('#playback-view-play').addEventListener('click', () => switchPlaybackView('play', overlay));
  overlay.querySelector('#playback-pause').addEventListener('click', () => {
    if (playbackTimer) { clearInterval(playbackTimer); playbackTimer = null; overlay.querySelector('#playback-pause').textContent = '继续'; }
    else { startPlayback(overlay); overlay.querySelector('#playback-pause').textContent = '暂停'; }
  });
  overlay.querySelector('#playback-speed').addEventListener('click', (e) => {
    if (playbackSpeed === 1000) playbackSpeed = 500;
    else if (playbackSpeed === 500) playbackSpeed = 2000;
    else playbackSpeed = 1000;
    e.target.textContent = '速度 ' + (playbackSpeed === 1000 ? '1x' : playbackSpeed === 500 ? '2x' : '0.5x');
    if (playbackTimer) { clearInterval(playbackTimer); startPlayback(overlay); }
  });
  overlay.querySelector('#playback-exit').addEventListener('click', () => { clearInterval(playbackTimer); overlay.remove(); });
  loadPlaybackDates(overlay);
}

function sortDatesDesc(dates) {
  return dates.slice().sort((a, b) => {
    const pa = a.split('-').map(Number);
    const pb = b.split('-').map(Number);
    if (pa[0] !== pb[0]) return pb[0] - pa[0];
    if (pa[1] !== pb[1]) return pb[1] - pa[1];
    return pb[2] - pa[2];
  });
}

function switchPlaybackView(view, overlay) {
  playbackView = view;
  clearInterval(playbackTimer);
  overlay.querySelector('#playback-pause').style.display = view === 'play' ? 'inline-block' : 'none';
  overlay.querySelector('#playback-speed').style.display = view === 'play' ? 'inline-block' : 'none';
  if (currentPlayDate) renderPlaybackContent(currentPlayDate, overlay);
}

async function loadPlaybackDates(overlay) {
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const dates = sortDatesDesc(Object.keys(archives));
  const container = overlay.querySelector('#playback-dates');
  container.innerHTML = '';
  if (!dates.length) { container.innerHTML = '<div class="placeholder-tip">还没有归档记录</div>'; return; }
  dates.forEach(date => {
    const div = document.createElement('div');
    div.className = 'playback-date';
    div.textContent = date;
    div.addEventListener('click', () => {
      container.querySelectorAll('.playback-date').forEach(d => d.classList.remove('active'));
      div.classList.add('active');
      currentPlayDate = date;
      renderPlaybackContent(date, overlay);
    });
    container.appendChild(div);
  });
  container.querySelector('.playback-date').classList.add('active');
  currentPlayDate = dates[0];
  renderPlaybackContent(dates[0], overlay);
}

function playbackMsgHTML(m) {
  if (m.imageData) return `<img src="${m.imageData}" style="max-width:200px;border-radius:12px;display:block;">`;
  if (m.giftData) return `<div class="msg-gift-card"><div class="msg-gift-icon">${m.giftData.icon || '🎁'}</div><div class="msg-gift-name">${escapeHtml(m.giftData.name || '礼物')}</div></div>`;
  if (m.giftPackData) return `<div class="msg-giftpack-card"><div class="gp-icon">${m.giftPackData.icon || '🎁'}</div><div class="gp-name">${escapeHtml(m.giftPackData.name || '礼包')}</div></div>`;
  if (m.interactData) return `<div class="msg-interact-text">${escapeHtml(m.interactData.text || '')}</div>`;
  if (m.intimateData) return `<div class="msg-bubble intimate" style="display:inline-block;">${escapeHtml(m.content || '')}</div>`;
  return escapeHtml(m.content || '');
}

function renderPlaybackContent(dateStr, overlay) {
  clearInterval(playbackTimer);
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const msgs = archives[dateStr] || [];
  const screen = overlay.querySelector('#playback-screen');
  screen.innerHTML = '';
  if (!msgs.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有消息</div>'; return; }
  if (playbackView === 'timeline') {
    msgs.forEach(m => {
      const pm = document.createElement('div');
      pm.className = 'playback-msg ' + (m.sender || 'ta');
      let bubble = playbackMsgHTML(m);
      if (m.heartMark) bubble = '💗 ' + bubble;
      const senderName = m.sender === 'me' ? settings.meName : (m.worldLabel || settings.taName);
      pm.innerHTML = `<div class="pm-sender">${escapeHtml(senderName)}</div><div class="pm-bubble">${bubble}</div>`;
      screen.appendChild(pm);
    });
  } else if (playbackView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    msgs.forEach(m => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      card.innerHTML = playbackMsgHTML(m);
      grid.appendChild(card);
    });
    screen.appendChild(grid);
  } else if (playbackView === 'play') {
    startPlayback(overlay);
  }
}

function startPlayback(overlay) {
  clearInterval(playbackTimer);
  const screen = overlay.querySelector('#playback-screen');
  screen.innerHTML = '';
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const msgs = archives[currentPlayDate] || [];
  if (!msgs.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有消息</div>'; return; }
  let idx = 0;
  playbackTimer = setInterval(() => {
    if (idx >= msgs.length) {
      clearInterval(playbackTimer);
      overlay.querySelector('#playback-pause').textContent = '暂停';
      screen.innerHTML = '<div class="placeholder-tip">播放结束</div>';
      return;
    }
    screen.innerHTML = '';
    const m = msgs[idx];
    const pm = document.createElement('div');
    pm.className = 'playback-msg ' + (m.sender || 'ta');
    let bubble = playbackMsgHTML(m);
    if (m.heartMark) bubble = '💗 ' + bubble;
    const senderName = m.sender === 'me' ? settings.meName : (m.worldLabel || settings.taName);
    pm.innerHTML = `<div class="pm-sender">${escapeHtml(senderName)}</div><div class="pm-bubble">${bubble}</div>`;
    screen.appendChild(pm);
    idx++;
  }, playbackSpeed);
}

async function loadVoiceDates(overlay) {
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');

function renderVoiceContent(dateStr, overlay) {
  clearInterval(playbackTimer);
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const dayRecords = records.filter(r => r.date === dateStr);
  const screen = overlay.querySelector('#voice-screen');
  screen.innerHTML = '';
  if (!dayRecords.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有通话</div>'; return; }
  if (playbackView === 'timeline') {
    dayRecords.forEach((r, idx) => {
      const block = document.createElement('div');
      block.className = 'voice-call-block';
      const mins = Math.floor(r.duration / 60);
      const secs = r.duration % 60;
      const startStr = r.startTime ? new Date(r.startTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
      const endStr = r.endTime ? new Date(r.endTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
      const wname = r.worldLabel || '易遇';
      block.innerHTML = `<div class="voice-call-head">通话${idx + 1} · ${escapeHtml(wname)} · ${startStr}开始 · ${endStr}结束 · ${mins}分${secs}秒${r.answered ? '' : '（未接）'}</div>`;
      if (r.taSpeaks && r.taSpeaks.length) {
        r.taSpeaks.forEach(speak => {
          const pm = document.createElement('div');
          pm.className = 'playback-msg ta';
          pm.innerHTML = `<div class="pm-sender">易遇</div><div class="pm-bubble">${escapeHtml(speak)}</div>`;
          block.appendChild(pm);
        });
      } else {
        const empty = document.createElement('div');
        empty.style.cssText = 'font-size:12px;color:#8b6f60;';
        empty.textContent = '（这次没有说话）';
        block.appendChild(empty);
      }
      screen.appendChild(block);
    });
  } else if (playbackView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    dayRecords.forEach((r) => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      const mins = Math.floor(r.duration / 60);
      card.textContent = `通话 ${mins}分${r.duration % 60}秒`;
      grid.appendChild(card);
      if (r.taSpeaks) {
        r.taSpeaks.forEach(speak => {
          const c2 = document.createElement('div');
          c2.className = 'heart-card';
          c2.textContent = speak;
          grid.appendChild(c2);
        });
      }
    });
    screen.appendChild(grid);
  } else if (playbackView === 'play') {
    startVoicePlayback(overlay);
  }
}

function startVoicePlayback(overlay) {
  clearInterval(playbackTimer);
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const dayRecords = records.filter(r => r.date === currentPlayDate);
  const allSpeaks = [];
  dayRecords.forEach(r => { if (r.taSpeaks) r.taSpeaks.forEach(s => allSpeaks.push(s)); });
  const screen = overlay.querySelector('#voice-screen');
  screen.innerHTML = '';
  if (!allSpeaks.length) { screen.innerHTML = '<div class="placeholder-tip">易遇没有说话</div>'; return; }
  let idx = 0;
  playbackTimer = setInterval(() => {
    if (idx >= allSpeaks.length) {
      clearInterval(playbackTimer);
      overlay.querySelector('#voice-pause').textContent = '暂停';
      screen.innerHTML = '<div class="placeholder-tip">播放结束</div>';
      return;
    }
    screen.innerHTML = '';
    const pm = document.createElement('div');
    pm.className = 'playback-msg ta';
    pm.innerHTML = `<div class="pm-sender">易遇</div><div class="pm-bubble">${escapeHtml(allSpeaks[idx])}</div>`;
    screen.appendChild(pm);
    idx++;
  }, playbackSpeed);
}

function joinCardsAsParagraph(cards) {
  let out = '';
  cards.forEach((c, i) => {
    const text = (c || '').trim();
    if (!text) return;
    out += text;
    if (i < cards.length - 1) {
      const lastChar = out.slice(-1);
      if (!/[，。！？、；：,.!?;:""''）)】]/.test(lastChar)) out += '，';
    }
  });
  return out;
}

// ========== 恋人空间 ==========
function getCheckinHeartSVG(meChecked, taChecked) {
  const both = meChecked && taChecked;
  const none = !meChecked && !taChecked;
  const heartPath = "M20,34 C20,34 4,23 4,13 C4,7 9,3 14,3 C17,3 20,6 20,6 C20,6 23,3 26,3 C31,3 36,7 36,13 C36,23 20,34 20,34 Z";
  if (both) return `<svg viewBox="0 0 40 38" width="40" height="38"><path d="${heartPath}" fill="rgba(255,143,176,0.85)" stroke="#ff6f9c" stroke-width="2"/></svg>`;
  if (none) return `<svg viewBox="0 0 40 38" width="40" height="38"><path d="${heartPath}" fill="rgba(255,255,255,0.6)" stroke="#ffb0c8" stroke-width="2"/></svg>`;
  return `<svg viewBox="0 0 40 38" width="40" height="38"><defs><linearGradient id="halfHeart" x1="0" y1="0" x2="1" y2="0"><stop offset="50%" stop-color="rgba(255,143,176,0.85)"/><stop offset="50%" stop-color="rgba(255,255,255,0.6)"/></linearGradient></defs><path d="${heartPath}" fill="url(#halfHeart)" stroke="#ffb0c8" stroke-width="2"/></svg>`;
}

function getCheckinData() {
  const today = new Date().toDateString();
  const checkins = JSON.parse(localStorage.getItem('loverCheckins') || '{}');
  const meList = checkins.me || [];
  const taList = checkins.ta || [];
  return { meList, taList, meChecked: meList.includes(today), taChecked: taList.includes(today), checkins };
}

function getMyConsecutiveDays(meList) {
  if (!meList.length) return 0;
  const days = [...new Set(meList)].sort();
  let consecutive = 0, prev = null;
  for (const d of days) {
    if (prev === null) consecutive = 1;
    else {
      const diff = Math.round((new Date(d) - new Date(prev)) / 86400000);
      consecutive = diff === 1 ? consecutive + 1 : 1;
    }
    prev = d;
  }
  const last = days[days.length - 1];
  const todayStr = new Date().toDateString();
  const yesterdayStr = new Date(Date.now() - 86400000).toDateString();
  if (last !== todayStr && last !== yesterdayStr) return 0;
  return consecutive;
}

function getCommonDays(meList, taList) {
  const meSet = new Set(meList);
  return [...new Set(taList)].filter(d => meSet.has(d)).length;
}

function openLoverSpacePanel() {
  const data = getCheckinData();
  const consecutive = getMyConsecutiveDays(data.meList);
  const common = getCommonDays(data.meList, data.taList);
  const bothChecked = data.meChecked && data.taChecked;
  const countText = bothChecked ? `共同打卡 ${common} 天` : `连续打卡 ${consecutive} 天`;
  const overlay = createModal(`
    <div style="text-align:center;margin-bottom:16px;">

async function loadStats(content) {
  const msgs = await idbGetAll('messages');
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  let allMsgs = [...msgs];
  Object.keys(archives).forEach(d => { allMsgs = allMsgs.concat(archives[d] || []); });
  const myMsgs = allMsgs.filter(m => m.sender === 'me');
  const taMsgs = allMsgs.filter(m => m.sender === 'ta');
  const letters = JSON.parse(localStorage.getItem('letters') || '{"received":[],"sent":[]}');
  const notes = JSON.parse(localStorage.getItem('notes') || '{"ta":[],"me":[]}');
  const posts = JSON.parse(localStorage.getItem('loverPosts') || '[]');
  const videoRecords = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const totalCallDuration = videoRecords.reduce((a, r) => a + (r.duration || 0), 0);
  const answeredRecords = videoRecords.filter(r => r.answered);
  const longestCall = answeredRecords.length ? Math.max(...answeredRecords.map(r => r.duration || 0)) : 0;
  const avgCall = answeredRecords.length ? Math.round(totalCallDuration / answeredRecords.length) : 0;
  const missedCalls = videoRecords.filter(r => !r.answered).length;
  const totalCallMins = Math.floor(totalCallDuration / 60);
  const totalCallHours = Math.floor(totalCallMins / 60);
  const callDurationStr = totalCallHours > 0 ? `${totalCallHours}小时${totalCallMins % 60}分` : `${totalCallMins}分${totalCallDuration % 60}秒`;
  const longestMins = Math.floor(longestCall / 60);
  const avgMins = Math.floor(avgCall / 60);
  const myPosts = posts.filter(p => p.name === settings.meName).length;
  const taPosts = posts.filter(p => p.name === settings.taName).length;
  const checkins = JSON.parse(localStorage.getItem('loverCheckins') || '{}');
  const myCheckins = checkins.me ? [...new Set(checkins.me)].length : 0;
  const taCheckins = checkins.ta ? [...new Set(checkins.ta)].length : 0;
  const commonCheckins = getCommonDays(checkins.me || [], checkins.ta || []);
  const myWords = getTopWords(myMsgs.map(m => m.content), 20);
  const taWords = getTopWords(taMsgs.map(m => m.content), 20);
  content.innerHTML = `
    <div class="big-input-title">数据统计</div>
    <div class="heart-item"><span class="heart-mark">💬</span><span>总消息 ${allMsgs.length} 条 ｜ 我发的 ${myMsgs.length} 条 ｜ 易遇发的 ${taMsgs.length} 条</span></div>
    <div class="heart-item"><span class="heart-mark">✉</span><span>易遇来信 ${letters.received.length} 封 ｜ 你寄出 ${letters.sent.length} 封</span></div>
    <div class="heart-item"><span class="heart-mark">📝</span><span>易遇留言 ${notes.ta.length} 条 ｜ 你的留言 ${notes.me.length} 条</span></div>
    <div class="heart-item"><span class="heart-mark">📢</span><span>易遇动态 ${taPosts} 条 ｜ 你动态 ${myPosts} 条</span></div>
    <div class="heart-item"><span class="heart-mark">📞</span><span>通话 ${videoRecords.length} 次 ｜ 总时长 ${callDurationStr} ｜ 最长 ${longestMins}分${longestCall % 60}秒 ｜ 平均 ${avgMins}分${avgCall % 60}秒 ｜ 未接 ${missedCalls} 次</span></div>
    <div class="heart-item"><span class="heart-mark">♡</span><span>打卡 我 ${myCheckins} 天 ｜ 易遇 ${taCheckins} 天 ｜ 共同 ${commonCheckins} 天</span></div>
    <div class="heart-item"><span class="heart-mark">💗</span><span>爱意值 当前 ${settings.heartValue}</span></div>
    <div class="big-input-title" style="margin-top:16px;">我的高频词汇</div>
    <div class="heart-list">${myWords.map(w => `<div class="heart-item"><span class="heart-mark">${w.count}</span><span>${escapeHtml(w.word)}</span></div>`).join('') || '<div class="placeholder-tip">暂无数据</div>'}</div>
    <div class="big-input-title" style="margin-top:16px;">易遇的高频词汇</div>
    <div class="heart-list">${taWords.map(w => `<div class="heart-item"><span class="heart-mark">${w.count}</span><span>${escapeHtml(w.word)}</span></div>`).join('') || '<div class="placeholder-tip">暂无数据</div>'}</div>`;
}

function getTopWords(texts, topN) {
  const wordCount = {};
  texts.forEach(text => {
    if (!text) return;
    const words = text.split(/[\s，。！？、,.!?；;：:（）()\[\]【】"'""'']+/);
    words.forEach(w => { if (w.length >= 2) wordCount[w] = (wordCount[w] || 0) + 1; });
  });
  return Object.entries(wordCount).sort((a, b) => b[1] - a[1]).slice(0, topN).map(([word, count]) => ({ word, count }));
}

function getTodayScheduleType(worldId) {
  if (!WORLD_SCHEDULE_TYPES[worldId]) {
    const types = Object.keys(WORLD_SCHEDULES_MULTI[worldId] || { work: 1 });
    WORLD_SCHEDULE_TYPES[worldId] = types[Math.floor(Math.random() * types.length)];
  }
  return WORLD_SCHEDULE_TYPES[worldId];
}

function refreshScheduleTypes() {
  const today = new Date().toDateString();
  if (lastScheduleDay === today) return;
  lastScheduleDay = today;
  WORLD_SCHEDULE_TYPES = {};
  (settings.worlds || []).forEach(w => {
    if (WORLD_SCHEDULES_MULTI[w.id]) {
      const types = Object.keys(WORLD_SCHEDULES_MULTI[w.id]);
      WORLD_SCHEDULE_TYPES[w.id] = types[Math.floor(Math.random() * types.length)];
    }
  });
}

function scheduleTADailyLife() {
  setInterval(async () => {
    if (isReplying || isArchiving) return;
    const pool = onlineWorlds.length ? onlineWorlds : (settings.worlds || []).map(w => w.id);
    for (const wid of pool) {
      const dayType = getTodayScheduleType(wid);
      if (dayType !== 'rest' && dayType !== 'special' && dayType !== 'overtime') continue;
      if (Math.random() > 0.1) continue;
      const proposals = (settings.worldProposals && settings.worldProposals[wid]) || [];
      const sweets = (settings.worldSweetWords && settings.worldSweetWords[wid]) || (settings.worldSweetWords && settings.worldSweetWords['__general']) || [];
      let line = '';
      if (dayType === 'rest' && proposals.length && Math.random() < 0.6) {
        line = proposals[Math.floor(Math.random() * proposals.length)];
      } else if (dayType === 'rest' && sweets.length) {
        line = sweets[Math.floor(Math.random() * sweets.length)];
      } else if ((dayType === 'overtime' || dayType === 'special') && sweets.length) {
        line = sweets[Math.floor(Math.random() * sweets.length)];
      }
      if (!line) continue;
      const msg = { sender: 'ta', content: line, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
      const id = await idbPutReturnId('messages', msg);
      msg.id = id;
      await appendMessage(msg);
      sendNotification(line);
      addNotification('🌙', '易遇的休假日常');
      return;
    }
  }, 1800000);
}

async function restoreFromBackup(data) {
  if (data.settings) {
    settings = { ...DEFAULT_SETTINGS, ...data.settings };
    if (!settings.worlds || settings.worlds.length < DEFAULT_WORLDS.length) {
      settings.worlds = JSON.parse(JSON.stringify(DEFAULT_WORLDS));
    }
    if (!settings.flowerTypes || !settings.flowerTypes.length) settings.flowerTypes = JSON.parse(JSON.stringify(DEFAULT_FLOWER_TYPES));
    if (!settings.treeTypes || !settings.treeTypes.length) settings.treeTypes = JSON.parse(JSON.stringify(DEFAULT_TREE_TYPES));
    await saveSettings();
  }
  if (data.cards) {
    await idbClear('cards');
    for (const card of data.cards) await idbPut('cards', { content: card.content, worldId: card.worldId || '' });
  }
  if (data.messages) {
    await idbClear('messages');
    for (const msg of data.messages) await idbPut('messages', msg);
  }
  if (data.media) {
    await idbClear('media');
    for (const m of data.media) await idbPut('media', m);
  }
  localStorage.clear();
  const lsKeys = ['archives', 'avatarLibrary', 'bgLibrary', 'stickerLibrary', 'giftLibrary', 'giftPackLibrary', 'interactionLibrary', 'quizLibrary', 'emojiLibrary', 'musicList', 'recycledCards', 'importantDays', 'attendanceRecords', 'bondRecords', 'periodRecords', 'periodCards', 'periodSymptoms', 'periodCareChecked', 'dateRecords', 'dateCards', 'petDataList', 'plantsData', 'wishes', 'videoRecords', 'letters', 'notes', 'loverPosts', 'loverCheckins', 'togetherLibrary', 'accountRecords', 'piggyData', 'ballPos', 'reminderChecked', 'checkinRemindChecked', 'importantChecked', 'lastArchiveDate', 'musicPlayerPos', 'musicPlayMode', 'giftsInitV700', 'datePlaceActivity', 'dateTextLibrary_accept', 'dateTextLibrary_reject', 'dateTextLibrary_reaction', 'dateTextLibrary_remind', 'pendingDateInvites', 'questionnaireLibrary', 'questionnaireReplyLibrary'];
  lsKeys.forEach(k => { if (data[k] !== undefined) localStorage.setItem(k, JSON.stringify(data[k])); });
  if (data.memo) localStorage.setItem('memo', data.memo);
  localStorage.setItem('mediaMigratedV650', '1');
}

  });
}

function loadAccountData(overlay) {
  const records = JSON.parse(localStorage.getItem('accountRecords') || '[]');
  const monthPrefix = new Date().toISOString().slice(0, 7);
  const monthRecords = records.filter(r => r.date.startsWith(monthPrefix));
  const monthIncome = monthRecords.filter(r => r.type === 'income').reduce((a, r) => a + r.amount, 0);
  const monthExpense = monthRecords.filter(r => r.type === 'expense').reduce((a, r) => a + r.amount, 0);
  overlay.querySelector('#account-summary').textContent = `本月收入 ${monthIncome} 元 ｜ 本月支出 ${monthExpense} 元 ｜ 结余 ${monthIncome - monthExpense} 元`;
  const list = overlay.querySelector('#account-list');
  list.innerHTML = '';
  if (!records.length) { list.innerHTML = '<div class="placeholder-tip">还没有记录</div>'; return; }
  records.slice().reverse().forEach((r) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    const noteStr = r.note ? ' ' + escapeHtml(r.note) : '';
    div.innerHTML = `<div class="card-text">${r.date} ${escapeHtml(r.cat)}${noteStr} ${r.type === 'income' ? '+' : '-'}${r.amount} 元</div>
      <div class="card-ops"><button class="account-del">✕</button></div>`;
    div.querySelector('.account-del').addEventListener('click', () => {
      records.splice(records.indexOf(r), 1);
      localStorage.setItem('accountRecords', JSON.stringify(records));
      loadAccountData(overlay);
    });
    list.appendChild(div);
  });
}

function loadMusicList(overlay, tab) {

    if (tab === 'netease' && isNetease) filtered.push({ song: m, index: i });

  let musicType = 'local';
  let musicData = '';

  overlay.querySelectorAll('.music-type-btn').forEach(btn => {

  });
  function renderMusicTypeArea() {
    const area = overlay.querySelector('#music-type-area');
    if (musicType === 'local') {
      area.innerHTML = `<button class="upload-btn" id="music-file-btn" style="margin-top:0;">上传音频文件</button><div class="big-input-hint" id="music-file-hint" style="margin-top:6px;"></div>`;
      area.querySelector('#music-file-btn').addEventListener('click', () => {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'audio/*';
        inp.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const hint = area.querySelector('#music-file-hint');
          hint.textContent = '正在读取...';
          const reader = new FileReader();
          reader.onload = async () => {
            hint.textContent = '正在保存...';
            const key = 'music_' + Date.now();
            try {
              await idbPut('media', { key, value: reader.result });
              musicData = 'media:' + key;
              hint.textContent = '已选择：' + file.name;
            } catch (err) { hint.textContent = '保存失败，可能太大'; }
          };
          reader.onerror = () => { hint.textContent = '读取失败'; };
          reader.readAsDataURL(file);
        };
        inp.click();
      });
    } else {
      area.innerHTML = `
        <input type="text" id="music-id-input" placeholder="网易云歌曲ID（必填）" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:8px;">
        <div style="font-size:12px;color:#8b6f60;">填歌名 + ID，播放时用网易云内嵌播放器</div>`;
      area.querySelector('#music-id-input').addEventListener('input', (e) => { musicId = e.target.value.trim(); });
    }
  }
  renderMusicTypeArea();
  overlay.querySelector('#save-music').addEventListener('click', async () => {
    const name = overlay.querySelector('#music-name-input').value.trim();
    const artist = overlay.querySelector('#music-artist-input').value.trim();
    if (!name) return showToast('请填写歌曲名');
    musicList = JSON.parse(localStorage.getItem('musicList') || '[]');
    if (musicType === 'local') {
      if (!musicData) return showToast('请上传音频文件');
      musicList.push({ name, artist, type: 'local', musicKey: musicData });
    } else {
      if (!musicId) return showToast('请输入网易云歌曲ID');
      musicList.push({ name, artist, type: 'platform', platform: 'netease', id: musicId });
    }
    localStorage.setItem('musicList', JSON.stringify(musicList));
    showToast('歌曲已保存');
    overlay.remove();
    panelOverlay.remove();
    openMusicManagePanel();
  });
}

      else if (curTab === 'local' && !isNetease) filtered.push({ song: m, index: i });
    });

      list.appendChild(div);

function refreshLocalIndices() {
  musicLocalIndices = [];
  musicList.forEach((m, i) => {
    const isNetease = m.type === 'platform' && m.platform === 'netease';
    if (!isNetease) musicLocalIndices.push(i);
  });
  const cur = musicLocalIndices.indexOf(musicIndex);
  musicLocalPos = cur >= 0 ? cur : 0;
}

async function showMusicPlayer() {
  const song = musicList[musicIndex];
  if (!song) return;
  if (song.type === 'platform' && song.platform === 'netease') {
    showNeteasePlayer(song);
    return;
  }
  refreshLocalIndices();
  if (!musicLocalIndices.length) { showToast('没有本地音乐'); return; }
  if (musicPlayer) musicPlayer.remove();
  musicPlayer = document.createElement('div');
  musicPlayer.className = 'music-mini-player';
  musicPlayer.innerHTML = `
    <span class="music-name" id="music-player-name">${escapeHtml(song.name)}</span>
    <button id="music-prev-btn">${PREV_ICON}</button>
    <button id="music-play-btn">${PLAY_ICON}</button>
    <button id="music-next-btn">${NEXT_ICON}</button>
    <button id="music-mode-btn" title="播放模式"></button>
    <button id="music-close-btn">✕</button>`;
  document.body.appendChild(musicPlayer);
  const savedPos = musicPlayerPos || JSON.parse(localStorage.getItem('musicPlayerPos') || 'null');
  if (savedPos && savedPos.x !== undefined) {
    musicPlayer.style.left = savedPos.x + 'px';
    musicPlayer.style.top = savedPos.y + 'px';
    musicPlayer.style.right = 'auto';
    musicPlayer.style.bottom = 'auto';
  }
  makeDraggable(musicPlayer, (pos) => {
    musicPlayerPos = pos;
    localStorage.setItem('musicPlayerPos', JSON.stringify(pos));
  });
  function modeIcon() {
    if (musicPlayMode === 'singleLoop') return '🔂';
    if (musicPlayMode === 'shuffle') return '🔀';
    if (musicPlayMode === 'order') return '➡';
    return '🔁';
  }
  function modeName() {
    if (musicPlayMode === 'singleLoop') return '单曲循环';
    if (musicPlayMode === 'shuffle') return '随机播放';
    if (musicPlayMode === 'order') return '顺序播放';
    return '列表循环';
  }
  const modeBtn = musicPlayer.querySelector('#music-mode-btn');
  modeBtn.textContent = modeIcon();
  modeBtn.style.fontSize = '14px';
  modeBtn.title = modeName();
  function goNext() {
    if (!musicLocalIndices.length) return;
    musicLocalPos = (musicLocalPos + 1) % musicLocalIndices.length;
    musicIndex = musicLocalIndices[musicLocalPos];
    showMusicPlayer();
  }
  function goPrev() {
    if (!musicLocalIndices.length) return;
    musicLocalPos = (musicLocalPos - 1 + musicLocalIndices.length) % musicLocalIndices.length;
    musicIndex = musicLocalIndices[musicLocalPos];
    showMusicPlayer();
  }
  function goRandom() {
    if (musicLocalIndices.length <= 1) { musicIndex = musicLocalIndices[0]; showMusicPlayer(); return; }
    let next = musicLocalPos;
    while (next === musicLocalPos) next = Math.floor(Math.random() * musicLocalIndices.length);
    musicLocalPos = next;
    musicIndex = musicLocalIndices[musicLocalPos];
    showMusicPlayer();
  }
  let audio = null;
  let isPlaying = false;
  if (song.musicKey) {
    const data = await resolveMedia(song.musicKey);
    if (data) audio = new Audio(data);
  }
  if (audio) {
    audio.play().then(() => { isPlaying = true; musicPlayer.querySelector('#music-play-btn').innerHTML = PAUSE_ICON; }).catch(() => {});
    audio.addEventListener('ended', () => {
      if (!musicPlayer) return;
      if (musicPlayMode === 'singleLoop') { audio.currentTime = 0; audio.play(); return; }
      if (musicPlayMode === 'shuffle') { goRandom(); return; }
      if (musicPlayMode === 'order') {
        if (musicLocalPos >= musicLocalIndices.length - 1) {
          isPlaying = false;
          const btnEl = musicPlayer.querySelector('#music-play-btn');
          if (btnEl) btnEl.innerHTML = PLAY_ICON;
          return;
        }
        goNext();
        return;
      }
      goNext();
    });
  }
  musicPlayer.querySelector('#music-play-btn').addEventListener('click', () => {
    if (!audio) return showToast('音频加载中');
    if (isPlaying) { audio.pause(); musicPlayer.querySelector('#music-play-btn').innerHTML = PLAY_ICON; }
    else { audio.play(); musicPlayer.querySelector('#music-play-btn').innerHTML = PAUSE_ICON; }
    isPlaying = !isPlaying;
  });
  musicPlayer.querySelector('#music-next-btn').addEventListener('click', () => { if (audio) audio.pause(); goNext(); });
  musicPlayer.querySelector('#music-prev-btn').addEventListener('click', () => { if (audio) audio.pause(); goPrev(); });
  modeBtn.addEventListener('click', () => {
    const order = ['listLoop', 'singleLoop', 'shuffle', 'order'];
    const idx = order.indexOf(musicPlayMode);
    musicPlayMode = order[(idx + 1) % order.length];
    localStorage.setItem('musicPlayMode', musicPlayMode);
    modeBtn.textContent = modeIcon();
    modeBtn.title = modeName();
    showToast(modeName());
  });
  musicPlayer.querySelector('#music-close-btn').addEventListener('click', () => {
    if (audio) audio.pause();
    musicPlayer.remove();
    musicPlayer = null;
  });
}

    </div>`, 'netease-modal-panel');

function makeModalDraggable(overlay, panel, handle) {
  let drag = false, startX = 0, startY = 0, origX = 0, origY = 0;
  handle.style.touchAction = 'none';
  handle.addEventListener('pointerdown', (e) => {
    drag = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = panel.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;
    panel.style.position = 'fixed';
    panel.style.left = origX + 'px';
    panel.style.top = origY + 'px';
    panel.style.margin = '0';
    overlay.style.alignItems = 'flex-start';
    overlay.style.justifyContent = 'flex-start';
    panel.style.transform = 'none';
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const nx = origX + e.clientX - startX;
    const ny = origY + e.clientY - startY;
    const maxX = window.innerWidth - panel.offsetWidth - 4;
    const maxY = window.innerHeight - panel.offsetHeight - 4;
    panel.style.left = Math.max(4, Math.min(maxX, nx)) + 'px';
    panel.style.top = Math.max(4, Math.min(maxY, ny)) + 'px';
  });
  handle.addEventListener('pointerup', () => { drag = false; handle.classList.remove('dragging'); });
}
