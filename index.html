<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>易遇♡夏雾凉</title>
<style>
/* ========== 基础重置 ========== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: #0d0d0d;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* ========== 动态背景 ========== */
#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ========== 主容器 ========== */
#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  backdrop-filter: blur(16px) saturate(1.1);
  -webkit-backdrop-filter: blur(16px) saturate(1.1);
  background: rgba(255, 255, 255, 0.08);
}

/* ========== 顶栏 ========== */
#topbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 20px 8px 20px;
  min-height: 56px;
  z-index: 2;
}

.top-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.3);
  border: 1.5px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
}

#heart-line {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

#heart-line svg {
  display: block;
}

#heart-line .heart-fill {
  animation: heartbeat 2.4s ease-in-out infinite;
  transform-origin: center;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  10% { transform: scale(1.12); }
  20% { transform: scale(0.98); }
  30% { transform: scale(1.08); }
  45% { transform: scale(1); }
}

.heartbeat-path {
  stroke-dasharray: 6, 3;
  animation: dashmove 3s linear infinite;
}

@keyframes dashmove {
  to { stroke-dashoffset: -18; }
}

/* ========== 心意值 ========== */
#heart-value-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 4px;
  font-size: 13px;
  color: #ff3b5c;
  font-weight: 600;
  text-shadow: 0 0 8px rgba(255, 59, 92, 0.35);
  z-index: 2;
}

#heart-value-box .empty-heart {
  font-size: 16px;
  color: #ff3b5c;
}

/* ========== 消息区 ========== */
#messages-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 12px 8px 12px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

/* ========== 置顶区 ========== */
#pinned-area {
  display: flex;
  gap: 8px;
  padding: 6px 12px;
  overflow-x: auto;
  flex-shrink: 0;
  z-index: 2;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

#pinned-area::-webkit-scrollbar {
  display: none;
}

.pinned-item {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 16px;
  padding: 6px 12px;
  font-size: 12px;
  color: #6b4c3b;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}

.pinned-item .pin-icon {
  font-size: 10px;
}
  /* ========== 消息行 ========== */
.message-row {
  display: flex;
  margin-bottom: 14px;
  animation: msgIn 0.25s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-row.me {
  justify-content: flex-end;
}

.message-row.ta {
  justify-content: flex-start;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
}

.message-row.me .msg-avatar {
  margin-left: 8px;
}

.message-row.ta .msg-avatar {
  margin-right: 8px;
}

.msg-content-wrapper {
  max-width: 68%;
  display: flex;
  flex-direction: column;
}

.message-row.me .msg-content-wrapper {
  align-items: flex-end;
}

.message-row.ta .msg-content-wrapper {
  align-items: flex-start;
}

.msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
  position: relative;
}

.message-row.me .msg-bubble {
  background: rgba(255, 150, 90, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
  border-bottom-right-radius: 6px;
}

.message-row.ta .msg-bubble {
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #4a3f3a;
  border-bottom-left-radius: 6px;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: rgba(80, 60, 50, 0.6);
  margin-top: 3px;
  padding: 0 4px;
}

.msg-read {
  color: rgba(120, 100, 90, 0.55);
}

.msg-pin-mark {
  color: #ff3b5c;
  font-size: 11px;
  margin-left: 4px;
}

.msg-heart-mark {
  color: #ff8fb0;
  font-size: 11px;
  margin-left: 4px;
}

/* ========== 正在输入 ========== */
#typing-indicator {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 4px 16px 8px 16px;
  font-size: 13px;
  color: rgba(90, 70, 60, 0.7);
  z-index: 2;
  flex-shrink: 0;
}

#typing-indicator.show {
  display: flex;
}

.typing-dots {
  display: flex;
  gap: 3px;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(90, 70, 60, 0.6);
  animation: dotjump 1.2s infinite;
}

.typing-dots span:nth-child(2) {
  animation-delay: 0.2s;
}

.typing-dots span:nth-child(3) {
  animation-delay: 0.4s;
}

@keyframes dotjump {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

/* ========== 输入区 ========== */
#input-area {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px 18px 16px;
  z-index: 2;
  flex-shrink: 0;
}

#chat-input {
  flex: 1;
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 22px;
  padding: 10px 16px;
  font-size: 15px;
  color: #4a3f3a;
  outline: none;
  min-height: 42px;
  max-height: 120px;
}

#chat-input::placeholder {
  color: rgba(90, 70, 60, 0.45);
}

#send-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #6b4c3b;
  flex-shrink: 0;
  transition: all 0.2s;
}

#send-btn:active {
  transform: scale(0.9);
  background: rgba(255, 255, 255, 0.6);
}

#send-btn.send-mode {
  background: rgba(255, 120, 100, 0.7);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border-color: rgba(255, 255, 255, 0.6);
}

/* ========== 悬浮球 ========== */
#floating-ball {
  position: fixed;
  z-index: 10;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  animation: ballBreathe 3.2s ease-in-out infinite;
  overflow: hidden;
  touch-action: none;
}

#floating-ball img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

@keyframes ballBreathe {
  0%, 100% { transform: scale(1); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  50% { transform: scale(1.04); box-shadow: 0 6px 24px rgba(0,0,0,0.16); }
}
  /* ========== 弹窗通用 ========== */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(60, 40, 30, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-panel {
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  border-radius: 24px;
  padding: 20px;
  width: 90%;
  max-width: 420px;
  max-height: 80vh;
  overflow-y: auto;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  animation: panelIn 0.25s ease-out;
}

@keyframes panelIn {
  from { opacity: 0; transform: scale(0.92) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ========== 悬浮球展开面板 ========== */
#ball-panel {
  position: fixed;
  z-index: 30;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1.5px solid rgba(255, 255, 255, 0.75);
  border-radius: 28px;
  padding: 20px;
  width: 88%;
  max-width: 380px;
  max-height: 75vh;
  overflow-y: auto;
  box-shadow: 0 16px 50px rgba(0, 0, 0, 0.2);
  display: none;
  animation: panelIn 0.3s ease-out;
}

#ball-panel.show {
  display: block;
}

.ball-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px 8px;
}

.ball-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  border-radius: 18px;
  cursor: pointer;
  transition: background 0.2s;
}

.ball-item:active {
  background: rgba(0, 0, 0, 0.04);
}

.ball-item .icon-wrap {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.ball-item .icon-wrap svg {
  width: 24px;
  height: 24px;
}

.ball-item span {
  font-size: 12px;
  color: #4a3528;
  text-align: center;
}

/* ========== 字卡面板 ========== */
.card-input-row input,
.card-search-row input {
  width: 100%;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 14px;
  color: #4a3f3a;
  outline: none;
  margin-bottom: 8px;
}

.card-actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.mini-btn {
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 14px;
  padding: 8px 14px;
  font-size: 13px;
  color: #4a3528;
  cursor: pointer;
  transition: all 0.2s;
}

.mini-btn:active {
  background: rgba(255, 255, 255, 0.7);
  transform: scale(0.96);
}

.card-count-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 13px;
  color: #4a3528;
}

.card-list {
  max-height: 45vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.card-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 14px;
  color: #4a3f3a;
  word-break: break-word;
}

.card-item .card-text {
  flex: 1;
}

.card-item .card-ops {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.card-ops button {
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  color: #8b6f60;
  padding: 2px;
}

/* ========== 大输入弹窗 ========== */
.big-input-title {
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  color: #4a3528;
  margin-bottom: 16px;
}

.big-input-area {
  width: 100%;
  min-height: 160px;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 16px;
  padding: 14px;
  font-size: 15px;
  color: #4a3f3a;
  outline: none;
  resize: vertical;
}

.big-input-area::placeholder {
  color: rgba(90, 70, 60, 0.4);
}

.big-input-hint {
  text-align: center;
  font-size: 11px;
  color: rgba(90, 70, 60, 0.55);
  margin: 10px 0 16px 0;
}

.save-btn-center {
  display: block;
  margin: 0 auto;
  background: rgba(255, 150, 100, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 18px;
  padding: 10px 24px;
  font-size: 15px;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
}

.save-btn-center:active {
  transform: scale(0.95);
  background: rgba(255, 150, 100, 0.8);
}
  /* ========== 头像/背景面板 ========== */
.about-section {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

.about-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  background: rgba(255, 255, 255, 0.3);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
}

.about-info {
  flex: 1;
}

.about-info .about-name {
  font-size: 16px;
  font-weight: 600;
  color: #4a3528;
  margin-bottom: 2px;
  cursor: pointer;
}

.about-info .about-nick {
  font-size: 13px;
  color: #8b6f60;
  cursor: pointer;
}

.library-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 8px;
}

.lib-item {
  aspect-ratio: 1;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  border: 2px solid transparent;
}

.lib-item.active {
  border-color: #ff7b5c;
}

.lib-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.lib-item .lib-del {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.45);
  color: #fff;
  border: none;
  font-size: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.upload-btn {
  display: block;
  width: 100%;
  background: rgba(255, 255, 255, 0.4);
  border: 1.5px dashed rgba(255, 255, 255, 0.7);
  border-radius: 14px;
  padding: 12px;
  font-size: 14px;
  color: #4a3528;
  cursor: pointer;
  text-align: center;
  margin-top: 10px;
}

/* ========== 回忆放映室 ========== */
.playback-dates {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px 0;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.playback-dates::-webkit-scrollbar {
  display: none;
}

.playback-date {
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 14px;
  padding: 8px 14px;
  font-size: 13px;
  color: #4a3528;
  cursor: pointer;
  white-space: nowrap;
}

.playback-date.active {
  background: rgba(255, 150, 100, 0.55);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.6);
}

.playback-screen {
  min-height: 200px;
  max-height: 45vh;
  overflow-y: auto;
  background: rgba(255, 255, 255, 0.25);
  border-radius: 16px;
  padding: 12px;
  margin-bottom: 12px;
}

.playback-msg {
  margin-bottom: 10px;
  animation: msgIn 0.3s ease-out;
}

.playback-msg .pm-sender {
  font-size: 11px;
  color: rgba(90, 70, 60, 0.6);
  margin-bottom: 2px;
}

.playback-msg .pm-bubble {
  display: inline-block;
  padding: 8px 12px;
  border-radius: 14px;
  font-size: 14px;
  line-height: 1.5;
  max-width: 85%;
  word-break: break-word;
  white-space: pre-wrap;
}

.playback-msg.me .pm-bubble {
  background: rgba(255, 150, 90, 0.5);
  color: #fff;
}

.playback-msg.ta .pm-bubble {
  background: rgba(255, 255, 255, 0.55);
  color: #4a3f3a;
}

.playback-controls {
  display: flex;
  gap: 8px;
  justify-content: center;
}

/* ========== 心动瞬间 ========== */
.heart-tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
}

.heart-tab {
  flex: 1;
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 14px;
  padding: 8px;
  font-size: 13px;
  color: #4a3528;
  cursor: pointer;
  text-align: center;
}

.heart-tab.active {
  background: rgba(255, 143, 176, 0.5);
  color: #fff;
  border-color: rgba(255, 255, 255, 0.6);
}

.heart-view-tabs {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin-top: 12px;
}

.heart-list {
  max-height: 40vh;
  overflow-y: auto;
}

.heart-grid-cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  max-height: 40vh;
  overflow-y: auto;
}

.heart-card {
  background: rgba(255, 255, 255, 0.45);
  border-radius: 14px;
  padding: 12px;
  font-size: 13px;
  color: #4a3f3a;
  word-break: break-word;
}

.heart-item {
  background: rgba(255, 255, 255, 0.4);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 14px;
  color: #4a3f3a;
  word-break: break-word;
  display: flex;
  align-items: flex-start;
  gap: 6px;
}

.heart-item .heart-mark {
  color: #ff8fb0;
  flex-shrink: 0;
}

/* ========== 轻提示 ========== */
#toast {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 18px;
  padding: 10px 18px;
  font-size: 14px;
  color: #4a3528;
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s ease-out;
  white-space: nowrap;
  max-width: 80%;
  overflow: hidden;
  text-overflow: ellipsis;
}

#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ========== 滚动条 ========== */
::-webkit-scrollbar {
  width: 4px;
  height: 4px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {

let db = null;
let settings = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
let stopTimer = null;

// ========== IndexedDB ==========
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('YiyuXiawuliang', 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('messages')) d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'key' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = (e) => reject(e);
  });
}

function idbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function idbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbClear(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function idbPutReturnId(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

// ========== 设置 ==========

  if (saved) settings = { ...DEFAULT_SETTINGS, ...saved.value };

}

async function saveSettings() {
  await idbPut('kv', { key: 'settings', value: settings });
}

}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function delay(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function initBallPosition() {
  const ball = document.getElementById('floating-ball');
  const savedPos = JSON.parse(localStorage.getItem('ballPos') || 'null');
  if (savedPos) {
    ball.style.left = savedPos.x + 'px';
    ball.style.top = savedPos.y + 'px';
  } else {
    ball.style.right = '16px';
    ball.style.bottom = '80px';
  }
  let drag = false, startX = 0, startY = 0, origX = 0, origY = 0;
  ball.addEventListener('pointerdown', (e) => {
    drag = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = ball.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;
    ball.style.right = 'auto';
    ball.style.bottom = 'auto';
    ball.style.left = origX + 'px';
    ball.style.top = origY + 'px';
    ball.setPointerCapture(e.pointerId);
  });
  ball.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    let nx = origX + dx;
    let ny = origY + dy;
    nx = Math.max(4, Math.min(window.innerWidth - 56, nx));
    ny = Math.max(4, Math.min(window.innerHeight - 56, ny));
    ball.style.left = nx + 'px';
    ball.style.top = ny + 'px';
  });
  ball.addEventListener('pointerup', (e) => {
    if (!drag) return;
    drag = false;
    const rect = ball.getBoundingClientRect();
    localStorage.setItem('ballPos', JSON.stringify({ x: rect.left, y: rect.top }));
  });
}

async function loadCardList(panel) {
  const cards = await idbGetAll('cards');
  const list = panel.querySelector('#card-list');
  const countText = panel.querySelector('#card-count-text');
  countText.textContent = `总数量：${cards.length} 张`;
  list.innerHTML = '';
  if (!cards.length) {
    list.innerHTML = '<div class="placeholder-tip">还没有字卡，快点添加吧</div>';
    return;
  }
  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.dataset.id = card.id;
    div.innerHTML = `
      <input type="checkbox" class="card-checkbox" style="display:none;">
      <div class="card-text">${escapeHtml(card.content)}</div>
      <div class="card-ops">
        <button class="card-edit" title="编辑">✎</button>
        <button class="card-delete" title="删除">✕</button>
      </div>`;
    list.appendChild(div);
  });

function bindCardEvents(panel) {
  const list = panel.querySelector('#card-list');
  const addInput = panel.querySelector('#card-add-input');
  const batchDelBtn = panel.querySelector('#card-batch-del');
  const batchConfirm = panel.querySelector('#card-batch-confirm');
  const recycleBtn = panel.querySelector('#card-recycle');
  const importBtn = panel.querySelector('#card-file-import');
  const exportBtn = panel.querySelector('#card-file-export');
  const searchBtn = panel.querySelector('#card-search-btn');

  addInput.addEventListener('click', () => openAddCardDialog(panel));

  batchDelBtn.addEventListener('click', () => {
    cardPageMode = !cardPageMode;
    const boxes = panel.querySelectorAll('.card-checkbox');
    boxes.forEach(b => b.style.display = cardPageMode ? 'inline-block' : 'none');
    batchConfirm.style.display = cardPageMode ? 'inline-block' : 'none';
    if (!cardPageMode) boxes.forEach(b => b.checked = false);
  });

  batchConfirm.addEventListener('click', async () => {
    const checked = panel.querySelectorAll('.card-checkbox:checked');
    for (const box of checked) {
      const id = Number(box.closest('.card-item').dataset.id);
      const card = (await idbGetAll('cards')).find(c => c.id === id);
      if (card) {
        const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
        recycled.push(card);
        localStorage.setItem('recycledCards', JSON.stringify(recycled));
        await idbDelete('cards', id);
      }
    }
    cardPageMode = false;
    loadCardList(panel);
  });

  recycleBtn.addEventListener('click', () => openRecyclePanel(panel));

  importBtn.addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.txt,.json';
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      if (file.name.endsWith('.json')) {
        const data = JSON.parse(text);
        const cards = data.cards || data;
        for (const c of cards) {
          const content = typeof c === 'string' ? c : c.content;
          if (content) await idbPut('cards', { content });
        }
      } else {
        const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
        for (const line of lines) await idbPut('cards', { content: line });
      }
      loadCardList(panel);
    };
    inp.click();
  });

  exportBtn.addEventListener('click', () => {
    const fmtOverlay = createModal(`
      <div class="big-input-title">导出格式</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;">
        <button class="mini-btn" id="export-txt">TXT</button>
        <button class="mini-btn" id="export-json">JSON</button>
      </div>`);
    fmtOverlay.querySelector('#export-txt').addEventListener('click', async () => {
      const cards = await idbGetAll('cards');
      downloadFile(cards.map(c => c.content).join('\n'), '字卡导出.txt', 'text/plain');
      fmtOverlay.remove();
    });
    fmtOverlay.querySelector('#export-json').addEventListener('click', async () => {
      const cards = await idbGetAll('cards');
      downloadFile(JSON.stringify({ cards }, null, 2), '字卡导出.json', 'application/json');
      fmtOverlay.remove();
    });
  });

  searchBtn.addEventListener('click', () => openCardSearchPanel());

  list.addEventListener('click', async (e) => {
    const item = e.target.closest('.card-item');
    if (!item) return;
    const id = Number(item.dataset.id);
    const cards = await idbGetAll('cards');
    const card = cards.find(c => c.id === id);
    if (!card) return;
    if (e.target.closest('.card-delete')) {
      const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      recycled.push(card);
      localStorage.setItem('recycledCards', JSON.stringify(recycled));
      await idbDelete('cards', id);
      loadCardList(panel);
    } else if (e.target.closest('.card-edit')) {
      showEditCardDialog(id, card.content, panel);
    }
  });
}

function loadRecycleList(overlay, panel) {
  const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
  overlay.querySelector('#recycle-count').textContent = `共 ${recycled.length} 张`;
  const list = overlay.querySelector('#recycle-list');
  list.innerHTML = '';
  if (!recycled.length) {
    list.innerHTML = '<div class="placeholder-tip">回收站是空的</div>';
    return;
  }
  recycled.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${escapeHtml(c.content)}</div>
      <div class="card-ops"><button class="recycle-restore">恢复</button><button class="recycle-forever">彻删</button></div>`;
    div.querySelector('.recycle-restore').addEventListener('click', async () => {
      const all = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      await idbPut('cards', { content: all[i].content });
      all.splice(i, 1);
      localStorage.setItem('recycledCards', JSON.stringify(all));
      loadRecycleList(overlay, panel);
    });
    div.querySelector('.recycle-forever').addEventListener('click', () => {
      const all = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      all.splice(i, 1);
      localStorage.setItem('recycledCards', JSON.stringify(all));
      loadRecycleList(overlay, panel);
    });
    list.appendChild(div);
  });
}

          lib.push(reader.result);

        };
        reader.readAsDataURL(file);
      });
    };
    inp.click();
  });
}

function applyBG() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (settings.bgCurrent) {
    const img = new Image();
    img.onload = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 0.85;
      ctx.filter = 'none';
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      ctx.filter = 'none';
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    };
    img.src = settings.bgCurrent;
  } else {
    drawDefaultBG(ctx, canvas.width, canvas.height);
  }
}

function drawDefaultBG(ctx, w, h) {
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#fdd9c8');
  grad.addColorStop(0.4, '#f7d4e3');
  grad.addColorStop(0.7, '#dcd3f5');
  grad.addColorStop(1, '#c8ddf5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function createMessageEl(msg) {
  const row = document.createElement('div');
  row.className = 'message-row ' + msg.sender;
  row.dataset.id = msg.id;
  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = msg.sender === 'me'
    ? (settings.meAvatar || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.5)"/><text x="16" y="21" text-anchor="middle" font-size="12" fill="rgba(90,70,60,0.6)">我</text></svg>'))
    : (settings.taAvatar || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.5)"/><text x="16" y="21" text-anchor="middle" font-size="12" fill="rgba(90,70,60,0.6)">TA</text></svg>'));
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-content-wrapper';
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (msg.imageData) {
    bubble.style.padding = '4px';
    bubble.style.background = 'transparent';
    bubble.style.border = 'none';
    bubble.innerHTML = `<img src="${msg.imageData}" style="max-width:200px;border-radius:12px;display:block;">`;
  } else {
    bubble.textContent = msg.content;
  }
  wrapper.appendChild(bubble);
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  if (msg.sender === 'me' && msg.readTime) {
    const read = document.createElement('span');
    read.className = 'msg-read';
    read.textContent = '已读 ' + msg.readTime;
    meta.appendChild(read);
  }
  if (msg.pinned) {
    const pin = document.createElement('span');
    pin.className = 'msg-pin-mark';
    pin.textContent = '📌';
    meta.appendChild(pin);
  }
  if (msg.heartMark) {
    const heart = document.createElement('span');
    heart.className = 'msg-heart-mark';
    heart.textContent = '💗' + msg.heartMark;
    meta.appendChild(heart);
  }
  wrapper.appendChild(meta);
  row.appendChild(avatar);
  row.appendChild(wrapper);
  return row;
}

async function renderPinnedArea(msgs) {
  const area = document.getElementById('pinned-area');

}

// ========== 已读回执 ==========
function scheduleReadReceipt(msg) {
  const delayMs = Math.random() * (settings.readMax - settings.readMin) + settings.readMin;
  setTimeout(async () => {
    const msgs = await idbGetAll('messages');
    const target = msgs.find(m => m.id === msg.id);
    if (target && target.sender === 'me' && !target.readTime) {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      target.readTime = hh + ':' + mm;
      await idbPut('messages', target);
      const row = document.querySelector(`.message-row[data-id="${msg.id}"] .msg-meta`);
      if (row) {
        const read = document.createElement('span');
        read.className = 'msg-read';
        read.textContent = '已读 ' + target.readTime;
        row.appendChild(read);
      }
    }
  }, delayMs);
}

function resetStopTimer() {
  clearTimeout(stopTimer);
  const delayMs = Math.random() * (settings.replyMax * 1000 - settings.replyMin * 1000) + settings.replyMin * 1000;
  stopTimer = setTimeout(() => triggerTAReply(), delayMs);
}

async function triggerTAReply() {
  if (isReplying) return;
  const cards = await idbGetAll('cards');
  if (!cards.length) {
    showTyping(false);
    return;
  }
  isReplying = true;
  const recentMe = await getRecentMeCount();
  let replyCount = 1;
  if (recentMe >= 3) replyCount = 1 + Math.floor(Math.random() * 3);
  else if (recentMe === 2) replyCount = 1 + Math.floor(Math.random() * 2);
  else replyCount = 1;
  if (Math.random() < 0.15) replyCount = 2;
  replyQueue = [];
  for (let i = 0; i < replyCount; i++) {
    const card = cards[Math.floor(Math.random() * cards.length)];
    replyQueue.push(card.content);
  }
  showTyping(true);
  let waitTime = Math.random() * (settings.replyMax * 1000 - settings.replyMin * 1000) * 0.6 + settings.replyMin * 1000 * 0.4;
  await delay(waitTime);
  showTyping(false);
  for (let i = 0; i < replyQueue.length; i++) {
    const msg = {
      sender: 'ta',
      content: replyQueue[i],
      timestamp: Date.now(),
      pinned: false,
      heartMark: null
    };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    appendMessage(msg);
    settings.heartValue += 1;
    await saveSettings();
    updateHeartValue();
    if (i < replyQueue.length - 1) await delay(600 + Math.random() * 1200);
  }
  replyQueue = [];
  isReplying = false;
}

async function getRecentMeCount() {
  const msgs = await idbGetAll('messages');
  let count = 0;
  for (let i = msgs.length - 1; i >= 0; i--) {
    if (msgs[i].sender === 'me') count++;
    else break;
  }
  return count;
}

    if (cards.length && !isReplying) {
      const card = cards[Math.floor(Math.random() * cards.length)];

      const id = await idbPutReturnId('messages', msg);

  }, next);
}

function openCamera() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => await sendImageMessage(reader.result);
    reader.readAsDataURL(file);
  };
  inp.click();
}

function openAlbum() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const reader = new FileReader();
      reader.onload = async () => await sendImageMessage(reader.result);
      reader.readAsDataURL(file);
    }
  };
  inp.click();
}

    timestamp: Date.now(),
    pinned: false,

    isSystem: true
  };

async function checkTelepathy(myAnswer) {

    telepathyActive = false;
    return;
  }
  const taCard = cards[Math.floor(Math.random() * cards.length)];
  const taMsg = {
    sender: 'ta',
    content: taCard.content,
    timestamp: Date.now(),
    pinned: false,
    heartMark: null
  };
  const id = await idbPutReturnId('messages', taMsg);
  taMsg.id = id;
  appendMessage(taMsg);
  
  const matched = taCard.content.includes(myAnswer) || myAnswer.includes(taCard.content);
  let resultContent = '';
  if (matched) {
    resultContent = '💗 默契达成！心意值+10';
    settings.heartValue += 10;
  } else {
    resultContent = '🤍 没达成默契，但TA在听。心意值+2';
    settings.heartValue += 2;

  await saveSettings();
  updateHeartValue();
  const resultMsg = {

    content: resultContent,
    timestamp: Date.now(),
    pinned: false,
    heartMark: null,
    isSystem: true
  };
  const rid = await idbPutReturnId('messages', resultMsg);
  resultMsg.id = rid;
  appendMessage(resultMsg);
  telepathyActive = false;
}

  overlay.querySelector('#heart-view-timeline').addEventListener('click', () => switchHeartView('timeline', overlay));

  overlay.querySelector('#heart-view-play').addEventListener('click', () => switchHeartView('play', overlay));
  renderHeartContent(overlay);
}

function switchHeartTab(tab, overlay) {
  heartCurrentTab = tab;
  overlay.querySelector('#heart-tab-ta').classList.toggle('active', tab === 'ta');
  overlay.querySelector('#heart-tab-me').classList.toggle('active', tab === 'me');
  renderHeartContent(overlay);
}

function switchHeartView(view, overlay) {
  heartCurrentView = view;
  clearInterval(heartPlaybackTimer);
  renderHeartContent(overlay);
}

async function getHeartMessages() {
  const msgs = await idbGetAll('messages');
  if (heartCurrentTab === 'ta') return msgs.filter(m => m.heartMark && m.heartMark.includes('TA'));
  return msgs.filter(m => m.heartMark && m.heartMark.includes('我'));
}

async function renderHeartContent(overlay) {
  const container = overlay.querySelector('#heart-content');
  const items = await getHeartMessages();
  container.innerHTML = '';
  if (!items.length) {
    container.innerHTML = '<div class="placeholder-tip">还没有心动瞬间</div>';
    return;
  }
  if (heartCurrentView === 'timeline') {
    const list = document.createElement('div');
    list.className = 'heart-list';
    items.forEach(m => {
      const div = document.createElement('div');
      div.className = 'heart-item';
      div.innerHTML = `<span class="heart-mark">💗</span><span>${escapeHtml(m.content)}</span>`;
      list.appendChild(div);
    });
    container.appendChild(list);
  } else if (heartCurrentView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    items.forEach(m => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      card.textContent = m.content;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  } else if (heartCurrentView === 'play') {
    const screen = document.createElement('div');
    screen.className = 'playback-screen';
    container.appendChild(screen);
    let idx = 0;
    heartPlaybackTimer = setInterval(() => {
      if (idx >= items.length) {
        clearInterval(heartPlaybackTimer);
        return;
      }
      const m = items[idx];
      const pm = document.createElement('div');
      pm.className = 'playback-msg ' + m.sender;
      pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${escapeHtml(m.content)}</div>`;
      screen.appendChild(pm);
      screen.scrollTop = screen.scrollHeight;
      idx++;
    }, 1000);
  }
}
  // ========== 回忆放映室 ==========
let playbackTimer = null;
let playbackSpeed = 1000;
let playbackView = 'play';
let currentPlayDate = '';

function openPlaybackPanel() {
  const overlay = createModal(`
    <div class="playback-dates" id="playback-dates"></div>
    <div class="heart-view-tabs" style="margin-bottom:12px;">
      <button class="mini-btn" id="playback-view-timeline">时间线</button>
      <button class="mini-btn" id="playback-view-cards">卡片</button>
      <button class="mini-btn" id="playback-view-play">播放</button>
    </div>
    <div id="playback-screen" class="playback-screen"></div>
    <div class="playback-controls">
      <button class="mini-btn" id="playback-pause" style="display:none;">暂停</button>
      <button class="mini-btn" id="playback-speed" style="display:none;">速度 1x</button>
      <button class="mini-btn" id="playback-exit">退出</button>
    </div>`);
  overlay.querySelector('#playback-view-timeline').addEventListener('click', () => switchPlaybackView('timeline', overlay));
  overlay.querySelector('#playback-view-cards').addEventListener('click', () => switchPlaybackView('cards', overlay));
  overlay.querySelector('#playback-view-play').addEventListener('click', () => switchPlaybackView('play', overlay));
  overlay.querySelector('#playback-pause').addEventListener('click', () => {
    if (playbackTimer) {
      clearInterval(playbackTimer);
      playbackTimer = null;
      overlay.querySelector('#playback-pause').textContent = '继续';
    } else {
      startPlayback(overlay);
      overlay.querySelector('#playback-pause').textContent = '暂停';
    }
  });
  overlay.querySelector('#playback-speed').addEventListener('click', (e) => {
    if (playbackSpeed === 1000) playbackSpeed = 500;
    else if (playbackSpeed === 500) playbackSpeed = 2000;
    else playbackSpeed = 1000;
    e.target.textContent = '速度 ' + (playbackSpeed === 1000 ? '1x' : playbackSpeed === 500 ? '2x' : '0.5x');
    if (playbackTimer) {
      clearInterval(playbackTimer);
      startPlayback(overlay);
    }
  });
  overlay.querySelector('#playback-exit').addEventListener('click', () => {
    clearInterval(playbackTimer);
    overlay.remove();
  });
  loadPlaybackDates(overlay);
}

function switchPlaybackView(view, overlay) {
  playbackView = view;
  clearInterval(playbackTimer);
  overlay.querySelector('#playback-pause').style.display = view === 'play' ? 'inline-block' : 'none';
  overlay.querySelector('#playback-speed').style.display = view === 'play' ? 'inline-block' : 'none';
  if (currentPlayDate) renderPlaybackContent(currentPlayDate, overlay);
}

async function loadPlaybackDates(overlay) {
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const dates = Object.keys(archives).sort().reverse();
  const container = overlay.querySelector('#playback-dates');
  container.innerHTML = '';
  if (!dates.length) {
    container.innerHTML = '<div class="placeholder-tip">还没有归档记录</div>';
    return;
  }
  dates.forEach(date => {
    const div = document.createElement('div');
    div.className = 'playback-date';
    div.textContent = date;
    div.addEventListener('click', () => {
      container.querySelectorAll('.playback-date').forEach(d => d.classList.remove('active'));
      div.classList.add('active');
      currentPlayDate = date;
      renderPlaybackContent(date, overlay);
    });
    container.appendChild(div);
  });
  container.querySelector('.playback-date').classList.add('active');
  currentPlayDate = dates[0];
  renderPlaybackContent(dates[0], overlay);
}

function renderPlaybackContent(dateStr, overlay) {
  clearInterval(playbackTimer);
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const msgs = archives[dateStr] || [];
  const screen = overlay.querySelector('#playback-screen');
  screen.innerHTML = '';
  if (!msgs.length) {
    screen.innerHTML = '<div class="placeholder-tip">这一天没有消息</div>';
    return;
  }
  if (playbackView === 'timeline') {
    msgs.forEach(m => {
      const pm = document.createElement('div');
      pm.className = 'playback-msg ' + m.sender;
      let bubble = m.content;
      if (m.pinned) bubble = '📌 ' + bubble;
      if (m.heartMark) bubble = '💗 ' + bubble;
      pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${escapeHtml(bubble)}</div>`;
      screen.appendChild(pm);
    });
  } else if (playbackView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    msgs.forEach(m => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      card.textContent = m.content;
      grid.appendChild(card);
    });
    screen.appendChild(grid);
  } else if (playbackView === 'play') {
    startPlayback(overlay);
  }
}

function startPlayback(overlay) {
  clearInterval(playbackTimer);
  const screen = overlay.querySelector('#playback-screen');
  screen.innerHTML = '';
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const msgs = archives[currentPlayDate] || [];
  if (!msgs.length) {
    screen.innerHTML = '<div class="placeholder-tip">这一天没有消息</div>';
    return;
  }
  let idx = 0;
  playbackTimer = setInterval(() => {
    if (idx >= msgs.length) {
      clearInterval(playbackTimer);
      overlay.querySelector('#playback-pause').textContent = '暂停';
      return;
    }
    const m = msgs[idx];
    const pm = document.createElement('div');
    pm.className = 'playback-msg ' + m.sender;
    let bubble = m.content;
    if (m.pinned) bubble = '📌 ' + bubble;
    if (m.heartMark) bubble = '💗 ' + bubble;
    pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${escapeHtml(bubble)}</div>`;
    screen.appendChild(pm);
    screen.scrollTop = screen.scrollHeight;
    idx++;
  }, playbackSpeed);
}
  // ========== 归档 ==========
function checkArchive() {
  const now = new Date();
  const today = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
  if (settings.lastArchiveDate && settings.lastArchiveDate !== today) {
    const prevDate = settings.lastArchiveDate;
    archiveDay(prevDate);
  }
  settings.lastArchiveDate = today;
  saveSettings();
}

async function archiveDay(dateStr) {
  const all = await idbGetAll('messages');
  const dayMsgs = all.filter(m => {
    const d = new Date(m.timestamp);
    const ds = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    return ds === dateStr;
  });
  if (dayMsgs.length) {
    const archives = JSON.parse(localStorage.getItem('archives') || '{}');
    archives[dateStr] = dayMsgs;
    localStorage.setItem('archives', JSON.stringify(archives));
    for (const m of dayMsgs) {
      await idbDelete('messages', m.id);
    }
    renderMessages();
  }
}

setInterval(checkArchive, 60000);

// ========== 数据备份 ==========
async function backupNow() {
  const cards = await idbGetAll('cards');
  const messages = await idbGetAll('messages');
  const data = {
    version: '1.0.0',
    exportedAt: new Date().toISOString(),
    settings,
    cards,
    messages,
    archives: JSON.parse(localStorage.getItem('archives') || '{}'),
    avatarLibrary: JSON.parse(localStorage.getItem('avatarLibrary') || '[]'),
    bgLibrary: JSON.parse(localStorage.getItem('bgLibrary') || '[]'),
    recycledCards: JSON.parse(localStorage.getItem('recycledCards') || '[]'),
    telepathyQuestions: JSON.parse(localStorage.getItem('telepathyQuestions') || '[]')
  };
  const json = JSON.stringify(data);
  downloadFile(json, '易遇♡夏雾凉-备份-' + new Date().toISOString().slice(0, 10) + '.json', 'application/json');
  localStorage.setItem('autoBackup', json);
  showToast('备份完成');
}

function scheduleDailyBackup() {
  setInterval(() => {
    const last = localStorage.getItem('lastBackupDate');
    const today = new Date().toDateString();
    if (last !== today) {
      backupNow();
      localStorage.setItem('lastBackupDate', today);
    }
  }, 3600000);
}

// ========== 动态背景 ==========
let bgHue = 0;
function animateBG() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (settings.bgCurrent) {
    applyBG();
    return;
  }
  bgHue = (bgHue + 0.15) % 360;
  const h1 = (bgHue + 15) % 360;
  const h2 = (bgHue + 45) % 360;
  const h3 = (bgHue + 75) % 360;
  const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  grad.addColorStop(0, `hsl(${h1}, 70%, 88%)`);
  grad.addColorStop(0.45, `hsl(${h2}, 65%, 86%)`);
  grad.addColorStop(1, `hsl(${h3}, 60%, 84%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  requestAnimationFrame(animateBG);
}

// ========== 初始化 ==========
async function init() {
  await openDB();
  await loadSettings();
  renderHeartLine();
  initBallPosition();
  renderMessages();
  scheduleTAActive();
  scheduleTAAutonomy();
  scheduleTAAvatarChange();
  scheduleTABGChange();
  scheduleDailyBackup();
  checkArchive();
  animateBG();
  updateSendBtn();
  const input = document.getElementById('chat-input');
  input.addEventListener('focus', () => {
    setTimeout(() => {
      input.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }, 300);
  });
  window.addEventListener('resize', () => {
    const canvas = document.getElementById('bg-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (!settings.bgCurrent) {
      const ctx = canvas.getContext('2d');
      drawDefaultBG(ctx, canvas.width, canvas.height);
    }
  });
  setInterval(() => {
    const now = new Date();
    const today = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
    if (settings.lastArchiveDate !== today) {
      checkArchive();
      renderMessages();
    }
  }, 30000);
}

init();
