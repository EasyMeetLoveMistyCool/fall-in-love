<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>易遇♡雾凉</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: #f5e8e0;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --theme-bubble-me: rgba(255, 150, 90, 0.55);
  --theme-bubble-ta: rgba(255, 255, 255, 0.5);
  --theme-accent: #ff7b5c;
  --theme-accent-soft: rgba(255, 150, 100, 0.6);
  --theme-text: #4a3f3a;
  --theme-text-soft: #8b6f60;
  --theme-panel: rgba(255, 255, 255, 0.65);
  --theme-btn: rgba(255, 255, 255, 0.5);
  --theme-border: rgba(255, 255, 255, 0.6);
  --theme-heart: #ff3b5c;
  --theme-title: #4a3528;
}

:root.dark-mode {
  --theme-bubble-me: rgba(140, 110, 200, 0.55);
  --theme-bubble-ta: rgba(255, 255, 255, 0.12);
  --theme-accent: #9a7bd0;
  --theme-accent-soft: rgba(150, 120, 200, 0.6);
  --theme-text: #e8e3f0;
  --theme-text-soft: #a89fc0;
  --theme-panel: rgba(40, 32, 55, 0.85);
  --theme-btn: rgba(255, 255, 255, 0.1);
  --theme-border: rgba(255, 255, 255, 0.15);
  --theme-heart: #c09bff;
  --theme-title: #f0ebf8;
}

:root.dark-mode html,
:root.dark-mode body {
  background: #1a1425;
}

#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

#particle-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

#app {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.05);
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 20px 8px 20px;
  min-height: 56px;
  z-index: 3;
}

.top-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.3);
  border: 1.5px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}

#heart-line {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

#heart-line svg {
  display: block;
}

.heart-fill {
  animation: heartbeat 2.4s ease-in-out infinite;
  transform-origin: center;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  10% { transform: scale(1.12); }
  20% { transform: scale(0.98); }
  30% { transform: scale(1.08); }
  45% { transform: scale(1); }
}

.heartbeat-path {
  stroke-dasharray: 6, 3;
  animation: dashmove 3s linear infinite;
}

@keyframes dashmove {
  to { stroke-dashoffset: -18; }
}

#status-bar {
  display: none;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-size: 13px;
  color: var(--theme-text);
  margin-top: 4px;
  z-index: 3;
  gap: 3px;
  text-align: center;
  cursor: pointer;
}

#status-bar.show {
  display: flex;
}

#status-bar .sb-nick-line {
  font-size: 13px;
  color: var(--theme-text);
  text-align: center;
  font-weight: 600;
  padding: 2px 0;
}

#status-bar .sb-world-line {
  display: flex;
  align-items: center;
  gap: 4px;
  justify-content: center;
  font-size: 12px;
  color: var(--theme-text);
}

#status-bar .sb-simple-line {
  display: flex;
  align-items: center;
  gap: 4px;
  justify-content: center;
  font-size: 13px;
  color: var(--theme-text);
}

#status-bar svg {
  width: 16px;
  height: 16px;
  vertical-align: middle;
}

#status-bar .sb-world-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #4caf50;
  flex-shrink: 0;
}

#heart-value-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 4px;
  font-size: 13px;
  color: var(--theme-heart);
  font-weight: 600;
  text-shadow: 0 0 8px rgba(255, 59, 92, 0.35);
  z-index: 3;
}

#heart-value-box .empty-heart {
  font-size: 16px;
  color: var(--theme-heart);
}

#messages-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 12px 8px 12px;
  -webkit-overflow-scrolling: touch;
}

/* ← 改：删掉置顶区 #pinned-area */

/* ===== 长按菜单 ===== */
.msg-context-menu {
  position: fixed;
  z-index: 80;
  background: rgba(255, 255, 255, 0.95);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 14px;
  padding: 6px;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
  min-width: 120px;
  animation: fadeIn 0.15s ease-out;
}

.msg-context-menu button {
  display: block;
  width: 100%;
  border: none;
  background: transparent;
  text-align: left;
  padding: 8px 14px;
  font-size: 14px;
  color: #4a3528;
  cursor: pointer;
  border-radius: 8px;
}

.msg-context-menu button:active {
  background: rgba(255, 143, 176, 0.2);
}

/* ← 改：问卷卡片样式 */
.quiz-card {
  display: inline-flex;
  flex-direction: column;
  padding: 14px 16px;
  border-radius: 18px;
  background: var(--theme-panel);
  border: 2px solid var(--theme-accent-soft);
  box-shadow: 0 6px 20px rgba(255,143,176,0.25);
  min-width: 240px;
  max-width: 300px;
  position: relative;
  animation: giftIn 0.4s ease-out;
}

.quiz-card .quiz-head {
  display: flex;
  align-items: center;
  gap: 6px;
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px dashed rgba(90,70,60,0.2);
}

.quiz-card .quiz-head svg {
  width: 20px;
  height: 20px;
}

.quiz-card .quiz-head-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--theme-title);
}

.quiz-card .quiz-body {
  max-height: 260px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding-right: 4px;
}

.quiz-card .quiz-q {
  margin-bottom: 10px;
}

.quiz-card .quiz-q-title {
  font-size: 13px;
  color: var(--theme-text);
  margin-bottom: 5px;
  font-weight: 500;
}

.quiz-card .quiz-opt {
  font-size: 12px;
  color: var(--theme-text-soft);
  padding: 3px 6px;
  border-radius: 8px;
  margin-bottom: 2px;
  display: flex;
  align-items: center;
  gap: 5px;
}

.quiz-card .quiz-opt .opt-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  border: 1.5px solid var(--theme-text-soft);
  flex-shrink: 0;
}

.quiz-card .quiz-opt.selected {
  background: var(--theme-accent-soft);
  color: var(--theme-title);
  font-weight: 600;
}

.quiz-card .quiz-opt.selected .opt-dot {
  border-color: var(--theme-accent);
  background: var(--theme-accent);
  box-shadow: inset 0 0 0 2px #fff;
}

.quiz-card .quiz-foot {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed rgba(90,70,60,0.2);
  font-size: 11px;
  color: var(--theme-text-soft);
}

.quiz-card .quiz-foot svg {
  width: 14px;
  height: 14px;
}

.quiz-card.unanswered {
  cursor: pointer;
  border-color: var(--theme-accent);
  box-shadow: 0 0 0 3px rgba(255,150,100,0.2), 0 6px 20px rgba(255,143,176,0.35);
}

.quiz-card.unanswered .quiz-foot {
  color: var(--theme-accent);
  font-weight: 600;
}
  .message-row {
  display: flex;
  margin-bottom: 14px;
  animation: msgIn 0.25s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-row.me {
  justify-content: flex-end;
}

.message-row.ta {
  justify-content: flex-start;
}

.message-row.system {
  justify-content: center;
}

.msg-system-bubble {
  font-size: 11px;
  color: rgba(90, 70, 60, 0.6);
  background: rgba(255, 255, 255, 0.35);
  border-radius: 10px;
  padding: 4px 12px;
  text-align: center;
}

.msg-world-label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: rgba(120, 100, 90, 0.7);
  margin-bottom: 3px;
  padding: 0 4px;
  letter-spacing: 0.3px;
}

.msg-world-icon {
  width: 12px;
  height: 12px;
  display: inline-block;
  vertical-align: middle;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
}

.message-row.me .msg-avatar {
  margin-left: 8px;
}

.message-row.ta .msg-avatar {
  margin-right: 8px;
}

.msg-content-wrapper {
  max-width: 68%;
  display: flex;
  flex-direction: column;
}

.message-row.me .msg-content-wrapper {
  align-items: flex-end;
}

.message-row.ta .msg-content-wrapper {
  align-items: flex-start;
}

.msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
  position: relative;
}

.message-row.me .msg-bubble {
  background: var(--theme-bubble-me);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
  border-bottom-right-radius: 6px;
}

  background: var(--theme-bubble-ta);

  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: var(--theme-text);

}

/* ===== 情侣互动 ===== */
.message-row.me .msg-bubble.msg-interact-couple,
.message-row.ta .msg-bubble.msg-interact-couple {
  background: linear-gradient(135deg, rgba(255,224,235,0.95), rgba(255,200,220,0.95)) padding-box,
              linear-gradient(135deg, #ff8fb0, #ffc4d6, #dcd3f5) border-box;
  border: 2px solid transparent;
  border-radius: 20px;
  border-bottom-right-radius: 20px;
  border-bottom-left-radius: 20px;
  color: #a04a6a;
  padding: 12px 18px;
  text-align: center;
  font-size: 14px;
  box-shadow: 0 4px 18px rgba(255,143,176,0.35);
  animation: coupleIn 0.5s ease-out;
}

@keyframes coupleIn {
  0% { transform: scale(0.75); opacity: 0; }
  60% { transform: scale(1.06); opacity: 1; }
  100% { transform: scale(1); }
}

.msg-interact-couple .couple-avatars {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 6px;
  margin-bottom: 6px;
}

.msg-interact-couple .couple-avatars img {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid #fff;
}

.msg-interact-couple .couple-heart {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.msg-interact-couple .couple-heart svg {
  width: 16px;
  height: 16px;
}

.msg-interact-couple .couple-text {
  font-weight: 600;
}

.msg-interact-couple .couple-spark {
  position: absolute;
  font-size: 11px;
  animation: sparkleFloat 2.5s ease-in-out infinite;
}

@keyframes sparkleFloat {
  0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
  50% { transform: translateY(-6px) scale(1.2); opacity: 1; }
}

.msg-interact-text {
  text-align: center;
  padding: 8px;
  font-size: 14px;
  color: var(--theme-text);
}

/* ===== 亲密互动（悄悄话）===== */
.message-row.me .msg-bubble.intimate,
.message-row.ta .msg-bubble.intimate {
  border-radius: 24px;
  background: radial-gradient(circle at 30% 30%, rgba(255, 210, 225, 0.95), rgba(255, 190, 215, 0.85) 60%, rgba(255, 175, 205, 0.75));
  border: 2px solid transparent;
  background-clip: padding-box;
  position: relative;
  animation: intimateBreath 2.5s ease-in-out infinite;
  color: #a04a6a;
  line-height: 1.6;
  letter-spacing: 0.5px;
  box-shadow: 0 0 0 2px rgba(255, 143, 176, 0.4), 0 0 16px rgba(255, 143, 176, 0.35);
  padding: 10px 14px;
}

.msg-bubble.intimate::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 26px;
  background: linear-gradient(135deg, rgba(255, 143, 176, 0.6), rgba(255, 196, 214, 0.4), rgba(255, 143, 176, 0.6));
  z-index: -1;
  animation: intimateGlow 2.5s ease-in-out infinite;
}

@keyframes intimateBreath {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.02); }
}

@keyframes intimateGlow {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.intimate-mark {
  position: absolute;
  bottom: -6px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  animation: intimateFloat 3s ease-in-out infinite;
  pointer-events: none;
}

@keyframes intimateFloat {
  0%, 100% { transform: translateX(-50%) translateY(0); opacity: 0.5; }
  50% { transform: translateX(-50%) translateY(-8px); opacity: 1; }
}

.intimate-time {
  font-size: 10px;
  color: #c08aa0;
  margin-top: 2px;
}

/* ===== 凑近气泡 ===== */
.message-row.me .msg-bubble.intimate-approach,
.message-row.ta .msg-bubble.intimate-approach {
  border-radius: 22px;
  background: radial-gradient(circle at 50% 40%, rgba(255, 224, 208, 0.95), rgba(255, 208, 224, 0.85) 60%, rgba(255, 190, 210, 0.75));
  border: 2px solid transparent;
  background-clip: padding-box;
  position: relative;
  animation: approachBreath 2.8s ease-in-out infinite;
  color: #a05a4a;
  line-height: 1.6;
  box-shadow: 0 0 0 2px rgba(255, 180, 160, 0.4), 0 0 14px rgba(255, 180, 160, 0.3);
  padding: 10px 14px;
}

.message-row.me .msg-bubble.intimate-approach::before,
.message-row.ta .msg-bubble.intimate-approach::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(255, 180, 160, 0.5), rgba(255, 208, 224, 0.4), rgba(255, 180, 160, 0.5));
  z-index: -1;
  animation: approachGlow 2.8s ease-in-out infinite;
}

@keyframes approachBreath {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(0.985) translateY(1px); }
}

@keyframes approachGlow {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.message-row.ta .msg-bubble.intimate-approach {
  background: radial-gradient(circle at 50% 40%, rgba(255, 232, 208, 0.95), rgba(255, 210, 220, 0.9) 60%, rgba(255, 195, 210, 0.8));
  box-shadow: 0 0 0 2px rgba(255, 200, 150, 0.5), 0 0 18px rgba(255, 200, 150, 0.35);
}

.intimate-approach-mark {
  position: absolute;
  bottom: -6px;
  right: 10px;
  font-size: 10px;
  color: #e08860;
  background: rgba(255, 255, 255, 0.7);
  padding: 1px 6px;
  border-radius: 8px;
  animation: approachFloat 3s ease-in-out infinite;
}

@keyframes approachFloat {
  0%, 100% { transform: translateY(0); opacity: 0.7; }
  50% { transform: translateY(-4px); opacity: 1; }
}

/* ===== 争宠气泡 ===== */
.message-row.me .msg-bubble.intimate-compete,
.message-row.ta .msg-bubble.intimate-compete {
  border-radius: 22px;
  background: radial-gradient(circle at 50% 40%, rgba(255, 208, 224, 0.95), rgba(240, 200, 240, 0.85) 60%, rgba(224, 192, 240, 0.75));
  border: 2px solid transparent;
  background-clip: padding-box;
  position: relative;
  animation: competeShake 1.6s ease-in-out infinite;
  color: #8a4a7a;
  line-height: 1.6;
  box-shadow: 0 0 0 2px rgba(224, 160, 208, 0.4), 0 0 14px rgba(224, 160, 208, 0.3);
  padding: 10px 14px;
}

.message-row.me .msg-bubble.intimate-compete::before,
.message-row.ta .msg-bubble.intimate-compete::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 24px;
  background: linear-gradient(135deg, rgba(224, 160, 208, 0.5), rgba(200, 160, 240, 0.4), rgba(224, 160, 208, 0.5));
  z-index: -1;
  animation: competeGlow 1.6s ease-in-out infinite;
}

@keyframes competeShake {
  0%, 100% { transform: rotate(0deg); }
  25% { transform: rotate(-0.6deg); }
  75% { transform: rotate(0.6deg); }
}

@keyframes competeGlow {
  0%, 100% { opacity: 0.6; }
  50% { opacity: 1; }
}

.message-row.ta .msg-bubble.intimate-compete {
  background: radial-gradient(circle at 50% 40%, rgba(255, 216, 232, 0.95), rgba(248, 210, 248, 0.9) 60%, rgba(232, 200, 248, 0.8));
  box-shadow: 0 0 0 2px rgba(255, 160, 210, 0.5), 0 0 18px rgba(255, 160, 210, 0.35);
}

.intimate-compete-mark {
  position: absolute;
  bottom: -6px;
  right: 10px;

  // ========== IndexedDB ==========
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('YiyuXiawuliang', 2);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('messages')) d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'key' });
      if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'key' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = (e) => reject(e);
  });
}

function idbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function idbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbClear(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function idbPutReturnId(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

// ========== 媒体 ==========
async function mediaSave(key, dataUrl) {
  await idbPut('media', { key, value: dataUrl });
  return 'media:' + key;
}

async function mediaGet(ref) {
  if (!ref || typeof ref !== 'string') return ref || '';
  if (ref.startsWith('media:')) {
    const rec = await idbGet('media', ref.slice(6));
    return rec ? rec.value : '';
  }
  return ref;
}

function mediaDel(ref) {
  if (ref && typeof ref === 'string' && ref.startsWith('media:')) {
    idbDelete('media', ref.slice(6));
  }
}

async function resolveMedia(x) {
  if (!x) return '';
  if (typeof x !== 'string') {
    if (x.data) return resolveMedia(x.data);
    if (x.ref) return resolveMedia(x.ref);
    return '';
  }
  if (x.startsWith('media:')) {
    const rec = await idbGet('media', x.slice(6));
    return rec ? rec.value : '';
  }
  return x;
}

// ========== 图片库 ==========
function libGetRefs(name) { return JSON.parse(localStorage.getItem(name) || '[]'); }

function libSetRefs(name, refs) {
  try { localStorage.setItem(name, JSON.stringify(refs)); }
  catch (e) { showToast('存储空间不足，请清理'); }
}

async function libGet(name) {
  const refs = libGetRefs(name);
  const out = [];
  for (const r of refs) {
    const data = await resolveMedia(r);
    if (data) out.push({ ref: r, data });
  }
  return out;
}

async function libPush(name, dataUrl, prefix) {
  const key = (prefix || name) + '_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
  const ref = await mediaSave(key, dataUrl);
  const refs = libGetRefs(name);
  refs.push(ref);
  libSetRefs(name, refs);
  return ref;
}

// ========== 旧数据迁移 ==========
async function migrateMediaOnce() {
  if (localStorage.getItem('mediaMigratedV650')) return;
  try {
    const av = JSON.parse(localStorage.getItem('avatarLibrary') || '[]');
    if (av.length && typeof av[0] === 'object') {
      const newRefs = [];
      for (const a of av) {
        if (a.data && typeof a.data === 'string' && a.data.startsWith('data:')) {
          const key = 'avatar_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
          await idbPut('media', { key, value: a.data });
          newRefs.push('media:' + key);
        } else if (typeof a === 'string') newRefs.push(a);
      }
      localStorage.setItem('avatarLibrary', JSON.stringify(newRefs));
    }
    const bg = JSON.parse(localStorage.getItem('bgLibrary') || '[]');
    if (bg.length && typeof bg[0] === 'string' && bg[0].startsWith('data:')) {
      const newRefs = [];
      for (const d of bg) {
        if (d.startsWith('data:')) {
          const key = 'bg_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
          await idbPut('media', { key, value: d });
          newRefs.push('media:' + key);
        } else newRefs.push(d);
      }
      localStorage.setItem('bgLibrary', JSON.stringify(newRefs));
    }
    const st = JSON.parse(localStorage.getItem('stickerLibrary') || '[]');
    if (st.length && typeof st[0] === 'string' && st[0].startsWith('data:')) {
      const newRefs = [];
      for (const d of st) {
        if (d.startsWith('data:')) {
          const key = 'sticker_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
          await idbPut('media', { key, value: d });
          newRefs.push('media:' + key);
        } else newRefs.push(d);
      }
      localStorage.setItem('stickerLibrary', JSON.stringify(newRefs));
    }
    if (settings.bgCurrent && settings.bgCurrent.startsWith('data:')) {
      const key = 'bgcur_' + Date.now();
      await idbPut('media', { key, value: settings.bgCurrent });
      settings.bgCurrent = 'media:' + key;
      await saveSettings();
    }
    const petList = JSON.parse(localStorage.getItem('petDataList') || '[]');
    if (petList.length) {
      let changed = false;
      for (const p of petList) {
        if (p.image && p.image.startsWith('data:')) {
          const key = 'pet_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
          await idbPut('media', { key, value: p.image });
          p.imageRef = 'media:' + key;
          delete p.image; changed = true;
        }
      }
      if (changed) localStorage.setItem('petDataList', JSON.stringify(petList));
    }
    const plants = JSON.parse(localStorage.getItem('plantsData') || '{"flowers":[],"trees":[]}');
    let plantChanged = false;
    for (const k of ['flowers', 'trees']) for (const p of (plants[k] || [])) if (p.image && p.image.startsWith('data:')) plantChanged = true;
    if (plantChanged) {
      for (const k of ['flowers', 'trees']) {
        for (const p of (plants[k] || [])) {
          if (p.image && p.image.startsWith('data:')) {
            const key = 'plant_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
            await idbPut('media', { key, value: p.image });
            p.imageRef = 'media:' + key;
            delete p.image;
          }
        }
      }
      localStorage.setItem('plantsData', JSON.stringify(plants));
    }
    localStorage.setItem('mediaMigratedV650', '1');
  } catch (e) { console.error('迁移出错', e); }
}

// ========== 设置 ==========
async function loadSettings() {
  const saved = await idbGet('kv', 'settings');
  if (saved && saved.value) {
    settings = { ...DEFAULT_SETTINGS, ...saved.value };
  }
  if (!settings.worlds || settings.worlds.length < DEFAULT_WORLDS.length) {
    settings.worlds = JSON.parse(JSON.stringify(DEFAULT_WORLDS));
    if (!settings.currentWorldId || !settings.worlds.find(w => w.id === settings.currentWorldId)) {
      settings.currentWorldId = 'real';
    }
    await saveSettings();
  }
  if (!settings.highDimLines) settings.highDimLines = [...DEFAULT_SETTINGS.highDimLines];
  if (!settings.flowerTypes || !settings.flowerTypes.length) settings.flowerTypes = JSON.parse(JSON.stringify(DEFAULT_FLOWER_TYPES));
  if (!settings.treeTypes || !settings.treeTypes.length) settings.treeTypes = JSON.parse(JSON.stringify(DEFAULT_TREE_TYPES));
  if (!settings.notifications) settings.notifications = [];
  if (!settings.taWishLibrary) settings.taWishLibrary = [];

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function delay(ms) {

}

  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._hideTimer);
  t._hideTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

function createModal(innerHTML, className) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-panel ${className || ''}">${innerHTML}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  return overlay;
}

function getUnreadNotifCount() {

function notifyGroupOf(icon, text) {
  const msgIcons = ['💬', '🤝', '🎁', '❓', '🔗'];
  const contentIcons = ['✉', '📝', '📷', '📮'];
  const lookIcons = ['🏷', '🖼', '🎨', '♪'];
  const remindIcons = ['⏰', '🌸', '🌙', '🎂', '✓'];
  const otherIcons = ['✨', '🌌'];
  const t = text || '';
  if (otherIcons.includes(icon)) return '其他';
  if (msgIcons.includes(icon)) return '消息';
  if (contentIcons.includes(icon)) return '内容';
  if (lookIcons.includes(icon)) return '外观';
  if (remindIcons.includes(icon)) return '提醒';
  if (t.includes('消息') || t.includes('互动') || t.includes('礼物')) return '消息';
  if (t.includes('信') || t.includes('留言') || t.includes('动态') || t.includes('小笺')) return '内容';
  if (t.includes('昵称') || t.includes('头像') || t.includes('背景') || t.includes('贴纸') || t.includes('听')) return '外观';
  if (t.includes('打卡') || t.includes('提醒') || t.includes('生理期') || t.includes('约会') || t.includes('重要') || t.includes('问卷')) return '提醒';
  return '其他';
}

function initBallPosition() {
  const ball = document.getElementById('floating-ball');
  const savedPos = JSON.parse(localStorage.getItem('ballPos') || 'null');
  if (savedPos) {
    ball.style.left = savedPos.x + 'px';
    ball.style.top = savedPos.y + 'px';
  } else {
    ball.style.right = '16px';
    ball.style.bottom = '80px';
  }
  let drag = false, moved = false, startX = 0, startY = 0, origX = 0, origY = 0;
  ball._wasDragged = () => moved;
  ball.addEventListener('pointerdown', (e) => {
    drag = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    const rect = ball.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;
    ball.style.right = 'auto';
    ball.style.bottom = 'auto';
    ball.style.left = origX + 'px';
    ball.style.top = origY + 'px';
    ball.setPointerCapture(e.pointerId);
  });
  ball.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    let nx = origX + dx;
    let ny = origY + dy;
    nx = Math.max(4, Math.min(window.innerWidth - settings.ballSize - 4, nx));
    ny = Math.max(4, Math.min(window.innerHeight - settings.ballSize - 4, ny));
    ball.style.left = nx + 'px';
    ball.style.top = ny + 'px';
  });
  ball.addEventListener('pointerup', () => {
    if (!drag) return;
    drag = false;
    const rect = ball.getBoundingClientRect();
    localStorage.setItem('ballPos', JSON.stringify({ x: rect.left, y: rect.top }));
    setTimeout(() => { moved = false; }, 50);
  });
}

function makeDraggable(el, onEnd) {
  let drag = false, startX = 0, startY = 0, origX = 0, origY = 0, moved = false;
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    drag = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    const rect = el.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.left = origX + 'px';
    el.style.top = origY + 'px';
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    const maxX = window.innerWidth - el.offsetWidth - 4;
    const maxY = window.innerHeight - el.offsetHeight - 4;
    el.style.left = Math.max(4, Math.min(maxX, origX + dx)) + 'px';
    el.style.top = Math.max(4, Math.min(maxY, origY + dy)) + 'px';
  });
  el.addEventListener('pointerup', () => {
    drag = false;
    el.classList.remove('dragging');
    if (onEnd) {
      const rect = el.getBoundingClientRect();
      onEnd({ x: rect.left, y: rect.top });
    }
    setTimeout(() => { moved = false; }, 50);
  });
  el._wasDragged = () => moved;
}

// ========== 世界时间 ==========
function getCurrentWorld() {
  return (settings.worlds || []).find(w => w.id === settings.currentWorldId) || (settings.worlds || [])[0];
}

function getWorldTime(worldId) {
  const world = worldId
    ? (settings.worlds || []).find(w => w.id === worldId)
    : getCurrentWorld();
  if (!world) return new Date();
  const offset = Number(world.offset) || 0;
  const speed = Number(world.speed) || 1;
  const base = Date.now();
  const baseZero = new Date();
  baseZero.setHours(0, 0, 0, 0);
  const elapsed = base - baseZero.getTime();
  const worldElapsed = elapsed * speed;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setTime(d.getTime() + worldElapsed + offset * 3600000);
  return d;
}

// ========== 世界状态 ==========
function getWorldStatusText(worldId) {
  const world = (settings.worlds || []).find(w => w.id === worldId);
  if (!world) return '在场';
  const wt = getWorldTime(worldId);
  const h = wt.getHours() + wt.getMinutes() / 60;
  const dayType = WORLD_SCHEDULE_TYPES[worldId] || 'work';
  const scheduleSet = WORLD_SCHEDULES_MULTI[worldId];
  const schedule = scheduleSet ? (scheduleSet[dayType] || scheduleSet.work) : [[0,24,'default','在场']];
  for (const [start, end, ic, lb] of schedule) {
    if (end > 24) {
      if (h >= start || h < (end - 24)) return lb;
    } else if (h >= start && h < end) {
      return lb;
    }
  }
  return '在场';
}

function getWorldStatusIcon(worldId) {
  const world = (settings.worlds || []).find(w => w.id === worldId);
  if (!world) return 'default';
  const wt = getWorldTime(worldId);
  const h = wt.getHours() + wt.getMinutes() / 60;
  const dayType = WORLD_SCHEDULE_TYPES[worldId] || 'work';
  const scheduleSet = WORLD_SCHEDULES_MULTI[worldId];
  const schedule = scheduleSet ? (scheduleSet[dayType] || scheduleSet.work) : [[0,24,'default','在场']];
  for (const [start, end, ic] of schedule) {
    if (end > 24) {
      if (h >= start || h < (end - 24)) return ic;
    } else if (h >= start && h < end) {
      return ic;
    }
  }
  return 'default';
}

function isWorldSleeping(worldId) {
  const ic = getWorldStatusIcon(worldId);
  return ic === 'sleeping';
}

function isWorldAwake(worldId) {
  if (worldSleepTimers[worldId] && worldSleepTimers[worldId] > Date.now()) return true;
  return !isWorldSleeping(worldId);
}

function isNightTime() {
  const h = new Date().getHours();
  return (h >= 22 || h < 6);
}

// ========== 状态优先级 ==========
function getPriorityStatus() {
  const now = Date.now();
  if (tempStatus && now < tempStatusUntil) return tempStatus;
  tempStatus = null;
  const taNick = settings.taNick || settings.taName;
  const silentMs = now - lastUserMessageTime;
  const twoHours = 2 * 3600000;
  const oneHour = 3600000;

  if (silentMs > oneHour && silentMs < twoHours) {
    return { iconKey: 'waitingForYou', text: `${taNick}在等你`, worldOverride: true };
  }
  if (silentMs > twoHours) {
    return { iconKey: 'thinkingOfYou', text: `${taNick}想你了`, worldOverride: true };
  }
  const tomorrow = new Date(now + 86400000);
  const tomorrowStr = tomorrow.getFullYear() + '-' + String(tomorrow.getMonth() + 1).padStart(2, '0') + '-' + String(tomorrow.getDate()).padStart(2, '0');
  const importantDays = JSON.parse(localStorage.getItem('importantDays') || '[]');
  const hasImportantTomorrow = importantDays.some(d => {
    let target = d.date;
    if (d.repeat) target = tomorrow.getFullYear() + '-' + d.date.slice(5);
    return target === tomorrowStr;
  });
  if (hasImportantTomorrow) {
    return { iconKey: 'lookingForward', text: `${taNick}在期待明天`, worldOverride: true };
  }
  const h = new Date().getHours();
  if (h >= 6 && h < 9) {
    return { iconKey: 'goodMorning', text: `${taNick}给你说早安`, worldOverride: true };
  }
  if (h >= 22 && h < 24) {
    return { iconKey: 'goodNight', text: `${taNick}给你说晚安`, worldOverride: true };
  }
  if (settings.accompanyMode === 'companion' && settings.accompanyType === 'clingy') {
    return { iconKey: 'actingCute', text: `${taNick}在撒娇`, worldOverride: true };
  }
  return null;
}

function setTempStatus(iconKey, text, duration) {
  tempStatus = { iconKey, text, worldOverride: true };
  tempStatusUntil = Date.now() + (duration || 300000);
  updateStatusBar();
}

// ========== 状态栏 ==========
function getTAStatus() {
  if (settings.accompanyMode) {
    const taNick = settings.taNick || settings.taName;
    let iconKey = 'companion', text = '';
    if (settings.accompanyMode === 'sleep') { iconKey = 'sleep'; text = `和${taNick}陪睡中`; }
    else if (settings.accompanyMode === 'daze') { iconKey = 'daze'; text = `和${taNick}发呆中`; }
    else if (settings.accompanyMode === 'together') { iconKey = 'together'; text = `和${taNick}一起${settings.accompanyType}中`; }
    else { iconKey = 'companion'; text = `和${taNick}陪伴中`; }
    return { iconKey, text, mode: 'companion' };
  }
  const pri = getPriorityStatus();
  if (pri) {
    return { iconKey: pri.iconKey, text: pri.text, mode: 'temp' };
  }
  if (onlineWorlds.length > 0) {
    return { mode: 'worlds' };
  }
  return null;
}

function updateStatusBar() {
  const bar = document.getElementById('status-bar');
  if (!bar) return;
  const st = getTAStatus();
  let html = '';
  if (!st) {
    bar.classList.remove('show');
    bar.innerHTML = '';
    return;
  }
  const taNick = settings.taNick || settings.taName;
  if (st.mode === 'companion' || st.mode === 'temp') {
    const icon = STATUS_ICONS[st.iconKey] || STATUS_ICONS.default;
    html = `<div class="sb-simple-line">${icon}<span>${escapeHtml(st.text)}</span></div>`;
  } else if (st.mode === 'worlds') {
    html += `<div class="sb-nick-line">${escapeHtml(taNick)}</div>`;
    onlineWorlds.forEach(wid => {
      const w = (settings.worlds || []).find(x => x.id === wid);
      if (!w) return;
      let statusText;
      let iconKey;
      if (worldSleepTimers[wid] && worldSleepTimers[wid] > Date.now()) {
        statusText = '被吵醒了';
        iconKey = 'woken';
      } else {
        statusText = getWorldStatusText(wid);
        iconKey = getWorldStatusIcon(wid);
      }
      const icon = STATUS_ICONS[iconKey] || STATUS_ICONS.default;
      html += `<div class="sb-world-line"><span class="sb-world-dot"></span>${icon}<span>${escapeHtml(w.name)} · ${escapeHtml(w.role)} · ${escapeHtml(statusText)}</span></div>`;
    });
  }
  bar.innerHTML = html;
  bar.classList.add('show');
}

// ========== 背景绘制 ==========
async function applyBG() {
  const canvas = document.getElementById('bg-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const w = window.innerWidth, h = window.innerHeight;
  canvas.width = w; canvas.height = h;
  if (document.documentElement.classList.contains('dark-mode')) {
    drawDarkBG(ctx, w, h);
    return;
  }
  if (settings.bgCurrent) {
    if (cachedBGImage && cachedBGRef === settings.bgCurrent && cachedBGImage.complete) {
      ctx.clearRect(0, 0, w, h);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(cachedBGImage, 0, 0, w, h);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(0, 0, w, h);
      return;
    }
    const data = await resolveMedia(settings.bgCurrent);
    if (data) {
      const img = new Image();
      img.onload = () => {
        cachedBGImage = img; cachedBGRef = settings.bgCurrent;
        ctx.clearRect(0, 0, w, h);
        ctx.globalAlpha = 0.85;
        ctx.drawImage(img, 0, 0, w, h);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(0, 0, w, h);
      };
      img.src = data;
      cachedBGImage = img; cachedBGRef = settings.bgCurrent;
      return;
    } else {
      settings.bgCurrent = '';
      await saveSettings();
    }
  }
  cachedBGImage = null; cachedBGRef = null;
  drawDefaultBG(ctx, w, h);
}

function drawDefaultBG(ctx, w, h) {
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#fdd9c8');
  grad.addColorStop(0.4, '#f7d4e3');
  grad.addColorStop(0.7, '#dcd3f5');
  grad.addColorStop(1, '#c8ddf5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function drawDarkBG(ctx, w, h) {
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#1a1425');
  grad.addColorStop(0.5, '#231a38');
  grad.addColorStop(1, '#1a1a2e');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function openShardInteractPanel() {
  const overlay = createModal(`
    <div class="big-input-title">副本互动</div>
    <div style="font-size:12px;color:#8b6f60;margin-bottom:10px;text-align:center;">选一个副本，编辑它的专属互动</div>
    <div class="world-chip-row" id="shard-interact-chips"></div>
    <div class="heart-tabs" id="shard-interact-tabs">
      <button class="heart-tab active" data-tab="me2ta">我对TA</button>
      <button class="heart-tab" data-tab="ta2me">TA对我</button>
      <button class="heart-tab" data-tab="couple">情侣</button>
    </div>
    <div class="card-list" id="shard-interact-list"></div>
    <button class="upload-btn" id="shard-interact-add">添加互动</button>`);
  let currentWorldId = settings.currentWorldId || (settings.worlds[0] && settings.worlds[0].id);
  let currentTab = 'me2ta';
  renderShardInteractChips(overlay, currentWorldId, () => renderShardInteractList(overlay, currentWorldId, currentTab));
  renderShardInteractList(overlay, currentWorldId, currentTab);
  overlay.querySelectorAll('#shard-interact-tabs .heart-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      currentTab = btn.dataset.tab;
      overlay.querySelectorAll('#shard-interact-tabs .heart-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderShardInteractList(overlay, currentWorldId, currentTab);
    });
  });
  overlay.querySelector('#shard-interact-add').addEventListener('click', () => {
    openShardInteractAddDialog(currentWorldId, currentTab, overlay);
  });
  function renderShardInteractChips(ov, wid, onPick) {
    const row = ov.querySelector('#shard-interact-chips');
    row.innerHTML = '';
    (settings.worlds || []).forEach(w => {
      const chip = document.createElement('div');
      chip.className = 'world-chip' + (w.id === wid ? ' active' : '');
      chip.textContent = w.name;
      chip.addEventListener('click', () => {
        currentWorldId = w.id;
        row.querySelectorAll('.world-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        onPick();
      });
      row.appendChild(chip);
    });
  }
}

function renderShardInteractList(overlay, worldId, tab) {
  const list = overlay.querySelector('#shard-interact-list');
  list.innerHTML = '';
  if (!settings.worldInteracts) settings.worldInteracts = {};
  const data = settings.worldInteracts[worldId] || { me2ta: [], ta2me: [], couple: [] };
  const items = data[tab] || [];
  if (!items.length) {
    list.innerHTML = '<div class="placeholder-tip">还没有专属互动</div>';
    return;
  }
  items.forEach((item, i) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    if (tab === 'couple') div.classList.add('interact-couple-item');
    const text = typeof item === 'string' ? item : (item.text || '');
    div.innerHTML = `<div class="card-text">${escapeHtml(text)}</div>
      <div class="card-ops"><button class="shard-interact-del">✕</button></div>`;
    div.querySelector('.shard-interact-del').addEventListener('click', async () => {
      const d = settings.worldInteracts[worldId] || { me2ta: [], ta2me: [], couple: [] };
      d[tab].splice(i, 1);
      settings.worldInteracts[worldId] = d;
      await saveSettings();
      renderShardInteractList(overlay, worldId, tab);
    });
    list.appendChild(div);
  });
}

function openShardInteractAddDialog(worldId, tab, panelOverlay) {
  const overlay = createModal(`
    <div class="big-input-title">添加互动</div>
    <textarea class="big-input-area" id="shard-interact-input" placeholder="一行一条互动" style="min-height:150px;"></textarea>
    <button class="save-btn-center" id="save-shard-interact" style="margin-top:12px;">保存</button>`);
  overlay.querySelector('#save-shard-interact').addEventListener('click', async () => {
    const text = overlay.querySelector('#shard-interact-input').value.trim();
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) return showToast('请输入互动文字');
    if (!settings.worldInteracts) settings.worldInteracts = {};
    if (!settings.worldInteracts[worldId]) settings.worldInteracts[worldId] = { me2ta: [], ta2me: [], couple: [] };
    lines.forEach(l => settings.worldInteracts[worldId][tab].push(l));
    await saveSettings();
    showToast(`已添加 ${lines.length} 条`);
    overlay.remove();
    renderShardInteractList(panelOverlay, worldId, tab);
  });
}

let cardPageMode = false;
let currentCardWorldId = '';

function openCardPanel() {
  currentCardWorldId = '';
  renderCardPanel(null, '');
}

function openShardCardsPanel() {
  const overlay = createModal(`
    <div class="big-input-title">副本字卡</div>
    <div style="font-size:12px;color:#8b6f60;margin-bottom:10px;text-align:center;">选一个副本，管理它的专属字卡</div>
    <div class="world-chip-row" id="shard-cards-chips"></div>
    <div id="shard-cards-body"></div>`);
  let currentWorldId = settings.currentWorldId || (settings.worlds[0] && settings.worlds[0].id);
  const chipsRow = overlay.querySelector('#shard-cards-chips');
  (settings.worlds || []).forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'world-chip' + (w.id === currentWorldId ? ' active' : '');
    chip.textContent = w.name;
    chip.addEventListener('click', () => {
      currentWorldId = w.id;

async function renderShardCardsBody(overlay, worldId) {
  const body = overlay.querySelector('#shard-cards-body');
  body.innerHTML = '';
  const allCards = await idbGetAll('cards');
  const cards = allCards.filter(c => c.worldId === worldId);
  const list = document.createElement('div');
  list.className = 'card-list';
  list.id = 'shard-cards-list';
  body.appendChild(list);
  const addInput = document.createElement('div');
  addInput.className = 'card-input-row';
  addInput.innerHTML = `<input type="text" id="shard-card-add" placeholder="添加新字卡" readonly>`;
  body.appendChild(addInput);
  const addBtn = document.createElement('button');
  addBtn.className = 'upload-btn';
  addBtn.textContent = '添加字卡';
  addBtn.addEventListener('click', () => openShardAddCardDialog(worldId, body));
  body.appendChild(addBtn);
  list.innerHTML = '';
  if (!cards.length) {
    list.innerHTML = '<div class="placeholder-tip">还没有专属字卡</div>';
  } else {
    cards.forEach(card => {
      const div = document.createElement('div');
      div.className = 'card-item';
      div.innerHTML = `<div class="card-text">${escapeHtml(card.content)}</div>
        <div class="card-ops"><button class="card-edit">✎</button><button class="card-delete">✕</button></div>`;
      div.querySelector('.card-edit').addEventListener('click', () => {
        showEditShardCardDialog(card.id, card.content, worldId, body);
      });
      div.querySelector('.card-delete').addEventListener('click', async () => {
        await idbDelete('cards', card.id);
        renderShardCardsBody(overlay, worldId);
      });
      list.appendChild(div);
    });
  }
}

function openShardAddCardDialog(worldId, body) {
  const overlay = createModal(`
    <div class="big-input-title">添加副本字卡</div>
    <textarea class="big-input-area" id="shard-card-area" placeholder="一行一条字卡"></textarea>
    <button class="save-btn-center" id="save-shard-card" style="margin-top:12px;">保存</button>`);
  overlay.querySelector('#save-shard-card').addEventListener('click', async () => {
    const text = overlay.querySelector('#shard-card-area').value.trim();
    if (!text) return;
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
    let added = 0;
    for (const line of lines) {
      await idbPut('cards', { content: line, worldId: worldId });
      added++;
    }
    showToast(`成功添加 ${added} 张`);
    overlay.remove();
    const parentOverlay = body.closest('.modal-overlay');
    const chipRow = parentOverlay.querySelector('#shard-cards-chips');
    const activeChip = chipRow.querySelector('.world-chip.active');
    const wid = activeChip ? (settings.worlds.find(w => w.name === activeChip.textContent) || {}).id : worldId;
    renderShardCardsBody(parentOverlay, wid || worldId);
  });
}

function showEditShardCardDialog(id, content, worldId, body) {
  const overlay = createModal(`
    <div class="big-input-title">编辑字卡</div>
    <textarea class="big-input-area" id="edit-shard-card-area">${escapeHtml(content)}</textarea>
    <button class="save-btn-center" id="save-edit-shard-card" style="margin-top:12px;">保存</button>`);
  overlay.querySelector('#save-edit-shard-card').addEventListener('click', async () => {
    const newContent = overlay.querySelector('#edit-shard-card-area').value.trim();
    if (newContent) {
      await idbPut('cards', { id, content: newContent, worldId: worldId });
    }
    overlay.remove();
    const parentOverlay = body.closest('.modal-overlay');
    renderShardCardsBody(parentOverlay, worldId);
  });
}

function renderCardPanel(panel, worldId) {
  if (!panel) {
    const overlay = createModal(`
      <div class="card-search-row"><input type="text" id="card-search-btn" placeholder="搜索字卡" readonly></div>
      <div class="card-input-row"><input type="text" id="card-add-input" placeholder="添加新字卡" readonly></div>
      <div class="card-actions-row">
        <button class="mini-btn" id="card-file-import">文件导入</button>
        <button class="mini-btn" id="card-file-export">文件导出</button>
        <button class="mini-btn" id="card-batch-del">批量删除</button>
        <button class="mini-btn" id="card-recycle">回收站</button>
        <button class="mini-btn" id="card-dedupe">一键去重</button>
      </div>
      <div class="card-count-row">
        <span id="card-count-text">总数量：0 张</span>
        <button class="mini-btn" id="card-batch-confirm" style="display:none;">一键删除</button>
      </div>
      <div class="card-list" id="card-list"></div>`);
    const p = overlay.querySelector('.modal-panel');
    loadCardList(p);
    bindCardEvents(p);
    return;
  }
  loadCardList(panel);
  bindCardEvents(panel);
}

async function loadCardList(panel) {
  const allCards = await idbGetAll('cards');
  const cards = allCards.filter(c => !c.worldId);
  const list = panel.querySelector('#card-list');
  const countText = panel.querySelector('#card-count-text');
  countText.textContent = `总数量：${cards.length} 张`;
  list.innerHTML = '';
  if (!cards.length) {
    list.innerHTML = '<div class="placeholder-tip">还没有字卡，快点添加吧</div>';
    return;
  }
  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.dataset.id = card.id;
    div.innerHTML = `
      <input type="checkbox" class="card-checkbox" style="display:none;">
      <div class="card-text">${escapeHtml(card.content)}</div>
      <div class="card-ops">
        <button class="card-edit" title="编辑">✎</button>
        <button class="card-delete" title="删除">✕</button>
      </div>`;
    list.appendChild(div);
  });
}

function bindCardEvents(panel) {
  const list = panel.querySelector('#card-list');
  const addInput = panel.querySelector('#card-add-input');
  const batchDelBtn = panel.querySelector('#card-batch-del');
  const batchConfirm = panel.querySelector('#card-batch-confirm');
  const recycleBtn = panel.querySelector('#card-recycle');
  const importBtn = panel.querySelector('#card-file-import');
  const exportBtn = panel.querySelector('#card-file-export');
  const searchBtn = panel.querySelector('#card-search-btn');
  const dedupeBtn = panel.querySelector('#card-dedupe');

  addInput.addEventListener('click', () => openAddCardDialog(panel));

  batchDelBtn.addEventListener('click', () => {
    cardPageMode = !cardPageMode;
    const boxes = panel.querySelectorAll('.card-checkbox');
    boxes.forEach(b => b.style.display = cardPageMode ? 'inline-block' : 'none');
    batchConfirm.style.display = cardPageMode ? 'inline-block' : 'none';
    if (!cardPageMode) boxes.forEach(b => b.checked = false);
  });

  batchConfirm.addEventListener('click', async () => {
    const checked = panel.querySelectorAll('.card-checkbox:checked');
    for (const box of checked) {
      const id = Number(box.closest('.card-item').dataset.id);
      const card = (await idbGetAll('cards')).find(c => c.id === id);
      if (card) {
        const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
        recycled.push(card);
        localStorage.setItem('recycledCards', JSON.stringify(recycled));
        await idbDelete('cards', id);
      }
    }
    cardPageMode = false;
    loadCardList(panel);
  });

  recycleBtn.addEventListener('click', () => openRecyclePanel(panel));

  dedupeBtn.addEventListener('click', async () => {
    const allCards = await idbGetAll('cards');
    const cards = allCards.filter(c => !c.worldId);
    const seen = new Set();
    const duplicates = [];
    for (const card of cards) {
      if (seen.has(card.content)) {
        duplicates.push(card.content);
        await idbDelete('cards', card.id);
      } else {
        seen.add(card.content);
      }
    }
    if (duplicates.length) {
      createModal(`
        <div class="big-input-title">去重完成</div>
        <div style="font-size:13px;color:#4a3528;margin-bottom:12px;">已去除 ${duplicates.length} 张重复字卡：</div>
        <div class="card-list" style="max-height:40vh;">${duplicates.map(d => `<div class="card-item"><div class="card-text">${escapeHtml(d)}</div></div>`).join('')}</div>`);
    } else {
      showToast('没有重复字卡');
    }
    loadCardList(panel);
  });

  importBtn.addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.txt,.json';
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      if (file.name.endsWith('.json')) {
        const data = JSON.parse(text);
        const cards = data.cards || data;
        for (const c of cards) {
          const content = typeof c === 'string' ? c : c.content;
          if (content) await idbPut('cards', { content, worldId: '' });
        }
      } else {
        const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
        for (const line of lines) await idbPut('cards', { content: line, worldId: '' });
      }
      loadCardList(panel);
    };
    inp.click();
  });

  exportBtn.addEventListener('click', () => {
    const fmtOverlay = createModal(`
      <div class="big-input-title">导出格式</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;">
        <button class="mini-btn" id="export-txt">TXT</button>
        <button class="mini-btn" id="export-json">JSON</button>
      </div>`);
    fmtOverlay.querySelector('#export-txt').addEventListener('click', async () => {
      const allCards = await idbGetAll('cards');
      const cards = allCards.filter(c => !c.worldId);
      downloadFile(cards.map(c => c.content).join('\n'), '字卡导出.txt', 'text/plain');
      fmtOverlay.remove();
    });
    fmtOverlay.querySelector('#export-json').addEventListener('click', async () => {
      const allCards = await idbGetAll('cards');
      const cards = allCards.filter(c => !c.worldId);
      downloadFile(JSON.stringify({ cards }, null, 2), '字卡导出.json', 'application/json');
      fmtOverlay.remove();
    });
  });

  searchBtn.addEventListener('click', () => openCardSearchPanel());

  list.addEventListener('click', async (e) => {
    const item = e.target.closest('.card-item');
    if (!item) return;
    const id = Number(item.dataset.id);
    const allCards = await idbGetAll('cards');
    const card = allCards.find(c => c.id === id);
    if (!card) return;
    if (e.target.closest('.card-delete')) {
      const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      recycled.push(card);
      localStorage.setItem('recycledCards', JSON.stringify(recycled));
      await idbDelete('cards', id);
      loadCardList(panel);
    } else if (e.target.closest('.card-edit')) {
      showEditCardDialog(id, card.content, panel);
    }
  });
}

function openAddCardDialog(panel) {
  const overlay = createModal(`
    <div class="big-input-title">字卡内容</div>
    <textarea class="big-input-area" id="add-card-area" placeholder="他会用这些字卡回复你哦"></textarea>
    <div class="big-input-hint">一行一条字卡，换行分隔</div>
    <button class="save-btn-center" id="save-add-card">保存字卡</button>`);
  overlay.querySelector('#save-add-card').addEventListener('click', async () => {
    const text = overlay.querySelector('#add-card-area').value.trim();
    if (!text) return;
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
    const existing = await idbGetAll('cards');
    const existingContents = existing.filter(c => !c.worldId).map(c => c.content);
    let added = 0, skipped = 0;
    for (const line of lines) {
      if (existingContents.includes(line)) skipped++;
      else {
        await idbPut('cards', { content: line, worldId: '' });
        existingContents.push(line);
        added++;
      }
    }
    if (skipped > 0) showToast(`有 ${skipped} 张已存在，已跳过`);
    if (added > 0) showToast(`成功添加 ${added} 张新字卡`);
    else if (added === 0 && skipped === 0) showToast('没有新字卡可添加');
    overlay.remove();
    loadCardList(panel);
  });
}

function showEditCardDialog(id, content, panel) {
  const overlay = createModal(`
    <div class="big-input-title">编辑字卡</div>
    <textarea class="big-input-area" id="edit-card-area">${escapeHtml(content)}</textarea>
    <button class="save-btn-center" id="save-edit-card" style="margin-top:12px;">保存</button>`);
  overlay.querySelector('#save-edit-card').addEventListener('click', async () => {
    const newContent = overlay.querySelector('#edit-card-area').value.trim();
    if (newContent) {
      await idbPut('cards', { id, content: newContent, worldId: '' });
      if (panel) loadCardList(panel);
    }
    overlay.remove();
  });
}

function openRecyclePanel(panel) {
  const overlay = createModal(`
    <div class="big-input-title">回收站</div>
    <div class="card-count-row"><span id="recycle-count"></span></div>
    <div class="card-list" id="recycle-list"></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
      <button class="mini-btn" id="recycle-restore-all">全部恢复</button>
      <button class="mini-btn" id="recycle-clear-all">清空</button>
    </div>`);
  loadRecycleList(overlay, panel);
  overlay.querySelector('#recycle-restore-all').addEventListener('click', async () => {
    const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
    for (const c of recycled) await idbPut('cards', { content: c.content, worldId: c.worldId || '' });
    localStorage.setItem('recycledCards', '[]');
    loadRecycleList(overlay, panel);
    if (panel) loadCardList(panel);
  });
  overlay.querySelector('#recycle-clear-all').addEventListener('click', () => {
    localStorage.setItem('recycledCards', '[]');
    loadRecycleList(overlay, panel);
  });
}

function loadRecycleList(overlay, panel) {
  const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
  overlay.querySelector('#recycle-count').textContent = `共 ${recycled.length} 张`;
  const list = overlay.querySelector('#recycle-list');
  list.innerHTML = '';
  if (!recycled.length) {
    list.innerHTML = '<div class="placeholder-tip">回收站是空的</div>';
    return;
  }
  recycled.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${escapeHtml(c.content)}</div>
      <div class="card-ops"><button class="recycle-restore">恢复</button><button class="recycle-forever">彻删</button></div>`;
    div.querySelector('.recycle-restore').addEventListener('click', async () => {
      const all = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      const idx = all.indexOf(c);
      const realIdx = idx >= 0 ? idx : i;
      if (all[realIdx]) {
        await idbPut('cards', { content: all[realIdx].content, worldId: all[realIdx].worldId || '' });
        all.splice(realIdx, 1);
        localStorage.setItem('recycledCards', JSON.stringify(all));
      }
      loadRecycleList(overlay, panel);
      if (panel) loadCardList(panel);
    });
    div.querySelector('.recycle-forever').addEventListener('click', () => {
      const all = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      const idx = all.indexOf(c);
      const realIdx = idx >= 0 ? idx : i;
      if (all[realIdx]) {
        all.splice(realIdx, 1);
        localStorage.setItem('recycledCards', JSON.stringify(all));
      }
      loadRecycleList(overlay, panel);
    });
    list.appendChild(div);
  });
}

// ========== 贴纸 ==========
function openStickerPanel() {
  const overlay = createModal(`
    <div class="big-input-title">贴纸（共 <span id="sticker-count-num"></span> 张）</div>
    <div class="library-grid" id="sticker-library"></div>
    <button class="upload-btn" id="sticker-upload-btn">上传贴纸</button>
    <button class="upload-btn" id="sticker-import-btn">导入贴纸</button>
    <button class="upload-btn" id="sticker-export-btn">导出贴纸</button>
    <div style="margin-top:12px;font-size:13px;color:#4a3528;">易遇发贴纸概率</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
      <button class="mini-btn sticker-tpl" data-tpl="rare">偶尔惊喜</button>
      <button class="mini-btn sticker-tpl" data-tpl="daily">日常甜</button>
      <button class="mini-btn sticker-tpl" data-tpl="active">活跃</button>
    </div>`);
  loadStickerLibrary(overlay);
  overlay.querySelector('#sticker-upload-btn').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.multiple = true;
    inp.onchange = async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      const previewOverlay = createModal(`
        <div class="big-input-title">预览贴纸</div>
        <div style="font-size:13px;color:#4a3528;margin-bottom:12px;">共 ${files.length} 张</div>
        <div class="library-grid" id="sticker-preview-grid"></div>
        <div class="big-input-hint" id="sticker-progress">准备就绪</div>
        <button class="save-btn-center" id="confirm-sticker-upload" style="margin-top:14px;">确认添加</button>`);
      const grid = previewOverlay.querySelector('#sticker-preview-grid');
      const dataUrls = [];
      for (const file of files) {
        const dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });
        if (dataUrl) {
          dataUrls.push(dataUrl);
          const div = document.createElement('div');
          div.className = 'lib-item';
          div.innerHTML = `<img src="${dataUrl}" alt="">`;
          grid.appendChild(div);
        }
      }
      previewOverlay.querySelector('#confirm-sticker-upload').addEventListener('click', async () => {
        const progressEl = previewOverlay.querySelector('#sticker-progress');
        let ok = 0, fail = 0;
        for (let i = 0; i < dataUrls.length; i++) {
          progressEl.textContent = `正在添加 ${i + 1}/${dataUrls.length}...`;
          try { await libPush('stickerLibrary', dataUrls[i], 'sticker'); ok++; } catch (err) { fail++; }
          await delay(20);
        }
        progressEl.textContent = `完成：成功 ${ok} 张${fail ? '，失败 ' + fail + ' 张' : ''}`;
        previewOverlay.remove();
        overlay.remove();
        openStickerPanel();
        showToast(`已添加 ${ok} 张贴纸${fail ? '，失败 ' + fail + ' 张' : ''}`);
      });
    };
    inp.click();
  });
  overlay.querySelector('#sticker-import-btn').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json';
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const data = JSON.parse(text);
      const items = data.stickers || data;
      let ok = 0;
      for (const s of items) {
        try { await libPush('stickerLibrary', s, 'sticker'); ok++; } catch (err) {}
      }
      showToast(`已导入 ${ok} 张贴纸`);
      overlay.remove();
      openStickerPanel();
    };
    inp.click();
  });
  overlay.querySelector('#sticker-export-btn').addEventListener('click', async () => {
    const list = await libGet('stickerLibrary');
    downloadFile(JSON.stringify({ stickers: list.map(x => x.data) }), '贴纸导出.json', 'application/json');
  });
  overlay.querySelectorAll('.sticker-tpl').forEach(btn => {
    if (btn.dataset.tpl === settings.stickerTpl) {
      btn.style.background = 'rgba(255,150,100,0.6)';
      btn.style.color = '#fff';
    }
    btn.addEventListener('click', () => {
      settings.stickerTpl = btn.dataset.tpl;
      if (btn.dataset.tpl === 'rare') settings.stickerProb = 0.015;
      if (btn.dataset.tpl === 'daily') settings.stickerProb = 0.06;
      if (btn.dataset.tpl === 'active') settings.stickerProb = 0.17;
      saveSettings();
      overlay.remove();
      openStickerPanel();
    });
  });
}

async function loadStickerLibrary(overlay) {
  const list = await libGet('stickerLibrary');
  const countEl = overlay.querySelector('#sticker-count-num');
  if (countEl) countEl.textContent = list.length;
  const grid = overlay.querySelector('#sticker-library');
  grid.innerHTML = '';
  list.forEach((item) => {
    const div = document.createElement('div');
    div.className = 'lib-item';
    div.innerHTML = `<img src="${item.data}" alt="">`;
    div.addEventListener('click', () => {
      openLibActionMenu(item, 'stickerLibrary', () => loadStickerLibrary(overlay));
    });
    grid.appendChild(div);
  });
}

function openLibActionMenu(item, libName, reloadFn, extraOptions) {
  const options = [];
  if (extraOptions) options.push(...extraOptions);
  options.push({ label: '删除', danger: true, action: () => {
    const refs = libGetRefs(libName).filter(r => r !== item.ref);
    libSetRefs(libName, refs);
    mediaDel(item.ref);
    if (reloadFn) reloadFn();
  }});
  const menuHtml = options.map((op, i) => `<button class="mini-btn lib-menu-btn" data-i="${i}" style="width:100%;margin-bottom:8px;${op.danger ? 'color:#c33;' : ''}">${op.label}</button>`).join('');
  const overlay = createModal(`<div style="display:flex;flex-direction:column;">${menuHtml}</div>`);
  overlay.querySelectorAll('.lib-menu-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const op = options[Number(btn.dataset.i)];
      overlay.remove();
      if (op.action) await op.action();
    });
  });
}

function openReplyTplDialog(panelOverlay) {
  const overlay = createModal(`
    <div class="big-input-title">选择回复速度模板</div>

      <button class="mini-btn tpl-option" data-tpl="natural">日常闲聊（5~8秒）</button>
      <button class="mini-btn tpl-option" data-tpl="distant">若即若离（30秒~2分钟）</button>
      <button class="mini-btn tpl-option" data-tpl="custom">自定义</button>
    </div>`);
  overlay.querySelectorAll('.tpl-option').forEach(btn => {
    if (btn.dataset.tpl === settings.replyTpl) { btn.style.background = 'rgba(255,150,100,0.6)'; btn.style.color = '#fff'; }
    btn.addEventListener('click', () => {
      const tpl = btn.dataset.tpl;
      settings.replyTpl = tpl;
      if (tpl === 'instant') { settings.replyMin = 1; settings.replyMax = 3; }
      if (tpl === 'natural') { settings.replyMin = 5; settings.replyMax = 8; }
      if (tpl === 'distant') { settings.replyMin = 30; settings.replyMax = 120; }
      saveSettings();
      overlay.remove();
      panelOverlay.remove();
      openSettingsPanel();
    });
  });
}

  tplRows.forEach(r => {
    html += `<div style="font-size:13px;color:#4a3528;margin-bottom:4px;">${r.name}</div>`;

  // ========== 消息渲染 ==========
async function renderMessages() {
  const area = document.getElementById('messages-area');
  const msgs = await idbGetAll('messages');
  const today = new Date().toDateString();
  const todayMsgs = msgs.filter(m => new Date(m.timestamp).toDateString() === today);
  area.innerHTML = '';
  for (const msg of todayMsgs) {
    const el = await createMessageEl(msg);
    area.appendChild(el);
  }
  scrollToBottom(area);
  // ← 改：删掉置顶区渲染
}

function scrollToBottom(area) {
  if (!area) return;
  area.scrollTop = area.scrollHeight;
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 100);
  setTimeout(() => { area.scrollTop = area.scrollHeight; }, 350);
}

function getWorldLabel(worldId) {
  const world = worldId
    ? (settings.worlds || []).find(w => w.id === worldId)
    : getCurrentWorld();
  if (!world) return '';
  return world.name + ' · ' + world.role;
}

function getWorldLabelShort(worldId) {
  const world = worldId
    ? (settings.worlds || []).find(w => w.id === worldId)
    : getCurrentWorld();
  if (!world) return '';
  return world.name;
}

async function createMessageEl(msg) {
  const row = document.createElement('div');
  if (msg.isSystem) {
    row.className = 'message-row system';
    const bubble = document.createElement('div');
    bubble.className = 'msg-system-bubble';
    bubble.textContent = msg.content;
    row.appendChild(bubble);
    row.dataset.id = msg.id;
    bindMessageLongPress(row, msg);
    return row;
  }
  row.className = 'message-row ' + msg.sender;
  row.dataset.id = msg.id;
  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  const avatarRef = msg.sender === 'me' ? settings.meAvatar : settings.taAvatar;
  const avatarData = await resolveMedia(avatarRef);
  avatar.src = avatarData || (msg.sender === 'me'
    ? 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.5)"/><text x="16" y="21" text-anchor="middle" font-size="12" fill="rgba(90,70,60,0.6)">我</text></svg>')
    : 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.5)"/><text x="16" y="21" text-anchor="middle" font-size="12" fill="rgba(90,70,60,0.6)">遇</text></svg>'));
  if (msg.sender === 'ta' && msg.worldId) {
    avatar.classList.add('world-' + msg.worldId);
  }
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-content-wrapper';
  if (msg.sender === 'ta' && msg.worldLabel) {
    const wl = document.createElement('div');
    wl.className = 'msg-world-label';
    if (msg.worldId && WORLD_ICONS[msg.worldId]) {
      wl.innerHTML = `<span class="msg-world-icon">${WORLD_ICONS[msg.worldId]}</span>${escapeHtml(msg.worldLabel)}`;
    } else {
      wl.textContent = msg.worldLabel;
    }
    wrapper.appendChild(wl);
  }
  if (msg.quoteContent) {
    const quote = document.createElement('div');
    quote.className = 'msg-quote';
    quote.textContent = '「' + msg.quoteContent + '」';
    quote.addEventListener('click', () => scrollToMessageByContent(msg.quoteContent));
    wrapper.appendChild(quote);
  }
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (msg.worldId && msg.sender === 'ta' && !msg.giftData && !msg.giftPackData && !msg.interactData && !msg.intimateData && !msg.imageData && !msg.questionnaireData) {
    bubble.classList.add('world-' + msg.worldId);
  }
  if (msg.imageData) {
    bubble.style.padding = '4px';
    bubble.style.background = 'transparent';
    bubble.style.border = 'none';
    bubble.innerHTML = `<img src="${msg.imageData}" style="max-width:200px;border-radius:12px;display:block;">`;
  } else if (msg.giftData) {
    bubble.className = 'gift-msg-slot';
    if (msg.giftData.opened) {
      const sparks = ['✨', '💗', '⭐', '💫'];
      let iconHTML = '';
      if (msg.giftData.image) {
        iconHTML = `<img class="gift-image" src="${msg.giftData.image}" alt="">`;
      } else {
        iconHTML = `<div class="msg-gift-icon">${msg.giftData.icon || '🎁'}</div>`;
      }
      bubble.innerHTML = `<div class="msg-gift-card">
        <span class="gift-sparkle" style="top:6px;left:10px;">${sparks[0]}</span>
        <span class="gift-sparkle" style="top:10px;right:12px;animation-delay:.6s;">${sparks[1]}</span>
        <span class="gift-sparkle" style="bottom:8px;left:16px;animation-delay:1.2s;">${sparks[2]}</span>
        <span class="gift-sparkle" style="bottom:10px;right:10px;animation-delay:1.8s;">${sparks[3]}</span>
        ${iconHTML}
        <div class="msg-gift-name">${escapeHtml(msg.giftData.name || '礼物')}</div>

      </div>`;
    } else {
      bubble.innerHTML = `<div class="msg-gift-box" data-gift-id="${msg.id}"><div class="gift-box-emoji">🎁</div></div>`;
    }
  } else if (msg.giftPackData) {
    bubble.className = 'gift-msg-slot';
    if (msg.giftPackData.opened) {
      const pack = msg.giftPackData;
      const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
      const isImagePack = pack.packType === 'image' || (pack.items || []).some(it => it && it.image);
      const itemsPreview = (pack.items || []).map(it => {
        const name = typeof it === 'string' ? it : (it.name || '');
        const g = gifts.find(x => x.name === name);
        const icon = (it && it.icon) || (g && g.icon) || '🎁';
        const image = (it && it.image) || (g && g.image) || '';
        if (image) return `<span class="gp-item-thumb"><img src="${image}" alt=""></span>`;
        return `<span class="gp-item-thumb">${icon}</span>`;
      }).join('');
      const previewClass = isImagePack ? 'gp-items-preview image-pack' : 'gp-items-preview';
      bubble.innerHTML = `<div class="msg-giftpack-card">
        <span class="gp-deco tl">🎀</span>
        <span class="gp-deco tr">⭐</span>
        <span class="gp-deco bl">🌸</span>

        <div class="gp-price-row">

  } else if (msg.questionnaireData) {

    bubble.className = 'gift-msg-slot';
    const q = msg.questionnaireData;
    const isMeSender = msg.sender === 'me';
    const answered = q.answers && q.answers.length > 0;
    const canAnswer = !isMeSender && !answered && q.status !== 'answered';

    qHtml += `<div class="quiz-head">${ICONS.questionnaire}<span class="quiz-head-title">问卷${answered ? ' · 已回答' : ''}</span></div>`;
    qHtml += `<div class="quiz-body">`;
    (q.questions || []).forEach((item, qi) => {
      qHtml += `<div class="quiz-q">`;
      qHtml += `<div class="quiz-q-title">${qi + 1}. ${escapeHtml(item.q)}</div>`;
      (item.options || []).forEach((opt, oi) => {
        const selected = answered && q.answers[qi] === oi;
        qHtml += `<div class="quiz-opt${selected ? ' selected' : ''}"><span class="opt-dot"></span>${String.fromCharCode(65 + oi)} ${escapeHtml(opt)}</div>`;
      });
      qHtml += `</div>`;
    });
    qHtml += `</div>`;
    const footIcon = isMeSender ? ICONS.mail : (answered ? '✓' : ICONS.questionnaire);
    let footText = '';
    if (isMeSender) {
      const wname = q.targetWorldName || '易遇';
      footText = answered ? `已答：${escapeHtml(wname)}` : `已发给：${escapeHtml(wname)}`;

      footText = answered ? '已回答' : '点击作答';
    }
    qHtml += `<div class="quiz-foot">${typeof footIcon === 'string' && footIcon.startsWith('<svg') ? footIcon : `<span>${footIcon}</span>`}<span>${footText}</span></div>`;
    qHtml += `</div>`;
    bubble.innerHTML = qHtml;
  } else if (msg.intimateData) {
    bubble.className = 'msg-bubble intimate';
    bubble.textContent = msg.content;
    const mark = document.createElement('span');
    mark.className = 'intimate-mark';
    mark.textContent = '💗';
    bubble.appendChild(mark);
  } else if (msg.interactData) {
    if (msg.interactData.intimateType === 'approach') {
      bubble.className = 'msg-bubble intimate-approach';
      bubble.textContent = msg.interactData.text || '';
      const mark = document.createElement('span');
      mark.className = 'intimate-approach-mark';
      mark.textContent = '凑近';
      bubble.appendChild(mark);
    } else if (msg.interactData.intimateType === 'compete') {
      bubble.className = 'msg-bubble intimate-compete';
      bubble.textContent = msg.interactData.text || '';
      const mark = document.createElement('span');
      mark.className = 'intimate-compete-mark';
      mark.textContent = '争宠';
      bubble.appendChild(mark);
    } else if (msg.interactData.couple) {
      bubble.className = 'msg-bubble msg-interact-couple';
      const taAv = await resolveMedia(settings.taAvatar);
      const meAv = await resolveMedia(settings.meAvatar);
      const heartSVG = `<svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 21C12 21 4 14.5 4 9.5C4 6.5 6.5 4.5 9 4.5C11 4.5 12 6 12 6C12 6 13 4.5 15 4.5C17.5 4.5 20 6.5 20 9.5C20 14.5 12 21 12 21Z" fill="#ff3b5c"/></svg>`;
      bubble.innerHTML = `
        <span class="couple-spark" style="top:6px;left:10px;">✨</span>
        <span class="couple-spark" style="bottom:8px;right:12px;animation-delay:.8s;">💗</span>
        <div class="couple-avatars">
          <img src="${taAv || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="12" fill="rgba(255,255,255,0.6)"/><text x="13" y="18" text-anchor="middle" font-size="10" fill="#a04a6a">遇</text></svg>')}">
          <span class="couple-heart">${heartSVG}</span>
          <img src="${meAv || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26"><circle cx="13" cy="13" r="12" fill="rgba(255,255,255,0.6)"/><text x="13" y="18" text-anchor="middle" font-size="10" fill="#a04a6a">我</text></svg>')}">
        </div>
        <div class="couple-text">${escapeHtml(msg.interactData.text || '')}</div>`;
    } else {
      bubble.style.background = 'transparent';
      bubble.style.border = 'none';
      bubble.innerHTML = `<div class="msg-interact-text">${escapeHtml(msg.interactData.text || '')}</div>`;

  } else {

  }
  wrapper.appendChild(bubble);
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  const timeSpan = document.createElement('span');
  const d = new Date(msg.timestamp);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  timeSpan.textContent = hh + ':' + mm;
  timeSpan.style.fontSize = '10px';

    timeSpan.textContent = '此刻 · 💋';
    timeSpan.className = 'intimate-time';

  meta.appendChild(timeSpan);
  if (msg.sender === 'me' && msg.readTime) {

    meta.appendChild(read);

    const heart = document.createElement('span');
    heart.className = 'msg-heart-mark';
    heart.textContent = '💗' + msg.heartMark;

  wrapper.appendChild(meta);
  if (msg.sender === 'me') {
    row.appendChild(wrapper);

    row.appendChild(avatar);
    row.appendChild(wrapper);

  // 礼物盒手动点开
  if (msg.giftData && !msg.giftData.opened) {
    const box = row.querySelector('.msg-gift-box');
    if (box) {
      box.addEventListener('click', async () => {
        if (msg.giftData.opened) return;

        row.replaceWith(newEl);

  if (msg.giftPackData && !msg.giftPackData.opened) {
    const box = row.querySelector('.msg-giftpack-box');
    if (box) {
      box.addEventListener('click', async () => {
