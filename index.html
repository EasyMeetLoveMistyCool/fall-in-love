    content.querySelector('#choice-quiz-btn').addEventListener('click', async () => {
      const question = content.querySelector('#choice-quiz').value.trim();
      if (!question) return showToast('请输入问题');

      const pick = pool[Math.floor(Math.random() * pool.length)];

      myMsg.id = mid;
      appendMessage(myMsg);
      const taMsg = { sender: 'ta', content: pick, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };

      const today = new Date().toISOString().slice(0, 10);
      const symptoms = JSON.parse(localStorage.getItem('periodSymptoms') || '{}');
      if (!symptoms[today]) symptoms[today] = [];
      if (symptoms[today].includes(symptom)) {
        symptoms[today] = symptoms[today].filter(s => s !== symptom);
        btn.style.background = '';
      } else {
        symptoms[today].push(symptom);
        btn.style.background = 'rgba(255,143,176,0.5)';
      }

    });

function loadPeriodData(overlay) {
  const records = JSON.parse(localStorage.getItem('periodRecords') || '[]');
  const starts = records.filter(r => r.type === 'start').map(r => r.date).sort();
  let summary = '还没有记录';
  if (starts.length) {
    const lastStart = starts[starts.length - 1];
    summary = '上次开始：' + lastStart;
    if (starts.length >= 2) {
      const cycleDays = Math.round((new Date(starts[starts.length - 1]) - new Date(starts[starts.length - 2])) / 86400000);
      summary += ' ｜ 周期约 ' + cycleDays + ' 天';
      const nextDate = new Date(starts[starts.length - 1]);
      nextDate.setDate(nextDate.getDate() + cycleDays);
      summary += ' ｜ 预测下次：' + nextDate.toISOString().slice(0, 10);
    }
  }
  overlay.querySelector('#period-summary').textContent = summary;
  const calendar = overlay.querySelector('#period-calendar');
  calendar.innerHTML = '';
  starts.forEach(date => {
    const div = document.createElement('div');
    div.className = 'playback-date';
    div.textContent = date;
    div.style.background = 'rgba(255,143,176,0.5)';
    calendar.appendChild(div);
  });
  const list = overlay.querySelector('#period-list');
  list.innerHTML = '';
  records.slice().reverse().forEach(r => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${r.date} - ${r.type === 'start' ? '开始' : '结束'}</div>`;
    list.appendChild(div);
  });
}

function checkPeriodCare() {
  const today = new Date().toISOString().slice(0, 10);
  const records = JSON.parse(localStorage.getItem('periodRecords') || '[]');
  const starts = records.filter(r => r.type === 'start').map(r => r.date);
  const ends = records.filter(r => r.type === 'end').map(r => r.date);
  const lastStart = starts[starts.length - 1];
  const lastEnd = ends[ends.length - 1];
  if (!lastStart) return;
  const isActive = !lastEnd || (new Date(lastEnd) < new Date(lastStart)) || (new Date(today) <= new Date(lastStart) + 7 * 86400000);
  if (!isActive) return;
  const checked = JSON.parse(localStorage.getItem('periodCareChecked') || '{}');
  if (checked[today]) return;
  checked[today] = true;
  localStorage.setItem('periodCareChecked', JSON.stringify(checked));
  const cards = JSON.parse(localStorage.getItem('periodCards') || '[]');
  if (!cards.length) return;
  const card = cards[Math.floor(Math.random() * cards.length)];
  const msg = { sender: 'ta', content: card, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
  idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); sendNotification(card); });
}

    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${escapeHtml(w.text)} ${w.done ? '✅' : '⭐'}</div>
      <div class="card-ops"><button class="wish-done">✓</button><button class="wish-del">✕</button></div>`;
    div.querySelector('.wish-done').addEventListener('click', () => {
      wishes[tab][i].done = !wishes[tab][i].done;
      localStorage.setItem('wishes', JSON.stringify(wishes));
      loadWishList(overlay, tab);
    });
    div.querySelector('.wish-del').addEventListener('click', () => {
      wishes[tab].splice(i, 1);
      localStorage.setItem('wishes', JSON.stringify(wishes));
      loadWishList(overlay, tab);
    });
    list.appendChild(div);
  });
}

function openWishAddDialog(tab, panelOverlay) {
  const overlay = createModal(`
    <div class="big-input-title">添加心愿</div>
    <input type="text" id="wish-input" placeholder="心愿内容" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;">
    <button class="save-btn-center" id="save-wish" style="margin-top:14px;">保存</button>`);
  overlay.querySelector('#save-wish').addEventListener('click', () => {
    const text = overlay.querySelector('#wish-input').value.trim();
    if (!text) return showToast('请输入心愿');
    const wishes = JSON.parse(localStorage.getItem('wishes') || '{"me":[],"ta":[],"common":[]}');
    wishes[tab].push({ text, done: false });
    localStorage.setItem('wishes', JSON.stringify(wishes));
    overlay.remove();
    panelOverlay.remove();
    openWishPanel();
  });
}

function openWishCardsPanel() {
  const overlay = createModal(`
    <div class="big-input-title">TA心愿库</div>
    <textarea class="big-input-area" id="wish-cards-input" placeholder="一行一个心愿" style="min-height:150px;">${(settings.taWishLibrary || []).join('\n')}</textarea>
    <button class="save-btn-center" id="save-wish-cards" style="margin-top:12px;">保存</button>`);
  overlay.querySelector('#save-wish-cards').addEventListener('click', () => {
    const lines = overlay.querySelector('#wish-cards-input').value.trim().split('\n').map(s => s.trim()).filter(Boolean);
    settings.taWishLibrary = lines;
    saveSettings();
    showToast('TA心愿库已保存');
    overlay.remove();
  });
}
  // ========== 宠物 ==========
function openPetPanel() {
  const pet = JSON.parse(localStorage.getItem('petData') || 'null');
  if (!pet) {
    const overlay = createModal(`
      <div class="big-input-title">领养宠物</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px;">
        <button class="mini-btn pet-adopt-btn" data-type="cat">🐱 猫</button>
        <button class="mini-btn pet-adopt-btn" data-type="dog">🐶 狗</button>
        <button class="mini-btn pet-adopt-btn" data-type="rabbit">🐰 兔子</button>
        <button class="mini-btn pet-adopt-btn" data-type="hamster">🐹 仓鼠</button>
        <button class="mini-btn pet-adopt-btn" data-type="egg">🥚 蛋</button>
        <button class="mini-btn pet-adopt-btn" data-type="custom">上传图片</button>
      </div>
      <input type="text" id="pet-name-input" placeholder="宠物名字" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:12px;">
      <button class="save-btn-center" id="adopt-pet-btn">领养</button>`);
    let petType = 'cat';
    let petImage = '';
    overlay.querySelectorAll('.pet-adopt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        petType = btn.dataset.type;
        if (petType === 'custom') {
          const inp = document.createElement('input');
          inp.type = 'file';
          inp.accept = 'image/*';
          inp.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => { petImage = reader.result; btn.textContent = '已选择'; };
            reader.readAsDataURL(file);
          };
          inp.click();
        }
      });
    });
    overlay.querySelector('#adopt-pet-btn').addEventListener('click', () => {
      const name = overlay.querySelector('#pet-name-input').value.trim() || '小宠物';
      const typeEmoji = { cat: '🐱', dog: '🐶', rabbit: '🐰', hamster: '🐹', egg: '🥚', custom: '🐾' };
      const petData = {
        name,
        type: petType,
        emoji: typeEmoji[petType],
        image: petImage,
        hunger: 8,
        mood: 8,
        clean: 8,
        stage: petType === 'egg' ? 'egg' : 'young',
        bornDate: new Date().toISOString().slice(0, 10)
      };
      localStorage.setItem('petData', JSON.stringify(petData));
      overlay.remove();
      openPetPanel();
    });
    return;
  }
  const overlay = createModal(`
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-size:64px;">${pet.image ? `<img src="${pet.image}" style="width:64px;height:64px;border-radius:50%;object-fit:cover;">` : pet.emoji}</div>
      <div style="font-size:18px;font-weight:700;color:#4a3528;margin-top:8px;">${escapeHtml(pet.name)}</div>
      <div style="font-size:13px;color:#8b6f60;">${pet.stage === 'egg' ? '蛋' : pet.stage === 'young' ? '幼年' : '成年'}</div>
    </div>
    <div style="font-size:13px;color:#4a3528;margin-bottom:4px;">饥饿：${'█'.repeat(Math.round(pet.hunger))}${'░'.repeat(10 - Math.round(pet.hunger))} ${pet.hunger}/10</div>
    <div style="font-size:13px;color:#4a3528;margin-bottom:4px;">心情：${'█'.repeat(Math.round(pet.mood))}${'░'.repeat(10 - Math.round(pet.mood))} ${pet.mood}/10</div>
    <div style="font-size:13px;color:#4a3528;margin-bottom:12px;">清洁：${'█'.repeat(Math.round(pet.clean))}${'░'.repeat(10 - Math.round(pet.clean))} ${pet.clean}/10</div>
    <div style="display:flex;gap:8px;justify-content:center;">
      <button class="mini-btn pet-action-btn" data-action="feed">喂食</button>
      <button class="mini-btn pet-action-btn" data-action="play">陪玩</button>
      <button class="mini-btn pet-action-btn" data-action="clean">清洁</button>
    </div>`);
  overlay.querySelectorAll('.pet-action-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'feed') pet.hunger = Math.min(10, pet.hunger + 3);
      if (action === 'play') pet.mood = Math.min(10, pet.mood + 3);
      if (action === 'clean') pet.clean = Math.min(10, pet.clean + 4);
      localStorage.setItem('petData', JSON.stringify(pet));
      overlay.remove();
      openPetPanel();
    });
  });
}

function checkPetStatus() {
  const pet = JSON.parse(localStorage.getItem('petData') || 'null');
  if (!pet) return;
  pet.hunger = Math.max(0, pet.hunger - 1);
  pet.mood = Math.max(0, pet.mood - 1);
  pet.clean = Math.max(0, pet.clean - 1);
  if (pet.hunger < 3 || pet.mood < 3 || pet.clean < 3) {
    const msg = { sender: 'ta', content: pet.name + '状态不太好，记得照顾它', timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); sendNotification(msg.content); });
  }
  localStorage.setItem('petData', JSON.stringify(pet));
}
setInterval(checkPetStatus, 3600000);

// ========== 种植 ==========
function openPlantPanel() {
  const overlay = createModal(`
    <div class="heart-tabs">
      <button class="heart-tab active" id="plant-tab-flower">花</button>
      <button class="heart-tab" id="plant-tab-tree">树</button>
    </div>
    <div id="plant-content"></div>`);
  let currentTab = 'flower';
  loadPlantContent(overlay, currentTab);
  overlay.querySelector('#plant-tab-flower').addEventListener('click', () => { currentTab = 'flower'; switchPlantTab('flower', overlay); });
  overlay.querySelector('#plant-tab-tree').addEventListener('click', () => { currentTab = 'tree'; switchPlantTab('tree', overlay); });
}

function switchPlantTab(tab, overlay) {
  overlay.querySelectorAll('.heart-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'flower') overlay.querySelector('#plant-tab-flower').classList.add('active');
  if (tab === 'tree') overlay.querySelector('#plant-tab-tree').classList.add('active');
  loadPlantContent(overlay, tab);
}

function loadPlantContent(overlay, tab) {
  const plants = JSON.parse(localStorage.getItem('plantsData') || '{"flowers":[],"trees":[]}');
  const items = tab === 'flower' ? plants.flowers : plants.trees;
  const container = overlay.querySelector('#plant-content');
  container.innerHTML = '';
  if (!items.length) {
    container.innerHTML = `<div class="placeholder-tip">还没有${tab === 'flower' ? '花' : '树'}</div>
      <button class="upload-btn" id="plant-add-btn">种${tab === 'flower' ? '花' : '树'}</button>`;
    container.querySelector('#plant-add-btn').addEventListener('click', () => addPlant(tab, overlay));
    return;
  }
  items.forEach((p, i) => {
    const stageEmoji = p.type === 'flower' ? ['🌰','🌱','🌷','🌸'] : ['🌰','🌱','🌿','🪴','🌳'];
    const stageIdx = Math.min(p.stage, stageEmoji.length - 1);
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `
      <div class="card-text">
        <div style="font-size:32px;">${stageEmoji[stageIdx]}</div>
        <div style="font-size:13px;color:#4a3528;">第 ${p.day} 天</div>
        <div style="font-size:12px;color:#8b6f60;">水分${p.water}/10 养分${p.nutrient}/10 健康${p.health}/10</div>
      </div>
      <div class="card-ops">
        <button class="plant-action-btn" data-action="water" data-idx="${i}">浇水</button>
        <button class="plant-action-btn" data-action="fertilize" data-idx="${i}">施肥</button>
        <button class="plant-action-btn" data-action="catch" data-idx="${i}">捉虫</button>
      </div>`;
    div.querySelectorAll('.plant-action-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        const idx = Number(btn.dataset.idx);
        const plant = items[idx];
        if (action === 'water') plant.water = Math.min(10, plant.water + 3);
        if (action === 'fertilize') plant.nutrient = Math.min(10, plant.nutrient + 4);
        if (action === 'catch') plant.health = Math.min(10, plant.health + 3);
        plant.day += 1;
        if (plant.water >= 5 && plant.nutrient >= 5 && plant.health >= 5) {
          plant.stage = Math.min(plant.stage + 1, (plant.type === 'flower' ? 3 : 4));
        }
        items[idx] = plant;
        localStorage.setItem('plantsData', JSON.stringify(plants));
        loadPlantContent(overlay, tab);
      });
    });
    container.appendChild(div);
  });
}

function addPlant(type, panelOverlay) {
  const overlay = createModal(`
    <div class="big-input-title">种${type === 'flower' ? '花' : '树'}</div>
    <button class="upload-btn" id="plant-image-btn">上传图片（可选）</button>
    <button class="save-btn-center" id="save-plant" style="margin-top:12px;">种下</button>`);
  let plantImage = '';
  overlay.querySelector('#plant-image-btn').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => { plantImage = reader.result; overlay.querySelector('#plant-image-btn').textContent = '已选择'; };
      reader.readAsDataURL(file);
    };
    inp.click();
  });
  overlay.querySelector('#save-plant').addEventListener('click', () => {
    const plants = JSON.parse(localStorage.getItem('plantsData') || '{"flowers":[],"trees":[]}');
    const key = type === 'flower' ? 'flowers' : 'trees';
    plants[key].push({ type, stage: 0, day: 0, water: 5, nutrient: 5, health: 5, image: plantImage });
    localStorage.setItem('plantsData', JSON.stringify(plants));
    overlay.remove();
    panelOverlay.remove();
    openPlantPanel();
  });
}
  // ========== TA主动互动定时器 ==========
function scheduleTAInteract() {
  setInterval(async () => {
    if (Math.random() < settings.taInteractProb && !isReplying && !isArchiving) {
      await taInteract();
    }
  }, 2700000);
}

function scheduleTAMeNickChange() {
  setInterval(async () => {
    if (Math.random() < 0.04) {
      await taChangeMeNick();
    }
  }, 3600000);
}

async function init() {
  await openDB();
  await loadSettings();
  renderHeartLine();
  initBallPosition();
  renderMessages();
  scheduleTAActive();
  scheduleTAAutonomy();
  scheduleTAAvatarChange();
  scheduleTAGiveAvatar();
  scheduleTABGChange();
  scheduleTAInteract();
  scheduleTAMeNickChange();
  scheduleDailyBackup();
  scheduleTAVideoCall();
  scheduleTAMusicRequest();
  scheduleDateInvite();
  scheduleDateRecall();
  checkArchive();
  checkImportantDays();
  checkPeriodCare();
  checkPetStatus();
  animateBG();
  updateSendBtn();
  const input = document.getElementById('chat-input');
  input.addEventListener('focus', () => {
    setTimeout(() => {
      input.scrollIntoView({ behavior: 'smooth', block: 'end' });
    }, 300);
  });
  document.addEventListener('fullscreenchange', () => setTimeout(() => applyBG(), 200));
  document.addEventListener('webkitfullscreenchange', () => setTimeout(() => applyBG(), 200));
  window.addEventListener('resize', () => {
    const canvas = document.getElementById('bg-canvas');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    if (!settings.bgCurrent) {
      const ctx = canvas.getContext('2d');
      drawDefaultBG(ctx, canvas.width, canvas.height);
    }
  });
}

init();
