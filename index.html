<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>易遇♡夏雾凉</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: #f5e8e0;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

#app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.05);
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 20px 8px 20px;
  min-height: 56px;
  z-index: 2;
}

.top-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.3);
  border: 1.5px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}

#heart-line {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

#heart-line svg {
  display: block;
}

#heart-line .heart-fill {
  animation: heartbeat 2.4s ease-in-out infinite;
  transform-origin: center;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  10% { transform: scale(1.12); }
  20% { transform: scale(0.98); }
  30% { transform: scale(1.08); }
  45% { transform: scale(1); }
}

.heartbeat-path {
  stroke-dasharray: 6, 3;
  animation: dashmove 3s linear infinite;
}

@keyframes dashmove {
  to { stroke-dashoffset: -18; }
}

#heart-value-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 4px;
  font-size: 13px;
  color: #ff3b5c;
  font-weight: 600;
  text-shadow: 0 0 8px rgba(255, 59, 92, 0.35);
  z-index: 2;
}

#heart-value-box .empty-heart {
  font-size: 16px;
  color: #ff3b5c;
}

#messages-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 12px 8px 12px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

#pinned-area {
  display: flex;
  gap: 8px;
  padding: 6px 12px;
  overflow-x: auto;
  flex-shrink: 0;
  z-index: 2;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

#pinned-area::-webkit-scrollbar {
  display: none;
}

.pinned-item {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 16px;
  padding: 6px 12px;
  font-size: 12px;
  color: #6b4c3b;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}

.pinned-item .pin-icon {
  font-size: 10px;
}
  .message-row {
  display: flex;
  margin-bottom: 14px;
  animation: msgIn 0.25s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-row.me {
  justify-content: flex-end;
}

.message-row.ta {
  justify-content: flex-start;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
}

.message-row.me .msg-avatar {
  margin-left: 8px;
}

.message-row.ta .msg-avatar {
  margin-right: 8px;
}

.msg-content-wrapper {
  max-width: 68%;
  display: flex;
  flex-direction: column;
}

.message-row.me .msg-content-wrapper {
  align-items: flex-end;
}

.message-row.ta .msg-content-wrapper {
  align-items: flex-start;
}

.msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
  position: relative;
}

.message-row.me .msg-bubble {
  background: rgba(255, 150, 90, 0.55);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
  border-bottom-right-radius: 6px;
}

.message-row.ta .msg-bubble {
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: #4a3f3a;
  border-bottom-left-radius: 6px;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: rgba(80, 60, 50, 0.6);
  margin-top: 3px;
  padding: 0 4px;
}

.msg-read {
  color: rgba(120, 100, 90, 0.55);
}

.msg-pin-mark {
  color: #ff3b5c;
  font-size: 11px;
  margin-left: 4px;
}

.msg-heart-mark {
  color: #ff8fb0;
  font-size: 11px;
  margin-left: 4px;
}

.msg-quote {
  font-size: 12px;
  color: rgba(90, 70, 60, 0.6);
  margin-bottom: 4px;
  padding: 4px 8px;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  border-left: 2px solid #ff8fb0;
}

#typing-indicator {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 4px 16px 8px 16px;
  font-size: 13px;
  color: rgba(90, 70, 60, 0.7);
  z-index: 2;
  flex-shrink: 0;
}

#typing-indicator.show {
  display: flex;
}

.typing-dots {
  display: flex;
  gap: 3px;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(90, 70, 60, 0.6);
  animation: dotjump 1.2s infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotjump {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

#input-area {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px 18px 16px;
  z-index: 2;
  flex-shrink: 0;
}

#chat-input {
  flex: 1;
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 22px;
  padding: 10px 16px;
  font-size: 15px;
  color: #4a3f3a;
  outline: none;
  min-height: 42px;
  max-height: 120px;
}

#chat-input::placeholder {
  color: rgba(90, 70, 60, 0.45);
}

#send-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #6b4c3b;
  flex-shrink: 0;
  transition: all 0.2s;
}

#send-btn:active {
  transform: scale(0.9);
  background: rgba(255, 255, 255, 0.6);
}

#send-btn.send-mode {
  background: rgba(255, 120, 100, 0.7);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border-color: rgba(255, 255, 255, 0.6);
}
  #floating-ball {
  position: fixed;
  z-index: 10;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  animation: ballBreathe 3.2s ease-in-out infinite;
  overflow: hidden;
  touch-action: none;
}

#floating-ball img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}

@keyframes ballBreathe {
  0%, 100% { transform: scale(1); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
  50% { transform: scale(1.04); box-shadow: 0 6px 24px rgba(0,0,0,0.16); }
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(60, 40, 30, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-panel {
  background: rgba(255, 255, 255, 0.65);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  border-radius: 24px;
  padding: 20px;
  width: 90%;
  max-width: 420px;
  max-height: 75vh;
  overflow-y: auto;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  animation: panelIn 0.25s ease-out;
}

@keyframes panelIn {
  from { opacity: 0; transform: scale(0.92) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

#ball-panel {
  position: fixed;
  z-index: 30;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1.5px solid rgba(255, 255, 255, 0.75);
  border-radius: 28px;
  padding: 20px;
  width: 88%;
  max-width: 380px;
  max-height: 75vh;
  overflow-y: auto;
  box-shadow: 0 16px 50px rgba(0, 0, 0, 0.2);
  display: none;
  animation: panelIn 0.3s ease-out;
}

#ball-panel.show {
  display: block;
}

.ball-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px 8px;
}

.ball-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  border-radius: 18px;
  cursor: pointer;
  transition: background 0.2s;
}

.ball-item:active {
  background: rgba(0, 0, 0, 0.04);
}

.ball-item .icon-wrap {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.ball-item .icon-wrap svg {
  width: 24px;
  height: 24px;
}

.ball-item span {
  font-size: 12px;
  color: #4a3528;
  text-align: center;
  white-space: nowrap;
}

.plus-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 6px;
  border-radius: 18px;
  cursor: pointer;
  transition: background 0.2s;
  text-align: center;
}

.plus-item:active {
  background: rgba(0, 0, 0, 0.04);
}

.plus-item .icon-wrap {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.plus-item .icon-wrap svg {
  width: 24px;
  height: 24px;
}

.plus-item span {
  font-size: 12px;
  color: #4a3528;
  text-align: center;
  white-space: nowrap;
  display: block;
  width: 100%;
}
  .card-input-row input,
.card-search-row input {
  width: 100%;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 14px;
  color: #4a3f3a;
  outline: none;
  margin-bottom: 8px;
}

.card-actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.mini-btn {
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 14px;
  padding: 8px 14px;
  font-size: 13px;
  color: #4a3528;
  cursor: pointer;
  transition: all 0.2s;
}

.mini-btn:active {
  background: rgba(255, 255, 255, 0.7);
  transform: scale(0.96);
}

.card-count-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 13px;
  color: #4a3528;
}

.card-list {
  max-height: 40vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.card-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 14px;
  color: #4a3f3a;
  word-break: break-word;
}

.card-item .card-text {
  flex: 1;
}

.card-item .card-ops {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.card-ops button {
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  color: #8b6f60;
  padding: 2px;
}

.big-input-title {
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  color: #4a3528;
  margin-bottom: 16px;
}

.big-input-area {
  width: 100%;
  min-height: 160px;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 16px;
  padding: 14px;
  font-size: 15px;
  color: #4a3f3a;
  outline: none;
  resize: vertical;
}

.big-input-area::placeholder {
  color: rgba(90, 70, 60, 0.4);
}

.big-input-hint {
  text-align: center;
  font-size: 11px;

}

.save-btn-center {
  display: block;
  margin: 0 auto;
  background: rgba(255, 150, 100, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 18px;
  padding: 10px 24px;
  font-size: 15px;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
}

.save-btn-center:active {
  transform: scale(0.95);
  background: rgba(255, 150, 100, 0.8);
}

.about-section {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

.about-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  background: rgba(255, 255, 255, 0.3);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
}

.about-info {
  flex: 1;
}

.about-info .about-name {
  font-size: 16px;
  font-weight: 600;

}

.about-info .about-nick {
  font-size: 13px;
  color: #8b6f60;

}

.library-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 8px;
  max-height: 50vh;
  overflow-y: auto;
}

.lib-item {
  aspect-ratio: 1;
  border-radius: 14px;

  cursor: pointer;
  border: 2px solid transparent;
}

.lib-item.active {
  border-color: #ff7b5c;
}

.lib-item img {
  width: 100%;

}

.lib-item .lib-del {
  position: absolute;

  border-radius: 50%;
  background: rgba(0, 0, 0, 0.45);
  color: #fff;
  border: none;
  font-size: 10px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
}

.upload-btn {
  display: block;
  width: 100%;
  background: rgba(255, 255, 255, 0.4);
  border: 1.5px dashed rgba(255, 255, 255, 0.7);
  border-radius: 14px;
  padding: 12px;
  font-size: 14px;
  color: #4a3528;
  cursor: pointer;
  text-align: center;
  margin-top: 10px;
}
  .playback-dates {
  display: flex;

  padding: 4px 0 12px 0;

}

.playback-dates::-webkit-scrollbar {
  display: none;
}

.playback-date {
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 14px;
  padding: 8px 14px;
  font-size: 13px;
  color: #4a3528;

}

.playback-date.active {
  background: rgba(255, 150, 100, 0.55);

}

.playback-screen {
  min-height: 200px;

}

.playback-msg {
  margin-bottom: 10px;

}

.playback-msg .pm-sender {
  font-size: 11px;

}

.playback-msg .pm-bubble {
  display: inline-block;

  border-radius: 14px;

}

.playback-msg.me .pm-bubble {
  background: rgba(255, 150, 90, 0.5);

}

.playback-msg.ta .pm-bubble {
  background: rgba(255, 255, 255, 0.55);

}

.playback-controls {
  display: flex;

}

.heart-tabs {

}

.heart-tab {

  border: 1px solid rgba(255, 255, 255, 0.5);

  padding: 8px;

.heart-tab.active {

}

.heart-view-tabs {
  display: flex;

}

.heart-list {
  max-height: 40vh;
  overflow-y: auto;
}

.heart-grid-cards {
  display: grid;

  max-height: 40vh;
  overflow-y: auto;
}

.heart-card {
  background: rgba(255, 255, 255, 0.45);
  border-radius: 14px;
  padding: 12px;
  font-size: 13px;
  color: #4a3f3a;

.heart-item {
  background: rgba(255, 255, 255, 0.4);

.heart-item .heart-mark {

#toast {
  position: fixed;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(16px);

  padding: 10px 18px;
  font-size: 14px;

// ========== IndexedDB ==========
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('YiyuXiawuliang', 1);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('messages')) d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'key' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = (e) => reject(e);
  });
}

function idbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function idbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbClear(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function idbPutReturnId(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    const req = tx.objectStore(store).put(data);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function initBallPosition() {
  const ball = document.getElementById('floating-ball');

    ball.style.left = savedPos.x + 'px';
    ball.style.top = savedPos.y + 'px';
  } else {
    ball.style.right = '16px';
    ball.style.bottom = '80px';
  }
  let drag = false, startX = 0, startY = 0, origX = 0, origY = 0;
  ball.addEventListener('pointerdown', (e) => {
    drag = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = ball.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;
    ball.style.right = 'auto';
    ball.style.bottom = 'auto';
    ball.style.left = origX + 'px';
    ball.style.top = origY + 'px';
    ball.setPointerCapture(e.pointerId);
  });
  ball.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    let nx = origX + dx;
    let ny = origY + dy;
    nx = Math.max(4, Math.min(window.innerWidth - settings.ballSize - 4, nx));
    ny = Math.max(4, Math.min(window.innerHeight - settings.ballSize - 4, ny));
    ball.style.left = nx + 'px';
    ball.style.top = ny + 'px';
  });
  ball.addEventListener('pointerup', (e) => {
    if (!drag) return;
    drag = false;
    const rect = ball.getBoundingClientRect();
    localStorage.setItem('ballPos', JSON.stringify({ x: rect.left, y: rect.top }));
  });
}

function toggleBallPanel() {
  const panel = document.getElementById('ball-panel');
  panel.classList.toggle('show');
  if (panel.classList.contains('show')) {
    const ball = document.getElementById('floating-ball');
    const rect = ball.getBoundingClientRect();
    panel.style.left = Math.max(8, rect.left - 320) + 'px';
    panel.style.top = Math.max(8, rect.top - 400) + 'px';

}

function closeBallPanel() {

// ========== 字卡面板 ==========
let cardPageMode = false;

function openCardPanel() {
  const overlay = createModal(`
    <div class="card-search-row"><input type="text" id="card-search-btn" placeholder="搜索字卡" readonly></div>
    <div class="card-input-row"><input type="text" id="card-add-input" placeholder="添加新字卡" readonly></div>
    <div class="card-actions-row">
      <button class="mini-btn" id="card-file-import">文件导入</button>
      <button class="mini-btn" id="card-file-export">文件导出</button>
      <button class="mini-btn" id="card-batch-del">批量删除</button>
      <button class="mini-btn" id="card-recycle">回收站</button>
      <button class="mini-btn" id="card-dedupe">一键去重</button>
    </div>
    <div class="card-count-row">
      <span id="card-count-text">总数量：0 张</span>
      <button class="mini-btn" id="card-batch-confirm" style="display:none;">一键删除</button>
    </div>
    <div class="card-list" id="card-list"></div>`);
  const panel = overlay.querySelector('.modal-panel');
  loadCardList(panel);
  bindCardEvents(panel);
}

async function loadCardList(panel) {
  const cards = await idbGetAll('cards');
  const list = panel.querySelector('#card-list');
  const countText = panel.querySelector('#card-count-text');
  countText.textContent = `总数量：${cards.length} 张`;
  list.innerHTML = '';
  if (!cards.length) {
    list.innerHTML = '<div class="placeholder-tip">还没有字卡，快点添加吧</div>';
    return;
  }
  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.dataset.id = card.id;
    div.innerHTML = `
      <input type="checkbox" class="card-checkbox" style="display:none;">
      <div class="card-text">${escapeHtml(card.content)}</div>
      <div class="card-ops">
        <button class="card-edit" title="编辑">✎</button>
        <button class="card-delete" title="删除">✕</button>
      </div>`;
    list.appendChild(div);
  });
}

function bindCardEvents(panel) {
  const list = panel.querySelector('#card-list');
  const addInput = panel.querySelector('#card-add-input');
  const batchDelBtn = panel.querySelector('#card-batch-del');
  const batchConfirm = panel.querySelector('#card-batch-confirm');
  const recycleBtn = panel.querySelector('#card-recycle');
  const importBtn = panel.querySelector('#card-file-import');
  const exportBtn = panel.querySelector('#card-file-export');
  const searchBtn = panel.querySelector('#card-search-btn');
  const dedupeBtn = panel.querySelector('#card-dedupe');

  addInput.addEventListener('click', () => openAddCardDialog(panel));

  batchDelBtn.addEventListener('click', () => {
    cardPageMode = !cardPageMode;
    const boxes = panel.querySelectorAll('.card-checkbox');
    boxes.forEach(b => b.style.display = cardPageMode ? 'inline-block' : 'none');
    batchConfirm.style.display = cardPageMode ? 'inline-block' : 'none';
    if (!cardPageMode) boxes.forEach(b => b.checked = false);
  });

  batchConfirm.addEventListener('click', async () => {
    const checked = panel.querySelectorAll('.card-checkbox:checked');
    for (const box of checked) {
      const id = Number(box.closest('.card-item').dataset.id);
      const card = (await idbGetAll('cards')).find(c => c.id === id);
      if (card) {
        const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
        recycled.push(card);
        localStorage.setItem('recycledCards', JSON.stringify(recycled));
        await idbDelete('cards', id);
      }
    }
    cardPageMode = false;
    loadCardList(panel);
  });

  recycleBtn.addEventListener('click', () => openRecyclePanel(panel));

  dedupeBtn.addEventListener('click', async () => {
    const cards = await idbGetAll('cards');
    const seen = new Set();
    const duplicates = [];
    for (const card of cards) {
      if (seen.has(card.content)) {
        duplicates.push(card.content);
        await idbDelete('cards', card.id);
      } else {
        seen.add(card.content);
      }
    }
    if (duplicates.length) {
      const overlay = createModal(`
        <div class="big-input-title">去重完成</div>
        <div style="font-size:13px;color:#4a3528;margin-bottom:12px;">已去除 ${duplicates.length} 张重复字卡：</div>
        <div class="card-list" style="max-height:40vh;">${duplicates.map(d => `<div class="card-item"><div class="card-text">${escapeHtml(d)}</div></div>`).join('')}</div>`);
    } else {
      showToast('没有重复字卡');
    }
    loadCardList(panel);
  });

  importBtn.addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.txt,.json';
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      if (file.name.endsWith('.json')) {
        const data = JSON.parse(text);
        const cards = data.cards || data;
        for (const c of cards) {
          const content = typeof c === 'string' ? c : c.content;
          if (content) await idbPut('cards', { content });
        }
      } else {
        const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
        for (const line of lines) await idbPut('cards', { content: line });
      }
      loadCardList(panel);
    };
    inp.click();
  });

  exportBtn.addEventListener('click', () => {
    const fmtOverlay = createModal(`
      <div class="big-input-title">导出格式</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;">
        <button class="mini-btn" id="export-txt">TXT</button>
        <button class="mini-btn" id="export-json">JSON</button>
      </div>`);
    fmtOverlay.querySelector('#export-txt').addEventListener('click', async () => {
      const cards = await idbGetAll('cards');
      downloadFile(cards.map(c => c.content).join('\n'), '字卡导出.txt', 'text/plain');
      fmtOverlay.remove();
    });
    fmtOverlay.querySelector('#export-json').addEventListener('click', async () => {
      const cards = await idbGetAll('cards');
      downloadFile(JSON.stringify({ cards }, null, 2), '字卡导出.json', 'application/json');
      fmtOverlay.remove();
    });
  });

  searchBtn.addEventListener('click', () => openCardSearchPanel());

  list.addEventListener('click', async (e) => {
    const item = e.target.closest('.card-item');
    if (!item) return;
    const id = Number(item.dataset.id);
    const cards = await idbGetAll('cards');
    const card = cards.find(c => c.id === id);
    if (!card) return;
    if (e.target.closest('.card-delete')) {
      const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      recycled.push(card);
      localStorage.setItem('recycledCards', JSON.stringify(recycled));
      await idbDelete('cards', id);
      loadCardList(panel);
    } else if (e.target.closest('.card-edit')) {
      showEditCardDialog(id, card.content, panel);
    }
  });
}

function openAddCardDialog(panel) {
  const overlay = createModal(`
    <div class="big-input-title">字卡内容</div>
    <textarea class="big-input-area" id="add-card-area" placeholder="他会用这些字卡回复你哦"></textarea>
    <div class="big-input-hint">一行一条字卡，换行分隔</div>
    <button class="save-btn-center" id="save-add-card">保存字卡</button>`);
  overlay.querySelector('#save-add-card').addEventListener('click', async () => {
    const text = overlay.querySelector('#add-card-area').value.trim();
    if (!text) return;
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
    const existing = await idbGetAll('cards');
    const existingContents = existing.map(c => c.content);
    let added = 0;
    let skipped = 0;
    for (const line of lines) {
      if (existingContents.includes(line)) {
        skipped++;
      } else {
        await idbPut('cards', { content: line });
        existingContents.push(line);
        added++;
      }
    }
    if (skipped > 0) showToast(`有 ${skipped} 张已存在，已跳过`);
    if (added > 0) showToast(`成功添加 ${added} 张新字卡`);
    else if (added === 0 && skipped === 0) showToast('没有新字卡可添加');
    overlay.remove();
    loadCardList(panel);
  });
}

function showEditCardDialog(id, content, panel) {
  const overlay = createModal(`
    <div class="big-input-title">编辑字卡</div>
    <textarea class="big-input-area" id="edit-card-area">${escapeHtml(content)}</textarea>
    <button class="save-btn-center" id="save-edit-card" style="margin-top:12px;">保存</button>`);
  overlay.querySelector('#save-edit-card').addEventListener('click', async () => {
    const newContent = overlay.querySelector('#edit-card-area').value.trim();
    if (newContent) {
      await idbPut('cards', { id, content: newContent });
      if (panel) loadCardList(panel);
    }
    overlay.remove();
  });
}

function openRecyclePanel(panel) {
  const overlay = createModal(`
    <div class="big-input-title">回收站</div>
    <div class="card-count-row"><span id="recycle-count"></span></div>
    <div class="card-list" id="recycle-list"></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
      <button class="mini-btn" id="recycle-restore-all">全部恢复</button>
      <button class="mini-btn" id="recycle-clear-all">清空</button>
    </div>`);
  loadRecycleList(overlay, panel);
  overlay.querySelector('#recycle-restore-all').addEventListener('click', async () => {
    const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
    for (const c of recycled) await idbPut('cards', { content: c.content });
    localStorage.setItem('recycledCards', '[]');
    loadRecycleList(overlay, panel);
    if (panel) loadCardList(panel);
  });
  overlay.querySelector('#recycle-clear-all').addEventListener('click', () => {
    localStorage.setItem('recycledCards', '[]');
    loadRecycleList(overlay, panel);
  });
}

function loadRecycleList(overlay, panel) {
  const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
  overlay.querySelector('#recycle-count').textContent = `共 ${recycled.length} 张`;
  const list = overlay.querySelector('#recycle-list');
  list.innerHTML = '';
  if (!recycled.length) {
    list.innerHTML = '<div class="placeholder-tip">回收站是空的</div>';
    return;
  }
  recycled.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${escapeHtml(c.content)}</div>
      <div class="card-ops"><button class="recycle-restore">恢复</button><button class="recycle-forever">彻删</button></div>`;
    div.querySelector('.recycle-restore').addEventListener('click', async () => {
      const all = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      await idbPut('cards', { content: all[i].content });
      all.splice(i, 1);
      localStorage.setItem('recycledCards', JSON.stringify(all));
      loadRecycleList(overlay, panel);
    });
    div.querySelector('.recycle-forever').addEventListener('click', () => {
      const all = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      all.splice(i, 1);
      localStorage.setItem('recycledCards', JSON.stringify(all));
      loadRecycleList(overlay, panel);
    });
    list.appendChild(div);
  });
}

function openCardSearchPanel() {
  const overlay = createModal(`
    <div class="card-search-row"><input type="text" id="card-search-input" placeholder="请输入搜索内容..."></div>
    <div class="card-list" id="card-search-results"></div>`);
  const searchInput = overlay.querySelector('#card-search-input');
  const resultList = overlay.querySelector('#card-search-results');
  searchInput.addEventListener('input', async () => {
    const kw = searchInput.value.trim();
    const cards = await idbGetAll('cards');
    const filtered = kw ? cards.filter(c => c.content.includes(kw)) : cards;
    resultList.innerHTML = '';
    filtered.forEach(card => {
      const div = document.createElement('div');
      div.className = 'card-item';
      div.innerHTML = `<div class="card-text">${escapeHtml(card.content)}</div>
        <div class="card-ops"><button class="search-edit">✎</button><button class="search-del">✕</button></div>`;
      div.querySelector('.search-edit').addEventListener('click', () => showEditCardDialog(card.id, card.content, null));
      div.querySelector('.search-del').addEventListener('click', async () => {
        const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
        recycled.push(card);
        localStorage.setItem('recycledCards', JSON.stringify(recycled));
        await idbDelete('cards', card.id);
        searchInput.dispatchEvent(new Event('input'));
      });
      resultList.appendChild(div);
    });
  });
  searchInput.dispatchEvent(new Event('input'));
}

      <button class="mini-btn sticker-tpl" data-tpl="active">活跃</button>

      const files = Array.from(e.target.files);
      if (!files.length) return;
      const previewOverlay = createModal(`
        <div class="big-input-title">预览贴纸</div>
        <div style="font-size:13px;color:#4a3528;margin-bottom:12px;">共 ${files.length} 张</div>

        const reader = new FileReader();
        reader.onload = () => {
          const div = document.createElement('div');
          div.className = 'lib-item';
          div.innerHTML = `<img src="${reader.result}" alt="">`;
          grid.appendChild(div);
        };
        reader.readAsDataURL(file);
      });
      previewOverlay.querySelector('#confirm-sticker-upload').addEventListener('click', async () => {
        const lib = JSON.parse(localStorage.getItem('stickerLibrary') || '[]');
        let loaded = 0;
        for (const file of files) {
          const dataUrl = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(file);
          });
          if (dataUrl) {
            lib.push(dataUrl);
            loaded++;
            showToast(`正在添加 ${loaded}/${files.length}...`);
          }
        }
        localStorage.setItem('stickerLibrary', JSON.stringify(lib));
        previewOverlay.remove();
        overlay.remove();
        openStickerPanel();
        showToast(`已添加 ${loaded} 张贴纸`);
      });
    };
    inp.click();
  });
  overlay.querySelectorAll('.sticker-tpl').forEach(btn => {
    if (btn.dataset.tpl === settings.stickerTpl) {
      btn.style.background = 'rgba(255,150,100,0.6)';
      btn.style.color = '#fff';
    }
    btn.addEventListener('click', () => {
      settings.stickerTpl = btn.dataset.tpl;
      if (btn.dataset.tpl === 'rare') settings.stickerProb = 0.015;
      if (btn.dataset.tpl === 'daily') settings.stickerProb = 0.06;
      if (btn.dataset.tpl === 'active') settings.stickerProb = 0.17;
      saveSettings();
      overlay.remove();
      openStickerPanel();
    });
  });
}

function loadBGPanel(overlay) {
  const current = overlay.querySelector('#current-bg-preview');
  if (settings.bgCurrent) {

      }

    });

  });
  overlay.querySelector('#bg-upload-btn').addEventListener('click', () => {

      files.forEach(file => {

        reader.onload = () => {
          const lib = JSON.parse(localStorage.getItem('bgLibrary') || '[]');
          lib.push(reader.result);
          localStorage.setItem('bgLibrary', JSON.stringify(lib));
          loaded++;
          if (loaded === files.length) loadBGPanel(overlay);
        };
        reader.readAsDataURL(file);
      });
    };
    inp.click();
  });
}

function applyBG() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (settings.bgCurrent) {
    if (cachedBGImage && cachedBGImage.complete && cachedBGImage.naturalWidth > 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(cachedBGImage, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else {
      cachedBGImage = new Image();
      cachedBGImage.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 0.85;
        ctx.drawImage(cachedBGImage, 0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };
      cachedBGImage.onerror = () => drawDefaultBG(ctx, canvas.width, canvas.height);
      cachedBGImage.src = settings.bgCurrent;
    }
  } else {
    cachedBGImage = null;
    drawDefaultBG(ctx, canvas.width, canvas.height);
  }
}

function drawDefaultBG(ctx, w, h) {
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#fdd9c8');
  grad.addColorStop(0.4, '#f7d4e3');
  grad.addColorStop(0.7, '#dcd3f5');
  grad.addColorStop(1, '#c8ddf5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

function createMessageEl(msg) {
  const row = document.createElement('div');
  row.className = 'message-row ' + msg.sender;
  row.dataset.id = msg.id;
  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = msg.sender === 'me'
    ? (settings.meAvatar || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.5)"/><text x="16" y="21" text-anchor="middle" font-size="12" fill="rgba(90,70,60,0.6)">我</text></svg>'))
    : (settings.taAvatar || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.5)"/><text x="16" y="21" text-anchor="middle" font-size="12" fill="rgba(90,70,60,0.6)">TA</text></svg>'));
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-content-wrapper';
  if (msg.quoteContent) {
    const quote = document.createElement('div');
    quote.className = 'msg-quote';
    quote.textContent = '「' + msg.quoteContent + '」';
    wrapper.appendChild(quote);
  }
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (msg.imageData) {
    bubble.style.padding = '4px';
    bubble.style.background = 'transparent';
    bubble.style.border = 'none';
    bubble.innerHTML = `<img src="${msg.imageData}" style="max-width:200px;border-radius:12px;display:block;">`;
  } else if (msg.giftData) {
    bubble.style.background = 'transparent';
    bubble.style.border = 'none';
    bubble.innerHTML = `<div style="text-align:center;padding:8px;"><div style="font-size:36px;">${msg.giftData.icon || '🎁'}</div><div style="font-size:13px;color:#4a3528;margin-top:4px;">${escapeHtml(msg.giftData.name || '礼物')}</div><div style="font-size:11px;color:#ff3b5c;margin-top:2px;">-${msg.giftData.cost || 0}心意值</div></div>`;
  } else if (msg.interactData) {
    bubble.style.background = 'transparent';
    bubble.style.border = 'none';
    bubble.innerHTML = `<div style="text-align:center;padding:8px;font-size:14px;color:#4a3528;">${escapeHtml(msg.interactData.text || '')}</div>`;
  } else {
    bubble.textContent = msg.content;
  }
  wrapper.appendChild(bubble);
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  const timeSpan = document.createElement('span');
  const d = new Date(msg.timestamp);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  timeSpan.textContent = hh + ':' + mm;
  timeSpan.style.fontSize = '10px';
  timeSpan.style.color = 'rgba(120,100,90,0.5)';
  meta.appendChild(timeSpan);
  if (msg.sender === 'me' && msg.readTime) {
    const read = document.createElement('span');
    read.className = 'msg-read';
    read.textContent = '已读 ' + msg.readTime;
    meta.appendChild(read);
  }
  if (msg.pinned) {
    const pin = document.createElement('span');
    pin.className = 'msg-pin-mark';
    pin.textContent = '📌';
    meta.appendChild(pin);
  }
  if (msg.heartMark) {
    const heart = document.createElement('span');
    heart.className = 'msg-heart-mark';
    heart.textContent = '💗' + msg.heartMark;
    meta.appendChild(heart);
  }
  wrapper.appendChild(meta);
  if (msg.sender === 'me') {
    row.appendChild(wrapper);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(wrapper);
  }
  return row;
}

async function renderPinnedArea(msgs) {
  const area = document.getElementById('pinned-area');

      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });

}

function scheduleReadReceipt(msg) {
  const delayMs = Math.random() * (settings.readMax - settings.readMin) + settings.readMin;
  setTimeout(async () => {
    const msgs = await idbGetAll('messages');
    const target = msgs.find(m => m.id === msg.id);
    if (target && target.sender === 'me' && !target.readTime) {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      target.readTime = hh + ':' + mm;
      await idbPut('messages', target);
      const row = document.querySelector(`.message-row[data-id="${msg.id}"] .msg-meta`);
      if (row) {
        const read = document.createElement('span');
        read.className = 'msg-read';
        read.textContent = '已读 ' + target.readTime;
        row.appendChild(read);
      }
    }
  }, delayMs);
}

function resetStopTimer() {
  clearTimeout(stopTimer);
  const delayMs = Math.random() * (settings.replyMax * 1000 - settings.replyMin * 1000) + settings.replyMin * 1000;
  stopTimer = setTimeout(() => triggerTAReply(), delayMs);
}

async function triggerTAReply() {
  if (isReplying || isArchiving) return;
  const cards = await idbGetAll('cards');
  if (!cards.length) {
    showTyping(false);
    return;
  }
  isReplying = true;
  const recentMe = await getRecentMeCount();
  let replyCount = 1;
  if (recentMe >= 5) replyCount = 1 + Math.floor(Math.random() * 5);
  else if (recentMe >= 4) replyCount = 1 + Math.floor(Math.random() * 4);
  else if (recentMe >= 3) replyCount = 1 + Math.floor(Math.random() * 3);
  else if (recentMe >= 2) replyCount = 1 + Math.floor(Math.random() * 2);
  else replyCount = 1;
  if (Math.random() < 0.15) replyCount = Math.min(replyCount + 1, 5);
  replyQueue = [];
  const emojis = JSON.parse(localStorage.getItem('emojiLibrary') || '[]');
  for (let i = 0; i < replyCount; i++) {
    const stickers = JSON.parse(localStorage.getItem('stickerLibrary') || '[]');
    if (stickers.length && Math.random() < settings.stickerProb) {
      const sticker = stickers[Math.floor(Math.random() * stickers.length)];
      replyQueue.push({ type: 'sticker', content: sticker });
    } else {
      const card = cards[Math.floor(Math.random() * cards.length)];
      replyQueue.push({ type: 'text', content: card.content });
    }
  }
  showTyping(true);
  let waitTime = Math.random() * (settings.replyMax * 1000 - settings.replyMin * 1000) * 0.6 + settings.replyMin * 1000 * 0.4;
  await delay(waitTime);
  showTyping(false);
  for (let i = 0; i < replyQueue.length; i++) {
    const item = replyQueue[i];
    let content = item.type === 'sticker' ? '[贴纸]' : item.content;
    if (item.type === 'text') {
      if (settings.meNick && Math.random() < settings.nicknameProb) {
        content = settings.meNick + '，' + content;
      }
      if (emojis.length && Math.random() < settings.taEmojiProb) {
        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
        content = Math.random() < 0.5 ? emoji + ' ' + content : content + ' ' + emoji;
      }
    }
    const msg = {
      sender: 'ta',
      content,
      imageData: item.type === 'sticker' ? item.content : null,
      timestamp: Date.now(),
      pinned: false,
      pinBy: '',
      heartMark: null,
      quoteContent: null
    };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    appendMessage(msg);
    settings.heartValue += 1;
    await saveSettings();
    updateHeartValue();
    sendNotification(content);
    if (i < replyQueue.length - 1) await delay(600 + Math.random() * 1200);
  }
  replyQueue = [];
  isReplying = false;
}

async function getRecentMeCount() {
  const msgs = await idbGetAll('messages');
  let count = 0;
  for (let i = msgs.length - 1; i >= 0; i--) {
    if (msgs[i].sender === 'me') count++;
    else break;
  }
  return count;
}

function showTyping(show) {
  const el = document.getElementById('typing-indicator');
  if (show) el.classList.add('show');
  else el.classList.remove('show');
}

  setTimeout(async () => {
    const cards = await idbGetAll('cards');
    if (cards.length && !isReplying && !isArchiving) {
      const card = cards[Math.floor(Math.random() * cards.length)];
      let content = card.content;
      if (settings.meNick && Math.random() < settings.nicknameProb) content = settings.meNick + '，' + content;
      const emojis = JSON.parse(localStorage.getItem('emojiLibrary') || '[]');
      if (emojis.length && Math.random() < settings.taEmojiProb) {
        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
        content = Math.random() < 0.5 ? emoji + ' ' + content : content + ' ' + emoji;
      }
      const msg = { sender: 'ta', content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
      const id = await idbPutReturnId('messages', msg);
      msg.id = id;
      appendMessage(msg);
      settings.heartValue += 5;
      await saveSettings();
      updateHeartValue();
      sendNotification(content);
    }
    scheduleTAActive();
  }, next);
}

function sendNotification(content) {
  if ('Notification' in window && Notification.permission === 'granted') {
    new Notification('TA', { body: content });
  }
}

// ========== TA自主行为 ==========
function scheduleTAAutonomy() {
  setInterval(async () => {
    if (Math.random() < settings.autonomyProb) {
      const msgs = await idbGetAll('messages');
      if (msgs.length) {
        const target = msgs[Math.floor(Math.random() * msgs.length)];
        const action = Math.random();
        if (action < 0.25) {
          target.pinned = !target.pinned;
          target.pinBy = target.pinned ? 'ta' : '';
          await idbPut('messages', target);
          renderMessages();
        } else if (action < 0.45) {
          target.heartMark = target.heartMark ? null : 'TA收藏';
          await idbPut('messages', target);
          renderMessages();
        } else if (action < 0.55) {
          target.heartMark = target.heartMark ? null : 'TA指定';
          await idbPut('messages', target);
          renderMessages();
        } else if (action < 0.65) {
          await taQuoteMessage(target);
        } else if (action < 0.75) {
          await taChangeNick();
        } else if (action < 0.85) {
          await taChangeMeNick();
        } else if (action < 0.92) {
          await taSendSticker();
        } else {
          await taSendGift();
        }
      }
    }
  }, 600000);
}

async function taQuoteMessage(target) {
  const cards = await idbGetAll('cards');
  if (!cards.length) return;
  const card = cards[Math.floor(Math.random() * cards.length)];
  const msg = {
    sender: 'ta',
    content: card.content,
    timestamp: Date.now(),
    pinned: false,
    pinBy: '',
    heartMark: null,
    quoteContent: target.content
  };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
}

async function taChangeNick() {
  const nicks = settings.taNickLibrary || [];
  if (!nicks.length) return;
  const nick = nicks[Math.floor(Math.random() * nicks.length)];
  settings.taNick = nick;
  await saveSettings();
  const msg = { sender: 'ta', content: '我换了个昵称：' + nick, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
}

async function taChangeMeNick() {
  const nicks = settings.meNickLibrary || [];
  if (!nicks.length) return;
  const nick = nicks[Math.floor(Math.random() * nicks.length)];
  settings.meNick = nick;
  await saveSettings();
  const msg = { sender: 'ta', content: '我给你换了个昵称：' + nick, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
}

async function taSendSticker() {
  const stickers = JSON.parse(localStorage.getItem('stickerLibrary') || '[]');
  if (!stickers.length) return;
  const sticker = stickers[Math.floor(Math.random() * stickers.length)];
  const msg = { sender: 'ta', content: '[贴纸]', imageData: sticker, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
  sendNotification('TA发了一张贴纸');
}

async function taSendGift() {
  const gifts = JSON.parse(localStorage.getItem('giftLibrary') || '[]');
  if (!gifts.length) return;
  const gift = gifts[Math.floor(Math.random() * gifts.length)];
  if (settings.heartValue < gift.cost) return;
  settings.heartValue -= gift.cost;
  await saveSettings();
  updateHeartValue();
  const msg = { sender: 'ta', content: '[礼物]', giftData: gift, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
  const reply = { sender: 'ta', content: '送你一个小礼物', timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
  const rid = await idbPutReturnId('messages', reply);
  reply.id = rid;
  appendMessage(reply);
  sendNotification('TA送了你一个礼物');
}

async function taInteract() {
  const interactions = JSON.parse(localStorage.getItem('interactionLibrary') || '{}');
  const pool = [...(interactions.ta2me || []), ...(interactions.couple || [])];
  if (!pool.length) return;
  const item = pool[Math.floor(Math.random() * pool.length)];

  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
  sendNotification(item.text);
}

// ========== 拍照和相册 ==========
function openCamera() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => await sendImageMessage(reader.result);
    reader.readAsDataURL(file);
  };
  inp.click();
}

function openAlbum() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const reader = new FileReader();
      reader.onload = async () => await sendImageMessage(reader.result);
      reader.readAsDataURL(file);
    }
  };
  inp.click();
}

async function sendImageMessage(dataUrl) {
  if (isArchiving) return showToast('归档中，请稍候');
  const msg = {
    sender: 'me',
    content: '[图片]',
    imageData: dataUrl,
    timestamp: Date.now(),
    readTime: null,
    pinned: false,
    pinBy: '',
    heartMark: null,
    quoteContent: null
  };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
  settings.heartValue += 1;
  await saveSettings();
  updateHeartValue();
  scheduleReadReceipt(msg);
  resetStopTimer();
  checkBondDaily();
}

async function startQuiz() {
  const quizzes = JSON.parse(localStorage.getItem('quizLibrary') || '[]');
  const cards = await idbGetAll('cards');
  if (Math.random() < 0.5 && quizzes.length) {
    await startLibraryQuiz(quizzes);
  } else if (cards.length >= 2) {
    await startCardQuiz(cards);
  } else if (quizzes.length) {
    await startLibraryQuiz(quizzes);
  } else if (cards.length >= 2) {
    await startCardQuiz(cards);
  } else {
    showToast('先添加字卡或问答题库');
  }
}

async function startLibraryQuiz(quizzes) {
  const quiz = quizzes[Math.floor(Math.random() * quizzes.length)];
  let content = '💫 问答：' + quiz.question + '\n';
  quiz.options.forEach((opt, i) => { content += String.fromCharCode(65 + i) + '：' + opt + '\n'; });
  content += '（请回复选项字母或内容）';
  const msg = { sender: 'ta', content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
  pendingQuiz = { type: 'library', quiz };
}

async function startCardQuiz(cards) {
  const shuffled = [...cards].sort(() => Math.random() - 0.5).slice(0, Math.min(4, cards.length));
  let content = '💫 问答：TA现在最想对你说哪句话？\n';
  shuffled.forEach((card, i) => { content += String.fromCharCode(65 + i) + '：' + card.content + '\n'; });
  content += '（请回复选项字母或内容）';
  const msg = { sender: 'ta', content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
  pendingQuiz = { type: 'card', cards: shuffled };
}

async function checkQuizAnswer(myAnswer) {
  const quiz = pendingQuiz;
  if (!quiz) return;
  pendingQuiz = null;
  if (quiz.type === 'card') {
    const taPick = quiz.cards[Math.floor(Math.random() * quiz.cards.length)];
    const taMsg = { sender: 'ta', content: taPick.content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    const tid = await idbPutReturnId('messages', taMsg);
    taMsg.id = tid;
    appendMessage(taMsg);
    const matched = taPick.content.includes(myAnswer) || myAnswer.includes(taPick.content);
    let result;
    if (matched) { result = '💗 你们想的一样！心意值+10'; settings.heartValue += 10; }
    else { result = '🤍 你们的答案不一样。心意值+2'; settings.heartValue += 2; }
    await saveSettings();
    updateHeartValue();
    const resultMsg = { sender: 'ta', content: result, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
    const rid = await idbPutReturnId('messages', resultMsg);
    resultMsg.id = rid;
    appendMessage(resultMsg);
  } else if (quiz.type === 'library') {
    const q = quiz.quiz;
    const taPick = q.options[Math.floor(Math.random() * q.options.length)];
    const taMsg = { sender: 'ta', content: taPick, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    const tid = await idbPutReturnId('messages', taMsg);
    taMsg.id = tid;
    appendMessage(taMsg);
    const matched = taPick.includes(myAnswer) || myAnswer.includes(taPick);
    let result;
    if (matched) { result = '💗 你们想的一样！心意值+10'; settings.heartValue += 10; }
    else { result = '🤍 你们的答案不一样。心意值+2'; settings.heartValue += 2; }
    await saveSettings();
    updateHeartValue();
    const resultMsg = { sender: 'ta', content: result, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
    const rid = await idbPutReturnId('messages', resultMsg);
    resultMsg.id = rid;
    appendMessage(resultMsg);
  }
}

function checkReminders() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const currentTime = hh + ':' + mm;
  if (!settings.reminderTimes || !settings.reminderTimes.includes(currentTime)) return;
  const checked = JSON.parse(localStorage.getItem('reminderChecked') || '{}');
  const today = now.toDateString();
  if (checked[today + currentTime]) return;
  checked[today + currentTime] = true;
  localStorage.setItem('reminderChecked', JSON.stringify(checked));
  if (Math.random() > settings.reminderProb) return;
  if (!settings.reminderCards || !settings.reminderCards.length) return;
  const card = settings.reminderCards[Math.floor(Math.random() * settings.reminderCards.length)];
  const msg = { sender: 'ta', content: card, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
  idbPutReturnId('messages', msg).then(id => {
    msg.id = id;
    appendMessage(msg);
    sendNotification(card);
  });
}

function applySleepMode() {

function scheduleSleepMessages() {
  clearTimeout(accompanySleepTimer);
  const delayMs = 5 * 60000 + Math.random() * 10 * 60000;
  accompanySleepTimer = setTimeout(async () => {
    if (settings.accompanyMode !== 'sleep') return;
    const cards = await idbGetAll('cards');
    if (cards.length) {
      const card = cards[Math.floor(Math.random() * cards.length)];
      const msg = { sender: 'ta', content: card.content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
      const id = await idbPutReturnId('messages', msg);
      msg.id = id;
      appendMessage(msg);
    }
    scheduleSleepMessages();
  }, delayMs);
}

function scheduleDazeMessages() {
  clearTimeout(accompanyTimer);
  const delayMs = 10 * 60000 + Math.random() * 20 * 60000;
  accompanyTimer = setTimeout(async () => {
    if (settings.accompanyMode !== 'daze') return;
    const msgs = ['我在呢', '发呆中', '嗯', '在这'];
    const msg = { sender: 'ta', content: msgs[Math.floor(Math.random() * msgs.length)], timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    appendMessage(msg);
    scheduleDazeMessages();
  }, delayMs);
}

function scheduleCompanionMessages() {
  clearTimeout(accompanyTimer);
  const type = settings.accompanyType;
  let delayMs = 15 * 60000;
  if (type === 'clingy') delayMs = 5 * 60000;
  else if (type === 'quiet') delayMs = 30 * 60000;
  else if (type === 'night') {
    const h = new Date().getHours();
    if (h >= 22 || h < 4) delayMs = 5 * 60000;
    else delayMs = 30 * 60000;
  }
  accompanyTimer = setTimeout(async () => {
    if (settings.accompanyMode !== 'companion') return;
    const cards = await idbGetAll('cards');
    if (cards.length) {
      const card = cards[Math.floor(Math.random() * cards.length)];
      const msg = { sender: 'ta', content: card.content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
      const id = await idbPutReturnId('messages', msg);
      msg.id = id;
      appendMessage(msg);
    }
    scheduleCompanionMessages();
  }, delayMs);
}

async function getHeartMessages() {
  const msgs = await idbGetAll('messages');
  if (heartCurrentTab === 'ta') return msgs.filter(m => m.heartMark && m.heartMark.includes('TA'));
  return msgs.filter(m => m.heartMark && m.heartMark.includes('我'));
}

async function renderHeartContent(overlay) {
  const container = overlay.querySelector('#heart-content');
  const items = await getHeartMessages();
  container.innerHTML = '';
  if (!items.length) { container.innerHTML = '<div class="placeholder-tip">还没有心动瞬间</div>'; return; }
  if (heartCurrentView === 'timeline') {
    const list = document.createElement('div');
    list.className = 'heart-list';
    items.forEach(m => {
      const div = document.createElement('div');
      div.className = 'heart-item';
      div.innerHTML = `<span class="heart-mark">💗</span><span>${escapeHtml(m.content)}</span>`;
      list.appendChild(div);
    });
    container.appendChild(list);
  } else if (heartCurrentView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    items.forEach(m => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      card.textContent = m.content;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  } else if (heartCurrentView === 'play') {
    const screen = document.createElement('div');
    screen.className = 'playback-screen';
    container.appendChild(screen);
    let idx = 0;
    heartPlaybackTimer = setInterval(() => {
      if (idx >= items.length) { clearInterval(heartPlaybackTimer); return; }
      const m = items[idx];
      const pm = document.createElement('div');
      pm.className = 'playback-msg ' + m.sender;
      pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${escapeHtml(m.content)}</div>`;
      screen.appendChild(pm);
      screen.scrollTop = screen.scrollHeight;
      idx++;
    }, 1000);
  }
}

function switchPlaybackView(view, overlay) {
  playbackView = view;
  clearInterval(playbackTimer);
  overlay.querySelector('#playback-pause').style.display = view === 'play' ? 'inline-block' : 'none';
  overlay.querySelector('#playback-speed').style.display = view === 'play' ? 'inline-block' : 'none';
  if (currentPlayDate) renderPlaybackContent(currentPlayDate, overlay);
}

async function loadPlaybackDates(overlay) {
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const dates = Object.keys(archives).sort().reverse();
  const container = overlay.querySelector('#playback-dates');
  container.innerHTML = '';
  if (!dates.length) { container.innerHTML = '<div class="placeholder-tip">还没有归档记录</div>'; return; }
  dates.forEach(date => {
    const div = document.createElement('div');
    div.className = 'playback-date';
    div.textContent = date;
    div.addEventListener('click', () => {
      container.querySelectorAll('.playback-date').forEach(d => d.classList.remove('active'));
      div.classList.add('active');
      currentPlayDate = date;
      renderPlaybackContent(date, overlay);
    });
    container.appendChild(div);
  });
  container.querySelector('.playback-date').classList.add('active');
  currentPlayDate = dates[0];
  renderPlaybackContent(dates[0], overlay);
}

function renderPlaybackContent(dateStr, overlay) {
  clearInterval(playbackTimer);
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const msgs = archives[dateStr] || [];
  const screen = overlay.querySelector('#playback-screen');
  screen.innerHTML = '';
  if (!msgs.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有消息</div>'; return; }
  if (playbackView === 'timeline') {
    msgs.forEach(m => {
      const pm = document.createElement('div');
      pm.className = 'playback-msg ' + m.sender;
      let bubble = m.content;
      if (m.pinned) bubble = '📌 ' + bubble;
      if (m.heartMark) bubble = '💗 ' + bubble;
      pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${escapeHtml(bubble)}</div>`;
      screen.appendChild(pm);
    });
  } else if (playbackView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    msgs.forEach(m => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      card.textContent = m.content;
      grid.appendChild(card);
    });
    screen.appendChild(grid);
  } else if (playbackView === 'play') {
    startPlayback(overlay);
  }
}

function startPlayback(overlay) {
  clearInterval(playbackTimer);
  const screen = overlay.querySelector('#playback-screen');
  screen.innerHTML = '';
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const msgs = archives[currentPlayDate] || [];
  if (!msgs.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有消息</div>'; return; }
  let idx = 0;
  playbackTimer = setInterval(() => {
    if (idx >= msgs.length) { clearInterval(playbackTimer); overlay.querySelector('#playback-pause').textContent = '暂停'; return; }
    const m = msgs[idx];
    const pm = document.createElement('div');
    pm.className = 'playback-msg ' + m.sender;
    let bubble = m.content;
    if (m.pinned) bubble = '📌 ' + bubble;
    if (m.heartMark) bubble = '💗 ' + bubble;
    pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${escapeHtml(bubble)}</div>`;
    screen.appendChild(pm);
    screen.scrollTop = screen.scrollHeight;
    idx++;
  }, playbackSpeed);
}

async function loadVoiceDates(overlay) {

function renderVoiceContent(dateStr, overlay) {
  clearInterval(playbackTimer);
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const dayRecords = records.filter(r => r.date === dateStr);
  const screen = overlay.querySelector('#voice-screen');
  screen.innerHTML = '';
  if (!dayRecords.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有通话</div>'; return; }
  if (playbackView === 'timeline') {
    dayRecords.forEach(r => {
      const div = document.createElement('div');
      div.className = 'card-item';
      const mins = Math.floor(r.duration / 60);
      const secs = r.duration % 60;
      div.innerHTML = `<div class="card-text">通话 ${mins}分${secs}秒${r.answered ? '' : '（未接）'}</div>`;
      if (r.taSpeaks && r.taSpeaks.length) {
        r.taSpeaks.forEach(speak => {
          const pm = document.createElement('div');
          pm.className = 'playback-msg ta';
          pm.innerHTML = `<div class="pm-sender">TA</div><div class="pm-bubble">${escapeHtml(speak)}</div>`;
          screen.appendChild(pm);
        });
      }
      screen.appendChild(div);
    });
  } else if (playbackView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    dayRecords.forEach(r => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      card.textContent = `通话 ${Math.floor(r.duration / 60)}分${r.duration % 60}秒`;
      grid.appendChild(card);
      if (r.taSpeaks) {
        r.taSpeaks.forEach(speak => {
          const c2 = document.createElement('div');
          c2.className = 'heart-card';
          c2.textContent = speak;
          grid.appendChild(c2);
        });
      }
    });
    screen.appendChild(grid);
  } else if (playbackView === 'play') {
    startVoicePlayback(overlay);
  }
}

function startVoicePlayback(overlay) {
  clearInterval(playbackTimer);
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const dayRecords = records.filter(r => r.date === currentPlayDate);
  const allSpeaks = [];
  dayRecords.forEach(r => {
    if (r.taSpeaks) r.taSpeaks.forEach(s => allSpeaks.push(s));
  });
  const screen = overlay.querySelector('#voice-screen');
  screen.innerHTML = '';
  if (!allSpeaks.length) { screen.innerHTML = '<div class="placeholder-tip">TA没有说话</div>'; return; }
  let idx = 0;
  playbackTimer = setInterval(() => {
    if (idx >= allSpeaks.length) { clearInterval(playbackTimer); overlay.querySelector('#voice-pause').textContent = '暂停'; return; }
    const pm = document.createElement('div');
    pm.className = 'playback-msg ta';
    pm.innerHTML = `<div class="pm-sender">TA</div><div class="pm-bubble">${escapeHtml(allSpeaks[idx])}</div>`;
    screen.appendChild(pm);
    screen.scrollTop = screen.scrollHeight;
    idx++;
  }, playbackSpeed);
}

function checkImportantDays() {
  const days = JSON.parse(localStorage.getItem('importantDays') || '[]');
  const now = new Date();
  const today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  days.forEach(d => {
    let target = d.date;
    if (d.repeat) target = now.getFullYear() + '-' + d.date.slice(5);
    if (target === today) {
      const checked = JSON.parse(localStorage.getItem('importantChecked') || '{}');
      if (!checked[d.name + today]) {
        checked[d.name + today] = true;
        localStorage.setItem('importantChecked', JSON.stringify(checked));
        settings.heartValue += 50;
        saveSettings();
        updateHeartValue();
        const msg = { sender: 'ta', content: '今天是' + d.name + '，我一直记得。心意值+50', timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
        idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); sendNotification(msg.content); });
      }
    }
  });
}
setInterval(checkImportantDays, 3600000);

  });
  overlay.querySelector('#attendance-save').addEventListener('click', () => {
    const date = overlay.querySelector('#attendance-date').value;
    const hours = Number(overlay.querySelector('#attendance-hours').value);
    if (!date || !hours) return showToast('请填写日期和小时数');
    const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
    records[date] = { type: 'work', hours };
    localStorage.setItem('attendanceRecords', JSON.stringify(records));
    loadAttendance(overlay);
  });
  overlay.querySelector('#attendance-rest').addEventListener('click', () => {
    const date = overlay.querySelector('#attendance-date').value;
    if (!date) return showToast('请填写日期');
    const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
    records[date] = { type: 'rest', hours: 0 };
    localStorage.setItem('attendanceRecords', JSON.stringify(records));
    loadAttendance(overlay);
  });
}

function loadAttendance(overlay) {
  const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
  const dates = Object.keys(records).sort().reverse();
  const wage = settings.hourlyWage || 0;
  let totalHours = 0;
  let totalWage = 0;
  let monthHours = 0;
  let monthWage = 0;
  const monthPrefix = new Date().toISOString().slice(0, 7);
  dates.forEach(date => {
    const r = records[date];
    if (r.type === 'work') {
      totalHours += r.hours;
      totalWage += r.hours * wage;
      if (date.startsWith(monthPrefix)) { monthHours += r.hours; monthWage += r.hours * wage; }
    }
  });
  overlay.querySelector('#attendance-summary').textContent = `本月 ${monthHours} 小时 ${monthWage} 元 ｜ 累计 ${totalHours} 小时 ${totalWage} 元`;
  const list = overlay.querySelector('#attendance-list');
  list.innerHTML = '';
  if (!dates.length) { list.innerHTML = '<div class="placeholder-tip">还没有出勤记录</div>'; return; }
  dates.forEach(date => {
    const r = records[date];
    const div = document.createElement('div');
    div.className = 'card-item';
    if (r.type === 'rest') {
      div.innerHTML = `<div class="card-text">${date} - 休</div><div class="card-ops"><button class="attendance-del">✕</button></div>`;
    } else {
      div.innerHTML = `<div class="card-text">${date} - ${r.hours} 小时 - ${r.hours * wage} 元</div><div class="card-ops"><button class="attendance-del">✕</button></div>`;
    }
    div.querySelector('.attendance-del').addEventListener('click', () => {
      delete records[date];
      localStorage.setItem('attendanceRecords', JSON.stringify(records));
      loadAttendance(overlay);
    });
    list.appendChild(div);
  });
}

function getBondHeart() {
  const days = settings.bondDays;
  if (days === 0) return '🤍';
  if (days <= 3) return '💕';
  if (days <= 7) return '💗';
  if (days <= 14) return '💖';
  if (days <= 30) return '❤️';
  if (days <= 100) return '❤️‍🔥';
  return '💝';
}

function getBondLevel() {
  const days = settings.bondDays;
  if (days === 0) return '未开始';
  if (days <= 3) return '小爱心';
  if (days <= 7) return '爱心';
  if (days <= 14) return '粉爱心';
  if (days <= 30) return '红爱心';
  if (days <= 100) return '深红爱心';
  return '永恒爱心';
}

function getBondTodayStatus() {
  return settings.bondLastCheckDate === new Date().toDateString() ? '已聊 ✓' : '未聊';
}

function renderBondCalendar(overlay) {
  const records = JSON.parse(localStorage.getItem('bondRecords') || '{}');
  const dates = Object.keys(records).sort().reverse().slice(0, 30);

function checkBondDaily() {
  const today = new Date().toDateString();

  if (settings.bondLastCheckDate && settings.bondDays > 0) {
    const diff = Math.floor((new Date() - new Date(settings.bondLastCheckDate)) / 86400000);
    if (diff > 1) {
      if (settings.bondDays > 30 && !settings.bondProtectUsed) {
        settings.bondProtectUsed = true;
        showToast('熄灭保护已使用');
      } else {
        if (settings.bondDays > settings.bondHistoryBest) settings.bondHistoryBest = settings.bondDays;
        settings.bondDays = 0;
        settings.bondProtectUsed = false;
        showToast('羁绊熄灭了');
      }
    }
  }
  settings.bondDays += 1;
  settings.bondLastCheckDate = today;
  if (settings.bondDays > 0 && settings.bondDays % 7 === 0) {
    settings.heartValue += 20;
    showToast('连续' + settings.bondDays + '天，心意值+20');
  }
  const records = JSON.parse(localStorage.getItem('bondRecords') || '{}');
  records[today] = true;

  saveSettings();
  updateHeartValue();
}

// ========== 动态背景 ==========
let bgHue = 0;
function animateBG() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (settings.bgCurrent) {
    if (cachedBGImage && cachedBGImage.complete && cachedBGImage.naturalWidth > 0) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 0.85;
      ctx.drawImage(cachedBGImage, 0, 0, canvas.width, canvas.height);
      ctx.globalAlpha = 1;
      ctx.fillStyle = 'rgba(255,255,255,0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else if (!cachedBGImage) {
      cachedBGImage = new Image();
      cachedBGImage.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 0.85;
        ctx.drawImage(cachedBGImage, 0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };
      cachedBGImage.src = settings.bgCurrent;
    }
    requestAnimationFrame(animateBG);
    return;
  }
  cachedBGImage = null;
  bgHue = (bgHue + 0.15) % 360;
  const h1 = (bgHue + 15) % 360;
  const h2 = (bgHue + 45) % 360;
  const h3 = (bgHue + 75) % 360;
  const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  grad.addColorStop(0, `hsl(${h1}, 70%, 88%)`);
  grad.addColorStop(0.45, `hsl(${h2}, 65%, 86%)`);
  grad.addColorStop(1, `hsl(${h3}, 60%, 84%)`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  requestAnimationFrame(animateBG);
}

    const hh = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const mm = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    const timerEl = document.getElementById('video-timer');
    if (timerEl) timerEl.textContent = elapsed >= 3600 ? `${hh}:${mm}:${ss}` : `${mm}:${ss}`;
    const miniTimer = document.getElementById('video-mini-timer');
    if (miniTimer) miniTimer.textContent = elapsed >= 3600 ? `${hh}:${mm}:${ss}` : `${mm}:${ss}`;
    if (elapsed > 0 && elapsed % 60 === 0) {
      settings.heartValue += 5;
      saveSettings();
      updateHeartValue();

async function scheduleVideoTASpeak() {
  if (!videoCallActive || !videoCallAnswered) return;
  const cards = await idbGetAll('cards');
  if (!cards.length) return;
  const card = cards[Math.floor(Math.random() * cards.length)];
  let content = card.content;
  if (settings.meNick && Math.random() < settings.nicknameProb) content = settings.meNick + '，' + content;
  const speakingEl = document.getElementById('video-ta-speaking');
  if (speakingEl) speakingEl.textContent = content;
  if (videoCallMini) showDanmaku(content);
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const today = new Date().toISOString().slice(0, 10);
  let todayRecord = records.find(r => r.date === today && r.startTime === videoCallStartTime);
  if (todayRecord) {
    if (!todayRecord.taSpeaks) todayRecord.taSpeaks = [];
    todayRecord.taSpeaks.push(content);
    localStorage.setItem('videoRecords', JSON.stringify(records));
  }
  const delayMs = 3000 + Math.random() * 5000;
  setTimeout(() => {
    if (videoCallActive && videoCallAnswered) scheduleVideoTASpeak();
  }, delayMs);
}

  });
  videoCallMini.querySelector('#video-mini-close').addEventListener('click', () => hangupVideoCall());

function makeDraggable(el) {
  let drag = false, startX = 0, startY = 0, origX = 0, origY = 0;
  el.addEventListener('pointerdown', (e) => {
    drag = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = el.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag) return;
    el.style.left = (origX + e.clientX - startX) + 'px';
    el.style.top = (origY + e.clientY - startY) + 'px';
    el.style.right = 'auto';
  });
  el.addEventListener('pointerup', () => { drag = false; });
}

function restoreVideoCall() {
  if (videoCallMini) videoCallMini.remove();
  videoCallMini = null;
  videoCallOverlay = document.createElement('div');
  videoCallOverlay.className = 'video-call-overlay';
  updateVideoCallUI();
  document.body.appendChild(videoCallOverlay);
}

function hangupVideoCall(reason) {
  if (videoCallStartTime) {
    const duration = Math.floor((Date.now() - videoCallStartTime) / 1000);
    const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
    const today = new Date().toISOString().slice(0, 10);
    let record = records.find(r => r.date === today && r.startTime === videoCallStartTime);
    if (record) {
      record.duration = duration;
      record.answered = videoCallAnswered;
    } else {
      records.push({ type: videoCallType, date: today, startTime: videoCallStartTime, duration, answered: videoCallAnswered, taSpeaks: [] });
    }
    localStorage.setItem('videoRecords', JSON.stringify(records));
    if (videoCallAnswered) showToast(`通话结束，时长 ${Math.floor(duration / 60)}分${duration % 60}秒`);
  }
  if (reason) {
    const msg = { sender: 'ta', content: reason, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); });
  }
  clearInterval(videoCallTimer);
  videoCallActive = false;
  videoCallIncoming = false;
  videoCallAnswered = false;
  videoCallStartTime = 0;
  if (videoCallOverlay) { videoCallOverlay.remove(); videoCallOverlay = null; }
  if (videoCallMini) { videoCallMini.remove(); videoCallMini = null; }
}

function scheduleTAVideoCall() {

    if (Math.random() < 0.03 && !videoCallActive) incomingVideoCall();
  }, 3600000);
}

    else { audio.play(); musicPlayer.querySelector('#music-play-btn').textContent = '⏸'; }
    isPlaying = !isPlaying;
  });
  musicPlayer.querySelector('#music-next-btn').addEventListener('click', () => {
    audio.pause();
    musicIndex = (musicIndex + 1) % musicList.length;
    showMusicPlayer();
  });
  musicPlayer.querySelector('#music-prev-btn').addEventListener('click', () => {
    audio.pause();
    musicIndex = (musicIndex - 1 + musicList.length) % musicList.length;
    showMusicPlayer();
  });
  musicPlayer.querySelector('#music-close-btn').addEventListener('click', () => {
    audio.pause();
    musicPlayer.remove();
    musicPlayer = null;
  });
}

    content.querySelector('#choice-select-btn').addEventListener('click', async () => {
      const question = content.querySelector('#choice-question').value.trim();
      const options = content.querySelector('#choice-options').value.trim().split('\n').map(s => s.trim()).filter(Boolean);
      if (!question || options.length < 2) return showToast('请填写问题和至少两个选项');
      const pick = options[Math.floor(Math.random() * options.length)];
      const myMsg = { sender: 'me', content: question + '\n' + options.map((o, i) => String.fromCharCode(65 + i) + '：' + o).join('\n'), timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
      const mid = await idbPutReturnId('messages', myMsg);
      myMsg.id = mid;
      appendMessage(myMsg);

      myMsg.id = mid;

      const tid = await idbPutReturnId('messages', taMsg);
      taMsg.id = tid;
      appendMessage(taMsg);

  } else if (mode === 'quiz') {
    content.innerHTML = `
      <input type="text" id="choice-quiz" placeholder="你的问题，如：你在吃饭吗？" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:8px;">
