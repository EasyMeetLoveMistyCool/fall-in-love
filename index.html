  taAvatar.style.transition = '';
}

function scheduleSleepMessages() {
  clearTimeout(accompanySleepTimer);
  const delayMs = 5 * 60000 + Math.random() * 10 * 60000;
  accompanySleepTimer = setTimeout(async () => {
    if (settings.accompanyMode !== 'sleep') return;
    const cards = await idbGetAll('cards');
    if (cards.length) {
      const card = cards[Math.floor(Math.random() * cards.length)];
      const msg = { sender: 'ta', content: card.content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
      const id = await idbPutReturnId('messages', msg);
      msg.id = id;
      appendMessage(msg);
    }
    scheduleSleepMessages();
  }, delayMs);
}

function scheduleDazeMessages() {
  clearTimeout(accompanyTimer);
  const delayMs = 10 * 60000 + Math.random() * 20 * 60000;
  accompanyTimer = setTimeout(async () => {
    if (settings.accompanyMode !== 'daze') return;
    const msgs = ['我在呢', '发呆中', '嗯', '在这'];
    const msg = { sender: 'ta', content: msgs[Math.floor(Math.random() * msgs.length)], timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    appendMessage(msg);
    scheduleDazeMessages();
  }, delayMs);
}

function scheduleCompanionMessages() {
  clearTimeout(accompanyTimer);
  const type = settings.accompanyType;
  let delayMs = 15 * 60000;
  if (type === 'clingy') delayMs = 5 * 60000;
  else if (type === 'quiet') delayMs = 30 * 60000;
  else if (type === 'night') {
    const h = new Date().getHours();
    delayMs = (h >= 22 || h < 4) ? 5 * 60000 : 30 * 60000;
  }
  accompanyTimer = setTimeout(async () => {
    if (settings.accompanyMode !== 'companion') return;
    const cards = await idbGetAll('cards');
    if (cards.length) {
      const card = cards[Math.floor(Math.random() * cards.length)];
      const msg = { sender: 'ta', content: card.content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
      const id = await idbPutReturnId('messages', msg);
      msg.id = id;
      appendMessage(msg);
    }
    scheduleCompanionMessages();
  }, delayMs);
}

function scheduleTogetherMessages() {
  clearTimeout(accompanyTimer);
  accompanyTimer = setTimeout(async () => {
    if (settings.accompanyMode !== 'together') return;
    const cards = await idbGetAll('cards');
    const hints = ['这个好好看', '你看到没', '我陪你', '一起看', '好玩', '你也喜欢吗'];
    let content;
    if (cards.length && Math.random() < 0.5) content = cards[Math.floor(Math.random() * cards.length)].content;
    else content = hints[Math.floor(Math.random() * hints.length)];
    const msg = { sender: 'ta', content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    appendMessage(msg);
    scheduleTogetherMessages();
  }, 5 * 60000 + Math.random() * 10 * 60000);
}

function openAccompanyStats() {
  const overlay = createModal(`<div class="big-input-title">陪伴统计</div><div id="acc-stats-content"></div>`);

function switchHeartTab(tab, overlay) {
  heartCurrentTab = tab;
  overlay.querySelector('#heart-tab-ta').classList.toggle('active', tab === 'ta');
  overlay.querySelector('#heart-tab-me').classList.toggle('active', tab === 'me');
  renderHeartContent(overlay);
}

function switchHeartView(view, overlay) {
  heartCurrentView = view;
  clearInterval(heartPlaybackTimer);
  renderHeartContent(overlay);
}

async function getHeartMessages() {
  const msgs = await idbGetAll('messages');
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  let all = [...msgs];
  Object.keys(archives).forEach(date => { all = all.concat(archives[date] || []); });
  if (heartCurrentTab === 'ta') return all.filter(m => m.heartMark && m.heartMark.includes('TA'));
  return all.filter(m => m.heartMark && m.heartMark.includes('我'));
}

function heartMsgTypeLabel(m) {
  if (m.interactData) return '[互动]';
  if (m.giftData) return '[礼物]';
  if (m.imageData) return '[贴纸]';
  return '';
}

function heartMsgPlainText(m) {
  if (m.interactData) return m.interactData.text || '';
  if (m.giftData) return (m.giftData.icon || '🎁') + ' ' + (m.giftData.name || '礼物');
  if (m.imageData) return '[贴纸]';
  return m.content || '';
}

function computeHeartCounts(items) {
  const counts = {};
  items.forEach(m => {
    const key = heartMsgTypeLabel(m) + '|' + heartMsgPlainText(m);
    counts[key] = (counts[key] || 0) + 1;
  });
  return counts;
}

function heartDisplayText(m, counts) {
  const label = heartMsgTypeLabel(m);
  const text = heartMsgPlainText(m);
  const key = label + '|' + text;
  const n = counts[key] || 1;
  const prefix = label ? label + ' ' : '';
  if (m.imageData) {
    return { html: `<img src="${m.imageData}" style="max-width:120px;border-radius:10px;display:inline-block;"><span style="font-size:11px;color:#8b6f60;margin-left:4px;">×${n}</span>`, text: null };
  }
  return { html: null, text: prefix + text + (n > 1 ? '  ' + n : '') };
}

async function renderHeartContent(overlay) {
  const container = overlay.querySelector('#heart-content');
  const items = await getHeartMessages();
  container.innerHTML = '';
  if (!items.length) { container.innerHTML = '<div class="placeholder-tip">还没有心动瞬间</div>'; return; }
  const counts = computeHeartCounts(items);
  if (heartCurrentView === 'timeline') {
    const list = document.createElement('div');
    list.className = 'heart-list';
    items.forEach(m => {
      const div = document.createElement('div');
      div.className = 'heart-item';
      const disp = heartDisplayText(m, counts);
      if (disp.html) div.innerHTML = `<span class="heart-mark">💗</span><div>${disp.html}</div>`;
      else div.innerHTML = `<span class="heart-mark">💗</span><span>${escapeHtml(disp.text)}</span>`;
      list.appendChild(div);
    });
    container.appendChild(list);
  } else if (heartCurrentView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    items.forEach(m => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      const disp = heartDisplayText(m, counts);
      if (disp.html) card.innerHTML = disp.html;
      else card.textContent = disp.text;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  } else if (heartCurrentView === 'play') {
    const screen = document.createElement('div');
    screen.className = 'playback-screen';
    container.appendChild(screen);
    let idx = 0;
    clearInterval(heartPlaybackTimer);
    heartPlaybackTimer = setInterval(() => {
      if (idx >= items.length) { clearInterval(heartPlaybackTimer); return; }
      const m = items[idx];
      const disp = heartDisplayText(m, counts);
      screen.innerHTML = '';
      const pm = document.createElement('div');
      pm.className = 'playback-msg ' + m.sender;
      const inner = disp.html || escapeHtml(disp.text);
      pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${inner}</div>`;
      screen.appendChild(pm);
      idx++;
    }, 1000);
  }
}

// ========== 回忆放映室 ==========
function openPlaybackPanel() {
  const overlay = createModal(`
    <div class="playback-dates" id="playback-dates"></div>
    <div class="heart-view-tabs" style="margin-bottom:12px;">
      <button class="mini-btn" id="playback-view-timeline">时间线</button>
      <button class="mini-btn" id="playback-view-cards">卡片</button>
      <button class="mini-btn" id="playback-view-play">播放</button>
    </div>
    <div id="playback-screen" class="playback-screen"></div>
    <div class="playback-controls">
      <button class="mini-btn" id="playback-pause" style="display:none;">暂停</button>
      <button class="mini-btn" id="playback-speed" style="display:none;">速度 1x</button>
      <button class="mini-btn" id="playback-exit">退出</button>
    </div>`);
  overlay.querySelector('#playback-view-timeline').addEventListener('click', () => switchPlaybackView('timeline', overlay));
  overlay.querySelector('#playback-view-cards').addEventListener('click', () => switchPlaybackView('cards', overlay));
  overlay.querySelector('#playback-view-play').addEventListener('click', () => switchPlaybackView('play', overlay));
  overlay.querySelector('#playback-pause').addEventListener('click', () => {
    if (playbackTimer) { clearInterval(playbackTimer); playbackTimer = null; overlay.querySelector('#playback-pause').textContent = '继续'; }
    else { startPlayback(overlay); overlay.querySelector('#playback-pause').textContent = '暂停'; }
  });
  overlay.querySelector('#playback-speed').addEventListener('click', (e) => {
    if (playbackSpeed === 1000) playbackSpeed = 500;
    else if (playbackSpeed === 500) playbackSpeed = 2000;
    else playbackSpeed = 1000;
    e.target.textContent = '速度 ' + (playbackSpeed === 1000 ? '1x' : playbackSpeed === 500 ? '2x' : '0.5x');
    if (playbackTimer) { clearInterval(playbackTimer); startPlayback(overlay); }
  });
  overlay.querySelector('#playback-exit').addEventListener('click', () => { clearInterval(playbackTimer); overlay.remove(); });
  loadPlaybackDates(overlay);
}

function switchPlaybackView(view, overlay) {
  playbackView = view;
  clearInterval(playbackTimer);
  overlay.querySelector('#playback-pause').style.display = view === 'play' ? 'inline-block' : 'none';
  overlay.querySelector('#playback-speed').style.display = view === 'play' ? 'inline-block' : 'none';
  if (currentPlayDate) renderPlaybackContent(currentPlayDate, overlay);
}

async function loadPlaybackDates(overlay) {
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const dates = Object.keys(archives).sort().reverse();
  const container = overlay.querySelector('#playback-dates');
  container.innerHTML = '';
  if (!dates.length) { container.innerHTML = '<div class="placeholder-tip">还没有归档记录</div>'; return; }
  dates.forEach(date => {
    const div = document.createElement('div');
    div.className = 'playback-date';
    div.textContent = date;
    div.addEventListener('click', () => {
      container.querySelectorAll('.playback-date').forEach(d => d.classList.remove('active'));
      div.classList.add('active');
      currentPlayDate = date;
      renderPlaybackContent(date, overlay);
    });
    container.appendChild(div);
  });
  container.querySelector('.playback-date').classList.add('active');
  currentPlayDate = dates[0];
  renderPlaybackContent(dates[0], overlay);
}

function playbackMsgHTML(m) {
  if (m.imageData) return `<img src="${m.imageData}" style="max-width:200px;border-radius:12px;display:block;">`;
  if (m.giftData) return `<div class="msg-gift-card"><div class="msg-gift-icon">${m.giftData.icon || '🎁'}</div><div class="msg-gift-name">${escapeHtml(m.giftData.name || '礼物')}</div></div>`;
  if (m.interactData) return `<div class="msg-interact-text">${escapeHtml(m.interactData.text || '')}</div>`;
  return escapeHtml(m.content || '');
}

function renderPlaybackContent(dateStr, overlay) {
  clearInterval(playbackTimer);
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const msgs = archives[dateStr] || [];
  const screen = overlay.querySelector('#playback-screen');
  screen.innerHTML = '';
  if (!msgs.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有消息</div>'; return; }
  if (playbackView === 'timeline') {
    msgs.forEach(m => {
      const pm = document.createElement('div');
      pm.className = 'playback-msg ' + (m.sender || 'ta');
      let bubble = playbackMsgHTML(m);
      if (m.pinned) bubble = '📌 ' + bubble;
      if (m.heartMark) bubble = '💗 ' + bubble;
      pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${bubble}</div>`;
      screen.appendChild(pm);
    });
  } else if (playbackView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    msgs.forEach(m => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      card.innerHTML = playbackMsgHTML(m);
      grid.appendChild(card);
    });
    screen.appendChild(grid);
  } else if (playbackView === 'play') {
    startPlayback(overlay);
  }
}

function startPlayback(overlay) {
  clearInterval(playbackTimer);
  const screen = overlay.querySelector('#playback-screen');
  screen.innerHTML = '';
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  const msgs = archives[currentPlayDate] || [];
  if (!msgs.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有消息</div>'; return; }
  let idx = 0;
  playbackTimer = setInterval(() => {
    if (idx >= msgs.length) {
      clearInterval(playbackTimer);
      overlay.querySelector('#playback-pause').textContent = '暂停';
      screen.innerHTML = '<div class="placeholder-tip">播放结束</div>';
      return;
    }
    screen.innerHTML = '';
    const m = msgs[idx];
    const pm = document.createElement('div');
    pm.className = 'playback-msg ' + (m.sender || 'ta');
    let bubble = playbackMsgHTML(m);
    if (m.pinned) bubble = '📌 ' + bubble;
    if (m.heartMark) bubble = '💗 ' + bubble;
    pm.innerHTML = `<div class="pm-sender">${m.sender === 'me' ? settings.meName : settings.taName}</div><div class="pm-bubble">${bubble}</div>`;
    screen.appendChild(pm);
    idx++;
  }, playbackSpeed);
}

      container.querySelectorAll('.playback-date').forEach(d => d.classList.remove('active'));
      div.classList.add('active');
      currentPlayDate = date;
      renderVoiceContent(date, overlay);
    });
    container.appendChild(div);
  });
  container.querySelector('.playback-date').classList.add('active');
  currentPlayDate = dates[0];
  renderVoiceContent(dates[0], overlay);
}

function renderVoiceContent(dateStr, overlay) {
  clearInterval(playbackTimer);
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const dayRecords = records.filter(r => r.date === dateStr);
  const screen = overlay.querySelector('#voice-screen');
  screen.innerHTML = '';
  if (!dayRecords.length) { screen.innerHTML = '<div class="placeholder-tip">这一天没有通话</div>'; return; }
  if (playbackView === 'timeline') {
    dayRecords.forEach(r => {
      const div = document.createElement('div');
      div.className = 'card-item';
      const mins = Math.floor(r.duration / 60);
      const secs = r.duration % 60;
      const startStr = r.startTime ? new Date(r.startTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
      const endStr = r.endTime ? new Date(r.endTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '';
      div.innerHTML = `<div class="card-text">通话 ${mins}分${secs}秒${r.answered ? '' : '（未接）'}${startStr ? ' · ' + startStr + '开始' : ''}${endStr ? ' · ' + endStr + '结束' : ''}</div>`;
      screen.appendChild(div);
      if (r.taSpeaks && r.taSpeaks.length) {
        r.taSpeaks.forEach(speak => {
          const pm = document.createElement('div');
          pm.className = 'playback-msg ta';
          pm.innerHTML = `<div class="pm-sender">TA</div><div class="pm-bubble">${escapeHtml(speak)}</div>`;
          screen.appendChild(pm);
        });
      }
    });
  } else if (playbackView === 'cards') {
    const grid = document.createElement('div');
    grid.className = 'heart-grid-cards';
    dayRecords.forEach(r => {
      const card = document.createElement('div');
      card.className = 'heart-card';
      card.textContent = `通话 ${Math.floor(r.duration / 60)}分${r.duration % 60}秒`;
      grid.appendChild(card);
      if (r.taSpeaks) {
        r.taSpeaks.forEach(speak => {
          const c2 = document.createElement('div');
          c2.className = 'heart-card';
          c2.textContent = speak;
          grid.appendChild(c2);
        });
      }
    });
    screen.appendChild(grid);
  } else if (playbackView === 'play') {
    startVoicePlayback(overlay);
  }
}

function startVoicePlayback(overlay) {
  clearInterval(playbackTimer);
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const dayRecords = records.filter(r => r.date === currentPlayDate);
  const allSpeaks = [];
  dayRecords.forEach(r => { if (r.taSpeaks) r.taSpeaks.forEach(s => allSpeaks.push(s)); });
  const screen = overlay.querySelector('#voice-screen');
  screen.innerHTML = '';
  if (!allSpeaks.length) { screen.innerHTML = '<div class="placeholder-tip">TA没有说话</div>'; return; }
  let idx = 0;
  playbackTimer = setInterval(() => {
    if (idx >= allSpeaks.length) {
      clearInterval(playbackTimer);
      overlay.querySelector('#voice-pause').textContent = '暂停';
      screen.innerHTML = '<div class="placeholder-tip">播放结束</div>';
      return;
    }
    screen.innerHTML = '';
    const pm = document.createElement('div');
    pm.className = 'playback-msg ta';
    pm.innerHTML = `<div class="pm-sender">TA</div><div class="pm-bubble">${escapeHtml(allSpeaks[idx])}</div>`;
    screen.appendChild(pm);
    idx++;
  }, playbackSpeed);
}

function getCheckinHeartSVG(meChecked, taChecked) {
  const both = meChecked && taChecked;
  const none = !meChecked && !taChecked;
  const heartPath = "M20,34 C20,34 4,23 4,13 C4,7 9,3 14,3 C17,3 20,6 20,6 C20,6 23,3 26,3 C31,3 36,7 36,13 C36,23 20,34 20,34 Z";
  if (both) {
    return `<svg viewBox="0 0 40 38" width="40" height="38"><path d="${heartPath}" fill="rgba(255,143,176,0.85)" stroke="#ff6f9c" stroke-width="2"/></svg>`;
  }
  if (none) {
    return `<svg viewBox="0 0 40 38" width="40" height="38"><path d="${heartPath}" fill="rgba(255,255,255,0.6)" stroke="#ffb0c8" stroke-width="2"/></svg>`;
  }
  return `<svg viewBox="0 0 40 38" width="40" height="38">
    <defs>
      <linearGradient id="halfHeart" x1="0" y1="0" x2="1" y2="0">
        <stop offset="50%" stop-color="rgba(255,143,176,0.85)"/>
        <stop offset="50%" stop-color="rgba(255,255,255,0.6)"/>
      </linearGradient>
    </defs>
    <path d="${heartPath}" fill="url(#halfHeart)" stroke="#ffb0c8" stroke-width="2"/>
  </svg>`;
}

function getCheckinData() {
  const today = new Date().toDateString();
  const checkins = JSON.parse(localStorage.getItem('loverCheckins') || '{}');
  const meList = checkins.me || [];
  const taList = checkins.ta || [];
  return { meList, taList, meChecked: meList.includes(today), taChecked: taList.includes(today), checkins };
}

function getMyConsecutiveDays(meList) {
  if (!meList.length) return 0;
  const days = [...new Set(meList)].sort();
  let consecutive = 0;
  let prev = null;
  for (const d of days) {
    if (prev === null) consecutive = 1;
    else {
      const diff = Math.round((new Date(d) - new Date(prev)) / 86400000);
      consecutive = diff === 1 ? consecutive + 1 : 1;
    }
    prev = d;
  }
  const last = days[days.length - 1];
  const todayStr = new Date().toDateString();
  const yesterdayStr = new Date(Date.now() - 86400000).toDateString();
  if (last !== todayStr && last !== yesterdayStr) return 0;
  return consecutive;
}

function getCommonDays(meList, taList) {
  const meSet = new Set(meList);
  return [...new Set(taList)].filter(d => meSet.has(d)).length;
}

        const shuffled = [...cards].sort(() => Math.random() - 0.5);
        const content = shuffled.slice(0, count).map(c => c.content).join('\n');
        const stickers = await libGet('stickerLibrary');
        const images = [];
        const stickerCount = Math.min(3, stickers.length, 1 + Math.floor(Math.random() * 3));
        for (let i = 0; i < stickerCount; i++) images.push(stickers[Math.floor(Math.random() * stickers.length)].data);
        const d = new Date();
        const time = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
        const posts = JSON.parse(localStorage.getItem('loverPosts') || '[]');
        posts.push({
          name: settings.taName,
          avatar: settings.taAvatar || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="14" cy="14" r="13" fill="rgba(255,255,255,0.5)"/><text x="14" y="19" text-anchor="middle" font-size="10" fill="rgba(90,70,60,0.6)">TA</text></svg>'),
          time,
          content,
          images
        });
        localStorage.setItem('loverPosts', JSON.stringify(posts));
        const msg = { sender: 'ta', content: '📷 我发了一条动态', timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
        const id = await idbPutReturnId('messages', msg);
        msg.id = id;
        appendMessage(msg);
        sendNotification('TA发了一条动态');
      }
    }
    scheduleTALoverPost();
  }, next);
}

function scheduleTALoverCheckin() {
  setInterval(() => {
    if (Math.random() < 0.3) {
      const today = new Date().toDateString();
      const checkins = JSON.parse(localStorage.getItem('loverCheckins') || '{}');
      if (!checkins.ta) checkins.ta = [];
      if (!checkins.ta.includes(today)) {

function scheduleTACheckinRemind() {
  setInterval(() => {
    const now = new Date();
    const hh = String(now.getHours()).padStart(2, '0');
    const mm = String(now.getMinutes()).padStart(2, '0');
    if (hh + ':' + mm !== (settings.checkinRemindTime || '22:00')) return;
    const today = now.toDateString();
    const checkins = JSON.parse(localStorage.getItem('loverCheckins') || '{}');
    const meChecked = checkins.me && checkins.me.includes(today);
    if (meChecked) return;
    const checked = JSON.parse(localStorage.getItem('checkinRemindChecked') || '{}');
    if (checked[today]) return;
    checked[today] = true;
    localStorage.setItem('checkinRemindChecked', JSON.stringify(checked));
    const msg = { sender: 'ta', content: '今天还没打卡哦', timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); sendNotification('今天还没打卡哦'); });
  }, 60000);
}

async function loadStats(content) {
  const msgs = await idbGetAll('messages');
  const archives = JSON.parse(localStorage.getItem('archives') || '{}');
  let allMsgs = [...msgs];
  Object.keys(archives).forEach(d => { allMsgs = allMsgs.concat(archives[d] || []); });
  const myMsgs = allMsgs.filter(m => m.sender === 'me');
  const taMsgs = allMsgs.filter(m => m.sender === 'ta');
  const letters = JSON.parse(localStorage.getItem('letters') || '{"received":[],"sent":[]}');
  const notes = JSON.parse(localStorage.getItem('notes') || '{"ta":[],"me":[]}');
  const posts = JSON.parse(localStorage.getItem('loverPosts') || '[]');
  const videoRecords = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const totalCallDuration = videoRecords.reduce((a, r) => a + (r.duration || 0), 0);
  const answeredRecords = videoRecords.filter(r => r.answered);
  const longestCall = answeredRecords.length ? Math.max(...answeredRecords.map(r => r.duration || 0)) : 0;
  const avgCall = answeredRecords.length ? Math.round(totalCallDuration / answeredRecords.length) : 0;
  const missedCalls = videoRecords.filter(r => !r.answered).length;
  const totalCallMins = Math.floor(totalCallDuration / 60);
  const totalCallHours = Math.floor(totalCallMins / 60);
  const callDurationStr = totalCallHours > 0 ? `${totalCallHours}小时${totalCallMins % 60}分` : `${totalCallMins}分${totalCallDuration % 60}秒`;
  const longestMins = Math.floor(longestCall / 60);
  const avgMins = Math.floor(avgCall / 60);
  const myPosts = posts.filter(p => p.name === settings.meName).length;
  const taPosts = posts.filter(p => p.name === settings.taName).length;
  const checkins = JSON.parse(localStorage.getItem('loverCheckins') || '{}');
  const myCheckins = checkins.me ? [...new Set(checkins.me)].length : 0;
  const taCheckins = checkins.ta ? [...new Set(checkins.ta)].length : 0;
  const commonCheckins = getCommonDays(checkins.me || [], checkins.ta || []);
  const myWords = getTopWords(myMsgs.map(m => m.content), 20);
  const taWords = getTopWords(taMsgs.map(m => m.content), 20);
  content.innerHTML = `
    <div class="big-input-title">数据统计</div>
    <div class="heart-item"><span class="heart-mark">💬</span><span>总消息 ${allMsgs.length} 条 ｜ 我发的 ${myMsgs.length} 条 ｜ TA发的 ${taMsgs.length} 条</span></div>
    <div class="heart-item"><span class="heart-mark">✉</span><span>TA来信 ${letters.received.length} 封 ｜ 你寄出 ${letters.sent.length} 封</span></div>
    <div class="heart-item"><span class="heart-mark">📝</span><span>TA留言 ${notes.ta.length} 条 ｜ 你的留言 ${notes.me.length} 条</span></div>
    <div class="heart-item"><span class="heart-mark">📢</span><span>TA动态 ${taPosts} 条 ｜ 你动态 ${myPosts} 条</span></div>
    <div class="heart-item"><span class="heart-mark">📞</span><span>通话 ${videoRecords.length} 次 ｜ 总时长 ${callDurationStr} ｜ 最长 ${longestMins}分${longestCall % 60}秒 ｜ 平均 ${avgMins}分${avgCall % 60}秒 ｜ 未接 ${missedCalls} 次</span></div>
    <div class="heart-item"><span class="heart-mark">♡</span><span>打卡 我 ${myCheckins} 天 ｜ TA ${taCheckins} 天 ｜ 共同 ${commonCheckins} 天</span></div>
    <div class="heart-item"><span class="heart-mark">💗</span><span>爱意值 当前 ${settings.heartValue}</span></div>
    <div class="big-input-title" style="margin-top:16px;">我的高频词汇</div>
    <div class="heart-list">${myWords.map(w => `<div class="heart-item"><span class="heart-mark">${w.count}</span><span>${escapeHtml(w.word)}</span></div>`).join('') || '<div class="placeholder-tip">暂无数据</div>'}</div>
    <div class="big-input-title" style="margin-top:16px;">TA的高频词汇</div>
    <div class="heart-list">${taWords.map(w => `<div class="heart-item"><span class="heart-mark">${w.count}</span><span>${escapeHtml(w.word)}</span></div>`).join('') || '<div class="placeholder-tip">暂无数据</div>'}</div>`;
}

function getTopWords(texts, topN) {
  const wordCount = {};
  texts.forEach(text => {
    if (!text) return;
    const words = text.split(/[\s，。！？、,.!?；;：:（）()\[\]【】'"“”"']+/);
    words.forEach(w => { if (w.length >= 2) wordCount[w] = (wordCount[w] || 0) + 1; });
  });
  return Object.entries(wordCount).sort((a, b) => b[1] - a[1]).slice(0, topN).map(([word, count]) => ({ word, count }));
}

async function loadStorageInfo(content) {
  try {
    if (navigator.storage && navigator.storage.estimate) {
      const estimate = await navigator.storage.estimate();
      const usedMB = (estimate.usage / 1024 / 1024).toFixed(2);
      const totalMB = (estimate.quota / 1024 / 1024).toFixed(2);
      content.querySelector('#data-storage-info').textContent = `设备总存储：${totalMB}MB ｜ 网站已用：${usedMB}MB`;
      if (estimate.usage / estimate.quota > 0.8) showToast('存储空间快满了，请及时备份和清理');
    } else {
      content.querySelector('#data-storage-info').textContent = '无法检测存储空间';

async function restoreFromBackup(data) {
  if (data.settings) {
    settings = { ...DEFAULT_SETTINGS, ...data.settings };
    if (!settings.worlds || !settings.worlds.length) settings.worlds = JSON.parse(JSON.stringify(DEFAULT_SETTINGS.worlds));
    await saveSettings();
  }
  if (data.cards) {
    await idbClear('cards');
    for (const card of data.cards) await idbPut('cards', { content: card.content });
  }
  if (data.messages) {
    await idbClear('messages');
    for (const msg of data.messages) await idbPut('messages', msg);
  }
  if (data.media) {
    await idbClear('media');
    for (const m of data.media) await idbPut('media', m);
  }
  localStorage.clear();
  const lsKeys = ['archives', 'avatarLibrary', 'bgLibrary', 'stickerLibrary', 'giftLibrary', 'interactionLibrary', 'quizLibrary', 'emojiLibrary', 'musicList', 'recycledCards', 'importantDays', 'attendanceRecords', 'bondRecords', 'periodRecords', 'periodCards', 'dateRecords', 'dateCards', 'petDataList', 'plantsData', 'wishes', 'videoRecords', 'letters', 'notes', 'loverPosts', 'loverCheckins', 'togetherLibrary', 'accountRecords', 'piggyData'];
  lsKeys.forEach(k => { if (data[k] !== undefined) localStorage.setItem(k, JSON.stringify(data[k])); });
  if (data.memo) localStorage.setItem('memo', data.memo);
  localStorage.setItem('mediaMigratedV4', '1');
}

function loadAccountData(overlay) {
  const records = JSON.parse(localStorage.getItem('accountRecords') || '[]');

  const monthRecords = records.filter(r => r.date.startsWith(monthPrefix));

  const monthExpense = monthRecords.filter(r => r.type === 'expense').reduce((a, r) => a + r.amount, 0);
  overlay.querySelector('#account-summary').textContent = `本月收入 ${monthIncome} 元 ｜ 本月支出 ${monthExpense} 元 ｜ 结余 ${monthIncome - monthExpense} 元`;
  const list = overlay.querySelector('#account-list');
  list.innerHTML = '';
  if (!records.length) { list.innerHTML = '<div class="placeholder-tip">还没有记录</div>'; return; }
  records.slice().reverse().forEach((r) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    const noteStr = r.note ? ' ' + escapeHtml(r.note) : '';
    div.innerHTML = `<div class="card-text">${r.date} ${escapeHtml(r.cat)}${noteStr} ${r.type === 'income' ? '+' : '-'}${r.amount} 元</div>

    div.querySelector('.account-del').addEventListener('click', () => {
      records.splice(records.indexOf(r), 1);
      localStorage.setItem('accountRecords', JSON.stringify(records));
      loadAccountData(overlay);
    });
    list.appendChild(div);
  });
}

async function showMusicPlayer() {
  const song = musicList[musicIndex];
  if (!song) return;
  if (song.type === 'platform' && song.platform === 'netease') {
    showNeteasePlayer(song);
    return;
  }
  if (musicPlayer) musicPlayer.remove();
  musicPlayer = document.createElement('div');
  musicPlayer.className = 'music-mini-player';
  musicPlayer.innerHTML = `
    <span class="music-name" id="music-player-name">${escapeHtml(song.name)}</span>
    <button id="music-prev-btn">${PREV_ICON}</button>
    <button id="music-play-btn">${PLAY_ICON}</button>
    <button id="music-next-btn">${NEXT_ICON}</button>
    <button id="music-close-btn">✕</button>`;
  document.body.appendChild(musicPlayer);
  makeDraggable(musicPlayer);
  let audio = null;
  let isPlaying = false;
  if (song.musicKey) {
    const data = await resolveMedia(song.musicKey);
    if (data) audio = new Audio(data);
  }
  if (audio) {
    audio.play().then(() => { isPlaying = true; musicPlayer.querySelector('#music-play-btn').innerHTML = PAUSE_ICON; }).catch(() => {});
    audio.addEventListener('ended', () => { musicIndex = (musicIndex + 1) % musicList.length; showMusicPlayer(); });
  }
  musicPlayer.querySelector('#music-play-btn').addEventListener('click', () => {
    if (!audio) return showToast('音频加载中');
    if (isPlaying) { audio.pause(); musicPlayer.querySelector('#music-play-btn').innerHTML = PLAY_ICON; }
    else { audio.play(); musicPlayer.querySelector('#music-play-btn').innerHTML = PAUSE_ICON; }
    isPlaying = !isPlaying;
  });
  musicPlayer.querySelector('#music-next-btn').addEventListener('click', () => {
    if (audio) audio.pause();
    musicIndex = (musicIndex + 1) % musicList.length;
    showMusicPlayer();
  });
  musicPlayer.querySelector('#music-prev-btn').addEventListener('click', () => {
    if (audio) audio.pause();
    musicIndex = (musicIndex - 1 + musicList.length) % musicList.length;
    showMusicPlayer();
  });
  musicPlayer.querySelector('#music-close-btn').addEventListener('click', () => {
    if (audio) audio.pause();
    musicPlayer.remove();
    musicPlayer = null;
  });
}

function showNeteasePlayer(song) {
  if (musicPlayer) { musicPlayer.remove(); musicPlayer = null; }
  const overlay = createModal(`

    </div>`, 'netease-modal-panel');
  const panel = overlay.querySelector('.modal-panel');
  overlay.querySelector('#netease-close').addEventListener('click', () => overlay.remove());
  const bar = overlay.querySelector('#netease-drag-bar');

}

function makeModalDraggable(overlay, panel, handle) {
  let drag = false, startX = 0, startY = 0, origX = 0, origY = 0;
  handle.style.touchAction = 'none';
  handle.addEventListener('pointerdown', (e) => {
    drag = true;
    startX = e.clientX;
    startY = e.clientY;
    const rect = panel.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;
    panel.style.position = 'fixed';
    panel.style.left = origX + 'px';
    panel.style.top = origY + 'px';
    panel.style.margin = '0';
    overlay.style.alignItems = 'flex-start';
    overlay.style.justifyContent = 'flex-start';
    panel.style.transform = 'none';
    handle.classList.add('dragging');
    handle.setPointerCapture(e.pointerId);
  });
  handle.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const nx = origX + e.clientX - startX;
    const ny = origY + e.clientY - startY;
    const maxX = window.innerWidth - panel.offsetWidth - 4;
    const maxY = window.innerHeight - panel.offsetHeight - 4;
    panel.style.left = Math.max(4, Math.min(maxX, nx)) + 'px';
    panel.style.top = Math.max(4, Math.min(maxY, ny)) + 'px';
  });
  handle.addEventListener('pointerup', () => {
    drag = false;
    handle.classList.remove('dragging');
  });
}

      msg.id = id;

      <input type="text" id="choice-image-text" placeholder="想说的话，如：帮我选一张最好看的" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:8px;">
      <button class="upload-btn" id="choice-image-btn">上传图片</button>
      <div class="library-grid" id="choice-image-grid"></div>
      <button class="save-btn-center" id="choice-image-select-btn" style="margin-top:12px;">让TA选</button>`;
    let images = [];
    content.querySelector('#choice-image-btn').addEventListener('click', () => {
      const inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = 'image/*';
      inp.multiple = true;
      inp.onchange = (e) => {
        const files = Array.from(e.target.files);
        files.forEach(file => {
          const reader = new FileReader();
          reader.onload = () => {
            images.push(reader.result);
            const grid = content.querySelector('#choice-image-grid');
            const div = document.createElement('div');
            div.className = 'lib-item';
            div.innerHTML = `<img src="${reader.result}" alt="">`;
            grid.appendChild(div);
          };
          reader.readAsDataURL(file);
        });
      };
      inp.click();
    });
    content.querySelector('#choice-image-select-btn').addEventListener('click', async () => {
      if (!images.length) return showToast('请上传图片');
      const text = content.querySelector('#choice-image-text').value.trim();
      if (text) {
        const textMsg = { sender: 'me', content: text, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
        const tid = await idbPutReturnId('messages', textMsg);
        textMsg.id = tid;
        appendMessage(textMsg);
      }
      const pickIdx = Math.floor(Math.random() * images.length);
      const pick = images[pickIdx];
      for (const img of images) {
        const msg = { sender: 'me', content: '[图片]', imageData: img, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
        const id = await idbPutReturnId('messages', msg);
        msg.id = id;
        appendMessage(msg);
      }
      const taMsg = { sender: 'ta', content: '我帮你选了第' + (pickIdx + 1) + '张', timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
      const tid = await idbPutReturnId('messages', taMsg);
      taMsg.id = tid;
      appendMessage(taMsg);
      const taImgMsg = { sender: 'ta', content: '[图片]', imageData: pick, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };
      const tiid = await idbPutReturnId('messages', taImgMsg);
      taImgMsg.id = tiid;
      appendMessage(taImgMsg);
      overlay.remove();
    });
  }
}

      const today = new Date().toISOString().slice(0, 10);
      const symptoms = JSON.parse(localStorage.getItem('periodSymptoms') || '{}');
      if (!symptoms[today]) symptoms[today] = [];
      if (symptoms[today].includes(symptom)) {
        symptoms[today] = symptoms[today].filter(s => s !== symptom);
        btn.style.background = '';
      } else {
        symptoms[today].push(symptom);

      }

    });
  });

function loadPeriodData(overlay) {
  const records = JSON.parse(localStorage.getItem('periodRecords') || '[]');
  const starts = records.filter(r => r.type === 'start').map(r => r.date).sort();
  let summary = '还没有记录';
  if (starts.length) {
    summary = '上次开始：' + starts[starts.length - 1];
    if (starts.length >= 2) {
      const cycleDays = Math.round((new Date(starts[starts.length - 1]) - new Date(starts[starts.length - 2])) / 86400000);
      summary += ' ｜ 周期约 ' + cycleDays + ' 天';
      const nextDate = new Date(starts[starts.length - 1]);
      nextDate.setDate(nextDate.getDate() + cycleDays);
      summary += ' ｜ 预测下次：' + nextDate.toISOString().slice(0, 10);
    }
  }
  overlay.querySelector('#period-summary').textContent = summary;
  const calendar = overlay.querySelector('#period-calendar');
  calendar.innerHTML = '';
  starts.forEach(date => {
    const div = document.createElement('div');
    div.className = 'playback-date';
    div.textContent = date;
    div.style.background = 'rgba(255,143,176,0.5)';
    calendar.appendChild(div);
  });
  const list = overlay.querySelector('#period-list');
  list.innerHTML = '';
  records.slice().reverse().forEach(r => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${r.date} - ${r.type === 'start' ? '开始' : '结束'}</div>`;
    list.appendChild(div);
  });
}

function checkPeriodCare() {
  const today = new Date().toISOString().slice(0, 10);
  const records = JSON.parse(localStorage.getItem('periodRecords') || '[]');
  const starts = records.filter(r => r.type === 'start').map(r => r.date);
  const ends = records.filter(r => r.type === 'end').map(r => r.date);
  const lastStart = starts[starts.length - 1];
  const lastEnd = ends[ends.length - 1];
  if (!lastStart) return;
  const isActive = !lastEnd || (new Date(lastEnd) < new Date(lastStart)) || (new Date(today) <= new Date(lastStart) + 7 * 86400000);
  if (!isActive) return;
  const checked = JSON.parse(localStorage.getItem('periodCareChecked') || '{}');
  if (checked[today]) return;
  checked[today] = true;
  localStorage.setItem('periodCareChecked', JSON.stringify(checked));
  const cards = JSON.parse(localStorage.getItem('periodCards') || '[]');
  if (!cards.length) return;
  const card = cards[Math.floor(Math.random() * cards.length)];
  const msg = { sender: 'ta', content: card, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
  idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); sendNotification(card); });
}

// ========== 宠物（多只） ==========
function getPets() {
  let pets = JSON.parse(localStorage.getItem('petDataList') || 'null');
  if (!pets) {
    const oldPet = JSON.parse(localStorage.getItem('petData') || 'null');
    if (oldPet) {
      pets = [oldPet];
      localStorage.setItem('petDataList', JSON.stringify(pets));
    } else pets = [];
  }
  return pets;
}

function savePets(pets) { localStorage.setItem('petDataList', JSON.stringify(pets)); }

function petStageName(stage) {
  if (stage === 'egg') return '蛋';
  if (stage === 'young') return '幼年';
  return '成年';
}

function openPetPanel() {
  const overlay = createModal(`<div id="pet-panel-content"></div>`);
  const content = overlay.querySelector('#pet-panel-content');
  renderPetPanel(content, getPets());
}

async function renderPetPanel(content, pets) {
  content.innerHTML = '';
  if (!pets.length) content.innerHTML = '<div class="placeholder-tip">还没有宠物，领养一只吧</div>';
  for (let i = 0; i < pets.length; i++) {
    const pet = pets[i];
    let avatarHTML;
    if (pet.imageRef) {
      const data = await resolveMedia(pet.imageRef);
      avatarHTML = data ? `<div class="pet-avatar"><img src="${data}"></div>` : `<div class="pet-avatar">${pet.emoji}</div>`;
    } else if (pet.image) {
      avatarHTML = `<div class="pet-avatar"><img src="${pet.image}"></div>`;
    } else {
      avatarHTML = `<div class="pet-avatar">${pet.emoji}</div>`;
    }
    const card = document.createElement('div');
    card.className = 'pet-card';
    card.innerHTML = `
      ${avatarHTML}
      <div class="pet-info">
        <div class="pet-name">${escapeHtml(pet.name)}</div>
        <div class="pet-stage">${petStageName(pet.stage)}</div>
        <div class="pet-bars">饥饿 ${Math.round(pet.hunger)}/10 · 心情 ${Math.round(pet.mood)}/10 · 清洁 ${Math.round(pet.clean)}/10</div>
      </div>
      <div class="pet-actions">
        <button data-action="feed" data-idx="${i}">喂食</button>
        <button data-action="play" data-idx="${i}">陪玩</button>
        <button data-action="clean" data-idx="${i}">清洁</button>
      </div>`;
    content.appendChild(card);
  }
  const addBtn = document.createElement('button');
  addBtn.className = 'upload-btn';
  addBtn.textContent = '再领养一只';
  addBtn.addEventListener('click', () => openPetAdoptDialog());
  content.appendChild(addBtn);
  content.querySelectorAll('.pet-actions button').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const idx = Number(btn.dataset.idx);
      const list = getPets();
      const pet = list[idx];
      if (action === 'feed') pet.hunger = Math.min(10, pet.hunger + 3);
      if (action === 'play') pet.mood = Math.min(10, pet.mood + 3);
      if (action === 'clean') pet.clean = Math.min(10, pet.clean + 4);
      savePets(list);
      renderPetPanel(content, list);
    });
  });
}

function checkPetStatus() {
  const list = getPets();
  if (!list.length) return;
  let needCare = false;
  list.forEach(pet => {
    pet.hunger = Math.max(0, pet.hunger - 1);
    pet.mood = Math.max(0, pet.mood - 1);
    pet.clean = Math.max(0, pet.clean - 1);
    if (pet.hunger < 3 || pet.mood < 3 || pet.clean < 3) needCare = true;
  });
  savePets(list);
  if (needCare) {
    const msg = { sender: 'ta', content: '宠物们状态不太好，记得照顾它们', timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
    idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); sendNotification(msg.content); });
  }
}

function openPlantPanel() {
  const overlay = createModal(`
    <div class="heart-tabs">
      <button class="heart-tab active" id="plant-tab-flower">花</button>
      <button class="heart-tab" id="plant-tab-tree">树</button>
    </div>
    <div id="plant-content"></div>`);
  let currentTab = 'flower';
  loadPlantContent(overlay, currentTab);
  overlay.querySelector('#plant-tab-flower').addEventListener('click', () => { currentTab = 'flower'; switchPlantTab('flower', overlay); });
  overlay.querySelector('#plant-tab-tree').addEventListener('click', () => { currentTab = 'tree'; switchPlantTab('tree', overlay); });
}

function switchPlantTab(tab, overlay) {
  overlay.querySelectorAll('.heart-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'flower') overlay.querySelector('#plant-tab-flower').classList.add('active');
  if (tab === 'tree') overlay.querySelector('#plant-tab-tree').classList.add('active');
  loadPlantContent(overlay, tab);
}

function loadPlantContent(overlay, tab) {
  const plants = JSON.parse(localStorage.getItem('plantsData') || '{"flowers":[],"trees":[]}');
  const items = tab === 'flower' ? plants.flowers : plants.trees;
  const container = overlay.querySelector('#plant-content');
  container.innerHTML = '';
  if (!items.length) {
    container.innerHTML = `<div class="placeholder-tip">还没有${tab === 'flower' ? '花' : '树'}</div>
      <button class="upload-btn" id="plant-add-btn">种${tab === 'flower' ? '花' : '树'}</button>`;
    container.querySelector('#plant-add-btn').addEventListener('click', () => addPlant(tab));
    return;
  }
  items.forEach((p, i) => {
    const stageEmoji = p.type === 'flower' ? ['🌰','🌱','🌷','🌸'] : ['🌰','🌱','🌿','🪴','🌳'];
    const stageIdx = Math.min(p.stage, stageEmoji.length - 1);
    const div = document.createElement('div');
    div.className = 'card-item';
    div.style.flexDirection = 'column';
    div.style.alignItems = 'flex-start';
    div.innerHTML = `
      <div style="font-size:32px;">${stageEmoji[stageIdx]}</div>
      <div style="font-size:13px;color:#4a3528;">第 ${p.day} 天</div>
      <div style="font-size:12px;color:#8b6f60;margin-bottom:6px;">水分${p.water}/10 养分${p.nutrient}/10 健康${p.health}/10</div>
      <div style="display:flex;gap:6px;">
        <button class="mini-btn plant-action-btn" data-action="water" data-idx="${i}">浇水</button>
        <button class="mini-btn plant-action-btn" data-action="fertilize" data-idx="${i}">施肥</button>
        <button class="mini-btn plant-action-btn" data-action="catch" data-idx="${i}">捉虫</button>
      </div>`;
    div.querySelectorAll('.plant-action-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        const idx = Number(btn.dataset.idx);
        const plant = items[idx];
        if (action === 'water') plant.water = Math.min(10, plant.water + 3);
        if (action === 'fertilize') plant.nutrient = Math.min(10, plant.nutrient + 4);
        if (action === 'catch') plant.health = Math.min(10, plant.health + 3);
        plant.day += 1;
        if (plant.water >= 5 && plant.nutrient >= 5 && plant.health >= 5) {
          plant.stage = Math.min(plant.stage + 1, (plant.type === 'flower' ? 3 : 4));
        }
        items[idx] = plant;
        localStorage.setItem('plantsData', JSON.stringify(plants));
        loadPlantContent(overlay, tab);
      });
    });
    container.appendChild(div);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'upload-btn';
  addBtn.textContent = `再种一${tab === 'flower' ? '朵' : '棵'}${tab === 'flower' ? '花' : '树'}`;
  addBtn.addEventListener('click', () => addPlant(tab));
  container.appendChild(addBtn);
}

function startVideoTimer() {
  clearInterval(videoCallTimer);
  videoCallTimer = setInterval(() => {
    if (!videoCallStartTime) return;
    const elapsed = Math.floor((Date.now() - videoCallStartTime) / 1000);
    const hh = String(Math.floor(elapsed / 3600)).padStart(2, '0');
    const mm = String(Math.floor((elapsed % 3600) / 60)).padStart(2, '0');
    const ss = String(elapsed % 60).padStart(2, '0');
    const str = elapsed >= 3600 ? `${hh}:${mm}:${ss}` : `${mm}:${ss}`;
    const timerEl = document.getElementById('video-timer');
    if (timerEl) { timerEl.textContent = str; timerEl.style.visibility = 'visible'; }
    const miniTimer = document.getElementById('video-mini-timer');
    if (miniTimer) miniTimer.textContent = str;
    if (elapsed > 0 && elapsed % 60 === 0) {
      settings.heartValue += 5;
      saveSettings();
      updateHeartValue();
    }
  }, 1000);
}

function scheduleVideoAutoHangup() {
  clearTimeout(videoCallAutoHangTimer);
  const hour = new Date().getHours();
  if (hour >= 22 || hour < 8) return;
  const minMs = 30 * 60000;
  const maxMs = 5 * 3600000;
  const wait = Math.random() * (maxMs - minMs) + minMs;
  videoCallAutoHangTimer = setTimeout(() => {
    if (videoCallActive && videoCallAnswered) {
      const h = new Date().getHours();
      if (h >= 22 || h < 8) return;
      hangupVideoCall('TA去忙了', true);
    }
  }, wait);
}

function saveVideoCallRecord(isNew) {
  if (!videoCallStartTime) return;
  const records = JSON.parse(localStorage.getItem('videoRecords') || '[]');
  const duration = Math.floor((Date.now() - videoCallStartTime) / 1000);
  const date = new Date(videoCallStartTime).toISOString().slice(0, 10);
  const rec = {
    type: videoCallType,
    date, duration,
    answered: videoCallAnswered,
    taSpeaks: window._currentVideoSpeaks || [],
    startTime: videoCallStartTime,
    endTime: Date.now()
  };
  if (videoCallRecordId === null) {
    videoCallRecordId = records.length;
    records.push(rec);
  } else {
    records[videoCallRecordId] = rec;
  }
  localStorage.setItem('videoRecords', JSON.stringify(records));
}

function startVideoPersistTimer() {
  clearInterval(videoCallPersistTimer);
  videoCallPersistTimer = setInterval(() => {
    if (videoCallActive && videoCallAnswered) saveVideoCallRecord(false);
  }, 60000);
}

async function scheduleVideoTASpeak() {
  if (!videoCallActive || !videoCallAnswered) return;
  const cards = await idbGetAll('cards');

    setTimeout(() => { if (videoCallActive && videoCallAnswered) scheduleVideoTASpeak(); }, 5000);

  }

}

function hangupVideoCall(reason, isSystem) {
  let duration = 0, startStr = '', endStr = '';
  if (videoCallStartTime) {
    duration = Math.floor((Date.now() - videoCallStartTime) / 1000);
    startStr = new Date(videoCallStartTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    endStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    saveVideoCallRecord(false);
    if (videoCallAnswered) showToast(`通话结束，时长 ${Math.floor(duration / 60)}分${duration % 60}秒`);
  }
  if (videoCallAnswered && duration > 0) {
    const mins = Math.floor(duration / 60);
    const secs = duration % 60;
    const sysMsg = { sender: 'ta', content: `${startStr} 开始 · ${endStr} 结束 · 通话 ${mins}分钟${secs}秒`, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
    idbPutReturnId('messages', sysMsg).then(id => { sysMsg.id = id; appendMessage(sysMsg); });
  } else if (reason) {
    const nowStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    let content = '';
    if (reason === 'TA正在忙') content = `${nowStr} 忙线未接`;
    else if (reason === 'TA的视频通话未接听') content = `${nowStr} 未接来电`;
    else if (reason === '你拒绝了TA的视频通话') content = `${nowStr} 你拒接了来电`;
    else content = reason;
    const sysMsg = { sender: 'ta', content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
    idbPutReturnId('messages', sysMsg).then(id => { sysMsg.id = id; appendMessage(sysMsg); });
  }
  clearInterval(videoCallTimer);
  clearTimeout(videoCallAutoHangTimer);
  clearInterval(videoCallPersistTimer);
  window._currentVideoSpeaks = [];
  videoCallRecordId = null;
  videoCallActive = false;
  videoCallIncoming = false;
  videoCallAnswered = false;
  videoCallStartTime = 0;
  if (videoCallOverlay) { videoCallOverlay.remove(); videoCallOverlay = null; }
  if (videoCallMini) { videoCallMini.remove(); videoCallMini = null; }
  refreshOpenPanels();
}

function scheduleTAVideoCall() {

function checkImportantDays() {
  const days = JSON.parse(localStorage.getItem('importantDays') || '[]');
  const now = new Date();
  const today = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
  days.forEach(d => {
    let target = d.date;
    if (d.repeat) target = now.getFullYear() + '-' + d.date.slice(5);
    if (target === today) {
      const checked = JSON.parse(localStorage.getItem('importantChecked') || '{}');
      if (!checked[d.name + today]) {
        checked[d.name + today] = true;
        localStorage.setItem('importantChecked', JSON.stringify(checked));
        settings.heartValue += 50;
        saveSettings();
        updateHeartValue();
        const msg = { sender: 'ta', content: '今天是' + d.name + '，我一直记得。爱意值+50', timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
        idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); sendNotification(msg.content); });
      }
    }
  });
}
setInterval(checkImportantDays, 3600000);

function openAttendancePanel() {
  const overlay = createModal(`

      <button class="mini-btn" id="attendance-save-wage">保存时薪</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <input type="date" id="attendance-date" style="flex:1;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:8px 10px;font-size:13px;color:#4a3f3a;outline:none;">
      <input type="number" id="attendance-hours" placeholder="小时" style="width:70px;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:8px 10px;font-size:13px;color:#4a3f3a;outline:none;">
      <button class="mini-btn" id="attendance-save">保存</button>
      <button class="mini-btn" id="attendance-rest">休</button>
    </div>
    <div class="card-list" id="attendance-list"></div>`);
  loadAttendance(overlay);
  overlay.querySelector('#attendance-save-wage').addEventListener('click', () => {
    const wage = Number(overlay.querySelector('#attendance-wage').value);
    if (!wage) return showToast('请输入时薪');
    settings.hourlyWage = wage;
    saveSettings();
    showToast('时薪已保存');
    loadAttendance(overlay);
  });
  overlay.querySelector('#attendance-save').addEventListener('click', () => {
    const date = overlay.querySelector('#attendance-date').value;
    const hours = Number(overlay.querySelector('#attendance-hours').value);
    if (!date || !hours) return showToast('请填写日期和小时数');
    const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
    records[date] = { type: 'work', hours };
    localStorage.setItem('attendanceRecords', JSON.stringify(records));
    loadAttendance(overlay);
  });
  overlay.querySelector('#attendance-rest').addEventListener('click', () => {
    const date = overlay.querySelector('#attendance-date').value;
    if (!date) return showToast('请填写日期');
    const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
    records[date] = { type: 'rest', hours: 0 };
    localStorage.setItem('attendanceRecords', JSON.stringify(records));
    loadAttendance(overlay);
  });
}

function loadAttendance(overlay) {
  const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
  const dates = Object.keys(records).sort().reverse();
  const wage = settings.hourlyWage || 0;
  let totalHours = 0, totalWage = 0, monthHours = 0, monthWage = 0;
  const monthPrefix = new Date().toISOString().slice(0, 7);
  dates.forEach(date => {
    const r = records[date];
    if (r.type === 'work') {
      totalHours += r.hours; totalWage += r.hours * wage;
      if (date.startsWith(monthPrefix)) { monthHours += r.hours; monthWage += r.hours * wage; }
    }
  });
  overlay.querySelector('#attendance-summary').textContent = `本月 ${monthHours} 小时 ${monthWage} 元 ｜ 累计 ${totalHours} 小时 ${totalWage} 元`;
  const list = overlay.querySelector('#attendance-list');
  list.innerHTML = '';
  if (!dates.length) { list.innerHTML = '<div class="placeholder-tip">还没有出勤记录</div>'; return; }
  dates.forEach(date => {
    const r = records[date];
    const div = document.createElement('div');
    div.className = 'card-item';
    if (r.type === 'rest') div.innerHTML = `<div class="card-text">${date} - 休</div><div class="card-ops"><button class="attendance-del">✕</button></div>`;
    else div.innerHTML = `<div class="card-text">${date} - ${r.hours} 小时 - ${r.hours * wage} 元</div><div class="card-ops"><button class="attendance-del">✕</button></div>`;
    div.querySelector('.attendance-del').addEventListener('click', () => {
      delete records[date];
      localStorage.setItem('attendanceRecords', JSON.stringify(records));
      loadAttendance(overlay);
    });
    list.appendChild(div);
  });
}

function openBondPanel() {
  const overlay = createModal(`
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-size:48px;margin-bottom:8px;">${getBondHeart()}</div>
      <div style="font-size:20px;font-weight:700;color:#4a3528;">连续 ${settings.bondDays} 天</div>
      <div style="font-size:13px;color:#8b6f60;margin-top:4px;">爱意值：${settings.heartValue}</div>
      <div style="font-size:13px;color:#8b6f60;">今日：${getBondTodayStatus()}</div>
      <div style="font-size:13px;color:#8b6f60;">等级：${getBondLevel()}</div>
      <div style="font-size:12px;color:#a08a7a;margin-top:4px;">历史最长：${settings.bondHistoryBest} 天</div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px;">
      <button class="mini-btn" id="bond-sign">补签(50爱意值)</button>
      <button class="mini-btn" id="bond-rename">改名</button>
    </div>
    <div class="big-input-title">${escapeHtml(settings.bondName)}日历</div>
    <div class="bond-calendar-wrap" id="bond-calendar"></div>`);
  renderBondCalendar(overlay);
  overlay.querySelector('#bond-sign').addEventListener('click', () => {
    if (settings.heartValue < 50) return showToast('爱意值不足');
    if (getBondTodayStatus() === '已聊') return showToast('今天已经聊过了');
    settings.heartValue -= 50;
    settings.bondDays += 1;
    settings.bondLastCheckDate = new Date().toDateString();
    saveSettings();
    updateHeartValue();
    overlay.remove();
    openBondPanel();
    showToast('补签成功');
  });
  overlay.querySelector('#bond-rename').addEventListener('click', () => {
    const renameOverlay = createModal(`
      <div class="big-input-title">修改名字</div>
      <input type="text" id="bond-name-input" value="${escapeHtml(settings.bondName)}" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:15px;color:#4a3f3a;outline:none;">
      <button class="save-btn-center" id="save-bond-name" style="margin-top:14px;">保存</button>`);
    renameOverlay.querySelector('#save-bond-name').addEventListener('click', () => {
      const val = renameOverlay.querySelector('#bond-name-input').value.trim();

      overlay.remove();

function getBondHeart() {
  const days = settings.bondDays;
  if (days === 0) return '🤍';
  if (days <= 3) return '💕';
  if (days <= 7) return '💗';
  if (days <= 14) return '💖';
  if (days <= 30) return '❤️';
  if (days <= 100) return '❤️‍🔥';
  return '💝';
}

function getBondLevel() {
  const days = settings.bondDays;
  if (days === 0) return '未开始';
  if (days <= 3) return '小爱心';
  if (days <= 7) return '爱心';
  if (days <= 14) return '粉爱心';
  if (days <= 30) return '红爱心';
  if (days <= 100) return '深红爱心';
  return '永恒爱心';
}

function getBondTodayStatus() {
  return settings.bondLastCheckDate === new Date().toDateString() ? '已聊 ✓' : '未聊';
}

function renderBondCalendar(overlay) {
  const records = JSON.parse(localStorage.getItem('bondRecords') || '{}');
  const dates = Object.keys(records).sort();
  const container = overlay.querySelector('#bond-calendar');
  container.innerHTML = '';
  if (!dates.length) { container.innerHTML = '<div class="placeholder-tip">还没有记录</div>'; return; }
  const monthMap = {};
  dates.forEach(date => {
    const d = new Date(date);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    if (!monthMap[key]) monthMap[key] = [];
    monthMap[key].push(d.getDate());
  });
  const months = Object.keys(monthMap).sort().reverse();
  months.forEach(mk => {
    const wrap = document.createElement('div');
    wrap.className = 'bond-month';
    const [y, m] = mk.split('-');
    const firstDay = new Date(Number(y), Number(m) - 1, 1).getDay();
    const daysInMonth = new Date(Number(y), Number(m), 0).getDate();
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'bond-day';
      wrap.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'bond-day';
      cell.textContent = d;
      if (monthMap[mk].includes(d)) cell.classList.add('has-record');
      wrap.appendChild(cell);
    }
    container.appendChild(wrap);
  });
}

function checkBondDaily() {
  const today = new Date().toDateString();
  if (settings.bondLastCheckDate === today) return;
  if (settings.bondLastCheckDate && settings.bondDays > 0) {
    const diff = Math.floor((new Date() - new Date(settings.bondLastCheckDate)) / 86400000);
    if (diff > 1) {
      if (settings.bondDays > 30 && !settings.bondProtectUsed) {
        settings.bondProtectUsed = true;
        showToast('熄灭保护已使用');
      } else {
        if (settings.bondDays > settings.bondHistoryBest) settings.bondHistoryBest = settings.bondDays;
        settings.bondDays = 0;
        settings.bondProtectUsed = false;
        showToast('羁绊熄灭了');
      }
    }
  }
  settings.bondDays += 1;
  settings.bondLastCheckDate = today;
  if (settings.bondDays > 0 && settings.bondDays % 7 === 0) {
    settings.heartValue += 20;
    showToast('连续' + settings.bondDays + '天，爱意值+20');
  }
  const records = JSON.parse(localStorage.getItem('bondRecords') || '{}');
  records[today] = true;
  localStorage.setItem('bondRecords', JSON.stringify(records));
  saveSettings();
  updateHeartValue();
}
  // ========== 归档（打开网页全量补齐） ==========
async function checkArchive() {
  const now = new Date();
  const todayStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
  const todayDate = now.toDateString();
  const all = await idbGetAll('messages');
  const toArchive = all.filter(m => new Date(m.timestamp).toDateString() !== todayDate);
  if (!toArchive.length) return;
  isArchiving = true;
  const input = document.getElementById('chat-input');
  if (input) { input.disabled = true; input.placeholder = '归档中...'; }
  try {
    const archives = JSON.parse(localStorage.getItem('archives') || '{}');
    const groups = {};
    toArchive.forEach(m => {
      const d = new Date(m.timestamp);
      const ds = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      if (!groups[ds]) groups[ds] = [];
      groups[ds].push(m);
    });
    Object.keys(groups).forEach(ds => {
      if (!archives[ds]) archives[ds] = [];
      archives[ds] = archives[ds].concat(groups[ds]);
    });
    localStorage.setItem('archives', JSON.stringify(archives));
    for (const m of toArchive) await idbDelete('messages', m.id);
    await renderMessages();
    localStorage.setItem('lastArchiveDate', todayStr);
  } catch (e) {
    console.error('归档失败', e);
  }
  isArchiving = false;
  if (input) { input.disabled = false; input.placeholder = '对TA说些什么...'; }
}

// ========== 情绪（零维护） ==========
const MOODS = [
  { id: 'happy', name: '开心', factor: 0.7, prefixes: ['嘿嘿，', '今天心情超好，'] },
  { id: 'miss', name: '想你', factor: 0.8, prefixes: ['想你了，', '好想你啊，'] },
  { id: 'normal', name: '平常', factor: 1.0, prefixes: [] },
  { id: 'clingy', name: '粘人', factor: 0.5, prefixes: ['陪我嘛，', '不许不理我，'] },
  { id: 'low', name: '低落', factor: 1.3, prefixes: ['唉，', '有点难过，'] }
];

function getTodayMood() {
  const today = new Date().toDateString();
  if (settings.moodDate === today && settings.moodType) {
    return MOODS.find(m => m.id === settings.moodType) || MOODS[2];
  }
  const pick = MOODS[Math.floor(Math.random() * MOODS.length)];
  settings.moodType = pick.id;
  settings.moodDate = today;
  saveSettings();
  return pick;
}

function applyMoodToText(text) {
  const mood = getTodayMood();
  if (!mood.prefixes.length) return text;
  if (Math.random() < 0.25) {
    const p = mood.prefixes[Math.floor(Math.random() * mood.prefixes.length)];
    return p + text;
  }
  return text;
}

function applyMoodDelayFactor() {
  const mood = getTodayMood();
  return mood.factor;
}

// ========== 动态粒子 ==========
function getSeasonParticle() {
  const m = new Date().getMonth() + 1;
  if (m >= 3 && m <= 5) return 'sakura';
  if (m >= 6 && m <= 8) return 'firefly';
  if (m >= 9 && m <= 11) return 'leaf';
  return 'snow';
}

function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (particleAnimation) cancelAnimationFrame(particleAnimation);
  particleItems = [];
  if (!settings.particleEnabled) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    return;
  }
  const type = settings.particleType === 'season' ? getSeasonParticle() : settings.particleType;
  const count = 40;
  for (let i = 0; i < count; i++) particleItems.push(createParticle(type, canvas));
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particleItems.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
      drawParticle(ctx, p);
    });
    particleAnimation = requestAnimationFrame(loop);
  }
  loop();
}

function createParticle(type, canvas) {
  return {
    type,
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    speed: 0.5 + Math.random() * 1.5,
    drift: (Math.random() - 0.5) * 0.8,
    size: 4 + Math.random() * 6,
    alpha: 0.4 + Math.random() * 0.5
  };
}

function drawParticle(ctx, p) {
  ctx.globalAlpha = p.alpha;
  if (p.type === 'sakura' || p.type === 'petal') {
    ctx.fillStyle = '#ffc4d6';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === 'snow') {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === 'leaf') {
    ctx.fillStyle = '#e0a96d';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.5, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === 'star' || p.type === 'firefly') {
    ctx.fillStyle = p.type === 'firefly' ? '#ffe27a' : '#fff7c2';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); ctx.fill();
  } else if (p.type === 'rain') {
    ctx.strokeStyle = 'rgba(150,190,230,0.6)';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 1, p.y + p.size * 2); ctx.stroke();
  } else if (p.type === 'bubble') {
    ctx.strokeStyle = 'rgba(180,220,255,0.7)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.8, 0, Math.PI * 2); ctx.stroke();
  } else if (p.type === 'meteor') {
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 12, p.y - 12); ctx.stroke();
  } else {
    ctx.fillStyle = '#ffc4d6';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}
