<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>易遇♡雾凉</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  background: #f5e8e0;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent;
}

:root {
  --theme-bubble-me: rgba(255, 150, 90, 0.55);
  --theme-bubble-ta: rgba(255, 255, 255, 0.5);
  --theme-accent: #ff7b5c;
  --theme-accent-soft: rgba(255, 150, 100, 0.6);
  --theme-text: #4a3f3a;
  --theme-text-soft: #8b6f60;
  --theme-panel: rgba(255, 255, 255, 0.65);
  --theme-btn: rgba(255, 255, 255, 0.5);
  --theme-border: rgba(255, 255, 255, 0.6);
  --theme-heart: #ff3b5c;
  --theme-title: #4a3528;
}

#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

#particle-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}

#app {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  width: 100%;
  height: 100%;
  background: rgba(255, 255, 255, 0.05);
}

#topbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 16px 20px 8px 20px;
  min-height: 56px;
  z-index: 3;
}

.top-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.3);
  border: 1.5px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
}

#heart-line {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

#heart-line svg {
  display: block;
}

.heart-fill {
  animation: heartbeat 2.4s ease-in-out infinite;
  transform-origin: center;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  10% { transform: scale(1.12); }
  20% { transform: scale(0.98); }
  30% { transform: scale(1.08); }
  45% { transform: scale(1); }
}

.heartbeat-path {
  stroke-dasharray: 6, 3;
  animation: dashmove 3s linear infinite;
}

@keyframes dashmove {
  to { stroke-dashoffset: -18; }
}

#status-bar {
  display: none;
  justify-content: center;
  align-items: center;
  font-size: 13px;
  color: var(--theme-text);
  margin-top: 4px;
  z-index: 3;
  gap: 4px;
}

#status-bar.show {
  display: flex;
}

#status-bar svg {
  width: 16px;
  height: 16px;
  vertical-align: middle;
}

#heart-value-box {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin-top: 4px;
  font-size: 13px;
  color: var(--theme-heart);
  font-weight: 600;
  text-shadow: 0 0 8px rgba(255, 59, 92, 0.35);
  z-index: 3;
}

#heart-value-box .empty-heart {
  font-size: 16px;
  color: var(--theme-heart);
}

#messages-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 16px 12px 8px 12px;
  -webkit-overflow-scrolling: touch;
  scroll-behavior: smooth;
}

#pinned-area {
  display: flex;
  gap: 8px;
  padding: 6px 12px;
  overflow-x: auto;
  flex-shrink: 0;
  z-index: 3;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}

#pinned-area::-webkit-scrollbar {
  display: none;
}

.pinned-item {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 16px;
  padding: 6px 12px;
  font-size: 12px;
  color: #6b4c3b;
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
}

.pinned-item .pin-icon {
  font-size: 10px;
}
  .message-row {
  display: flex;
  margin-bottom: 14px;
  animation: msgIn 0.25s ease-out;
}

@keyframes msgIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-row.me {
  justify-content: flex-end;
}

.message-row.ta {
  justify-content: flex-start;
}

.message-row.system {
  justify-content: center;
}

.msg-system-bubble {
  font-size: 11px;
  color: rgba(90, 70, 60, 0.6);
  background: rgba(255, 255, 255, 0.35);
  border-radius: 10px;
  padding: 4px 12px;
  text-align: center;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.5);
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
}

.message-row.me .msg-avatar {
  margin-left: 8px;
}

.message-row.ta .msg-avatar {
  margin-right: 8px;
}

.msg-content-wrapper {
  max-width: 68%;
  display: flex;
  flex-direction: column;
}

.message-row.me .msg-content-wrapper {
  align-items: flex-end;
}

.message-row.ta .msg-content-wrapper {
  align-items: flex-start;
}

.msg-bubble {
  padding: 10px 14px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.5;
  word-break: break-word;
  white-space: pre-wrap;
  position: relative;
}

.message-row.me .msg-bubble {
  background: var(--theme-bubble-me);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  color: #fff;
  border-bottom-right-radius: 6px;
}

.message-row.ta .msg-bubble {
  background: var(--theme-bubble-ta);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.6);
  color: var(--theme-text);
  border-bottom-left-radius: 6px;
}

.msg-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: rgba(80, 60, 50, 0.6);
  margin-top: 3px;
  padding: 0 4px;
}

.msg-read {
  color: rgba(120, 100, 90, 0.55);
}

.msg-pin-mark {
  color: var(--theme-heart);
  font-size: 11px;
  margin-left: 4px;
}

.msg-heart-mark {
  color: #ff8fb0;
  font-size: 11px;
  margin-left: 4px;
}

.msg-quote {
  font-size: 12px;
  color: rgba(90, 70, 60, 0.6);
  margin-bottom: 4px;
  padding: 4px 8px;
  background: rgba(255, 255, 255, 0.3);
  border-radius: 8px;
  border-left: 2px solid #ff8fb0;
  cursor: pointer;
}

.msg-gift-card {
  text-align: center;
  padding: 8px;
}

.msg-gift-icon {
  font-size: 36px;
}

.msg-gift-name {
  font-size: 13px;
  color: var(--theme-text);
  margin-top: 4px;
}

.msg-gift-cost {
  font-size: 11px;
  color: var(--theme-heart);
  margin-top: 2px;
}

.msg-interact-text {
  text-align: center;
  padding: 8px;
  font-size: 14px;
  color: var(--theme-text);
}

/* 情侣互动特殊气泡 */
.msg-interact-couple {
  position: relative;
  text-align: center;
  padding: 10px 16px;
  font-size: 14px;
  color: #a04a6a;
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(255,200,220,0.85), rgba(255,170,200,0.85)) padding-box,
              linear-gradient(135deg, #ff8fb0, #ffc4d6, #dcd3f5) border-box;
  border: 2px solid transparent;
  box-shadow: 0 2px 12px rgba(255,143,176,0.3);
}

.msg-interact-couple::before {
  content: '💗';
  margin-right: 4px;
}

.msg-interact-couple::after {
  content: '💗';
  margin-left: 4px;
}

#typing-indicator {
  display: none;
  align-items: center;
  gap: 6px;
  padding: 4px 16px 8px 16px;
  font-size: 13px;
  color: rgba(90, 70, 60, 0.7);
  z-index: 3;
  flex-shrink: 0;
}

#typing-indicator.show {
  display: flex;
}

.typing-dots {
  display: flex;
  gap: 3px;
}

.typing-dots span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(90, 70, 60, 0.6);
  animation: dotjump 1.2s infinite;
}

.typing-dots span:nth-child(2) { animation-delay: 0.2s; }
.typing-dots span:nth-child(3) { animation-delay: 0.4s; }

@keyframes dotjump {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-5px); }
}

#input-area {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px 18px 16px;
  z-index: 3;
  flex-shrink: 0;
}

#chat-input {
  flex: 1;
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.55);
  border-radius: 22px;
  padding: 10px 16px;
  font-size: 15px;
  color: var(--theme-text);
  outline: none;
  min-height: 42px;
  max-height: 120px;
}

#chat-input::placeholder {
  color: rgba(90, 70, 60, 0.45);
}

#send-btn {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  border: none;
  background: rgba(255, 255, 255, 0.4);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.5);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  color: #6b4c3b;
  flex-shrink: 0;
  transition: all 0.2s;
}

#send-btn:active {
  transform: scale(0.9);
  background: rgba(255, 255, 255, 0.6);
}

#send-btn.send-mode {
  background: var(--theme-accent-soft);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.5px;
  border-color: rgba(255, 255, 255, 0.6);
}

#floating-ball {
  position: fixed;
  z-index: 10;
  width: 52px;
  height: 52px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.1);
  overflow: hidden;
  touch-action: none;
  will-change: transform;
}

#floating-ball img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
}
  .modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(60, 40, 30, 0.25);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-panel {
  background: var(--theme-panel);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border: 1.5px solid rgba(255, 255, 255, 0.7);
  border-radius: 24px;
  padding: 20px;
  width: 90%;
  max-width: 420px;
  max-height: 75vh;
  overflow-y: auto;
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
  animation: panelIn 0.25s ease-out;
}

@keyframes panelIn {
  from { opacity: 0; transform: scale(0.92) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

#ball-panel {
  position: fixed;
  z-index: 30;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%) scale(0.92);
  background: var(--theme-panel);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border: 1.5px solid rgba(255, 255, 255, 0.75);
  border-radius: 28px;
  padding: 20px;
  width: 88%;
  max-width: 380px;
  max-height: 75vh;
  overflow-y: auto;
  box-shadow: 0 16px 50px rgba(0, 0, 0, 0.2);
  display: none;
  opacity: 0;
  transition: opacity 0.2s ease-out, transform 0.25s ease-out;
}

#ball-panel.show {
  display: block;
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.ball-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px 8px;
}

.ball-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 12px 6px;
  border-radius: 18px;
  cursor: pointer;
  transition: background 0.2s;
}

.ball-item:active {
  background: rgba(0, 0, 0, 0.04);
}

.ball-item .icon-wrap {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.ball-item .icon-wrap svg {
  width: 24px;
  height: 24px;
}

.ball-item span {
  font-size: 12px;
  color: var(--theme-title);
  text-align: center;
  white-space: nowrap;
}

.plus-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 12px 6px;
  border-radius: 18px;
  cursor: pointer;
  transition: background 0.2s;
  text-align: center;
}

.plus-item:active {
  background: rgba(0, 0, 0, 0.04);
}

.plus-item .icon-wrap {
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.55);
  border: 1px solid rgba(255, 255, 255, 0.8);
}

.plus-item .icon-wrap svg {
  width: 24px;
  height: 24px;
}

.plus-item span {
  font-size: 12px;
  color: var(--theme-title);
  text-align: center;
  white-space: nowrap;
  display: block;
  width: 100%;
}

.card-input-row input,
.card-search-row input {
  width: 100%;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 14px;
  padding: 10px 14px;
  font-size: 14px;
  color: var(--theme-text);
  outline: none;
  margin-bottom: 8px;
}

.card-input-row input[readonly],
.card-search-row input[readonly] {
  cursor: pointer;
}

.card-actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 8px;
}

.mini-btn {
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 14px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--theme-title);
  cursor: pointer;
  transition: all 0.2s;
}

.mini-btn:active {
  background: rgba(255, 255, 255, 0.7);
  transform: scale(0.96);
}

.mini-btn:disabled,
.mini-btn.disabled {
  opacity: 0.45;
  cursor: not-allowed;
  pointer-events: none;
}

.card-count-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
  font-size: 13px;
  color: var(--theme-title);
}

.card-list {
  max-height: 40vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.card-item {
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 12px;
  padding: 10px 12px;
  margin-bottom: 6px;
  font-size: 14px;
  color: var(--theme-text);
  word-break: break-word;
}

.card-item .card-text {
  flex: 1;
}

.card-item .card-ops {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
}

.card-ops button {
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 14px;
  color: var(--theme-text-soft);
  padding: 2px;
}

/* 情侣互动特殊卡片（管理面板内） */
.interact-couple-item {
  position: relative;
  background: linear-gradient(rgba(255,255,255,0.45), rgba(255,255,255,0.45)) padding-box,
              linear-gradient(135deg, #ff8fb0, #ffc4d6, #dcd3f5) border-box;
  border: 2px solid transparent;
  border-radius: 14px;
  box-shadow: 0 2px 12px rgba(255,143,176,0.25);
}
  .big-input-title {
  text-align: center;
  font-size: 17px;
  font-weight: 600;
  color: var(--theme-title);
  margin-bottom: 16px;
}

.big-input-area {
  width: 100%;
  min-height: 160px;
  background: rgba(255, 255, 255, 0.5);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 16px;
  padding: 14px;
  font-size: 15px;
  color: var(--theme-text);
  outline: none;
  resize: vertical;
}

.big-input-area::placeholder {
  color: rgba(90, 70, 60, 0.4);
}

.big-input-hint {
  text-align: center;
  font-size: 11px;
  color: rgba(90, 70, 60, 0.55);
  margin: 10px 0 16px 0;
}

.save-btn-center {
  display: block;
  margin: 0 auto;
  background: var(--theme-accent-soft);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 18px;
  padding: 10px 24px;
  font-size: 15px;
  color: #fff;
  cursor: pointer;
  transition: all 0.2s;
}

.save-btn-center:active {
  transform: scale(0.95);
  background: var(--theme-accent);
}

.about-section {
  display: flex;
  align-items: center;
  gap: 14px;
  background: rgba(255, 255, 255, 0.4);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}

.about-avatar {
  width: 52px;
  height: 52px;
  border-radius: 50%;
  object-fit: cover;
  background: rgba(255, 255, 255, 0.3);
  border: 1.5px solid rgba(255, 255, 255, 0.6);
}

.about-info {
  flex: 1;
}

.about-info .about-name {
  font-size: 16px;
  font-weight: 600;
  color: var(--theme-title);
  margin-bottom: 2px;
}

.about-info .about-nick {
  font-size: 13px;
  color: var(--theme-text-soft);
  cursor: pointer;
}

.library-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 8px;
  max-height: 50vh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.lib-item {
  aspect-ratio: 1;
  border-radius: 14px;
  overflow: hidden;
  position: relative;
  cursor: pointer;
  border: 2px solid transparent;
}

.lib-item.active {
  border-color: var(--theme-accent);
}

.lib-item img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.lib-item .lib-del {
  position: absolute;
  top: 4px;
  right: 4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.45);
  color: #fff;
  border: none;
  font-size: 11px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2;
}

.upload-btn {
  display: block;
  width: 100%;
  background: rgba(255, 255, 255, 0.4);
  border: 1.5px dashed rgba(255, 255, 255, 0.7);
  border-radius: 14px;
  padding: 12px;
  font-size: 14px;
  color: var(--theme-title);
  cursor: pointer;
  text-align: center;
  margin-top: 10px;
}

.playback-dates {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 0 12px 0;
  scrollbar-width: none;
  -ms-overflow-style: none;
  -webkit-overflow-scrolling: touch;
}

.playback-dates::-webkit-scrollbar {
  display: none;
}

.playback-date {
  flex-shrink: 0;
  background: rgba(255, 255, 255, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 14px;
  padding: 8px 14px;
  font-size: 13px;
  color: var(--theme-title);
  cursor: pointer;
  white-space: nowrap;
}

      if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('messages')) d.createObjectStore('messages', { keyPath: 'id', autoIncrement: true });
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'key' });
      if (!d.objectStoreNames.contains('media')) d.createObjectStore('media', { keyPath: 'key' });
    };
    req.onsuccess = (e) => { db = e.target.result; resolve(); };
    req.onerror = (e) => reject(e);
  });
}

function idbPut(store, data) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(data);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbGetAll(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function idbDelete(store, id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);
  });
}

function idbClear(store) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).clear();
    tx.oncomplete = () => resolve();
    tx.onerror = (e) => reject(e);

}

function idbGet(store, key) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = (e) => reject(e);
  });
}

function idbPutReturnId(store, data) {

// ========== 媒体存储 ==========
async function mediaSave(key, dataUrl) {
  await idbPut('media', { key, value: dataUrl });
  return 'media:' + key;
}

async function mediaGet(ref) {
  if (!ref || typeof ref !== 'string') return ref || '';
  if (ref.startsWith('media:')) {
    const key = ref.slice(6);
    const rec = await idbGet('media', key);
    return rec ? rec.value : '';
  }
  return ref;
}

function mediaDel(ref) {
  if (ref && typeof ref === 'string' && ref.startsWith('media:')) {
    idbDelete('media', ref.slice(6));
  }
}

// ========== 统一解析 ==========
async function resolveMedia(x) {
  if (!x) return '';
  if (typeof x !== 'string') {
    if (x.data) return resolveMedia(x.data);
    if (x.ref) return resolveMedia(x.ref);
    return '';
  }
  if (x.startsWith('media:')) {
    const rec = await idbGet('media', x.slice(6));
    return rec ? rec.value : '';
  }
  return x;
}

// ========== 图片库（存引用） ==========
function libGetRefs(name) {
  return JSON.parse(localStorage.getItem(name) || '[]');
}

function libSetRefs(name, refs) {
  try {
    localStorage.setItem(name, JSON.stringify(refs));
  } catch (e) {
    showToast('存储空间不足，请清理');
  }
}

async function libGet(name) {
  const refs = libGetRefs(name);
  const out = [];
  for (const r of refs) {
    const data = await resolveMedia(r);
    if (data) out.push({ ref: r, data });
  }
  return out;
}

async function libPush(name, dataUrl, prefix) {
  const key = (prefix || name) + '_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
  const ref = await mediaSave(key, dataUrl);
  const refs = libGetRefs(name);
  refs.push(ref);
  libSetRefs(name, refs);
  return ref;
}

// ========== 旧数据迁移 ==========
async function migrateMediaOnce() {
  if (localStorage.getItem('mediaMigratedV4')) return;
  try {
    // avatarLibrary: [{data,tags}] -> [media:]
    const av = JSON.parse(localStorage.getItem('avatarLibrary') || '[]');
    if (av.length && typeof av[0] === 'object') {
      const newRefs = [];
      for (const a of av) {
        if (a.data && typeof a.data === 'string' && a.data.startsWith('data:')) {
          const key = 'avatar_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
          await idbPut('media', { key, value: a.data });
          newRefs.push('media:' + key);
        } else if (typeof a === 'string') {
          newRefs.push(a);
        }
      }
      localStorage.setItem('avatarLibrary', JSON.stringify(newRefs));
    }
    // bgLibrary
    const bg = JSON.parse(localStorage.getItem('bgLibrary') || '[]');
    if (bg.length && typeof bg[0] === 'string' && bg[0].startsWith('data:')) {
      const newRefs = [];
      for (const d of bg) {
        if (d.startsWith('data:')) {
          const key = 'bg_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
          await idbPut('media', { key, value: d });
          newRefs.push('media:' + key);
        } else newRefs.push(d);
      }
      localStorage.setItem('bgLibrary', JSON.stringify(newRefs));
    }
    // stickerLibrary
    const st = JSON.parse(localStorage.getItem('stickerLibrary') || '[]');
    if (st.length && typeof st[0] === 'string' && st[0].startsWith('data:')) {
      const newRefs = [];
      for (const d of st) {
        if (d.startsWith('data:')) {
          const key = 'sticker_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
          await idbPut('media', { key, value: d });
          newRefs.push('media:' + key);
        } else newRefs.push(d);
      }
      localStorage.setItem('stickerLibrary', JSON.stringify(newRefs));
    }
    // 当前背景
    if (settings.bgCurrent && settings.bgCurrent.startsWith('data:')) {
      const key = 'bgcur_' + Date.now();
      await idbPut('media', { key, value: settings.bgCurrent });
      settings.bgCurrent = 'media:' + key;
      await saveSettings();
    }
    // petData / petDataList
    const pet = JSON.parse(localStorage.getItem('petData') || 'null');
    if (pet && pet.image && pet.image.startsWith('data:')) {
      const key = 'pet_' + Date.now();
      await idbPut('media', { key, value: pet.image });
      pet.imageRef = 'media:' + key;
      delete pet.image;
      localStorage.setItem('petData', JSON.stringify(pet));
    }
    const petList = JSON.parse(localStorage.getItem('petDataList') || '[]');
    if (petList.length) {
      let changed = false;
      for (const p of petList) {
        if (p.image && p.image.startsWith('data:')) {
          const key = 'pet_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
          await idbPut('media', { key, value: p.image });
          p.imageRef = 'media:' + key;
          delete p.image;
          changed = true;
        }
      }
      if (changed) localStorage.setItem('petDataList', JSON.stringify(petList));
    }
    // plantsData
    const plants = JSON.parse(localStorage.getItem('plantsData') || '{"flowers":[],"trees":[]}');
    let plantChanged = false;
    for (const k of ['flowers', 'trees']) {
      for (const p of (plants[k] || [])) {
        if (p.image && p.image.startsWith('data:')) plantChanged = true;
      }
    }
    if (plantChanged) {
      for (const k of ['flowers', 'trees']) {
        for (const p of (plants[k] || [])) {
          if (p.image && p.image.startsWith('data:')) {
            const key = 'plant_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
            await idbPut('media', { key, value: p.image });
            p.imageRef = 'media:' + key;
            delete p.image;
          }
        }
      }
      localStorage.setItem('plantsData', JSON.stringify(plants));
    }
    localStorage.setItem('mediaMigratedV4', '1');
  } catch (e) {
    console.error('迁移出错', e);
  }
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function downloadFile(content, filename, mime) {
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

  const overlay = document.createElement('div');

  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
  return overlay;
}

// ========== 丝滑拖拽 ==========
function makeDraggable(el) {
  let drag = false, startX = 0, startY = 0, origX = 0, origY = 0, moved = false;
  el.style.touchAction = 'none';
  el.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    drag = true;
    moved = false;
    startX = e.clientX;
    startY = e.clientY;
    const rect = el.getBoundingClientRect();
    origX = rect.left;
    origY = rect.top;
    el.style.right = 'auto';
    el.style.bottom = 'auto';
    el.style.left = origX + 'px';
    el.style.top = origY + 'px';
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
  });
  el.addEventListener('pointermove', (e) => {
    if (!drag) return;
    const dx = e.clientX - startX;
    const dy = e.clientY - startY;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;
    const nx = origX + dx;
    const ny = origY + dy;
    const maxX = window.innerWidth - el.offsetWidth - 4;
    const maxY = window.innerHeight - el.offsetHeight - 4;
    el.style.left = Math.max(4, Math.min(maxX, nx)) + 'px';
    el.style.top = Math.max(4, Math.min(maxY, ny)) + 'px';
  });
  el.addEventListener('pointerup', () => {
    drag = false;
    el.classList.remove('dragging');
    setTimeout(() => { moved = false; }, 50);
  });
  el._wasDragged = () => moved;
}

function getWorldTime() {
  const world = (settings.worlds || []).find(w => w.id === settings.currentWorldId) || settings.worlds[0];
  if (!world) return new Date();
  const offset = Number(world.offset) || 0;
  const speed = Number(world.speed) || 1;
  const base = Date.now();
  const baseZero = new Date();
  baseZero.setHours(0, 0, 0, 0);
  const elapsed = base - baseZero.getTime();
  const worldElapsed = elapsed * speed;
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  d.setTime(d.getTime() + worldElapsed + offset * 3600000);
  return d;
}

function getTAStatus() {
  if (settings.accompanyMode) {
    const taNick = settings.taNick || settings.taName;
    let iconKey = 'companion';
    let text = '';
    if (settings.accompanyMode === 'sleep') { iconKey = 'sleep'; text = `和${taNick}陪睡中`; }
    else if (settings.accompanyMode === 'daze') { iconKey = 'daze'; text = `和${taNick}发呆中`; }
    else if (settings.accompanyMode === 'together') { iconKey = 'together'; text = `和${taNick}一起${settings.accompanyType}中`; }
    else { iconKey = 'companion'; text = `和${taNick}陪伴中`; }
    return { iconKey, text };
  }
  const taNick = settings.taNick || settings.taName;
  const h = getWorldTime().getHours();
  let iconKey, label;
  if (h >= 7 && h < 9) { iconKey = 'awake'; label = '刚醒'; }
  else if (h >= 9 && h < 12) { iconKey = 'busy'; label = '在忙'; }
  else if (h >= 12 && h < 13.5) { iconKey = 'eating'; label = '吃饭中'; }
  else if (h >= 13.5 && h < 14) { iconKey = 'nap'; label = '午休'; }
  else if (h >= 14 && h < 18) { iconKey = 'busy'; label = '在忙'; }
  else if (h >= 18 && h < 19.5) { iconKey = 'eating'; label = '吃饭中'; }
  else if (h >= 19.5 && h < 23) { iconKey = 'free'; label = '空闲'; }
  else if (h >= 23 || h < 1) { iconKey = 'prepare'; label = '准备睡了'; }
  else { iconKey = 'sleeping'; label = '睡着了'; }
  return { iconKey, text: `${label}`, prefix: taNick };
}

function updateStatusBar() {
  const bar = document.getElementById('status-bar');
  const st = getTAStatus();
  const icon = STATUS_ICONS[st.iconKey] || '';
  if (st.prefix) {
    bar.innerHTML = `${icon}<span>${escapeHtml(st.prefix)}${st.text}</span>`;
  } else {
    bar.innerHTML = `${icon}<span>${st.text}</span>`;
  }
  bar.classList.add('show');
}

function openWorldsPanel() {
  const overlay = createModal(`<div id="worlds-content"></div>`);
  renderWorldsContent(overlay);
  overlay.querySelector('#worlds-content').addEventListener('click', (e) => {
    if (e.target.closest('#worlds-add-btn')) {
      openWorldEditDialog(null, overlay);
    }
  });
  registerPanelUpdater('worlds', () => renderWorldsContent(overlay));
}

function renderWorldsContent(overlay) {
  const content = overlay.querySelector('#worlds-content');
  const worlds = settings.worlds || [];
  let html = '<div class="big-input-title">世界之外</div>';
  html += '<div style="font-size:12px;color:#8b6f60;margin-bottom:12px;text-align:center;">每个世界有自己的时差和流速</div>';
  worlds.forEach(w => {
    const current = w.id === settings.currentWorldId ? ' current' : '';
    const speedText = w.speed === 1 ? '同速' : `${w.speed}倍速`;
    const offsetText = w.offset >= 0 ? `+${w.offset}h` : `${w.offset}h`;
    html += `
      <div class="world-card${current}" data-id="${w.id}">
        <div class="world-icon">${WORLD_ICONS[w.icon] || WORLD_ICONS.real}</div>
        <div class="world-info">
          <div class="world-name">${escapeHtml(w.name)}</div>
          <div class="world-meta">时差 ${offsetText} ｜ ${speedText}</div>
        </div>
        <div class="world-ops">
          <button class="world-enter" data-id="${w.id}">${w.id === settings.currentWorldId ? '当前' : '进入'}</button>
          <button class="world-edit" data-id="${w.id}">改</button>
          <button class="world-del" data-id="${w.id}">✕</button>
        </div>
      </div>`;
  });
  html += '<button class="upload-btn" id="worlds-add-btn">添加世界</button>';
  content.innerHTML = html;
  content.querySelectorAll('.world-enter').forEach(btn => {
    btn.addEventListener('click', async () => {
      settings.currentWorldId = btn.dataset.id;
      await saveSettings();
      updateStatusBar();
      renderWorldsContent(overlay);
      const world = settings.worlds.find(w => w.id === btn.dataset.id);
      showToast('已进入' + world.name);
    });
  });
  content.querySelectorAll('.world-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      const world = settings.worlds.find(w => w.id === btn.dataset.id);
      openWorldEditDialog(world, overlay);
    });
  });
  content.querySelectorAll('.world-del').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (settings.worlds.length <= 1) return showToast('至少保留一个世界');
      settings.worlds = settings.worlds.filter(w => w.id !== btn.dataset.id);
      if (settings.currentWorldId === btn.dataset.id) settings.currentWorldId = settings.worlds[0].id;
      await saveSettings();
      renderWorldsContent(overlay);
    });
  });
}

    <div style="font-size:13px;color:#4a3528;margin-bottom:4px;">流速（1 = 同速，30 = 你1天他30天）</div>
    <input type="number" id="world-speed-input" value="${w.speed}" min="0.1" step="0.1" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:12px;">
    <button class="save-btn-center" id="save-world">保存</button>`);
  let pickedIcon = w.icon;
  const iconGrid = overlay.querySelector('#world-icon-grid');
  Object.keys(WORLD_ICONS).forEach(key => {
    const div = document.createElement('div');
    div.className = 'lib-item' + (key === pickedIcon ? ' active' : '');
    div.style.display = 'flex';
    div.style.alignItems = 'center';
    div.style.justifyContent = 'center';
    div.style.background = 'rgba(255,255,255,0.5)';
    div.innerHTML = WORLD_ICONS[key];
    div.addEventListener('click', () => {
      pickedIcon = key;
      iconGrid.querySelectorAll('.lib-item').forEach(el => el.classList.remove('active'));
      div.classList.add('active');
    });
    iconGrid.appendChild(div);
  });
  overlay.querySelector('#save-world').addEventListener('click', async () => {
    const name = overlay.querySelector('#world-name-input').value.trim() || '新世界';
    const offset = Number(overlay.querySelector('#world-offset-input').value) || 0;
    const speed = Number(overlay.querySelector('#world-speed-input').value) || 1;
    if (isNew) {
      settings.worlds.push({ id: w.id, name, icon: pickedIcon, offset, speed });
    } else {
      const target = settings.worlds.find(x => x.id === w.id);
      if (target) { target.name = name; target.icon = pickedIcon; target.offset = offset; target.speed = speed; }
    }
    await saveSettings();
    overlay.remove();
    panelOverlay.remove();
    openWorldsPanel();
    showToast('世界已保存');
  });
}

// ========== 字卡面板 ==========
let cardPageMode = false;

function openCardPanel() {
  const overlay = createModal(`
    <div class="card-search-row"><input type="text" id="card-search-btn" placeholder="搜索字卡" readonly></div>
    <div class="card-input-row"><input type="text" id="card-add-input" placeholder="添加新字卡" readonly></div>
    <div class="card-actions-row">
      <button class="mini-btn" id="card-file-import">文件导入</button>
      <button class="mini-btn" id="card-file-export">文件导出</button>
      <button class="mini-btn" id="card-batch-del">批量删除</button>
      <button class="mini-btn" id="card-recycle">回收站</button>
      <button class="mini-btn" id="card-dedupe">一键去重</button>
    </div>
    <div class="card-count-row">
      <span id="card-count-text">总数量：0 张</span>
      <button class="mini-btn" id="card-batch-confirm" style="display:none;">一键删除</button>
    </div>
    <div class="card-list" id="card-list"></div>`);
  const panel = overlay.querySelector('.modal-panel');
  loadCardList(panel);
  bindCardEvents(panel);
}

async function loadCardList(panel) {
  const cards = await idbGetAll('cards');
  const list = panel.querySelector('#card-list');
  const countText = panel.querySelector('#card-count-text');
  countText.textContent = `总数量：${cards.length} 张`;
  list.innerHTML = '';
  if (!cards.length) {
    list.innerHTML = '<div class="placeholder-tip">还没有字卡，快点添加吧</div>';
    return;
  }
  cards.forEach(card => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.dataset.id = card.id;
    div.innerHTML = `
      <input type="checkbox" class="card-checkbox" style="display:none;">
      <div class="card-text">${escapeHtml(card.content)}</div>
      <div class="card-ops">
        <button class="card-edit" title="编辑">✎</button>
        <button class="card-delete" title="删除">✕</button>
      </div>`;
    list.appendChild(div);
  });
}

function bindCardEvents(panel) {
  const list = panel.querySelector('#card-list');
  const addInput = panel.querySelector('#card-add-input');
  const batchDelBtn = panel.querySelector('#card-batch-del');
  const batchConfirm = panel.querySelector('#card-batch-confirm');
  const recycleBtn = panel.querySelector('#card-recycle');
  const importBtn = panel.querySelector('#card-file-import');
  const exportBtn = panel.querySelector('#card-file-export');
  const searchBtn = panel.querySelector('#card-search-btn');
  const dedupeBtn = panel.querySelector('#card-dedupe');

  addInput.addEventListener('click', () => openAddCardDialog(panel));

  batchDelBtn.addEventListener('click', () => {
    cardPageMode = !cardPageMode;
    const boxes = panel.querySelectorAll('.card-checkbox');
    boxes.forEach(b => b.style.display = cardPageMode ? 'inline-block' : 'none');
    batchConfirm.style.display = cardPageMode ? 'inline-block' : 'none';
    if (!cardPageMode) boxes.forEach(b => b.checked = false);
  });

  batchConfirm.addEventListener('click', async () => {
    const checked = panel.querySelectorAll('.card-checkbox:checked');
    for (const box of checked) {
      const id = Number(box.closest('.card-item').dataset.id);
      const card = (await idbGetAll('cards')).find(c => c.id === id);
      if (card) {
        const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
        recycled.push(card);
        localStorage.setItem('recycledCards', JSON.stringify(recycled));
        await idbDelete('cards', id);
      }
    }
    cardPageMode = false;
    loadCardList(panel);
  });

  recycleBtn.addEventListener('click', () => openRecyclePanel(panel));

  dedupeBtn.addEventListener('click', async () => {
    const cards = await idbGetAll('cards');
    const seen = new Set();
    const duplicates = [];
    for (const card of cards) {
      if (seen.has(card.content)) {
        duplicates.push(card.content);
        await idbDelete('cards', card.id);
      } else {
        seen.add(card.content);
      }
    }
    if (duplicates.length) {
      createModal(`
        <div class="big-input-title">去重完成</div>
        <div style="font-size:13px;color:#4a3528;margin-bottom:12px;">已去除 ${duplicates.length} 张重复字卡：</div>
        <div class="card-list" style="max-height:40vh;">${duplicates.map(d => `<div class="card-item"><div class="card-text">${escapeHtml(d)}</div></div>`).join('')}</div>`);
    } else {
      showToast('没有重复字卡');
    }
    loadCardList(panel);
  });

  importBtn.addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.txt,.json';
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      if (file.name.endsWith('.json')) {
        const data = JSON.parse(text);
        const cards = data.cards || data;
        for (const c of cards) {
          const content = typeof c === 'string' ? c : c.content;
          if (content) await idbPut('cards', { content });
        }
      } else {
        const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
        for (const line of lines) await idbPut('cards', { content: line });
      }
      loadCardList(panel);
    };
    inp.click();
  });

  exportBtn.addEventListener('click', () => {
    const fmtOverlay = createModal(`
      <div class="big-input-title">导出格式</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:10px;">
        <button class="mini-btn" id="export-txt">TXT</button>
        <button class="mini-btn" id="export-json">JSON</button>
      </div>`);
    fmtOverlay.querySelector('#export-txt').addEventListener('click', async () => {
      const cards = await idbGetAll('cards');
      downloadFile(cards.map(c => c.content).join('\n'), '字卡导出.txt', 'text/plain');
      fmtOverlay.remove();
    });
    fmtOverlay.querySelector('#export-json').addEventListener('click', async () => {
      const cards = await idbGetAll('cards');
      downloadFile(JSON.stringify({ cards }, null, 2), '字卡导出.json', 'application/json');
      fmtOverlay.remove();
    });
  });

  searchBtn.addEventListener('click', () => openCardSearchPanel());

  list.addEventListener('click', async (e) => {
    const item = e.target.closest('.card-item');
    if (!item) return;
    const id = Number(item.dataset.id);
    const cards = await idbGetAll('cards');
    const card = cards.find(c => c.id === id);
    if (!card) return;
    if (e.target.closest('.card-delete')) {
      const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      recycled.push(card);
      localStorage.setItem('recycledCards', JSON.stringify(recycled));
      await idbDelete('cards', id);
      loadCardList(panel);
    } else if (e.target.closest('.card-edit')) {
      showEditCardDialog(id, card.content, panel);
    }
  });
}

function openAddCardDialog(panel) {
  const overlay = createModal(`
    <div class="big-input-title">字卡内容</div>
    <textarea class="big-input-area" id="add-card-area" placeholder="他会用这些字卡回复你哦"></textarea>
    <div class="big-input-hint">一行一条字卡，换行分隔</div>
    <button class="save-btn-center" id="save-add-card">保存字卡</button>`);
  overlay.querySelector('#save-add-card').addEventListener('click', async () => {
    const text = overlay.querySelector('#add-card-area').value.trim();
    if (!text) return;
    const lines = text.split('\n').map(s => s.trim()).filter(Boolean);
    const existing = await idbGetAll('cards');
    const existingContents = existing.map(c => c.content);
    let added = 0, skipped = 0;
    for (const line of lines) {
      if (existingContents.includes(line)) skipped++;
      else {
        await idbPut('cards', { content: line });
        existingContents.push(line);
        added++;
      }
    }
    if (skipped > 0) showToast(`有 ${skipped} 张已存在，已跳过`);
    if (added > 0) showToast(`成功添加 ${added} 张新字卡`);
    else if (added === 0 && skipped === 0) showToast('没有新字卡可添加');
    overlay.remove();
    loadCardList(panel);
  });
}

function showEditCardDialog(id, content, panel) {
  const overlay = createModal(`
    <div class="big-input-title">编辑字卡</div>
    <textarea class="big-input-area" id="edit-card-area">${escapeHtml(content)}</textarea>
    <button class="save-btn-center" id="save-edit-card" style="margin-top:12px;">保存</button>`);
  overlay.querySelector('#save-edit-card').addEventListener('click', async () => {
    const newContent = overlay.querySelector('#edit-card-area').value.trim();
    if (newContent) {
      await idbPut('cards', { id, content: newContent });
      if (panel) loadCardList(panel);
    }
    overlay.remove();
  });
}

function openRecyclePanel(panel) {
  const overlay = createModal(`
    <div class="big-input-title">回收站</div>
    <div class="card-count-row"><span id="recycle-count"></span></div>
    <div class="card-list" id="recycle-list"></div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:12px;">
      <button class="mini-btn" id="recycle-restore-all">全部恢复</button>
      <button class="mini-btn" id="recycle-clear-all">清空</button>
    </div>`);
  loadRecycleList(overlay, panel);
  overlay.querySelector('#recycle-restore-all').addEventListener('click', async () => {
    const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
    for (const c of recycled) await idbPut('cards', { content: c.content });
    localStorage.setItem('recycledCards', '[]');
    loadRecycleList(overlay, panel);
    if (panel) loadCardList(panel);
  });
  overlay.querySelector('#recycle-clear-all').addEventListener('click', () => {
    localStorage.setItem('recycledCards', '[]');
    loadRecycleList(overlay, panel);
  });
}

function loadRecycleList(overlay, panel) {
  const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
  overlay.querySelector('#recycle-count').textContent = `共 ${recycled.length} 张`;
  const list = overlay.querySelector('#recycle-list');
  list.innerHTML = '';
  if (!recycled.length) {
    list.innerHTML = '<div class="placeholder-tip">回收站是空的</div>';
    return;
  }
  recycled.forEach((c, i) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${escapeHtml(c.content)}</div>
      <div class="card-ops"><button class="recycle-restore">恢复</button><button class="recycle-forever">彻删</button></div>`;
    div.querySelector('.recycle-restore').addEventListener('click', async () => {
      const all = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      await idbPut('cards', { content: all[i].content });
      all.splice(i, 1);
      localStorage.setItem('recycledCards', JSON.stringify(all));
      loadRecycleList(overlay, panel);
    });
    div.querySelector('.recycle-forever').addEventListener('click', () => {
      const all = JSON.parse(localStorage.getItem('recycledCards') || '[]');
      all.splice(i, 1);
      localStorage.setItem('recycledCards', JSON.stringify(all));
      loadRecycleList(overlay, panel);
    });
    list.appendChild(div);
  });
}

function openCardSearchPanel() {
  const overlay = createModal(`
    <div class="card-search-row"><input type="text" id="card-search-input" placeholder="请输入搜索内容..."></div>
    <div class="card-list" id="card-search-results"></div>`);
  const searchInput = overlay.querySelector('#card-search-input');
  const resultList = overlay.querySelector('#card-search-results');
  searchInput.addEventListener('input', async () => {
    const kw = searchInput.value.trim();
    const cards = await idbGetAll('cards');
    const filtered = kw ? cards.filter(c => c.content.includes(kw)) : cards;
    resultList.innerHTML = '';
    filtered.forEach(card => {
      const div = document.createElement('div');
      div.className = 'card-item';
      div.innerHTML = `<div class="card-text">${escapeHtml(card.content)}</div>
        <div class="card-ops"><button class="search-edit">✎</button><button class="search-del">✕</button></div>`;
      div.querySelector('.search-edit').addEventListener('click', () => showEditCardDialog(card.id, card.content, null));
      div.querySelector('.search-del').addEventListener('click', async () => {
        const recycled = JSON.parse(localStorage.getItem('recycledCards') || '[]');
        recycled.push(card);
        localStorage.setItem('recycledCards', JSON.stringify(recycled));
        await idbDelete('cards', card.id);
        searchInput.dispatchEvent(new Event('input'));
      });
      resultList.appendChild(div);
    });
  });
  searchInput.dispatchEvent(new Event('input'));
}
  // ========== 贴纸面板 ==========
function openStickerPanel() {
  const overlay = createModal(`
    <div class="big-input-title">贴纸库（共 <span id="sticker-count-num"></span> 张）</div>
    <div class="library-grid" id="sticker-library"></div>
    <button class="upload-btn" id="sticker-upload-btn">上传贴纸</button>
    <button class="upload-btn" id="sticker-import-btn">导入贴纸</button>
    <button class="upload-btn" id="sticker-export-btn">导出贴纸</button>
    <div style="margin-top:12px;font-size:13px;color:#4a3528;">TA发贴纸概率</div>
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
      <button class="mini-btn sticker-tpl" data-tpl="rare">偶尔惊喜</button>
      <button class="mini-btn sticker-tpl" data-tpl="daily">日常甜</button>
      <button class="mini-btn sticker-tpl" data-tpl="active">活跃</button>
    </div>`);
  loadStickerLibrary(overlay);
  overlay.querySelector('#sticker-upload-btn').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.multiple = true;
    inp.onchange = async (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      const previewOverlay = createModal(`
        <div class="big-input-title">预览贴纸</div>
        <div style="font-size:13px;color:#4a3528;margin-bottom:12px;">共 ${files.length} 张</div>
        <div class="library-grid" id="sticker-preview-grid"></div>
        <div class="big-input-hint" id="sticker-progress">准备就绪</div>
        <button class="save-btn-center" id="confirm-sticker-upload" style="margin-top:14px;">确认添加</button>`);
      const grid = previewOverlay.querySelector('#sticker-preview-grid');
      const dataUrls = [];
      for (const file of files) {
        const dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });
        if (dataUrl) {
          dataUrls.push(dataUrl);
          const div = document.createElement('div');
          div.className = 'lib-item';
          div.innerHTML = `<img src="${dataUrl}" alt="">`;
          grid.appendChild(div);
        }
      }
      previewOverlay.querySelector('#confirm-sticker-upload').addEventListener('click', async () => {
        const progressEl = previewOverlay.querySelector('#sticker-progress');
        let ok = 0, fail = 0;
        for (let i = 0; i < dataUrls.length; i++) {
          progressEl.textContent = `正在添加 ${i + 1}/${dataUrls.length}...`;
          try { await libPush('stickerLibrary', dataUrls[i], 'sticker'); ok++; } catch (err) { fail++; }
          await delay(20);
        }
        progressEl.textContent = `完成：成功 ${ok} 张${fail ? '，失败 ' + fail + ' 张' : ''}`;
        previewOverlay.remove();
        overlay.remove();
        openStickerPanel();
        showToast(`已添加 ${ok} 张贴纸${fail ? '，失败 ' + fail + ' 张' : ''}`);
      });
    };
    inp.click();
  });
  overlay.querySelector('#sticker-import-btn').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json';
    inp.onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const data = JSON.parse(text);
      const items = data.stickers || data;
      let ok = 0;
      for (const s of items) {
        try { await libPush('stickerLibrary', s, 'sticker'); ok++; } catch (err) {}
      }
      showToast(`已导入 ${ok} 张贴纸`);
      overlay.remove();
      openStickerPanel();
    };
    inp.click();
  });
  overlay.querySelector('#sticker-export-btn').addEventListener('click', async () => {
    const list = await libGet('stickerLibrary');
    downloadFile(JSON.stringify({ stickers: list.map(x => x.data) }), '贴纸导出.json', 'application/json');
  });
  overlay.querySelectorAll('.sticker-tpl').forEach(btn => {
    if (btn.dataset.tpl === settings.stickerTpl) {
      btn.style.background = 'rgba(255,150,100,0.6)';
      btn.style.color = '#fff';
    }
    btn.addEventListener('click', () => {
      settings.stickerTpl = btn.dataset.tpl;
      if (btn.dataset.tpl === 'rare') settings.stickerProb = 0.015;
      if (btn.dataset.tpl === 'daily') settings.stickerProb = 0.06;
      if (btn.dataset.tpl === 'active') settings.stickerProb = 0.17;
      saveSettings();
      overlay.remove();
      openStickerPanel();
    });
  });
}

async function loadStickerLibrary(overlay) {
  const list = await libGet('stickerLibrary');

async function updateAvatarPanelPreviews(overlay) {
  const ta = overlay.querySelector('#about-ta-avatar');
  const me = overlay.querySelector('#about-me-avatar');
  const taData = await resolveMedia(settings.taAvatar);
  const meData = await resolveMedia(settings.meAvatar);
  ta.src = taData || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52"><circle cx="26" cy="26" r="25" fill="rgba(255,255,255,0.5)"/><text x="26" y="33" text-anchor="middle" font-size="18" fill="rgba(90,70,60,0.6)">TA</text></svg>');
  me.src = meData || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="52" height="52"><circle cx="26" cy="26" r="25" fill="rgba(255,255,255,0.5)"/><text x="26" y="33" text-anchor="middle" font-size="18" fill="rgba(90,70,60,0.6)">我</text></svg>');
}

async function loadAvatarLibrary(overlay) {
  const list = await libGet('avatarLibrary');
  const grid = overlay.querySelector('#avatar-library');
  grid.innerHTML = '';
  for (const a of list) {
    const taData = await resolveMedia(settings.taAvatar);
    const meData = await resolveMedia(settings.meAvatar);
    const div = document.createElement('div');
    div.className = 'lib-item';
    if (taData === a.data || meData === a.data) div.classList.add('active');
    div.innerHTML = `<img src="${a.data}" alt=""><button class="lib-del">✕</button>`;
    div.addEventListener('click', async (e) => {
      if (e.target.closest('.lib-del')) {
        const refs = libGetRefs('avatarLibrary').filter(r => r !== a.ref);
        libSetRefs('avatarLibrary', refs);
        mediaDel(a.ref);
        if (settings.taAvatar === a.ref) { settings.taAvatar = ''; await saveSettings(); applySettings(); }
        if (settings.meAvatar === a.ref) { settings.meAvatar = ''; await saveSettings(); applySettings(); }
        loadAvatarLibrary(overlay);
        return;
      }
      openAvatarMarkDialog(a, overlay);
    });
    grid.appendChild(div);
  }
}

function openAvatarMarkDialog(item, panelOverlay) {
  const overlay = createModal(`
    <div class="big-input-title">标记头像</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;">
      <button class="mini-btn" id="mark-ta">TA</button>
      <button class="mini-btn" id="mark-me">我</button>
      <button class="mini-btn" id="mark-couple">情侣可用</button>
    </div>`);
  overlay.querySelector('#mark-ta').addEventListener('click', async () => {
    settings.taAvatar = item.data;
    saveSettings();
    applySettings();
    overlay.remove();
    panelOverlay.remove();
    openAvatarPanel();
  });
  overlay.querySelector('#mark-me').addEventListener('click', async () => {
    settings.meAvatar = item.data;
    saveSettings();
    applySettings();
    overlay.remove();
    panelOverlay.remove();
    openAvatarPanel();
  });
  overlay.querySelector('#mark-couple').addEventListener('click', () => {

function bindAvatarEvents(overlay) {
  overlay.querySelector('#about-ta-name-click').addEventListener('click', (e) => { e.stopPropagation(); openNameEdit('ta', overlay); });
  overlay.querySelector('#about-ta-nick-click').addEventListener('click', (e) => { e.stopPropagation(); openNickEdit('ta', overlay); });
  overlay.querySelector('#about-me-name-click').addEventListener('click', (e) => { e.stopPropagation(); openNameEdit('me', overlay); });
  overlay.querySelector('#about-me-nick-click').addEventListener('click', (e) => { e.stopPropagation(); openNickEdit('me', overlay); });
  overlay.querySelector('#about-ta-nick-lib').addEventListener('click', (e) => { e.stopPropagation(); openNickLibraryPanel('ta', overlay); });
  overlay.querySelector('#about-me-nick-lib').addEventListener('click', (e) => { e.stopPropagation(); openNickLibraryPanel('me', overlay); });
  overlay.querySelector('#about-ta-change').addEventListener('click', async () => {
    const list = await libGet('avatarLibrary');
    if (!list.length) return showToast('头像库是空的');
    openAvatarSelectDialog('ta', list, overlay);
  });
  overlay.querySelector('#about-me-change').addEventListener('click', async () => {
    const list = await libGet('avatarLibrary');
    if (!list.length) return showToast('头像库是空的');
    openAvatarSelectDialog('me', list, overlay);
  });
  overlay.querySelector('#avatar-upload-btn').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.multiple = true;
    inp.onchange = async (e) => {
      const files = Array.from(e.target.files);
      let loaded = 0;
      for (const file of files) {
        const dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });
        if (dataUrl) { try { await libPush('avatarLibrary', dataUrl, 'avatar'); loaded++; } catch (err) {} }
      }
      showToast(`已上传 ${loaded} 张头像`);
      loadAvatarLibrary(overlay);
    };
    inp.click();
  });
}

async function loadBGPanel(overlay) {
  const current = overlay.querySelector('#current-bg-preview');
  const curData = await resolveMedia(settings.bgCurrent);
  current.innerHTML = curData ? `<img src="${curData}" style="width:100%;height:100%;object-fit:cover;">` : '<div class="placeholder-tip">使用默认暖色背景</div>';
  const list = await libGet('bgLibrary');
  const grid = overlay.querySelector('#bg-library');
  grid.innerHTML = '';
  list.forEach((item) => {
    const div = document.createElement('div');
    div.className = 'lib-item';
    if (settings.bgCurrent === item.ref) div.classList.add('active');
    div.innerHTML = `<img src="${item.data}" alt=""><button class="lib-del">✕</button>`;
    div.addEventListener('click', async (e) => {
      if (e.target.closest('.lib-del')) {
        const refs = libGetRefs('bgLibrary').filter(r => r !== item.ref);
        libSetRefs('bgLibrary', refs);
        mediaDel(item.ref);
        if (settings.bgCurrent === item.ref) settings.bgCurrent = '';
        await saveSettings();
        applyBG();
        loadBGPanel(overlay);
        return;
      }
      settings.bgCurrent = item.ref;
      await saveSettings();
      applyBG();
      loadBGPanel(overlay);
    });
    grid.appendChild(div);
  });
  const uploadBtn = overlay.querySelector('#bg-upload-btn');
  uploadBtn.onclick = () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.multiple = true;
    inp.onchange = async (e) => {
      const files = Array.from(e.target.files);
      let loaded = 0;
      for (const file of files) {
        const dataUrl = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(file);
        });
        if (dataUrl) { try { await libPush('bgLibrary', dataUrl, 'bg'); loaded++; } catch (err) {} }
      }
      showToast(`已上传 ${loaded} 张背景`);
      loadBGPanel(overlay);
    };
    inp.click();
  };
}

async function applyBG() {
  const canvas = document.getElementById('bg-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (settings.bgCurrent) {
    const data = await resolveMedia(settings.bgCurrent);
    if (data) {
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 0.85;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(255,255,255,0.12)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      };
      img.src = data;
      cachedBGImage = img;
      return;
    } else {
      settings.bgCurrent = '';
      await saveSettings();
    }
  }
  cachedBGImage = null;
  drawDefaultBG(ctx, canvas.width, canvas.height);
}

function drawDefaultBG(ctx, w, h) {
  const grad = ctx.createLinearGradient(0, 0, w, h);
  grad.addColorStop(0, '#fdd9c8');
  grad.addColorStop(0.4, '#f7d4e3');
  grad.addColorStop(0.7, '#dcd3f5');
  grad.addColorStop(1, '#c8ddf5');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);
}

async function renderMessages() {
  const area = document.getElementById('messages-area');
  const msgs = await idbGetAll('messages');
  const today = new Date().toDateString();
  const todayMsgs = msgs.filter(m => new Date(m.timestamp).toDateString() === today);
  area.innerHTML = '';
  todayMsgs.forEach(msg => area.appendChild(createMessageEl(msg)));
  area.scrollTop = area.scrollHeight;
  renderPinnedArea(todayMsgs);
}

function createMessageEl(msg) {
  const row = document.createElement('div');
  if (msg.isSystem) {
    row.className = 'message-row system';
    const bubble = document.createElement('div');
    bubble.className = 'msg-system-bubble';
    bubble.textContent = msg.content;
    row.appendChild(bubble);
    row.dataset.id = msg.id;
    return row;
  }
  row.className = 'message-row ' + msg.sender;
  row.dataset.id = msg.id;
  const avatar = document.createElement('img');
  avatar.className = 'msg-avatar';
  avatar.src = msg.sender === 'me'
    ? (settings.meAvatar || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.5)"/><text x="16" y="21" text-anchor="middle" font-size="12" fill="rgba(90,70,60,0.6)">我</text></svg>'))
    : (settings.taAvatar || 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><circle cx="16" cy="16" r="15" fill="rgba(255,255,255,0.5)"/><text x="16" y="21" text-anchor="middle" font-size="12" fill="rgba(90,70,60,0.6)">TA</text></svg>'));
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-content-wrapper';
  if (msg.quoteContent) {
    const quote = document.createElement('div');
    quote.className = 'msg-quote';
    quote.textContent = '「' + msg.quoteContent + '」';
    quote.addEventListener('click', () => scrollToMessageByContent(msg.quoteContent));
    wrapper.appendChild(quote);
  }
  const bubble = document.createElement('div');
  bubble.className = 'msg-bubble';
  if (msg.imageData) {
    bubble.style.padding = '4px';
    bubble.style.background = 'transparent';
    bubble.style.border = 'none';
    bubble.innerHTML = `<img src="${msg.imageData}" style="max-width:200px;border-radius:12px;display:block;">`;
  } else if (msg.giftData) {
    bubble.style.background = 'transparent';
    bubble.style.border = 'none';
    bubble.innerHTML = `<div class="msg-gift-card"><div class="msg-gift-icon">${msg.giftData.icon || '🎁'}</div><div class="msg-gift-name">${escapeHtml(msg.giftData.name || '礼物')}</div><div class="msg-gift-cost">-${msg.giftData.cost || 0}爱意值</div></div>`;
  } else if (msg.interactData) {
    if (msg.interactData.couple) {
      bubble.className = 'msg-bubble msg-interact-couple';
      bubble.textContent = msg.interactData.text || '';
    } else {
      bubble.style.background = 'transparent';
      bubble.style.border = 'none';
      bubble.innerHTML = `<div class="msg-interact-text">${escapeHtml(msg.interactData.text || '')}</div>`;
    }
  } else {
    bubble.textContent = msg.content;
  }
  wrapper.appendChild(bubble);
  const meta = document.createElement('div');
  meta.className = 'msg-meta';
  const timeSpan = document.createElement('span');
  const d = new Date(msg.timestamp);
  const hh = String(d.getHours()).padStart(2, '0');
  const mm = String(d.getMinutes()).padStart(2, '0');
  timeSpan.textContent = hh + ':' + mm;
  timeSpan.style.fontSize = '10px';
  timeSpan.style.color = 'rgba(120,100,90,0.5)';
  meta.appendChild(timeSpan);
  if (msg.sender === 'me' && msg.readTime) {
    const read = document.createElement('span');
    read.className = 'msg-read';
    read.textContent = '已读 ' + msg.readTime;
    meta.appendChild(read);
  }
  if (msg.pinned) {
    const pin = document.createElement('span');
    pin.className = 'msg-pin-mark';
    pin.textContent = '📌';
    meta.appendChild(pin);
  }
  if (msg.heartMark) {
    const heart = document.createElement('span');
    heart.className = 'msg-heart-mark';
    heart.textContent = '💗' + msg.heartMark;
    meta.appendChild(heart);
  }
  wrapper.appendChild(meta);
  if (msg.sender === 'me') {
    row.appendChild(wrapper);
    row.appendChild(avatar);
  } else {
    row.appendChild(avatar);
    row.appendChild(wrapper);
  }
  return row;
}

function scrollToMessageByContent(content) {
  const rows = document.querySelectorAll('.message-row');
  for (const r of rows) {
    const b = r.querySelector('.msg-bubble');
    if (b && b.textContent === content) {
      r.scrollIntoView({ behavior: 'smooth', block: 'center' });
      r.style.boxShadow = '0 0 0 3px rgba(255,143,176,0.5)';
      setTimeout(() => { r.style.boxShadow = ''; }, 2000);
      break;
    }
  }
}

async function renderPinnedArea(msgs) {
  const area = document.getElementById('pinned-area');
  area.innerHTML = '';
  const pinned = msgs.filter(m => m.pinned);
  pinned.slice(0, 3).forEach(m => {
    const div = document.createElement('div');
    div.className = 'pinned-item';
    const pinBy = m.pinBy === 'ta' ? 'TA置顶' : '我置顶';
    if (m.imageData) {
      div.innerHTML = `<span class="pin-icon">📌</span>${pinBy} <img src="${m.imageData}" style="width:24px;height:24px;border-radius:6px;object-fit:cover;">`;
    } else {
      const text = (m.content || '').slice(0, 20);
      div.innerHTML = `<span class="pin-icon">📌</span>${pinBy} ${escapeHtml(text)}${(m.content || '').length > 20 ? '...' : ''}`;
    }
    div.addEventListener('click', () => {
      const target = document.querySelector(`.message-row[data-id="${m.id}"]`);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
    area.appendChild(div);
  });
}

// ========== 已读回执 ==========
function scheduleReadReceipt(msg) {
  const delayMs = Math.random() * (settings.readMax - settings.readMin) + settings.readMin;
  setTimeout(async () => {
    const msgs = await idbGetAll('messages');
    const target = msgs.find(m => m.id === msg.id);
    if (target && target.sender === 'me' && !target.readTime) {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      target.readTime = hh + ':' + mm;
      await idbPut('messages', target);
      const row = document.querySelector(`.message-row[data-id="${msg.id}"] .msg-meta`);
      if (row) {
        const read = document.createElement('span');
        read.className = 'msg-read';
        read.textContent = '已读 ' + target.readTime;
        row.appendChild(read);
      }
    }
  }, delayMs);
}

// ========== 停止检测与回复 ==========
function resetStopTimer() {
  clearTimeout(stopTimer);
  const delayMs = Math.random() * (settings.stopDetectMax * 1000 - settings.stopDetectMin * 1000) + settings.stopDetectMin * 1000;
  stopTimer = setTimeout(() => triggerTAReply(), delayMs);
}

async function getRecentMeCount() {
  const msgs = await idbGetAll('messages');
  const today = new Date().toDateString();
  const todayMsgs = msgs.filter(m => new Date(m.timestamp).toDateString() === today);
  let count = 0;
  for (let i = todayMsgs.length - 1; i >= 0; i--) {
    const m = todayMsgs[i];
    if (m.sender === 'me') count++;
    else if (m.isSystem) continue;
    else break;
  }
  return count;
}

async function triggerTAReply() {
  if (isReplying || isArchiving) return;
  const cards = await idbGetAll('cards');
  if (!cards.length) { showTyping(false); return; }
  isReplying = true;
  const recentMe = await getRecentMeCount();
  let replyCount = 1;
  if (recentMe >= 1) replyCount = 1 + Math.floor(Math.random() * recentMe);
  replyCount = Math.min(replyCount, 5);
  if (replyCount < 1) replyCount = 1;
  replyQueue = [];
  const emojis = JSON.parse(localStorage.getItem('emojiLibrary') || '[]');
  for (let i = 0; i < replyCount; i++) {
    const stickers = await libGet('stickerLibrary');
    if (stickers.length && Math.random() < settings.stickerProb) {
      const sticker = stickers[Math.floor(Math.random() * stickers.length)];
      replyQueue.push({ type: 'sticker', content: sticker.data });
    } else {
      const card = cards[Math.floor(Math.random() * cards.length)];
      replyQueue.push({ type: 'text', content: card.content });
    }
  }
  showTyping(true);
  let waitTime = Math.random() * (settings.replyMax * 1000 - settings.replyMin * 1000) * 0.6 + settings.replyMin * 1000 * 0.4;
  await delay(waitTime);
  showTyping(false);
  for (let i = 0; i < replyQueue.length; i++) {
    const item = replyQueue[i];
    let content = item.type === 'sticker' ? '[贴纸]' : item.content;
    if (item.type === 'text') {
      content = applyMoodToText(content);
      if (settings.meNick && Math.random() < settings.nicknameProb) content = settings.meNick + '，' + content;
      if (emojis.length && Math.random() < settings.taEmojiProb) {
        const emoji = emojis[Math.floor(Math.random() * emojis.length)];
        content = Math.random() < 0.5 ? emoji + ' ' + content : content + ' ' + emoji;
      }
    }
    const msg = {
      sender: 'ta',
      content,
      imageData: item.type === 'sticker' ? item.content : null,
      timestamp: Date.now(),
      pinned: false,
      pinBy: '',
      heartMark: null,
      quoteContent: null
    };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    appendMessage(msg);
    settings.heartValue += 1;
    await saveSettings();
    updateHeartValue();
    sendNotification(content);
    if (i < replyQueue.length - 1) await delay(800 + Math.random() * 2000);
  }
  replyQueue = [];
  isReplying = false;
}

// ========== TA主动发消息（1~5条） ==========
function scheduleTAActive() {
  const next = Math.random() * (settings.activeMax - settings.activeMin) + settings.activeMin;
  setTimeout(async () => {
    const cards = await idbGetAll('cards');
    if (cards.length && !isReplying && !isArchiving) {
      const count = Math.random() < 0.4 ? 1 : (1 + Math.floor(Math.random() * 5));
      const emojis = JSON.parse(localStorage.getItem('emojiLibrary') || '[]');
      showTyping(true);
      await delay(1000 + Math.random() * 2000);
      showTyping(false);
      for (let i = 0; i < count; i++) {
        const card = cards[Math.floor(Math.random() * cards.length)];
        let content = applyMoodToText(card.content);
        if (settings.meNick && Math.random() < settings.nicknameProb) content = settings.meNick + '，' + content;
        if (emojis.length && Math.random() < settings.taEmojiProb) {
          const emoji = emojis[Math.floor(Math.random() * emojis.length)];
          content = Math.random() < 0.5 ? emoji + ' ' + content : content + ' ' + emoji;
        }
        const msg = { sender: 'ta', content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, quoteContent: null };

  // ========== TA自主行为 ==========
function scheduleTAAutonomy() {
  setInterval(async () => {
    if (Math.random() < settings.autonomyProb) {
      const msgs = await idbGetAll('messages');
      const today = new Date().toDateString();
      const todayMsgs = msgs.filter(m => new Date(m.timestamp).toDateString() === today);
      const pool = todayMsgs.length ? todayMsgs : msgs;
      if (pool.length) {
        const target = pool[Math.floor(Math.random() * pool.length)];
        const action = Math.random();
        if (action < 0.25) {
          target.pinned = !target.pinned;
          target.pinBy = target.pinned ? 'ta' : '';
          await idbPut('messages', target);
          renderMessages();
        } else if (action < 0.45) {
          target.heartMark = target.heartMark ? null : 'TA收藏';
          await idbPut('messages', target);
          renderMessages();
        } else if (action < 0.55) {
          target.heartMark = target.heartMark ? null : 'TA指定';
          await idbPut('messages', target);
          renderMessages();
        } else if (action < 0.65 && Math.random() < settings.taQuoteProb) {
          await taQuoteMessage(target);
        } else if (action < 0.75 && Math.random() < settings.taNickProb) {
          await taChangeNick();
        } else if (action < 0.85 && Math.random() < settings.taNickProb) {
          await taChangeMeNick();
        } else if (action < 0.92 && Math.random() < settings.taStickerProb) {
          await taSendSticker();
        } else if (Math.random() < settings.taGiftProb) {
          await taSendGift();
        }
      }
    }
  }, 600000);
}

function openCamera() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.capture = 'environment';
  inp.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async () => await sendImageMessage(reader.result);
    reader.readAsDataURL(file);
  };
  inp.click();
}

function openAlbum() {
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*';
  inp.multiple = true;
  inp.onchange = async (e) => {
    const files = Array.from(e.target.files);
    for (const file of files) {
      const reader = new FileReader();
      reader.onload = async () => await sendImageMessage(reader.result);
      reader.readAsDataURL(file);
    }
  };
  inp.click();
}

// ========== 问答玩法（含判定支持字母） ==========
async function startQuiz() {
  if (pendingQuiz) return showToast('还有一题没答完');
  const quizzes = JSON.parse(localStorage.getItem('quizLibrary') || '[]');
  const cards = await idbGetAll('cards');
  if (Math.random() < 0.5 && quizzes.length) {
    await startLibraryQuiz(quizzes);
  } else if (cards.length >= 2) {
    await startCardQuiz(cards);
  } else if (quizzes.length) {
    await startLibraryQuiz(quizzes);
  } else if (cards.length >= 2) {
    await startCardQuiz(cards);
  } else {
    showToast('先添加字卡或问答题库');
  }
}

async function startLibraryQuiz(quizzes) {
  const quiz = quizzes[Math.floor(Math.random() * quizzes.length)];
  let content = '💫 问答：' + quiz.question + '\n';
  quiz.options.forEach((opt, i) => { content += String.fromCharCode(65 + i) + '：' + opt + '\n'; });
  content += '（请回复选项字母或内容）';
  const msg = { sender: 'ta', content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
  pendingQuiz = { type: 'library', quiz };
}

async function startCardQuiz(cards) {
  const shuffled = [...cards].sort(() => Math.random() - 0.5).slice(0, Math.min(4, cards.length));
  let content = '💫 问答：TA现在最想对你说哪句话？\n';
  shuffled.forEach((card, i) => { content += String.fromCharCode(65 + i) + '：' + card.content + '\n'; });
  content += '（请回复选项字母或内容）';
  const msg = { sender: 'ta', content, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
  const id = await idbPutReturnId('messages', msg);
  msg.id = id;
  appendMessage(msg);
  pendingQuiz = { type: 'card', cards: shuffled };
}

function normalizeAnswer(answer, options) {
  const a = String(answer).trim();
  if (/^[A-Da-d]$/.test(a)) {
    const idx = a.toUpperCase().charCodeAt(0) - 65;
    if (options[idx] !== undefined) return options[idx];
  }
  return a;
}

async function checkQuizAnswer(myAnswer) {
  const quiz = pendingQuiz;
  if (!quiz) return;
  pendingQuiz = null;
  let options, taPick;
  if (quiz.type === 'card') {
    options = quiz.cards.map(c => c.content);
    taPick = options[Math.floor(Math.random() * options.length)];
  } else {
    options = quiz.quiz.options;
    taPick = options[Math.floor(Math.random() * options.length)];
  }
  const myPick = normalizeAnswer(myAnswer, options);
  const taMsg = { sender: 'ta', content: taPick, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
  const tid = await idbPutReturnId('messages', taMsg);
  taMsg.id = tid;
  appendMessage(taMsg);
  const matched = taPick.includes(myPick) || myPick.includes(taPick);
  let result;
  if (matched) {
    result = '💗 你们想的一样！爱意值+10';
    settings.heartValue += 10;
  } else {
    result = '🤍 你们的答案不一样。爱意值-5';
    settings.heartValue = Math.max(0, settings.heartValue - 5);
  }
  await saveSettings();
  updateHeartValue();
  const resultMsg = { sender: 'ta', content: result, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null, isSystem: true };
  const rid = await idbPutReturnId('messages', resultMsg);
  resultMsg.id = rid;
  appendMessage(resultMsg);
}

function scheduleTAQuiz() {
  const next = Math.random() * (settings.taQuizMax - settings.taQuizMin) + settings.taQuizMin;
  setTimeout(async () => {
    if (!pendingQuiz && !isReplying && !isArchiving) {
      await startQuiz();
      sendNotification('TA想和你玩问答');
    }
    scheduleTAQuiz();
  }, next);
}

function checkReminders() {
  const now = new Date();
  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const currentTime = hh + ':' + mm;
  if (!settings.reminderTimes || !settings.reminderTimes.includes(currentTime)) return;
  const checked = JSON.parse(localStorage.getItem('reminderChecked') || '{}');
  const today = now.toDateString();
  if (checked[today + currentTime]) return;
  checked[today + currentTime] = true;
  localStorage.setItem('reminderChecked', JSON.stringify(checked));
  if (Math.random() > settings.reminderProb) return;
  if (!settings.reminderCards || !settings.reminderCards.length) return;
  const card = settings.reminderCards[Math.floor(Math.random() * settings.reminderCards.length)];
  const msg = { sender: 'ta', content: card, timestamp: Date.now(), pinned: false, pinBy: '', heartMark: null };
  idbPutReturnId('messages', msg).then(id => { msg.id = id; appendMessage(msg); sendNotification(card); });
}

function applySleepMode() {

  taAvatar.style.transform = 'translateX(6px)';

}

function removeSleepMode() {
  document.getElementById('app').style.filter = '';
  const taAvatar = document.getElementById('ta-avatar-top');
