function loadPeriodData(overlay) {
  const records = JSON.parse(localStorage.getItem('periodRecords') || '[]');
  const starts = records.filter(r => r.type === 'start').map(r => r.date).sort();
  let summary = '还没有记录';
  if (starts.length) {
    summary = '上次开始：' + starts[starts.length - 1];
    if (starts.length >= 2) {
      const cycleDays = Math.round((new Date(starts[starts.length - 1]) - new Date(starts[starts.length - 2])) / 86400000);
      summary += ' ｜ 周期约 ' + cycleDays + ' 天';
      const nextDate = new Date(starts[starts.length - 1]);
      nextDate.setDate(nextDate.getDate() + cycleDays);
      summary += ' ｜ 预测下次：' + nextDate.toISOString().slice(0, 10);
    }
  }
  overlay.querySelector('#period-summary').textContent = summary;
  const calendar = overlay.querySelector('#period-calendar');
  calendar.innerHTML = '';
  starts.forEach(date => {
    const div = document.createElement('div');
    div.className = 'playback-date';
    div.textContent = date;
    div.style.background = 'rgba(255,143,176,0.5)';
    calendar.appendChild(div);
  });
  const list = overlay.querySelector('#period-list');
  list.innerHTML = '';
  records.slice().reverse().forEach(r => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${r.date} - ${r.type === 'start' ? '开始' : '结束'}</div>`;
    list.appendChild(div);
  });
}

function checkPeriodCare() {
  const today = new Date().toISOString().slice(0, 10);
  const records = JSON.parse(localStorage.getItem('periodRecords') || '[]');
  const starts = records.filter(r => r.type === 'start').map(r => r.date);
  const ends = records.filter(r => r.type === 'end').map(r => r.date);
  const lastStart = starts[starts.length - 1];
  const lastEnd = ends[ends.length - 1];
  if (!lastStart) return;
  const isActive = !lastEnd || (new Date(lastEnd) < new Date(lastStart)) || (new Date(today) <= new Date(lastStart) + 7 * 86400000);
  if (!isActive) return;
  const checked = JSON.parse(localStorage.getItem('periodCareChecked') || '{}');
  if (checked[today]) return;
  checked[today] = true;
  localStorage.setItem('periodCareChecked', JSON.stringify(checked));
  const cards = JSON.parse(localStorage.getItem('periodCards') || '[]');
  if (!cards.length) return;
  const card = cards[Math.floor(Math.random() * cards.length)];
  let pool = onlineWorlds.length ? onlineWorlds : ['real'];
  const wid = pool[Math.floor(Math.random() * pool.length)];
  const msg = { sender: 'ta', content: card, timestamp: Date.now(), heartMark: null, worldId: wid, worldLabel: getWorldLabel(wid) };
  idbPutReturnId('messages', msg).then(async id => { msg.id = id; await appendMessage(msg); sendNotification(card); addNotification('🌸', '易遇的生理期关怀'); addBigEvent('period', '第一次收到生理期关怀'); });
}

async function handleDateInviteResponse(invite, isDelayed) {
  const wid = invite.worldId;
  const myMsg = { sender: 'me', content: `邀请你 ${invite.date} ${invite.time} 去${invite.place}${invite.activity}，可以吗？`, timestamp: Date.now(), heartMark: null, quoteContent: null };
  const mid = await idbPutReturnId('messages', myMsg);
  myMsg.id = mid;
  await appendMessage(myMsg);
  await delay(800 + Math.random() * 1200);
  const accepted = Math.random() < 0.7;
  let taContent;
  if (accepted) {
    taContent = getDateText('accept');
  } else {
    taContent = getDateText('reject');
  }
  const taMsg = { sender: 'ta', content: taContent, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
  const tid = await idbPutReturnId('messages', taMsg);
  taMsg.id = tid;
  await appendMessage(taMsg);
  const records = JSON.parse(localStorage.getItem('dateRecords') || '[]');
  records.push({
    id: invite.id,
    worldId: wid,
    date: invite.date,
    time: invite.time,
    place: invite.place,
    activity: invite.activity,
    from: 'me',
    status: accepted ? 'pending' : 'cancelled',
    createdAt: invite.createdAt,
    reminded: false
  });
  localStorage.setItem('dateRecords', JSON.stringify(records));
  addBigEvent('dateinvite', '第一次发出约会邀请');
  if (accepted) addBigEvent('dateaccept', '第一次约会邀请被接受');
}

function scheduleTADateInvite() {
  const next = Math.random() * (settings.taDateMax - settings.taDateMin) + settings.taDateMin;
  setTimeout(async () => {
    if (!isReplying && !isArchiving && onlineWorlds.length) {
      const wid = onlineWorlds[Math.floor(Math.random() * onlineWorlds.length)];
      const placeData = JSON.parse(localStorage.getItem('datePlaceActivity') || '{"place":[],"activity":[]}');
      if (placeData.place && placeData.place.length && placeData.activity && placeData.activity.length) {
        const range = [1, 3, 5, 7][Math.floor(Math.random() * 4)];
        const place = placeData.place[Math.floor(Math.random() * placeData.place.length)];
        const activity = placeData.activity[Math.floor(Math.random() * placeData.activity.length)];
        const today = new Date();
        const candidateDatesArr = [];
        for (let i = 1; i <= range; i++) {
          const d = new Date(today);
          d.setDate(d.getDate() + i);
          candidateDatesArr.push(d.toISOString().slice(0, 10));
        }
        const inviteMsg = { sender: 'ta', content: `大概${range}天后，想约你去${place}${activity}，选个时间吧`, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
        const id = await idbPutReturnId('messages', inviteMsg);
        inviteMsg.id = id;
        await appendMessage(inviteMsg);
        const records = JSON.parse(localStorage.getItem('dateRecords') || '[]');
        records.push({
          id: 'inv_ta_' + Date.now(),
          worldId: wid,
          date: '',
          time: '',
          place, activity,
          from: 'ta',
          status: 'pending',
          range,
          candidateDates: candidateDatesArr.map(d => d.slice(5)).join(' / '),
          candidateDatesArr,
          createdAt: Date.now(),
          reminded: false
        });
        localStorage.setItem('dateRecords', JSON.stringify(records));
        sendNotification('易遇约你了');
        addNotification('💗', '易遇约你了');
        addBigEvent('tadateinvite', '第一次收到易遇的约会邀请');
      }
    }
    scheduleTADateInvite();
  }, next);
}

function checkDateReminders() {
  const now = Date.now();
  const records = JSON.parse(localStorage.getItem('dateRecords') || '[]');
  let changed = false;
  records.forEach(r => {
    if (r.status !== 'pending' || r.reminded) return;
    if (!r.date || !r.time) return;
    const targetTime = new Date(r.date + 'T' + r.time).getTime();
    if (isNaN(targetTime)) return;
    const diff = targetTime - now;
    if (diff > 0 && diff <= 3600000) {
      r.reminded = true;
      changed = true;
      const taMsg = { sender: 'ta', content: getDateText('remind'), timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: r.worldId, worldLabel: getWorldLabel(r.worldId) };
      idbPutReturnId('messages', taMsg).then(async id => { taMsg.id = id; await appendMessage(taMsg); });
      sendNotification('约会提醒');
      addNotification('⏰', '约会提醒');
    }
  });
  if (changed) localStorage.setItem('dateRecords', JSON.stringify(records));
}
setInterval(checkDateReminders, 60000);

  if (tab === 'common') overlay.querySelector('#wish-tab-common').classList.add('active');

function loadWishList(overlay, tab) {
  const wishes = JSON.parse(localStorage.getItem('wishes') || '{"me":[],"ta":[],"common":[]}');
  const items = wishes[tab] || [];
  const list = overlay.querySelector('#wish-list');
  list.innerHTML = '';
  if (!items.length) { list.innerHTML = '<div class="placeholder-tip">还没有心愿</div>'; return; }
  items.forEach((w, i) => {
    const div = document.createElement('div');
    div.className = 'card-item';
    div.innerHTML = `<div class="card-text">${escapeHtml(w.text)} ${w.done ? '✅' : '⭐'}</div>
      <div class="card-ops"><button class="wish-done">✓</button><button class="wish-del">✕</button></div>`;
    div.querySelector('.wish-done').addEventListener('click', () => {
      wishes[tab][i].done = !wishes[tab][i].done;
      localStorage.setItem('wishes', JSON.stringify(wishes));
      loadWishList(overlay, tab);
    });
    div.querySelector('.wish-del').addEventListener('click', () => {
      wishes[tab].splice(i, 1);
      localStorage.setItem('wishes', JSON.stringify(wishes));

function getPets() {
  let pets = JSON.parse(localStorage.getItem('petDataList') || 'null');
  if (!pets) {
    const oldPet = JSON.parse(localStorage.getItem('petData') || 'null');
    if (oldPet) { pets = [oldPet]; localStorage.setItem('petDataList', JSON.stringify(pets)); }
    else pets = [];
  }
  return pets;
}

function savePets(pets) { localStorage.setItem('petDataList', JSON.stringify(pets)); }

function petStageName(stage) {
  if (stage === 'egg') return '蛋';
  if (stage === 'young') return '幼年';
  return '成年';
}

function petColor(type) {
  const map = { cat: 'rgba(255,200,220,0.6)', dog: 'rgba(210,180,140,0.6)', rabbit: 'rgba(240,240,250,0.7)', hamster: 'rgba(255,220,150,0.6)', egg: 'rgba(255,240,210,0.7)', custom: 'rgba(220,210,240,0.6)' };
  return map[type] || 'rgba(255,200,220,0.5)';
}

function petMoodEmoji(pet) {
  if (pet.left) return '😢';
  const min = Math.min(pet.hunger, pet.mood, pet.clean);
  if (min <= 2) return '😿';
  if (min <= 4) return '😐';
  if (min <= 7) return '😺';
  return '😸';
}

function petTip(pet) {
  if (pet.left) return '';
  if (pet.hunger <= 3) return '肚子咕咕叫';
  if (pet.clean <= 3) return '毛毛乱糟糟';
  if (pet.mood <= 3) return '有点闷闷的';
  if (Math.min(pet.hunger, pet.mood, pet.clean) >= 9) return '尾巴摇成花';
  return '';
}

function openPetPanel() {
  const overlay = createModal(`<div id="pet-panel-content"></div>`);
  const content = overlay.querySelector('#pet-panel-content');
  renderPetPanel(content, getPets());
  registerPanelUpdater('pet', () => renderPetPanel(content, getPets()));
}

async function renderPetPanel(content, pets) {
  content.innerHTML = '';
  if (!pets.length) content.innerHTML = '<div class="placeholder-tip">还没有宠物，领养一只吧</div>';
  for (let i = 0; i < pets.length; i++) {
    const pet = pets[i];
    let avatarHTML;
    if (pet.imageRef) {
      const data = await resolveMedia(pet.imageRef);
      avatarHTML = data ? `<div class="pet-avatar" data-pet-idx="${i}"><img src="${data}"></div>` : `<div class="pet-avatar" data-pet-idx="${i}">${pet.emoji}</div>`;
    } else if (pet.image) {
      avatarHTML = `<div class="pet-avatar" data-pet-idx="${i}"><img src="${pet.image}"></div>`;
    } else {
      avatarHTML = `<div class="pet-avatar" data-pet-idx="${i}">${pet.emoji}</div>`;
    }
    const allFull = pet.hunger >= 10 && pet.mood >= 10 && pet.clean >= 10;
    const card = document.createElement('div');
    card.className = 'pet-card' + (allFull ? ' full-glow' : '') + (pet.left ? ' left-home' : '');
    card.style.setProperty('--pet-color', petColor(pet.type));
    const tip = petTip(pet);
    const careRecord = pet.lastCareWorld ? `<div class="pet-care-record">最近照顾：${escapeHtml(pet.lastCareWorld)}</div>` : '';
    const leftTip = pet.left ? `<div class="pet-left-tip">离家出走了…</div>` : '';
    card.innerHTML = `
      <div class="pet-head">
        ${avatarHTML}
        <div class="pet-info">
          <div class="pet-name">${escapeHtml(pet.name)} <span style="font-size:15px;">${petMoodEmoji(pet)}</span></div>
          <div class="pet-stage">${petStageName(pet.stage)}</div>
          ${tip ? `<div class="pet-tip">${tip}</div>` : ''}
          ${leftTip}
        </div>
      </div>
      <div class="pet-stat-row"><span class="pet-stat-ico">🍖</span><div class="pet-stat-bar${pet.hunger >= 10 ? ' full' : ''}"><div style="width:${pet.hunger * 10}%;background:linear-gradient(90deg,#ffb56b,#ff8f4d);"></div></div></div>
      <div class="pet-stat-row"><span class="pet-stat-ico">💗</span><div class="pet-stat-bar${pet.mood >= 10 ? ' full' : ''}"><div style="width:${pet.mood * 10}%;background:linear-gradient(90deg,#ffb0c8,#ff7b9c);"></div></div></div>
      <div class="pet-stat-row"><span class="pet-stat-ico">🫧</span><div class="pet-stat-bar${pet.clean >= 10 ? ' full' : ''}"><div style="width:${pet.clean * 10}%;background:linear-gradient(90deg,#9ad4f0,#5ab0e0);"></div></div></div>
      ${careRecord}
      ${pet.left ? `<button class="pet-recall-btn" data-action="recall" data-idx="${i}">找回它</button>` : `
      <div class="pet-actions">
        <button data-action="feed" data-idx="${i}" title="喂食">🍖</button>
        <button data-action="play" data-idx="${i}" title="陪玩">🎾</button>
        <button data-action="clean" data-idx="${i}" title="清洁">🛁</button>
        <button data-action="del" data-idx="${i}" title="送走">🗑</button>
      </div>`}`;
    content.appendChild(card);
  }
  const addBtn = document.createElement('button');
  addBtn.className = 'pet-add-card';
  addBtn.innerHTML = '<span style="font-size:18px;">🐾</span><span>再领养一只</span>';
  addBtn.addEventListener('click', () => openPetAdoptDialog());
  content.appendChild(addBtn);

  content.querySelectorAll('.pet-avatar').forEach(av => {
    av.addEventListener('click', () => {
      av.classList.remove('bounce');
      void av.offsetWidth;
      av.classList.add('bounce');
      const heart = document.createElement('div');
      heart.textContent = '💗';
      heart.style.cssText = 'position:absolute;font-size:16px;pointer-events:none;animation:sparkleFloat 1.2s ease-out forwards;';
      av.style.position = 'relative';
      av.appendChild(heart);
      setTimeout(() => heart.remove(), 1200);
    });
  });

  content.querySelectorAll('.pet-actions button').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      const idx = Number(btn.dataset.idx);
      const list = getPets();
      const pet = list[idx];
      if (action === 'feed') pet.hunger = Math.min(10, pet.hunger + 3);
      else if (action === 'play') pet.mood = Math.min(10, pet.mood + 3);
      else if (action === 'clean') pet.clean = Math.min(10, pet.clean + 4);
      else if (action === 'del') {
        if (!confirm('确定送走「' + pet.name + '」吗？')) return;
        list.splice(idx, 1);
      }
      savePets(list);
      renderPetPanel(content, list);
    });
  });
  content.querySelectorAll('.pet-recall-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = Number(btn.dataset.idx);
      const list = getPets();
      const pet = list[idx];
      if (!pet) return;
      pet.left = false;
      pet.hunger = 5;
      pet.mood = 5;
      pet.clean = 5;
      pet.zeroDays = 0;
      savePets(list);
      addBigEvent('petrecall', '第一次找回离家宠物');
      renderPetPanel(content, list);
      showToast('宠物找回啦');
    });
  });
}

function openPetAdoptDialog() {
  const overlay = createModal(`
    <div class="big-input-title">领养宠物</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;">
      <div class="pet-adopt-card" data-type="cat"><div class="pa-icon">🐱</div><div class="pa-name">猫</div></div>
      <div class="pet-adopt-card" data-type="dog"><div class="pa-icon">🐶</div><div class="pa-name">狗</div></div>
      <div class="pet-adopt-card" data-type="rabbit"><div class="pa-icon">🐰</div><div class="pa-name">兔子</div></div>
      <div class="pet-adopt-card" data-type="hamster"><div class="pa-icon">🐹</div><div class="pa-name">仓鼠</div></div>
      <div class="pet-adopt-card" data-type="egg"><div class="pa-icon">🥚</div><div class="pa-name">蛋</div></div>
      <div class="pet-adopt-card" data-type="custom"><div class="pa-icon">🖼️</div><div class="pa-name">上传图片</div></div>
    </div>
    <input type="text" id="pet-name-input" placeholder="宠物名字" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:12px;">
    <button class="save-btn-center" id="adopt-pet-btn">领养</button>`);
  let petType = 'cat';
  let petImageRef = '';
  const cards = overlay.querySelectorAll('.pet-adopt-card');
  cards[0].classList.add('selected');
  cards.forEach(card => {
    card.addEventListener('click', () => {
      if (card.dataset.type === 'custom') {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'image/*';
        inp.onchange = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = async () => {
            try {
              petImageRef = await libPush('petImageLibrary', reader.result, 'petimg');
              card.querySelector('.pa-name').textContent = '已选择';
              petType = 'custom';
              cards.forEach(c => c.classList.remove('selected'));
              card.classList.add('selected');
            } catch (err) { showToast('图片太大'); }
          };
          reader.readAsDataURL(file);
        };
        inp.click();
      } else {
        petType = card.dataset.type;
        cards.forEach(c => c.classList.remove('selected'));
        card.classList.add('selected');
      }
    });
  });
  overlay.querySelector('#adopt-pet-btn').addEventListener('click', () => {
    if (petType === 'custom' && !petImageRef) return showToast('请先选择图片');
    const name = overlay.querySelector('#pet-name-input').value.trim() || '小宠物';
    const typeEmoji = { cat: '🐱', dog: '🐶', rabbit: '🐰', hamster: '🐹', egg: '🥚', custom: '🐾' };
    const pet = { name, type: petType, emoji: typeEmoji[petType], imageRef: petImageRef, hunger: 8, mood: 8, clean: 8, stage: petType === 'egg' ? 'egg' : 'young', bornDate: new Date().toISOString().slice(0, 10), lastCareWorld: '', left: false, zeroDays: 0 };
    const list = getPets();
    list.push(pet);
    savePets(list);
    addBigEvent('petadopt', '第一次领养宠物');
    showToast('领养成功');
    overlay.remove();
    openPetPanel();
  });
}

function checkPetStatus() {
  const list = getPets();
  if (!list.length) return;
  let needCare = false;
  list.forEach(pet => {
    if (pet.left) return;
    pet.hunger = Math.max(0, pet.hunger - 1);
    pet.mood = Math.max(0, pet.mood - 1);
    pet.clean = Math.max(0, pet.clean - 1);
    if (pet.hunger === 0 && pet.mood === 0 && pet.clean === 0) {
      pet.zeroDays = (pet.zeroDays || 0) + 1;
    } else {
      pet.zeroDays = 0;
    }
    if (pet.zeroDays >= 18) {
      pet.left = true;
      addBigEvent('petleft', '第一次宠物离家');
    }
    if (pet.hunger < 3 || pet.mood < 3 || pet.clean < 3) needCare = true;
  });
  savePets(list);
  if (needCare) taAutoCarePets();
}
setInterval(checkPetStatus, 14400000);

async function taAutoCarePets() {
  const list = getPets();
  if (!list.length) return;
  let cared = 0;
  list.forEach(pet => {
    if (pet.left) return;
    const min = Math.min(pet.hunger, pet.mood, pet.clean);
    if (min >= 3) return;
    if (pet.hunger <= pet.mood && pet.hunger <= pet.clean) pet.hunger = Math.max(8, Math.min(10, pet.hunger + 4));
    else if (pet.mood <= pet.clean) pet.mood = Math.max(8, Math.min(10, pet.mood + 4));
    else pet.clean = Math.max(8, Math.min(10, pet.clean + 5));
    cared++;
  });
  if (cared > 0) {
    let pool = onlineWorlds.length ? onlineWorlds : ['real'];
    const wid = pool[Math.floor(Math.random() * pool.length)];
    list.forEach(p => { p.lastCareWorld = getWorldLabel(wid); });
    savePets(list);
    addNotification('🐾', `易遇照顾了宠物（${cared}只）`);
    refreshOpenPanels();
  }
}

function scheduleTAPetCare() {
  const next = Math.random() * (settings.taPetCareMax - settings.taPetCareMin) + settings.taPetCareMin;
  setTimeout(async () => {
    if (!isReplying && !isArchiving) {
      await taAutoCarePets();
      refreshOpenPanels();
    }
    scheduleTAPetCare();
  }, next);
}

// ========== 种植 ==========
function getPlantsData() {
  return JSON.parse(localStorage.getItem('plantsData') || '{"flowers":[],"trees":[]}');
}

function savePlantsData(data) {
  localStorage.setItem('plantsData', JSON.stringify(data));
}

function getFlowerTypes() {
  return settings.flowerTypes && settings.flowerTypes.length ? settings.flowerTypes : JSON.parse(JSON.stringify(DEFAULT_FLOWER_TYPES));
}

function getTreeTypes() {
  return settings.treeTypes && settings.treeTypes.length ? settings.treeTypes : JSON.parse(JSON.stringify(DEFAULT_TREE_TYPES));
}

function openPlantPanel() {
  const overlay = createModal(`
    <div class="heart-tabs">
      <button class="heart-tab active" id="plant-tab-flower">花</button>
      <button class="heart-tab" id="plant-tab-tree">树</button>
    </div>
    <div id="plant-content"></div>`);
  let currentTab = 'flower';
  loadPlantContent(overlay, currentTab);
  overlay.querySelector('#plant-tab-flower').addEventListener('click', () => { currentTab = 'flower'; switchPlantTab('flower', overlay); });
  overlay.querySelector('#plant-tab-tree').addEventListener('click', () => { currentTab = 'tree'; switchPlantTab('tree', overlay); });
}

function switchPlantTab(tab, overlay) {
  overlay.querySelectorAll('.heart-tab').forEach(t => t.classList.remove('active'));
  if (tab === 'flower') overlay.querySelector('#plant-tab-flower').classList.add('active');
  if (tab === 'tree') overlay.querySelector('#plant-tab-tree').classList.add('active');
  loadPlantContent(overlay, tab);
}

function loadPlantContent(overlay, tab) {
  const plants = getPlantsData();
  const items = tab === 'flower' ? plants.flowers : plants.trees;
  const container = overlay.querySelector('#plant-content');
  container.innerHTML = '';
  if (!items.length) {
    container.innerHTML = `<div class="placeholder-tip">还没有${tab === 'flower' ? '花' : '树'}</div>`;
  }
  items.forEach((p, i) => {
    const typeLib = tab === 'flower' ? getFlowerTypes() : getTreeTypes();
    const typeInfo = typeLib.find(t => t.id === p.typeId) || { name: p.name || '未知', emoji: p.type === 'flower' ? '🌸' : '🌳', stages: p.type === 'flower' ? ['🌰','🌱','🌷','🌸'] : ['🌰','🌱','🌿','🪴','🌳'] };
    const stages = typeInfo.stages || (tab === 'flower' ? ['🌰','🌱','🌷','🌸'] : ['🌰','🌱','🌿','🪴','🌳']);
    const maxStage = stages.length - 1;
    const stageIdx = Math.min(p.stage, maxStage);
    const matureEmoji = typeInfo.emoji || stages[maxStage];
    const displayEmoji = p.stage >= maxStage ? matureEmoji : stages[stageIdx];
    const isMature = p.stage >= maxStage && p.water >= 10 && p.nutrient >= 10 && p.health >= 10;
    const isWithered = p.withered;
    const wrap = document.createElement('div');
    wrap.className = 'plant-card';
    wrap.innerHTML = `
      <div class="plant-visual"><div class="plant-visual-inner"></div></div>
      <div class="plant-soil"></div>
      <div class="plant-day">${escapeHtml(typeInfo.name)} · 第 ${p.day} 天${isWithered ? ' · 已枯萎' : ''}</div>
      <div class="plant-stat-label">水分 ${p.water}/10</div>
      <div class="plant-stat-bar"><div style="width:${p.water * 10}%;background:#5ab0e0;"></div></div>
      <div class="plant-stat-label">养分 ${p.nutrient}/10</div>
      <div class="plant-stat-bar"><div style="width:${p.nutrient * 10}%;background:#7bc47f;"></div></div>
      <div class="plant-stat-label">健康 ${p.health}/10</div>
      <div class="plant-stat-bar"><div style="width:${p.health * 10}%;background:#e8789f;"></div></div>
      ${p.lastCareWorld ? `<div class="plant-care-record">最近照顾：${escapeHtml(p.lastCareWorld)}</div>` : ''}
      <div class="plant-actions">
        <button class="mini-btn plant-action-btn" data-action="water" data-idx="${i}" ${isWithered ? 'disabled' : ''}>浇水</button>
        <button class="mini-btn plant-action-btn" data-action="fertilize" data-idx="${i}" ${isWithered ? 'disabled' : ''}>施肥</button>
        <button class="mini-btn plant-action-btn" data-action="catch" data-idx="${i}" ${isWithered ? 'disabled' : ''}>捉虫</button>
        ${isMature && !isWithered ? `<button class="mini-btn plant-action-btn" data-action="harvest" data-idx="${i}" style="color:#e8789f;">采摘</button>` : ''}
        <button class="mini-btn plant-action-btn" data-action="del" data-idx="${i}" style="color:#c33;">删除</button>
      </div>`;
    const visualInner = wrap.querySelector('.plant-visual-inner');
    (async () => {
      let shown = false;
      const ref = p.imageRef || p.image;
      if (ref) {
        const data = await resolveMedia(ref);
        if (data) {
          visualInner.innerHTML = `<img src="${data}" style="width:${p.stage >= maxStage ? 56 : 44}px;height:${p.stage >= maxStage ? 56 : 44}px;${isWithered ? 'filter:grayscale(1);opacity:0.5;' : ''}">`;
          shown = true;
        }
      }
      if (!shown) visualInner.textContent = isWithered ? '🥀' : displayEmoji;
      visualInner.style.fontSize = (p.stage >= maxStage ? 44 : 34) + 'px';
    })();
    wrap.querySelectorAll('.plant-action-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const action = btn.dataset.action;
        const idx = Number(btn.dataset.idx);
        const data = getPlantsData();
        const arr = tab === 'flower' ? data.flowers : data.trees;
        const plant = arr[idx];
        if (action === 'del') {
          if (!confirm('确定删除这' + (tab === 'flower' ? '朵花' : '棵树') + '吗？')) return;
          arr.splice(idx, 1);
          savePlantsData(data);
          loadPlantContent(overlay, tab);
          return;
        }
        if (action === 'harvest') {
          if (plant.stage < maxStage || plant.water < 10 || plant.nutrient < 10 || plant.health < 10) return showToast('还没成熟');
          settings.heartValue += 30;
          saveSettings();
          updateHeartValue();
          plant.water = 5;
          plant.nutrient = 5;
          plant.health = 5;
          plant.stage = Math.max(0, maxStage - 1);
          arr[idx] = plant;
          savePlantsData(data);
          showToast('采摘成功，爱意值+30');
          addBigEvent('harvest', '第一次收获');
          loadPlantContent(overlay, tab);
          return;
        }
        if (action === 'water') plant.water = Math.min(10, plant.water + 3);
        if (action === 'fertilize') plant.nutrient = Math.min(10, plant.nutrient + 4);
        if (action === 'catch') plant.health = Math.min(10, plant.health + 3);
        const t = new Date().toISOString().slice(0, 10);
        if (plant.lastCareDate !== t) {
          plant.day += 1;
          plant.lastCareDate = t;
          if (plant.water >= 5 && plant.nutrient >= 5 && plant.health >= 5) {
            plant.stage = Math.min(plant.stage + 1, maxStage);
          }
        }
        arr[idx] = plant;
        savePlantsData(data);
        loadPlantContent(overlay, tab);
      });
    });
    container.appendChild(wrap);
  });
  const btnRow = document.createElement('div');
  btnRow.style.cssText = 'display:flex;gap:8px;margin-top:10px;';
  const addBtn = document.createElement('button');
  addBtn.className = 'upload-btn';
  addBtn.style.marginTop = '0';
  addBtn.textContent = `种一${tab === 'flower' ? '朵' : '棵'}${tab === 'flower' ? '花' : '树'}`;
  addBtn.addEventListener('click', () => addPlant(tab));
  const manageBtn = document.createElement('button');
  manageBtn.className = 'upload-btn';
  manageBtn.style.marginTop = '0';
  manageBtn.textContent = `管理${tab === 'flower' ? '花种' : '树种'}`;
  manageBtn.addEventListener('click', () => openPlantTypeManageDialog(tab));
  btnRow.appendChild(addBtn);
  btnRow.appendChild(manageBtn);
  container.appendChild(btnRow);
}

function addPlant(tab) {
  const typeLib = tab === 'flower' ? getFlowerTypes() : getTreeTypes();
  if (!typeLib.length) return showToast('请先添加' + (tab === 'flower' ? '花种' : '树种'));
  const overlay = createModal(`
    <div class="big-input-title">选一种${tab === 'flower' ? '花' : '树'}种下</div>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;" id="plant-type-grid"></div>
    <button class="upload-btn" id="plant-image-btn" style="margin-top:0;">上传图片（可选）</button>
    <button class="save-btn-center" id="save-plant" style="margin-top:12px;">种下</button>`);
  let pickedType = typeLib[0].id;
  let plantImageRef = '';
  const grid = overlay.querySelector('#plant-type-grid');
  typeLib.forEach(t => {
    const div = document.createElement('div');
    div.className = 'pet-adopt-card' + (t.id === pickedType ? ' selected' : '');
    div.innerHTML = `<div class="pa-icon">${t.emoji}</div><div class="pa-name">${escapeHtml(t.name)}</div>`;
    div.addEventListener('click', () => {
      pickedType = t.id;
      grid.querySelectorAll('.pet-adopt-card').forEach(el => el.classList.remove('selected'));
      div.classList.add('selected');
    });
    grid.appendChild(div);
  });
  overlay.querySelector('#plant-image-btn').addEventListener('click', () => {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = 'image/*';
    inp.onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          plantImageRef = await libPush('plantImageLibrary', reader.result, 'plantimg');
          overlay.querySelector('#plant-image-btn').textContent = '已选择';
        } catch (err) { showToast('图片太大'); }
      };
      reader.readAsDataURL(file);
    };
    inp.click();
  });
  overlay.querySelector('#save-plant').addEventListener('click', () => {
    const data = getPlantsData();
    const key = tab === 'flower' ? 'flowers' : 'trees';
    data[key].push({ type: tab, typeId: pickedType, stage: 0, day: 0, water: 5, nutrient: 5, health: 5, imageRef: plantImageRef, lastCareDate: '', lastCareWorld: '', withered: false, zeroDays: 0 });
    savePlantsData(data);
    addBigEvent('plant' + tab, '第一次种' + (tab === 'flower' ? '花' : '树'));
    showToast('已种下');
    overlay.remove();
    openPlantPanel();
  });
}

function openPlantTypeManageDialog(tab) {
  const key = tab === 'flower' ? 'flowerTypes' : 'treeTypes';
  const overlay = createModal(`
    <div class="big-input-title">${tab === 'flower' ? '花种' : '树种'}</div>
    <div class="card-list" id="type-list" style="max-height:40vh;margin-bottom:10px;"></div>
    <input type="text" id="type-name-input" placeholder="名称，如：苹果树" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:8px;">
    <input type="text" id="type-emoji-input" placeholder="成熟图标，如：🍎" style="width:100%;background:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.6);border-radius:14px;padding:10px 14px;font-size:14px;color:#4a3f3a;outline:none;margin-bottom:10px;">
    <button class="save-btn-center" id="add-type-btn">添加</button>`);
  const list = overlay.querySelector('#type-list');
  function render() {
    list.innerHTML = '';
    const cur = tab === 'flower' ? getFlowerTypes() : getTreeTypes();
    cur.forEach((t, i) => {
      const div = document.createElement('div');
      div.className = 'card-item';
      div.innerHTML = `<div class="card-text">${t.emoji} ${escapeHtml(t.name)}</div><div class="card-ops"><button class="type-del">✕</button></div>`;
      div.querySelector('.type-del').addEventListener('click', () => {
        const arr = tab === 'flower' ? getFlowerTypes() : getTreeTypes();
        arr.splice(i, 1);
        settings[key] = arr;
        saveSettings();
        render();
      });
      list.appendChild(div);
    });
    if (!cur.length) list.innerHTML = '<div class="placeholder-tip">还没有</div>';
  }
  render();
  overlay.querySelector('#add-type-btn').addEventListener('click', () => {
    const name = overlay.querySelector('#type-name-input').value.trim();
    const emoji = overlay.querySelector('#type-emoji-input').value.trim() || (tab === 'flower' ? '🌸' : '🌳');
    if (!name) return showToast('请输入名称');
    const arr = tab === 'flower' ? getFlowerTypes() : getTreeTypes();
    const stages = tab === 'flower' ? ['🌰','🌱','🌷',emoji] : ['🌰','🌱','🌿','🪴',emoji];
    arr.push({ id: 'custom_' + Date.now(), name, emoji, stages });
    settings[key] = arr;
    saveSettings();
    overlay.querySelector('#type-name-input').value = '';
    overlay.querySelector('#type-emoji-input').value = '';
    render();
    showToast('已添加');
  });
}

function checkPlantStatus() {
  const data = getPlantsData();
  let changed = false;
  ['flowers', 'trees'].forEach(k => {
    data[k].forEach(p => {
      if (p.withered) return;
      p.water = Math.max(0, p.water - 1);
      p.nutrient = Math.max(0, p.nutrient - 1);
      p.health = Math.max(0, p.health - 1);
      if (p.water <= 0 || p.health <= 0) {
        p.zeroDays = (p.zeroDays || 0) + 1;
      } else {
        p.zeroDays = 0;
      }
      if (p.zeroDays >= 18) {
        p.withered = true;
        addBigEvent('plantwithered', '第一次植物枯萎');
      }
      changed = true;
    });
  });
  if (changed) savePlantsData(data);
}
setInterval(checkPlantStatus, 14400000);

async function taAutoCarePlants() {
  const data = getPlantsData();
  const all = [...data.flowers.map((p, i) => ({ p, key: 'flowers', i })), ...data.trees.map((p, i) => ({ p, key: 'trees', i }))];
  if (!all.length) return;
  let cared = 0;
  all.forEach(x => {
    const plant = x.p;
    if (plant.withered) {
      if (Math.random() < 0.4) {
        plant.zeroDays = Math.max(0, (plant.zeroDays || 0) - 2);
        if (plant.zeroDays <= 0) {
          plant.withered = false;
          plant.water = 5;
          plant.nutrient = 5;
          plant.health = 5;
          cared++;
        }
      }
      return;
    }
    const min = Math.min(plant.water, plant.nutrient, plant.health);
    if (min >= 3) return;
    if (plant.water < 3) plant.water = Math.max(8, Math.min(10, plant.water + 4));
    else if (plant.nutrient < 3) plant.nutrient = Math.max(8, Math.min(10, plant.nutrient + 4));
    else plant.health = Math.max(8, Math.min(10, plant.health + 4));
    const t = new Date().toISOString().slice(0, 10);
    if (plant.lastCareDate !== t) {
      plant.day += 1;
      plant.lastCareDate = t;
      const typeLib = plant.type === 'flower' ? getFlowerTypes() : getTreeTypes();
      const ti = typeLib.find(x => x.id === plant.typeId);
      const maxStage = ti ? (ti.stages.length - 1) : (plant.type === 'flower' ? 3 : 4);
      if (plant.water >= 5 && plant.nutrient >= 5 && plant.health >= 5) {
        plant.stage = Math.min(plant.stage + 1, maxStage);
      }
    }
    cared++;
  });
  if (cared > 0) {
    let pool = onlineWorlds.length ? onlineWorlds : ['real'];
    const wid = pool[Math.floor(Math.random() * pool.length)];
    all.forEach(x => { x.p.lastCareWorld = getWorldLabel(wid); });
    savePlantsData(data);
    addNotification('🌸', `易遇照顾了植物（${cared}株）`);
    refreshOpenPanels();
  }
}

function hangupVideoCall(reason, isSystem) {
  let duration = 0, startStr = '', endStr = '';
  if (videoCallStartTime) {
    duration = Math.floor((Date.now() - videoCallStartTime) / 1000);
    startStr = new Date(videoCallStartTime).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    endStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    saveVideoCallRecord(false);
    if (videoCallAnswered) showToast(`通话结束，时长 ${Math.floor(duration / 60)}分${duration % 60}秒`);
  }
  if (videoCallAnswered && duration > 0) {
    const mins = Math.floor(duration / 60);
    const secs = duration % 60;
    const sysMsg = { sender: 'ta', content: `${startStr} 开始 · ${endStr} 结束 · 通话 ${mins}分钟${secs}秒`, timestamp: Date.now(), heartMark: null, isSystem: true };
    idbPutReturnId('messages', sysMsg).then(async id => { sysMsg.id = id; await appendMessage(sysMsg); });
  } else if (reason) {
    const nowStr = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    let content = '';
    if (reason === 'TA正在忙') content = `${nowStr} 忙线未接`;
    else if (reason === 'TA的视频通话未接听') content = `${nowStr} 未接来电`;
    else if (reason === '你拒绝了TA的视频通话') content = `${nowStr} 你拒接了来电`;
    else content = reason;
    const sysMsg = { sender: 'ta', content, timestamp: Date.now(), heartMark: null, isSystem: true };
    idbPutReturnId('messages', sysMsg).then(async id => { sysMsg.id = id; await appendMessage(sysMsg); });
  }
  clearInterval(videoCallTimer);
  clearTimeout(videoCallAutoHangTimer);
  clearInterval(videoCallPersistTimer);
  window._currentVideoSpeaks = [];
  window._currentVideoWorldId = null;
  videoCallRecordId = null;
  videoCallActive = false;
  videoCallIncoming = false;
  videoCallAnswered = false;
  videoCallStartTime = 0;
  if (videoCallOverlay) { videoCallOverlay.remove(); videoCallOverlay = null; }
  if (videoCallMini) { videoCallMini.remove(); videoCallMini = null; }
  refreshOpenPanels();
}

    const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
    records[date] = { type: 'work', hours };
    localStorage.setItem('attendanceRecords', JSON.stringify(records));
    loadAttendance(overlay);
  });
  overlay.querySelector('#attendance-rest').addEventListener('click', () => {
    const date = overlay.querySelector('#attendance-date').value;
    if (!date) return showToast('请填写日期');
    const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
    records[date] = { type: 'rest', hours: 0 };
    localStorage.setItem('attendanceRecords', JSON.stringify(records));
    loadAttendance(overlay);
  });
}

function loadAttendance(overlay) {
  const records = JSON.parse(localStorage.getItem('attendanceRecords') || '{}');
  const dates = Object.keys(records).sort().reverse();
  const wage = settings.hourlyWage || 0;
  let totalHours = 0, totalWage = 0, monthHours = 0, monthWage = 0;
  const monthPrefix = new Date().toISOString().slice(0, 7);
  dates.forEach(date => {
    const r = records[date];
    if (r.type === 'work') {
      totalHours += r.hours; totalWage += r.hours * wage;
      if (date.startsWith(monthPrefix)) { monthHours += r.hours; monthWage += r.hours * wage; }
    }
  });
  overlay.querySelector('#attendance-summary').textContent = `本月 ${monthHours} 小时 ${monthWage} 元 ｜ 累计 ${totalHours} 小时 ${totalWage} 元`;
  const list = overlay.querySelector('#attendance-list');
  list.innerHTML = '';
  if (!dates.length) { list.innerHTML = '<div class="placeholder-tip">还没有出勤记录</div>'; return; }
  dates.forEach(date => {
    const r = records[date];
    const div = document.createElement('div');
    div.className = 'card-item';
    if (r.type === 'rest') div.innerHTML = `<div class="card-text">${date} - 休</div><div class="card-ops"><button class="attendance-del">✕</button></div>`;
    else div.innerHTML = `<div class="card-text">${date} - ${r.hours} 小时 - ${r.hours * wage} 元</div><div class="card-ops"><button class="attendance-del">✕</button></div>`;
    div.querySelector('.attendance-del').addEventListener('click', () => {
      delete records[date];
      localStorage.setItem('attendanceRecords', JSON.stringify(records));
      loadAttendance(overlay);
    });
    list.appendChild(div);
  });
}

function getBondHeartSVG(days) {
  let fill, stroke, glow = false, beat = false;
  if (days === 0) { fill = 'rgba(255,255,255,0.6)'; stroke = '#dcdcdc'; }
  else if (days <= 3) { fill = '#ffc4d6'; stroke = '#ffb0c8'; }
  else if (days <= 7) { fill = '#ff8fb0'; stroke = '#ff6f9c'; }
  else if (days <= 14) { fill = '#ff6f9c'; stroke = '#ff3b5c'; }
  else if (days <= 30) { fill = '#ff3b5c'; stroke = '#e02040'; }
  else if (days <= 100) { fill = '#e02040'; stroke = '#c01030'; glow = true; }
  else { fill = '#c01030'; stroke = '#900020'; glow = true; beat = true; }
  const heartPath = "M28,48 C28,48 4,32 4,16 C4,8 10,2 18,2 C23,2 28,8 28,8 C28,8 33,2 38,2 C46,2 52,8 52,16 C52,32 28,48 28,48 Z";
  const glowFilter = glow ? `<defs><filter id="bondGlow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>` : '';
  const filterAttr = glow ? ' filter="url(#bondGlow)"' : '';
  return `<svg viewBox="0 0 56 52" width="56" height="52">${glowFilter}<path d="${heartPath}" fill="${fill}" stroke="${stroke}" stroke-width="2"${filterAttr}/></svg>`;
}

function getBondLevelIcon(days) {
  let fill, stroke;
  if (days === 0) { fill = 'rgba(255,255,255,0.6)'; stroke = '#dcdcdc'; }
  else if (days <= 3) { fill = '#ffc4d6'; stroke = '#ffb0c8'; }
  else if (days <= 7) { fill = '#ff8fb0'; stroke = '#ff6f9c'; }
  else if (days <= 14) { fill = '#ff6f9c'; stroke = '#ff3b5c'; }
  else if (days <= 30) { fill = '#ff3b5c'; stroke = '#e02040'; }
  else if (days <= 100) { fill = '#e02040'; stroke = '#c01030'; }
  else { fill = '#c01030'; stroke = '#900020'; }
  const heartPath = "M7,12 C7,12 1,8 1,4 C1,2 3,1 4,1 C5,1 7,2 7,2 C7,2 9,1 10,1 C11,1 13,2 13,4 C13,8 7,12 7,12 Z";
  return `<svg viewBox="0 0 14 13" width="14" height="13"><path d="${heartPath}" fill="${fill}" stroke="${stroke}" stroke-width="1"/></svg>`;
}

function getBondLevel() {
  const days = settings.bondDays;
  if (days === 0) return '未开始';
  if (days <= 3) return '小爱心';
  if (days <= 7) return '爱心';
  if (days <= 14) return '粉爱心';
  if (days <= 30) return '红爱心';
  if (days <= 100) return '深红爱心';
  return '永恒爱心';
}

function getBondTodayStatus() {
  return settings.bondLastCheckDate === new Date().toDateString() ? '已聊 ✓' : '未聊';
}

function renderBondCalendar(overlay) {
  const records = JSON.parse(localStorage.getItem('bondRecords') || '{}');
  const dates = Object.keys(records).sort();
  const container = overlay.querySelector('#bond-calendar');
  container.innerHTML = '';
  if (!dates.length) { container.innerHTML = '<div class="placeholder-tip">还没有记录</div>'; return; }
  const monthMap = {};
  dates.forEach(date => {
    const d = new Date(date);
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
    if (!monthMap[key]) monthMap[key] = [];
    monthMap[key].push(d.getDate());
  });
  const months = Object.keys(monthMap).sort().reverse();
  months.forEach(mk => {
    const wrap = document.createElement('div');
    wrap.className = 'bond-month';
    const [y, m] = mk.split('-');
    const firstDay = new Date(Number(y), Number(m) - 1, 1).getDay();
    const daysInMonth = new Date(Number(y), Number(m), 0).getDate();
    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'bond-day';
      wrap.appendChild(empty);
    }
    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'bond-day';
      cell.textContent = d;
      if (monthMap[mk].includes(d)) cell.classList.add('has-record');
      wrap.appendChild(cell);
    }
    container.appendChild(wrap);
  });
}

function checkBondDaily() {
  const today = new Date().toDateString();
  if (settings.bondLastCheckDate === today) return;
  if (settings.bondLastCheckDate && settings.bondDays > 0) {
    const diff = Math.floor((new Date() - new Date(settings.bondLastCheckDate)) / 86400000);
    if (diff > 1) {
      if (settings.bondDays > 30 && !settings.bondProtectUsed) {
        settings.bondProtectUsed = true;
        showToast('熄灭保护已使用');
      } else {
        if (settings.bondDays > settings.bondHistoryBest) settings.bondHistoryBest = settings.bondDays;
        addBigEvent('bondbreak', '羁绊熄灭（原 ' + settings.bondDays + ' 天）');
        settings.bondDays = 0;
        settings.bondProtectUsed = false;
        showToast('羁绊熄灭了');
      }
    }
  }
  settings.bondDays += 1;
  settings.bondLastCheckDate = today;
  if (settings.bondDays === 7) addBigEvent('bond7', '羁绊连续 7 天');
  if (settings.bondDays === 30) addBigEvent('bond30', '羁绊连续 30 天');
  if (settings.bondDays === 100) addBigEvent('bond100', '羁绊连续 100 天');
  if (settings.bondDays > 0 && settings.bondDays % 7 === 0) {
    settings.heartValue += 20;
    showToast('连续' + settings.bondDays + '天，爱意值+20');
  }
  const records = JSON.parse(localStorage.getItem('bondRecords') || '{}');
  records[today] = true;
  localStorage.setItem('bondRecords', JSON.stringify(records));
  saveSettings();
  updateHeartValue();
}
  // ========== 归档 ==========
async function checkArchive() {
  const now = new Date();
  const todayStr = now.getFullYear() + '-' + (now.getMonth() + 1) + '-' + now.getDate();
  const todayDate = now.toDateString();
  const all = await idbGetAll('messages');
  const toArchive = all.filter(m => new Date(m.timestamp).toDateString() !== todayDate);
  if (!toArchive.length) return;
  isArchiving = true;
  const input = document.getElementById('chat-input');
  if (input) { input.disabled = true; input.placeholder = '归档中...'; }
  try {
    const archives = JSON.parse(localStorage.getItem('archives') || '{}');
    const groups = {};
    toArchive.forEach(m => {
      const d = new Date(m.timestamp);
      const ds = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
      if (!groups[ds]) groups[ds] = [];
      groups[ds].push(m);
    });
    Object.keys(groups).forEach(ds => {
      if (!archives[ds]) archives[ds] = [];
      archives[ds] = archives[ds].concat(groups[ds]);
    });
    localStorage.setItem('archives', JSON.stringify(archives));
    for (const m of toArchive) await idbDelete('messages', m.id);
    await renderMessages();
    localStorage.setItem('lastArchiveDate', todayStr);
  } catch (e) { console.error('归档失败', e); }
  isArchiving = false;
  if (input) { input.disabled = false; input.placeholder = '对TA说些什么...'; }
}

// ========== 粒子 ==========
function getTimePeriodParticles() {
  const h = new Date().getHours();
  if (h >= 5 && h < 9) return ['petal', 'dew', 'dandelion'];
  if (h >= 9 && h < 17) return ['bigstar', 'bubble', 'butterfly'];
  if (h >= 17 && h < 20) return ['leaf', 'maple', 'sakura'];
  if (h >= 20 && h < 24) return ['firefly', 'meteor', 'bigstar'];
  return ['snow', 'star', 'moon'];
}

function getAutoParticleList() {
  if (settings.particleType === 'season') return getTimePeriodParticles();
  return [settings.particleType];
}

function initParticles() {
  const canvas = document.getElementById('particle-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  if (particleAnimation) cancelAnimationFrame(particleAnimation);
  particleItems = [];
  if (!settings.particleEnabled) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
  const types = getAutoParticleList();
  const perType = Math.max(8, Math.floor(40 / types.length));
  types.forEach(t => {
    for (let i = 0; i < perType; i++) particleItems.push(createParticle(t, canvas));
  });
  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particleItems.forEach(p => {
      p.y += p.speed;
      p.x += p.drift;
      if (p.y > canvas.height + 20) { p.y = -20; p.x = Math.random() * canvas.width; }
      drawParticle(ctx, p);
    });
    particleAnimation = requestAnimationFrame(loop);
  }
  loop();
}

function createParticle(type, canvas) {
  return { type, x: Math.random() * canvas.width, y: Math.random() * canvas.height, speed: 0.5 + Math.random() * 1.5, drift: (Math.random() - 0.5) * 0.8, size: 4 + Math.random() * 6, alpha: 0.4 + Math.random() * 0.5 };
}

function drawParticle(ctx, p) {
  ctx.globalAlpha = p.alpha;
  const t = p.type;
  if (t === 'sakura' || t === 'petal') {
    ctx.fillStyle = '#ffc4d6';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'snow') {
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'leaf' || t === 'maple') {
    ctx.fillStyle = t === 'maple' ? '#d97a4a' : '#e0a96d';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.5, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'greenleaf') {
    ctx.fillStyle = '#7bc47f';
    ctx.beginPath(); ctx.ellipse(p.x, p.y, p.size, p.size * 0.5, Math.PI / 4, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'star' || t === 'firefly' || t === 'bigstar' || t === 'glow') {
    if (t === 'bigstar') { ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2); ctx.fill(); }
    else if (t === 'glow') { ctx.fillStyle = 'rgba(255,240,180,0.9)'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill(); }
    else if (t === 'firefly') { ctx.fillStyle = '#ffe27a'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = '#fff7c2'; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); ctx.fill(); }
  } else if (t === 'rain') {
    ctx.strokeStyle = 'rgba(150,190,230,0.6)';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - 1, p.y + p.size * 2); ctx.stroke();
  } else if (t === 'bubble') {
    ctx.strokeStyle = 'rgba(180,220,255,0.7)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.8, 0, Math.PI * 2); ctx.stroke();
  } else if (t === 'meteor') {
    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + 12, p.y - 12); ctx.stroke();
  } else if (t === 'dew') {
    ctx.fillStyle = 'rgba(200,230,255,0.85)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'wave') {
    ctx.strokeStyle = 'rgba(150,200,230,0.6)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 1.2, 0, Math.PI); ctx.stroke();
  } else if (t === 'dandelion') {
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'windbell') {
    ctx.fillStyle = '#c0e0ff';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.6, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'butterfly') {
    ctx.fillStyle = '#e8b0e0';
    ctx.beginPath(); ctx.ellipse(p.x - p.size * 0.3, p.y, p.size * 0.5, p.size * 0.7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(p.x + p.size * 0.3, p.y, p.size * 0.5, p.size * 0.7, 0, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'heart') {
    ctx.fillStyle = '#ff8fb0';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'bow') {
    ctx.fillStyle = '#ffc4d6';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'candy') {
    ctx.fillStyle = '#ff9ab0';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'sparkle') {
    ctx.fillStyle = '#fff7c2';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.3, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'moon') {
    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.7, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'fog') {
    ctx.fillStyle = 'rgba(220,220,230,0.3)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 1.2, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'candle') {
    ctx.fillStyle = 'rgba(255,200,120,0.8)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.4, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'firework') {
    ctx.fillStyle = '#ff9ad0';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'cloud') {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.8, 0, Math.PI * 2); ctx.fill();
  } else if (t === 'rainbow') {
    ctx.strokeStyle = 'rgba(255,180,200,0.6)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI); ctx.stroke();
  } else {
    ctx.fillStyle = '#ffc4d6';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 0.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function renderWorldsContent(overlay) {
  const content = overlay.querySelector('#worlds-content');
  if (!content) return;
  const searchEl = overlay.querySelector('#worlds-search-input');
  const kw = searchEl ? searchEl.value.trim().toLowerCase() : '';
  let worlds = settings.worlds || [];
  if (kw) {
    worlds = worlds.filter(w => w.name.toLowerCase().includes(kw) || (w.role || '').toLowerCase().includes(kw));
  }
  worlds = worlds.slice().sort((a, b) => {
    const aOn = onlineWorlds.includes(a.id) ? 1 : 0;
    const bOn = onlineWorlds.includes(b.id) ? 1 : 0;
    return bOn - aOn;
  });
  let html = '';
  worlds.forEach(w => {
    const isOnline = onlineWorlds.includes(w.id);
    const current = w.id === settings.currentWorldId ? ' current' : '';
    const speedText = w.speed === 1 ? '同速' : `${w.speed}倍速`;
    const offsetText = w.offset >= 0 ? `+${w.offset}h` : `${w.offset}h`;
    html += `
      <div class="world-card${current}" data-id="${w.id}">
        <div class="world-icon">${WORLD_ICONS[w.icon] || WORLD_ICONS.real}</div>
        <div class="world-info">
          <div class="world-name"><span class="${isOnline ? 'world-online-dot' : 'world-offline-dot'}"></span>${escapeHtml(w.name)}</div>
          <div class="world-role">${escapeHtml(w.role || '')}</div>
          <div class="world-meta">时差 ${offsetText} ｜ ${speedText}${isOnline ? ' ｜ 在线' : ''}</div>
          <div class="world-actions-row">
            <button class="world-invite" data-id="${w.id}">${isOnline ? '在线' : '邀请'}</button>
            <button class="world-edit" data-id="${w.id}">改</button>
          </div>
        </div>
      </div>`;
  });
  html += '<button class="upload-btn" id="worlds-add-btn">添加副本</button>';
  content.innerHTML = html;
  content.querySelectorAll('.world-invite').forEach(btn => {
    btn.addEventListener('click', async () => {
      await inviteWorld(btn.dataset.id);
      renderWorldsContent(overlay);
    });
  });
  content.querySelectorAll('.world-edit').forEach(btn => {
    btn.addEventListener('click', () => {

// ========== 大事记（去重：text 相同就不重复记） ==========
function addBigEvent(type, text) {
  settings.bigEvents = settings.bigEvents || [];
  if (settings.bigEvents.some(ev => ev.text === text)) return;
  settings.bigEvents.push({ type, text, time: Date.now() });
  saveSettings();
}

function openTimelinePanel() {
  const overlay = createModal(`
    <div class="big-input-title">大事记</div>
    <div class="card-list" id="timeline-list"></div>`);
  const list = overlay.querySelector('#timeline-list');
  const events = (settings.bigEvents || []).slice().sort((a, b) => b.time - a.time);
  if (!events.length) { list.innerHTML = '<div class="placeholder-tip">还没有记录</div>'; return; }
  events.forEach(ev => {
    const d = new Date(ev.time);
    const str = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');

    div.className = 'heart-item';
    div.innerHTML = `<span class="heart-mark">✦</span><span>${escapeHtml(ev.text)}<br><span style="font-size:11px;color:#8b6f60;">${str}</span></span>`;

function loadQuestionnaireList(overlay) {

// 问卷发送面板
function openQuestionnaireSendPanel() {
  const list_ = JSON.parse(localStorage.getItem('questionnaireLibrary') || '[]');
  if (!list_.length) return showToast('先去小世界新建问卷');
  const worlds = settings.worlds || [];
  let selectedQIdx = 0;
  let selectedWorldId = settings.currentWorldId || (worlds[0] && worlds[0].id);
  const overlay = createModal(`
    <div class="big-input-title">发送问卷</div>
    <div style="font-size:13px;color:#4a3528;margin-bottom:6px;">选择问卷</div>
    <div class="world-chip-row" id="qn-pick-chips"></div>
    <div style="font-size:13px;color:#4a3528;margin-bottom:6px;">发给谁</div>
    <div class="world-chip-row" id="qn-world-chips"></div>
    <button class="save-btn-center" id="qn-send" style="margin-top:12px;">发出问卷</button>`);
  const qChips = overlay.querySelector('#qn-pick-chips');
  list_.forEach((q, i) => {
    const chip = document.createElement('div');
    chip.className = 'world-chip' + (i === selectedQIdx ? ' active' : '');
    chip.textContent = q.title;
    chip.addEventListener('click', () => {
      selectedQIdx = i;
      qChips.querySelectorAll('.world-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
    qChips.appendChild(chip);
  });
  const wChips = overlay.querySelector('#qn-world-chips');
  worlds.forEach(w => {
    const chip = document.createElement('div');
    chip.className = 'world-chip' + (w.id === selectedWorldId ? ' active' : '');
    chip.textContent = w.name;
    chip.addEventListener('click', () => {
      selectedWorldId = w.id;
      wChips.querySelectorAll('.world-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
    });
    wChips.appendChild(chip);
  });
  overlay.querySelector('#qn-send').addEventListener('click', async () => {
    const q = list_[selectedQIdx];
    if (!q) return showToast('请选择问卷');
    const w = worlds.find(x => x.id === selectedWorldId);
    if (!w) return showToast('请选择发给谁');
    const qData = {
      id: 'qn_' + Date.now(),
      title: q.title,
      questions: q.questions,
      targetWorldId: selectedWorldId,
      targetWorldName: w.name,
      answers: [],
      status: 'sent'
    };
    const msg = { sender: 'me', content: '【问卷】' + q.title, questionnaireData: qData, timestamp: Date.now(), readTime: null, heartMark: null, quoteContent: null };
    const id = await idbPutReturnId('messages', msg);
    msg.id = id;
    await appendMessage(msg);
    addBigEvent('sendqn', '第一次发出问卷');
    overlay.remove();
    lastUserMessageTime = Date.now();
    scheduleReadReceipt(msg);
    // TA 5 分钟内答题
    setTimeout(async () => {
      if (isReplying || isArchiving) return;
      const answers = qData.questions.map(item => Math.floor(Math.random() * (item.options || []).length));
      const target = (await idbGetAll('messages')).find(m => m.id === id);
      if (!target) return;
      target.questionnaireData.answers = answers;
      target.questionnaireData.status = 'answered';
      await idbPut('messages', target);
      // 重渲染这条消息
      const row = document.querySelector(`.message-row[data-id="${id}"]`);
      if (row) {
        const newEl = await createMessageEl(target);
        row.replaceWith(newEl);
      }
      // +10 爱意值
      settings.heartValue += 10;
      await saveSettings();
      updateHeartValue();
      addBigEvent('qnanswered', '第一次收到问卷回答');
      addNotification('📋', '易遇回答了你的问卷');
      sendNotification('易遇回答了你的问卷');
    }, 300000);
    showToast('问卷已发出，TA正在答题...');
  });
}

// 我答 TA 的问卷
function openQuestionnaireAnswerPanel(msg) {
  const q = msg.questionnaireData;
  if (!q) return;
  const answers = new Array(q.questions.length).fill(-1);
  let html = `<div class="big-input-title">${escapeHtml(q.title)}</div><div id="qa-body"></div><button class="save-btn-center" id="qa-submit" style="margin-top:12px;">提交</button>`;
  const overlay = createModal(html);
  const body = overlay.querySelector('#qa-body');
  q.questions.forEach((item, qi) => {
    const block = document.createElement('div');
    block.style.marginBottom = '12px';
    block.innerHTML = `<div style="font-size:13px;color:#4a3528;margin-bottom:6px;">${qi + 1}. ${escapeHtml(item.q)}</div>`;
    (item.options || []).forEach((opt, oi) => {
      const btn = document.createElement('button');
      btn.className = 'mini-btn';
      btn.style.cssText = 'display:block;width:100%;text-align:left;margin-bottom:4px;';
      btn.textContent = String.fromCharCode(65 + oi) + ' ' + opt;
      btn.addEventListener('click', () => {
        answers[qi] = oi;
        block.querySelectorAll('.mini-btn').forEach(b => { b.style.background = ''; b.style.color = ''; });
        btn.style.background = 'rgba(255,150,100,0.6)';
        btn.style.color = '#fff';
      });
      block.appendChild(btn);
    });
    body.appendChild(block);
  });
  overlay.querySelector('#qa-submit').addEventListener('click', async () => {
    if (answers.includes(-1)) return showToast('还有题目没答');
    const all = await idbGetAll('messages');
    const target = all.find(m => m.id === msg.id);
    if (!target) return;
    target.questionnaireData.answers = answers;
    target.questionnaireData.status = 'answered';
    target.questionnaireData.answeredBy = 'me';
    await idbPut('messages', target);
    const row = document.querySelector(`.message-row[data-id="${msg.id}"]`);
    if (row) {
      const newEl = await createMessageEl(target);
      row.replaceWith(newEl);
    }
    settings.heartValue += 10;
    await saveSettings();
    updateHeartValue();
    addBigEvent('myqnanswered', '第一次回答TA的问卷');
    // TA 回一句
    const wid = target.questionnaireData.targetWorldId || settings.currentWorldId;
    const reply = { sender: 'ta', content: getQuestionnaireReply(), timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
    const rid = await idbPutReturnId('messages', reply);
    reply.id = rid;
    await appendMessage(reply);
    overlay.remove();
    showToast('已提交');
  });
}

// TA 主动发问卷给我
function scheduleTAQuestionnaire() {
  const next = Math.random() * (settings.taQuestionnaireMax - settings.taQuestionnaireMin) + settings.taQuestionnaireMin;
  setTimeout(async () => {
    if (!isReplying && !isArchiving && onlineWorlds.length) {
      const list_ = JSON.parse(localStorage.getItem('questionnaireLibrary') || '[]');
      if (list_.length) {
        const q = list_[Math.floor(Math.random() * list_.length)];
        const wid = onlineWorlds[Math.floor(Math.random() * onlineWorlds.length)];
        const qData = {
          id: 'qn_ta_' + Date.now(),
          title: q.title,
          questions: q.questions,
          targetWorldId: wid,
          targetWorldName: (settings.worlds || []).find(w => w.id === wid)?.name || '易遇',
          answers: [],
          status: 'sent',
          from: 'ta'
        };
        // 显示"TA正在答题..."5 分钟
        showTyping(true);
        const typingText = document.querySelector('#typing-indicator span');
        if (typingText) typingText.textContent = 'TA正在出题...';
        const msg = { sender: 'ta', content: '【问卷】' + q.title, questionnaireData: qData, timestamp: Date.now(), heartMark: null, quoteContent: null, worldId: wid, worldLabel: getWorldLabel(wid) };
        const id = await idbPutReturnId('messages', msg);
        msg.id = id;
        await appendMessage(msg);
        sendNotification('易遇发来一份问卷');
        addNotification('📋', '易遇发来一份问卷');
        addBigEvent('taqn', '第一次收到易遇的问卷');
        if (typingText) typingText.textContent = 'TA正在输入中';
        showTyping(false);
      }
    }
    scheduleTAQuestionnaire();
  }, next);
}

// ========== 状态临时刷新 ==========
setInterval(() => {
  if (tempStatus && Date.now() > tempStatusUntil) {
    tempStatus = null;
    updateStatusBar();
  }
  const now = Date.now();
  Object.keys(worldSleepTimers).forEach(wid => {
    if (worldSleepTimers[wid] < now) delete worldSleepTimers[wid];
  });
  updateStatusBar();
}, 10000);

  await openDB();
  await loadSettings();
  await migrateMediaOnce();
  await initGiftsOnce();
  loadPendingDateInvites();
  refreshScheduleTypes();
  renderHeartLine();
  initBallPosition();
  await renderMessages();
  await applyBG();
  updateStatusBar();
  addBigEventOnce();
  initOnlineWorlds();
  scheduleTAActive();
  scheduleTAAutonomy();
  scheduleTASticker();
  scheduleTAGift();
  scheduleTAGiftPack();
  scheduleTAInteract();
  scheduleTANick();
  scheduleTAQuote();
  scheduleTAAvatarChange();
  scheduleTABGChange();
  scheduleTAMusicRequest();
  scheduleTALetter();
  scheduleTANote();
  scheduleTALoverPost();
  scheduleTAVideoCall();
  scheduleTADateInvite();
  scheduleDateInvite();
  scheduleDateRecall();
  scheduleTALoverCheckin();
  scheduleTACheckinRemind();
  scheduleTAQuiz();
  scheduleTAPetCare();
  scheduleTAPlantCare();
  scheduleHighDim();
  scheduleTADailyLife();
  scheduleTAQuestionnaire();
  await checkArchive();
  checkImportantDays();
  checkPeriodCare();
  checkPetStatus();
  checkPlantStatus();
  initParticles();
  updateSendBtn();
  setInterval(() => { updateStatusBar(); }, 60000);
  setInterval(() => { refreshScheduleTypes(); updateStatusBar(); }, 300000);
  setInterval(() => { if (settings.particleEnabled) initParticles(); }, 900000);
  const input = document.getElementById('chat-input');
  input.addEventListener('focus', () => { setTimeout(() => { input.scrollIntoView({ behavior: 'smooth', block: 'end' }); }, 300); });
  document.addEventListener('fullscreenchange', () => setTimeout(() => applyBG(), 200));
  document.addEventListener('webkitfullscreenchange', () => setTimeout(() => applyBG(), 200));
  window.addEventListener('resize', () => {
    clearTimeout(bgResizeTimer);
    bgResizeTimer = setTimeout(() => {
      if (settings.bgCurrent) applyBG();
      else {
        const c = document.getElementById('bg-canvas');
        const ctx = c.getContext('2d');
        c.width = window.innerWidth;
        c.height = window.innerHeight;
        if (document.documentElement.classList.contains('dark-mode')) drawDarkBG(ctx, c.width, c.height);
        else drawDefaultBG(ctx, c.width, c.height);
      }
      const pc = document.getElementById('particle-canvas');
      if (pc) { pc.width = window.innerWidth; pc.height = window.innerHeight; }
      initParticles();
    }, 300);
  });
}

function addBigEventOnce() {
  settings.visitedWorlds = settings.visitedWorlds || [];
  if (!settings.visitedWorlds.includes('real')) {
    settings.visitedWorlds.push('real');
    addBigEvent('world', '第一次相遇：现实世界 · 医生');
  }
}

init();
</script>
